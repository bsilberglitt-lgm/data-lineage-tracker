<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Lineage Tracker</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a2332; height: 100vh; overflow: hidden; }
.app { display: flex; height: 100vh; }
.sidebar { width: 260px; background: #1B3A5C; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.sidebar-header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
.sidebar-header h1:hover { background: rgba(255,255,255,0.1); }
.sidebar-header p { font-size: 11px; opacity: 0.6; margin-top: 4px; cursor: pointer; border-radius: 4px; padding: 2px 4px; margin-left: -4px; }
.sidebar-header p:hover { background: rgba(255,255,255,0.1); }
.sidebar-header input { width: 100%; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; color: #fff; font-family: inherit; padding: 2px 4px; margin: -2px -4px; outline: none; }
.sidebar-header input.header-title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
.sidebar-header input.header-subtitle { font-size: 11px; margin-top: 4px; opacity: 0.8; }
.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.nav-item { padding: 10px 20px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.15s; }
.nav-item:hover { background: rgba(255,255,255,0.08); }
.nav-item.active { background: rgba(255,255,255,0.15); border-left: 3px solid #5BA4E6; }
.nav-icon { width: 18px; text-align: center; opacity: 0.7; }
.nav-section { padding: 16px 20px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.4; }
.main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.toolbar { height: 48px; background: #fff; border-bottom: 1px solid #dde3ea; display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0; }
.toolbar-title { font-size: 15px; font-weight: 600; color: #1B3A5C; }
.toolbar-spacer { flex: 1; }
.btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #ccc; background: #fff; font-size: 12px; cursor: pointer; transition: all 0.15s; }
.btn:hover { background: #f5f5f5; }
.btn-primary { background: #2E75B6; color: #fff; border-color: #2E75B6; }
.btn-primary:hover { background: #245f96; }
.btn-edit { background: #fff; color: #2E75B6; border-color: #2E75B6; }
.btn-edit:hover { background: #e8f0fa; }
.btn-save { background: #27ae60; color: #fff; border-color: #27ae60; }
.btn-danger { background: #fff; color: #c0392b; border-color: #c0392b; }
.btn-danger:hover { background: #c0392b; color: #fff; }
.btn-save:hover { background: #1e8c4c; }
.content-area { flex: 1; display: flex; overflow: hidden; }
.canvas-container { flex: 1; min-width: 0; position: relative; overflow: hidden; background: #f5f8fb; transition: all 0.25s ease; }
.canvas-container svg { display: block; width: 100%; height: 100%; }
.detail-panel { width: 480px; background: #fff; border-left: 1px solid #dde3ea; overflow-y: auto; overflow-x: hidden; flex-shrink: 0; transition: width 0.3s ease, border 0.3s ease; }
.detail-panel.closed { width: 0; min-width: 0; border-left: none; overflow: hidden; padding: 0; }
.panel-header { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; }
.panel-header h2 { font-size: 15px; font-weight: 600; color: #1B3A5C; flex: 1; }
.panel-close { width: 28px; height: 28px; border-radius: 50%; border: none; background: #f0f0f0; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.panel-close:hover { background: #e0e0e0; }
.panel-body { padding: 16px 20px; }
.panel-section { margin-bottom: 20px; }
.panel-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 8px; font-weight: 600; }
.field-row { display: flex; margin-bottom: 6px; font-size: 13px; line-height: 1.5; }
.field-label { width: 140px; flex-shrink: 0; color: #666; font-weight: 500; }
.field-value { flex: 1; color: #1a2332; word-break: break-word; }
.field-value.multiline { white-space: pre-line; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-active { background: #e6f4ea; color: #1e7e34; }
.badge-deprecated { background: #fde8e8; color: #c0392b; }
.badge-planned { background: #fff3cd; color: #856404; }
.badge-broken { background: #fde8e8; color: #c0392b; }
.badge-pii { background: #ffeaa7; color: #6c5300; }
.badge-ferpa { background: #dfe6ff; color: #2c3e8c; }
.badge-source { background: #d5f5e3; color: #1a6b3c; }
.badge-destination { background: #fadbd8; color: #922b21; }
.badge-internal, .badge-etlprocess, .badge-datastore, .badge-manualprocess { background: #d6eaf8; color: #1a5276; }
.badge-confidential { background: #f5b7b1; color: #78281f; }
.badge-sensitive { background: #fdebd0; color: #7e5109; }
.badge-public { background: #d5f5e3; color: #1a6b3c; }
.system-node { cursor: grab; }
.system-node:active { cursor: grabbing; }
.system-node rect { rx: 10; ry: 10; transition: filter 0.15s; }
.system-node:hover rect { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15)); }
.system-node text { pointer-events: none; }
.flow-line { cursor: pointer; }
.flow-line:hover line { stroke-width: 4; }
.flow-label { font-size: 10px; fill: #333f4a; cursor: pointer; user-select: none; }
.flow-line.selected line { stroke: #D4772C; stroke-width: 4; }
.system-node.selected rect { stroke: #D4772C; stroke-width: 3; }
.table-view { padding: 20px; overflow-y: auto; flex: 1; }
.data-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.data-table th { background: #1B3A5C; color: #fff; padding: 10px 14px; text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.3px; }
.data-table td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #eee; }
.data-table tr:hover td { background: #f8fafc; }
.data-table tr.clickable { cursor: pointer; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: #fff; border-radius: 12px; width: 600px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.modal-header { padding: 20px 24px; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 600; color: #1B3A5C; display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 20px 24px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; font-family: inherit; }
.form-group textarea { min-height: 70px; resize: vertical; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.modal-footer { padding: 16px 24px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 8px; }
.checkbox-row { display: flex; gap: 20px; margin-bottom: 14px; }
.checkbox-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.edit-input { width: 100%; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; }
.edit-textarea { width: 100%; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; min-height: 60px; resize: vertical; }
.edit-select { padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; }
.edit-field-row { display: flex; margin-bottom: 10px; font-size: 13px; align-items: flex-start; }
.edit-field-row .field-label { padding-top: 6px; }
.panel-actions { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid #eee; background: #fafbfc; }
.stats-bar { display: flex; gap: 24px; padding: 10px 20px; background: #fff; border-bottom: 1px solid #eee; }
.stat { text-align: center; }
.stat-value { font-size: 22px; font-weight: 700; color: #1B3A5C; }
.stat-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.legend { position: absolute; bottom: 16px; left: 16px; background: rgba(255,255,255,0.95); border-radius: 8px; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); font-size: 11px; z-index: 5; }
.legend-title { font-weight: 600; margin-bottom: 6px; color: #555; }
.legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.legend-color { width: 14px; height: 14px; border-radius: 3px; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
.login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; background: #f0f4f8; }
.login-box { background: #fff; border-radius: 12px; padding: 40px; width: 380px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); text-align: center; }
.login-box h1 { font-size: 20px; color: #1B3A5C; margin-bottom: 6px; }
.login-box p { font-size: 13px; color: #888; margin-bottom: 24px; }
.login-box input { width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; font-family: inherit; margin-bottom: 12px; }
.login-box input:focus { outline: none; border-color: #2E75B6; box-shadow: 0 0 0 3px rgba(46,117,182,0.15); }
.login-box .login-btn { width: 100%; padding: 10px; background: #1B3A5C; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
.login-box .login-btn:hover { background: #244d75; }
.login-error { color: #c0392b; font-size: 12px; margin-bottom: 12px; }
/* Collapsible section styles */
.collapsible-header { display: flex; align-items: center; cursor: pointer; padding: 8px 0; margin-bottom: 4px; user-select: none; gap: 6px; }
.collapsible-header:hover .panel-section-title { color: #1B3A5C; }
.collapsible-arrow { font-size: 10px; color: #888; transition: transform 0.2s; width: 14px; flex-shrink: 0; }
.collapsible-arrow.open { transform: rotate(90deg); }
.collapsible-content { overflow: hidden; transition: max-height 0.25s ease; }
.collapsible-content.collapsed { max-height: 0 !important; overflow: hidden; }
.domain-tag { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; padding: 1px 6px; border-radius: 3px; margin-left: 8px; text-transform: uppercase; vertical-align: middle; }
.domain-tag-security { background: #fce4ec; color: #c62828; }
.domain-tag-management { background: #e3f2fd; color: #1565c0; }
.domain-tag-use { background: #e8f5e9; color: #2e7d32; }
.domain-tag-leadership { background: #f3e5f5; color: #6a1b9a; }
.modal-section-title { font-size: 12px; font-weight: 700; color: #1B3A5C; margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid #eee; }
.modal-section-title:first-child { margin-top: 0; }
/* ===== Schema drill-down ===== */
.drill-banner { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 16px; background: linear-gradient(90deg,#eaf2fb,#f3f8fd); border: 1px solid #cfe0f2; border-radius: 8px; }
.drill-banner .drill-icon { font-size: 20px; }
.drill-banner .drill-text { flex: 1; font-size: 12px; color: #1B3A5C; }
.drill-banner .drill-text strong { display: block; font-size: 13px; margin-bottom: 2px; }
.breadcrumb { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #555; }
.breadcrumb .crumb-link { color: #2E75B6; cursor: pointer; font-weight: 500; }
.breadcrumb .crumb-link:hover { text-decoration: underline; }
.breadcrumb .crumb-sep { color: #bbb; }
.schema-canvas { flex: 1; min-width: 0; position: relative; overflow: hidden; background: #eef2f7; cursor: grab; }
.schema-canvas.panning { cursor: grabbing; }
.schema-links { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
.schema-world { position: absolute; top: 0; left: 0; transform-origin: 0 0; z-index: 2; }
.schema-card { position: absolute; width: 240px; background: #fff; border: 1px solid #c3cedb; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.10); overflow: hidden; }
.schema-card.selected { border-color: #D4772C; box-shadow: 0 0 0 2px rgba(212,119,44,0.35), 0 4px 14px rgba(0,0,0,0.18); }
.schema-card.dimmed { opacity: 0.3; }
.schema-card-header { height: 34px; display: flex; flex-direction: column; justify-content: center; padding: 0 10px; background: #1B3A5C; color: #fff; cursor: grab; }
.schema-card-header:active { cursor: grabbing; }
.schema-card-schema { font-size: 8px; letter-spacing: 0.5px; opacity: 0.6; text-transform: uppercase; line-height: 1.1; }
.schema-card-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.schema-card-body { max-height: 220px; overflow-y: auto; }
.schema-col-row { display: flex; align-items: center; gap: 5px; padding: 3px 9px; font-size: 11px; border-top: 1px solid #f1f3f5; cursor: pointer; }
.schema-col-row:hover { background: #eef5fc; }
.schema-col-row.selected { background: #fdebd0; }
.schema-col-key { width: 22px; flex-shrink: 0; display: flex; gap: 2px; }
.schema-col-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1a2332; }
.schema-col-type { color: #9aa6b2; font-size: 10px; flex-shrink: 0; }
.col-badge { font-size: 8px; font-weight: 700; padding: 0 3px; border-radius: 3px; line-height: 1.4; }
.col-badge-pk { background: #f9e79f; color: #7d6608; }
.col-badge-fk { background: #aed6f1; color: #1a5276; }
.gov-dot { width: 7px; height: 7px; border-radius: 50%; background: #D4772C; flex-shrink: 0; }
.schema-link-line { stroke: #9fb3c8; stroke-width: 1.5; fill: none; }
.schema-link-line.hl { stroke: #D4772C; stroke-width: 2.5; }
.schema-empty { padding: 40px; text-align: center; color: #888; font-size: 14px; }
/* governance inheritance display */
.gov-field { display: flex; margin-bottom: 7px; font-size: 13px; line-height: 1.5; }
.gov-field .field-label { width: 140px; flex-shrink: 0; color: #666; font-weight: 500; }
.gov-field .gov-val { flex: 1; color: #1a2332; word-break: break-word; }
.gov-val.inherited { color: #8a96a3; font-style: italic; }
.src-tag { display: inline-block; font-size: 8px; font-weight: 700; padding: 1px 5px; border-radius: 3px; margin-left: 6px; text-transform: uppercase; letter-spacing: 0.3px; vertical-align: middle; }
.src-tag-system { background: #eceff1; color: #607d8b; }
.src-tag-table { background: #e3f2fd; color: #1565c0; }
.src-tag-column { background: #fdebd0; color: #b9770e; }
.src-tag-none { background: #f5f5f5; color: #bbb; }
.gov-hint { font-size: 10px; color: #999; margin-top: 2px; }
.col-meta-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; margin-bottom: 4px; }
.col-meta-row .chip { background: #eef2f7; border-radius: 4px; padding: 2px 8px; color: #4a5764; }
/* ===== Auth / admin ===== */
.login-box .login-sub { font-size: 12px; color: #888; margin-top: 14px; line-height: 1.5; }
.login-box label { display: block; text-align: left; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
.login-box .field { margin-bottom: 12px; }
.login-note { background: #fff8e1; border: 1px solid #ffe0a3; color: #7a5b00; border-radius: 6px; padding: 10px 12px; font-size: 12px; margin-bottom: 14px; text-align: left; line-height: 1.5; }
.policy-list { text-align: left; font-size: 12px; color: #c0392b; margin: -4px 0 12px; padding-left: 18px; }
.policy-list li { margin-bottom: 2px; }
.user-chip { display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; }
.user-chip .avatar { width: 28px; height: 28px; border-radius: 50%; background: #5BA4E6; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; flex-shrink: 0; }
.user-chip .who { flex: 1; min-width: 0; }
.user-chip .who b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-chip .who span { opacity: 0.6; font-size: 10px; }
.user-chip button { background: rgba(255,255,255,0.15); border: none; color: #fff; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
.user-chip button:hover { background: rgba(255,255,255,0.28); }
.role-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; letter-spacing: 0.3px; }
.role-Viewer { background: #e8eef4; color: #4a5764; }
.role-Editor { background: #d6eaf8; color: #1a5276; }
.role-Administrator { background: #e8daef; color: #6c3483; }
.role-SuperAdmin { background: #fdebd0; color: #7e5109; }
.inactive-row td { opacity: 0.45; }
.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; padding: 12px 20px; background: #fff; border-bottom: 1px solid #eee; }
.filter-bar .fg { display: flex; flex-direction: column; gap: 3px; }
.filter-bar label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; font-weight: 600; }
.filter-bar input, .filter-bar select { padding: 6px 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 12px; font-family: inherit; }
.audit-changes { margin-top: 4px; font-size: 11px; }
.audit-changes .chg { display: block; color: #555; padding: 1px 0; }
.audit-changes .old { color: #c0392b; text-decoration: line-through; margin-right: 4px; }
.audit-changes .new { color: #1e7e34; }
.pref-group { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; overflow: hidden; }
.pref-group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #fff; background: #1B3A5C; padding: 10px 16px; }
.pref-row { display: flex; gap: 16px; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; align-items: flex-start; }
.pref-row:last-child { border-bottom: none; }
.pref-row .pref-label { width: 260px; flex-shrink: 0; }
.pref-row .pref-label b { display: block; font-size: 13px; color: #1a2332; }
.pref-row .pref-label span { font-size: 11px; color: #888; line-height: 1.45; }
.pref-row .pref-control { flex: 1; }
.pref-row input[type=text], .pref-row input[type=number], .pref-row select { width: 100%; max-width: 380px; padding: 7px 9px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; font-family: inherit; }
.pref-row.locked { background: #fafafa; }
.pref-row.locked .pref-label b::after { content: ' — not yet available'; font-weight: 400; color: #b08900; font-size: 11px; }
.banner { padding: 10px 20px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
.banner-error { background: #fde8e8; color: #922b21; border-bottom: 1px solid #f5c6cb; }
.banner-ok { background: #e6f4ea; color: #1e7e34; border-bottom: 1px solid #bfe5c9; }
.empty-state { padding: 40px; text-align: center; color: #999; font-size: 14px; }
/* Screens that stack a toolbar above a scrolling table. The content area is a
   flex row, so a screen with more than one child must declare its own column. */
.screen { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.screen .table-view { flex: 1; overflow-y: auto; }
/* Sortable table headers */
.data-table th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
.data-table th.sortable:hover { background: #24547f; }
.data-table th .sort-arrow { display: inline-block; margin-left: 5px; font-size: 9px; opacity: 0.45; }
.data-table th.sorted .sort-arrow { opacity: 1; }
/* Diagram nodes: the border band drags, the inside opens the details panel. */
.system-node .node-frame { cursor: grab; }
.system-node .node-frame.locked { cursor: default; }
.system-node:active .node-frame { cursor: grabbing; }
.system-node .node-body { cursor: pointer; }
/* ===== Version badge ===== */
.version-badge { position: fixed; right: 10px; bottom: 8px; z-index: 60; font-size: 10px;
  color: #8a96a3; background: rgba(255,255,255,0.85); border: 1px solid #e2e8ef;
  border-radius: 10px; padding: 2px 9px; cursor: pointer; letter-spacing: 0.3px; }
.version-badge:hover { color: #2E75B6; border-color: #b9d3ea; }
/* ===== Release notes ===== */
.release-modal { width: 680px; max-height: 82vh; display: flex; flex-direction: column; }
.release-scroll { overflow-y: auto; padding: 4px 24px 8px; }
.release-entry { border-bottom: 1px solid #eee; padding: 14px 0; }
.release-entry:last-child { border-bottom: none; }
.release-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.release-head h3 { font-size: 15px; color: #1B3A5C; }
.release-ver { font-size: 11px; font-weight: 700; background: #1B3A5C; color: #fff;

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<script type="text/babel" data-presets="react">
/* @jsxRuntime classic */
// Uses the classic JSX runtime (React.createElement) — React is loaded globally
// above. Do not switch to the automatic runtime: it emits `import` statements
// that cannot run in this inline (non-module) script.
const { useState, useEffect, useCallback, useRef } = React;

// ===== Session-aware API client =====
// The CSRF token is issued at login and must accompany every state-changing
// request. A 401 means the session expired or was revoked, so the app returns
// to the login screen rather than silently rendering empty panels.
const session = { csrf: null };
let onAuthLost = () => {};

class ApiError extends Error {
  constructor(status, payload) {
    super((payload && payload.error) || `Request failed (${status})`);
    this.status = status;
    this.payload = payload || {};
    this.problems = this.payload.problems || null;
  }
}

async function request(method, url, data) {
  const opts = { method, credentials: 'same-origin', headers: {} };
  if (data !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(data);
  }
  if (method !== 'GET' && session.csrf) opts.headers['X-CSRF-Token'] = session.csrf;
  const r = await fetch(url, opts);
  if (r.status === 401) { onAuthLost(); throw new ApiError(401, { error: 'Your session has ended.' }); }
  const ctype = r.headers.get('Content-Type') || '';
  const payload = ctype.includes('json') ? await r.json().catch(() => ({})) : await r.text();
  if (!r.ok) throw new ApiError(r.status, typeof payload === 'object' ? payload : { error: payload });
  return payload;
}

// Multipart uploads can't go through request(): FormData sets its own
// Content-Type. This mirrors its error handling, including the case where the
// server answers with something that isn't JSON at all.
async function uploadFile(url, formData) {
  const r = await fetch(url, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'X-CSRF-Token': session.csrf }, body: formData,
  });
  if (r.status === 401) { onAuthLost(); throw new ApiError(401, { error: 'Your session has ended.' }); }
  const text = await r.text();
  let payload;
  try { payload = JSON.parse(text); }
  catch (e) {
    throw new ApiError(r.status, {
      error: r.ok
        ? 'The server returned an unexpected response.'
        : `Upload failed (${r.status} ${r.statusText}). The server did not return JSON — ` +
          `check the container logs with: docker compose logs --tail=50 app`,
    });
  }
  if (!r.ok) throw new ApiError(r.status, payload);
  return payload;
}

const api = {
  get: (url) => request('GET', url),
  post: (url, data) => request('POST', url, data === undefined ? {} : data),
  put: (url, data) => request('PUT', url, data === undefined ? {} : data),
  del: (url) => request('DELETE', url),
  // Fire-and-forget for high-frequency writes like node dragging.
  quiet: (method, url, data) => request(method, url, data).catch(() => {}),
};

// System types (and their colours) are configured in Preferences and loaded
// from the server. These are only a fallback for the first paint.
const FALLBACK_TYPE = { fill: '#e2e6ea', stroke: '#4a5764', text: '#333f4a' };
let TYPE_COLORS = {
  'Source': { fill: '#dce9fb', stroke: '#2f6fd0', text: '#123a6b' },
  'Destination': { fill: '#c9e6d2', stroke: '#116039', text: '#0d3d22' },
  'Data Store': { fill: '#e8daef', stroke: '#7d3c98', text: '#5b2c6f' },
  'Manual Entry': { fill: '#fce5cd', stroke: '#b35c00', text: '#7a3e00' },
};
const getColor = (type) => TYPE_COLORS[type] || FALLBACK_TYPE;
const STATUS_BADGE = { Active: 'active', Deprecated: 'deprecated', Planned: 'planned', Broken: 'broken', 'Under Review': 'planned' };
const CLASS_BADGE = { Confidential: 'confidential', Sensitive: 'sensitive', Internal: 'internal', Public: 'public' };

// Roles are ordered; a higher role inherits everything below it. This mirrors
// permissions.py on the server, which is where the rule is actually enforced —
// hiding a control here is only a convenience.
const ROLE_ORDER = ['Viewer', 'Editor', 'Administrator', 'SuperAdmin'];
const roleAtLeast = (role, minimum) =>
  ROLE_ORDER.indexOf(role) >= ROLE_ORDER.indexOf(minimum);

// ===== Sortable tables =====
// Click a header to sort ascending, click again for descending. Values are
// compared numerically when both sides are numeric, otherwise case-insensitively
// as text, with blanks always sorted last.
function useSort(rows, initialKey, initialDir) {
  const [sort, setSort] = useState({ key: initialKey || null, dir: initialDir || 'asc' });
  const toggle = (key) => setSort(s =>
    s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' });

  const sorted = React.useMemo(() => {
    if (!sort.key) return rows;
    const factor = sort.dir === 'asc' ? 1 : -1;
    const val = (r) => {
      const v = typeof sort.key === 'function' ? sort.key(r) : r[sort.key];
      return (v === null || v === undefined || v === '') ? null : v;
    };
    return [...rows].sort((a, b) => {
      const x = val(a), y = val(b);
      if (x === null && y === null) return 0;
      if (x === null) return 1;          // blanks last, regardless of direction
      if (y === null) return -1;
      const nx = Number(x), ny = Number(y);
      if (!Number.isNaN(nx) && !Number.isNaN(ny) && x !== true && y !== true) {
        return (nx - ny) * factor;
      }
      return String(x).localeCompare(String(y), undefined, { sensitivity: 'base' }) * factor;
    });
  }, [rows, sort]);

  return { sorted, sort, toggle };
}

function SortHeader({ label, sortKey, sort, toggle, style }) {
  const active = sort.key === sortKey;
  return (
    <th className={`sortable ${active ? 'sorted' : ''}`} style={style}
        onClick={() => toggle(sortKey)} role="columnheader" tabIndex={0}
        onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(sortKey); } }}
        aria-sort={active ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}
        title={`Sort by ${label}`}>
      {label}<span className="sort-arrow">{active ? (sort.dir === 'asc' ? '▲' : '▼') : '▴▾'}</span>
    </th>
  );
}

// Contributor references are stored as IDs; show the person's name with the ID
// in parentheses so the record is still easy to spot.
function contributorLabel(id, contributors) {
  if (!id) return null;
  const c = (contributors || []).find(x => x.contributor_id === id);
  return c ? `${c.name} (${c.contributor_id})` : id;
}
function ContributorField({ label, value, contributors }) {
  return <ReadField label={label} value={contributorLabel(value, contributors)} />;
}
function ContributorSelect({ label, value, onChange, contributors }) {
  return (
    <div className="edit-field-row"><span className="field-label">{label}</span>
      <select className="edit-select" value={value || ''} onChange={e => onChange(e.target.value || null)}>
        <option value="">— none —</option>
        {(contributors || []).map(c =>
          <option key={c.contributor_id} value={c.contributor_id}>{c.name} ({c.contributor_id})</option>)}
      </select>
    </div>
  );
}

// Dropdowns of systems are sorted by name — hunting for an ID in creation order
// is needlessly hard once there are more than a handful.
const byName = (list) => [...(list || [])].sort((a, b) =>
  String(a.name || '').localeCompare(String(b.name || '')));
const systemOption = (s) => `${s.name} (${s.system_id})`;

const VIEW_TITLES = {
  diagram: 'Lineage Diagram', systems: 'Systems Catalog',
  flows: 'Data Flows Catalog', elements: 'Data Elements Glossary',
  contributors: 'Contributors', users: 'User Management',
  preferences: 'Preferences', audit: 'Audit Log', releases: 'Release Notes',
};

// ===== Collapsible Section =====
function CollapsibleSection({ title, domainTag, children, defaultOpen }) {
  const [open, setOpen] = useState(defaultOpen !== false);
  const contentRef = useRef(null);
  return (
    <div className="panel-section">
      <div className="collapsible-header" onClick={() => setOpen(!open)}>
        <span className={`collapsible-arrow ${open ? 'open' : ''}`}>&#9654;</span>
        <span className="panel-section-title" style={{marginBottom:0}}>{title}</span>
        {domainTag && <span className={`domain-tag domain-tag-${domainTag}`}>
          {domainTag === 'security' ? '2.0 Security' : domainTag === 'management' ? '3.0 Mgmt' : domainTag === 'use' ? '4.0 Use' : '1.0 Leadership'}
        </span>}
      </div>
      <div ref={contentRef} className={`collapsible-content ${open ? '' : 'collapsed'}`}
           style={open ? {maxHeight: '2000px'} : {}}>
        {children}
      </div>

  );
}

// ===== SVG Diagram =====
function DiagramCanvas({ systems, flows, selected, onSelectSystem, onSelectFlow, onUpdatePosition, onDrill, canEdit, panelOpen, onDismissPanel, systemTypes }) {
  const svgRef = useRef(null);
  const dragRef = useRef(null);
  const [panOffset, setPanOffset] = useState({ x: 0, y: 0 });
  const [zoom, setZoom] = useState(1);
  const isPanning = useRef(false);
  const panStart = useRef({ x: 0, y: 0 });
  const NODE_W = 200, NODE_H = 70, NODE_EDGE = 12;  // NODE_EDGE = draggable border band

  const handleMouseDown = useCallback((e, sys) => {
    if (sys && !canEdit) { e.stopPropagation(); return; }   // viewers cannot rearrange
    if (sys) {
      e.stopPropagation();
      const svg = svgRef.current;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
      dragRef.current = { id: sys.system_id, offsetX: svgP.x / zoom - panOffset.x / zoom - sys.x_pos, offsetY: svgP.y / zoom - panOffset.y / zoom - sys.y_pos };
    } else {
      isPanning.current = true;
      panStart.current = { x: e.clientX - panOffset.x, y: e.clientY - panOffset.y };
    }
  }, [panOffset, zoom, canEdit]);

  const handleMouseMove = useCallback((e) => {
    if (dragRef.current) {
      const svg = svgRef.current;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
      const newX = svgP.x / zoom - panOffset.x / zoom - dragRef.current.offsetX;
      const newY = svgP.y / zoom - panOffset.y / zoom - dragRef.current.offsetY;
      onUpdatePosition(dragRef.current.id, newX, newY);
    } else if (isPanning.current) {
      setPanOffset({ x: e.clientX - panStart.current.x, y: e.clientY - panStart.current.y });
    }
  }, [onUpdatePosition, panOffset, zoom]);

  const handleMouseUp = useCallback(() => {
    if (dragRef.current) {
      const sys = systems.find(s => s.system_id === dragRef.current.id);
      if (sys) api.quiet('PUT', `/api/systems/${sys.system_id}/position`, { x_pos: sys.x_pos, y_pos: sys.y_pos });
      dragRef.current = null;
    }
    isPanning.current = false;
  }, [systems]);

  const handleWheel = useCallback((e) => {
    e.preventDefault();
    setZoom(z => Math.max(0.3, Math.min(3, z * (e.deltaY > 0 ? 0.9 : 1.1))));
  }, []);

  useEffect(() => {
    const svg = svgRef.current;
    if (svg) svg.addEventListener('wheel', handleWheel, { passive: false });
    return () => { if (svg) svg.removeEventListener('wheel', handleWheel); };
  }, [handleWheel]);

  const [showTypeKey, setShowTypeKey] = useState(false);
  const sysMap = {};
  systems.forEach(s => { sysMap[s.system_id] = s; });

  return (
    <div className="canvas-container">
      {/* While a details panel is open the diagram is frozen: the next click
          anywhere closes the panel and does nothing else. Scrolling still zooms,
          so you can still look around what you are reading about. */}
      {panelOpen && <div className="diagram-freeze" onMouseDown={(e) => {
        e.preventDefault(); e.stopPropagation(); onDismissPanel();
      }} title="Click to close the details panel" />}
      <svg ref={svgRef} role="img"
           aria-label={`Data lineage diagram: ${systems.length} systems and ${flows.length} data flows. The Systems and Data Flows tables in the sidebar list the same information.`}
           onMouseDown={(e) => handleMouseDown(e, null)} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}>
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#888"><polygon points="0 0, 10 3.5, 0 7" /></marker>
          <marker id="arrowhead-sel" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#D4772C"><polygon points="0 0, 10 3.5, 0 7" /></marker>
        </defs>
        <g transform={`translate(${panOffset.x},${panOffset.y}) scale(${zoom})`}>
          {flows.map(flow => {
            const src = sysMap[flow.source_system_id], dst = sysMap[flow.destination_system_id];
            if (!src || !dst) return null;
            const isSel = selected && selected.type === 'flow' && selected.id === flow.flow_id;
            const x1 = src.x_pos + NODE_W/2, y1 = src.y_pos + NODE_H/2, x2 = dst.x_pos + NODE_W/2, y2 = dst.y_pos + NODE_H/2;
            const angle = Math.atan2(y2-y1, x2-x1);
            const sx = x1+Math.cos(angle)*(NODE_W/2+5), sy = y1+Math.sin(angle)*(NODE_H/2+5);
            const ex = x2-Math.cos(angle)*(NODE_W/2+12), ey = y2-Math.sin(angle)*(NODE_H/2+12);
            return (
              <g key={flow.flow_id} className={`flow-line ${isSel?'selected':''}`}
                 onMouseDown={(e)=>e.stopPropagation()}
                 onClick={(e)=>{e.stopPropagation();onSelectFlow(flow.flow_id);}}>
                <line x1={sx} y1={sy} x2={ex} y2={ey} stroke={isSel?'#D4772C':'#999'} strokeWidth={isSel?3:2} markerEnd={isSel?'url(#arrowhead-sel)':'url(#arrowhead)'} />
                <line x1={sx} y1={sy} x2={ex} y2={ey} stroke="transparent" strokeWidth="16" />
                {/* The number is a generous click target — easier to hit than the line. */}
                <rect className="flow-label-hit" x={(sx+ex)/2-22} y={(sy+ey)/2-23} width={44} height={16}
                      rx="8" fill="#fff" fillOpacity="0.85" stroke={isSel?'#D4772C':'#d7dde5'} />
                <text className="flow-label" x={(sx+ex)/2} y={(sy+ey)/2-12} textAnchor="middle"
                      fontSize="10" fontWeight={isSel?'700':'400'}>{flow.flow_id}</text>
              </g>
            );
          })}
          {systems.map(sys => {
            const c = getColor(sys.system_type);
            const isSel = selected && selected.type === 'system' && selected.id === sys.system_id;
            return (
              <g key={sys.system_id} className={`system-node ${isSel?'selected':''}`}
                 onDoubleClick={(e)=>{e.stopPropagation(); if(sys.schema_table_count>0 && onDrill) onDrill(sys.system_id);}}
                 transform={`translate(${sys.x_pos},${sys.y_pos})`}>
                {/* Outer band: grab here to move the node. */}
                <rect className={`node-frame ${canEdit ? '' : 'locked'}`}
                      width={NODE_W} height={NODE_H} fill={c.fill}
                      stroke={isSel?'#D4772C':c.stroke} strokeWidth={isSel?3:2}
                      onMouseDown={(e)=>handleMouseDown(e,sys)} />
                {/* Inner area: click here to open the details panel. */}
                <rect className="node-body" x={NODE_EDGE} y={NODE_EDGE}
                      width={NODE_W-NODE_EDGE*2} height={NODE_H-NODE_EDGE*2}
                      fill={c.fill} stroke="none"
                      onMouseDown={(e)=>e.stopPropagation()}
                      onClick={(e)=>{e.stopPropagation(); onSelectSystem(sys.system_id);}} />
                <text x={NODE_W/2} y={24} textAnchor="middle" fontSize="11" fontWeight="700" fill={c.text}>{sys.name.length>28?sys.name.substring(0,26)+'...':sys.name}</text>
                <text x={NODE_W/2} y={40} textAnchor="middle" fontSize="9" fill="#888">{sys.system_type}</text>
                <text x={NODE_W/2} y={56} textAnchor="middle" fontSize="9" fill="#aaa">{sys.system_id}</text>
                {sys.schema_table_count>0 ? <g style={{cursor:'pointer'}} onMouseDown={(e)=>e.stopPropagation()} onClick={(e)=>{e.stopPropagation(); onDrill && onDrill(sys.system_id);}}>
                  <rect x={6} y={NODE_H-18} width={64} height={14} rx="7" fill="#1B3A5C" />
                  <text x={38} y={NODE_H-8} textAnchor="middle" fontSize="8" fill="#fff" fontWeight="700">&#9707; SCHEMA</text>
                </g> : null}
              </g>
            );
          })}
        </g>
      </svg>
      <div className="legend">
        <div className="legend-title">
          System Types
          <button className="type-key-info" aria-label="What do these system types mean?"
                  title="What do these mean?" onClick={() => setShowTypeKey(true)}>&#9432;</button>
        </div>
        {/* Sorted alphabetically so the key is predictable as types are added. */}
        {[...(systemTypes || [])].sort((a, b) => a.type_name.localeCompare(b.type_name)).map(t => (
          <div key={t.type_name} className="legend-item">
            <div className="legend-color" style={{background: t.fill_color,
                 border: `2px solid ${t.stroke_color}`}}></div>{t.type_name}
          </div>
        ))}
      </div>
      {showTypeKey && <SystemTypeKeyModal types={systemTypes}
                                          onClose={() => setShowTypeKey(false)} />}
    </div>
  );
}

// ===== Schema Drill-Down Canvas =====
const GOV_OVERRIDE_FIELDS = ['data_classification','contains_pii','ferpa_protected','data_owner_id','data_steward_id','retention_schedule','access_restrictions','legal_authority','business_meaning','notes'];
const colHasOverride = (c) => GOV_OVERRIDE_FIELDS.some(f => c[f] !== null && c[f] !== undefined && c[f] !== '');

const CARD_W = 240, HEADER_H = 34, ROW_H = 21, MAX_BODY = 220;
const cardHeight = (t) => HEADER_H + Math.min((t.columns ? t.columns.length : 0) * ROW_H, MAX_BODY);

function rectEdge(cx, cy, w, h, tx, ty) {
  const dx = tx - cx, dy = ty - cy;
  if (dx === 0 && dy === 0) return { x: cx, y: cy };
  const sx = dx === 0 ? Infinity : (w / 2) / Math.abs(dx);
  const sy = dy === 0 ? Infinity : (h / 2) / Math.abs(dy);
  const s = Math.min(sx, sy);
  return { x: cx + dx * s, y: cy + dy * s };
}

function SchemaCanvas({ tables, selected, onSelectTable, onSelectColumn, onUpdatePosition, canEdit }) {
  const canvasRef = useRef(null);
  const dragRef = useRef(null);
  const [panOffset, setPanOffset] = useState({ x: 40, y: 20 });
  const [zoom, setZoom] = useState(0.85);
  const isPanning = useRef(false);
  const panStart = useRef({ x: 0, y: 0 });

  const tableMap = {};
  tables.forEach(t => { tableMap[t.table_id] = t; });

  const handleHeaderDown = useCallback((e, t) => {
    e.stopPropagation();
    if (!canEdit) return;   // viewers cannot rearrange the shared layout
    dragRef.current = { id: t.table_id, mx: e.clientX, my: e.clientY, x0: t.x_pos, y0: t.y_pos, moved: false };
  }, [canEdit]);

  const handleMouseMove = useCallback((e) => {
    if (dragRef.current) {
      const d = dragRef.current;
      d.moved = true;
      onUpdatePosition(d.id, d.x0 + (e.clientX - d.mx) / zoom, d.y0 + (e.clientY - d.my) / zoom);
    } else if (isPanning.current) {
      setPanOffset({ x: e.clientX - panStart.current.x, y: e.clientY - panStart.current.y });
    }
  }, [onUpdatePosition, zoom]);

  const endDrag = useCallback(() => {
    if (dragRef.current) {
      const t = tableMap[dragRef.current.id];
      if (t && dragRef.current.moved) api.quiet('PUT', `/api/schema/tables/${t.table_id}/position`, { x_pos: t.x_pos, y_pos: t.y_pos });
      dragRef.current = null;
    }
    isPanning.current = false;
  }, [tableMap]);

  const handleBgDown = useCallback((e) => {
    isPanning.current = true;
    panStart.current = { x: e.clientX - panOffset.x, y: e.clientY - panOffset.y };
  }, [panOffset]);

  const handleWheel = useCallback((e) => {
    e.preventDefault();
    setZoom(z => Math.max(0.25, Math.min(2.5, z * (e.deltaY > 0 ? 0.9 : 1.1))));
  }, []);

  useEffect(() => {
    const el = canvasRef.current;
    if (el) el.addEventListener('wheel', handleWheel, { passive: false });
    return () => { if (el) el.removeEventListener('wheel', handleWheel); };
  }, [handleWheel]);

  // Build deduped FK links between tables
  const linkSet = {};
  tables.forEach(t => {
    (t.columns || []).forEach(c => {
      if (c.is_fk && c.fk_target_table_id && tableMap[c.fk_target_table_id] && c.fk_target_table_id !== t.table_id) {
        linkSet[`${t.table_id}->${c.fk_target_table_id}`] = { src: t.table_id, dst: c.fk_target_table_id };
      }
    });
  });
  const links = Object.values(linkSet);
  const selId = selected && selected.type === 'schema_table' ? selected.id
              : selected && selected.type === 'schema_column' ? selected.parentTableId : null;
  const connected = new Set();
  if (selId) { connected.add(selId); links.forEach(l => { if (l.src === selId) connected.add(l.dst); if (l.dst === selId) connected.add(l.src); }); }

  const transform = `translate(${panOffset.x}px,${panOffset.y}px) scale(${zoom})`;

  return (
    <div ref={canvasRef} className={`schema-canvas ${isPanning.current ? 'panning' : ''}`}
         onMouseDown={handleBgDown} onMouseMove={handleMouseMove} onMouseUp={endDrag} onMouseLeave={endDrag}>
      {tables.length === 0 && <div className="schema-empty">No schema tables defined for this system yet.</div>}
      <svg className="schema-links">
        <defs>
          <marker id="fk-arrow" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#9fb3c8"><polygon points="0 0, 9 3, 0 6" /></marker>
          <marker id="fk-arrow-hl" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#D4772C"><polygon points="0 0, 9 3, 0 6" /></marker>
        </defs>
        <g transform={`translate(${panOffset.x},${panOffset.y}) scale(${zoom})`}>
          {links.map(l => {
            const s = tableMap[l.src], d = tableMap[l.dst];
            if (!s || !d) return null;
            const sH = cardHeight(s), dH = cardHeight(d);
            const sc = { x: s.x_pos + CARD_W / 2, y: s.y_pos + sH / 2 };
            const dc = { x: d.x_pos + CARD_W / 2, y: d.y_pos + dH / 2 };
            const p1 = rectEdge(sc.x, sc.y, CARD_W, sH, dc.x, dc.y);
            const p2 = rectEdge(dc.x, dc.y, CARD_W, dH, sc.x, sc.y);
            const hl = selId && (l.src === selId || l.dst === selId);
            return <line key={`${l.src}->${l.dst}`} className={`schema-link-line ${hl ? 'hl' : ''}`}
                         x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y}
                         markerEnd={hl ? 'url(#fk-arrow-hl)' : 'url(#fk-arrow)'} />;
          })}
        </g>
      </svg>
      <div className="schema-world" style={{ transform }}>
        {tables.map(t => {
          const isSel = selId === t.table_id;
          const dim = selId && !connected.has(t.table_id);
          const colSelId = selected && selected.type === 'schema_column' ? selected.id : null;
          return (
            <div key={t.table_id} className={`schema-card ${isSel ? 'selected' : ''} ${dim ? 'dimmed' : ''}`}
                 style={{ left: t.x_pos, top: t.y_pos, width: CARD_W }}>
              <div className="schema-card-header" onMouseDown={(e) => handleHeaderDown(e, t)}
                   onClick={(e) => { e.stopPropagation(); if (!dragRef.current || !dragRef.current.moved) onSelectTable(t.table_id); }}>
                <span className="schema-card-schema">{t.schema_name}</span>
                <span className="schema-card-title">{t.table_name}</span>
              </div>
              <div className="schema-card-body">
                {(t.columns || []).map(c => (
                  <div key={c.column_id} className={`schema-col-row ${colSelId === c.column_id ? 'selected' : ''}`}
                       onMouseDown={(e) => e.stopPropagation()}
                       onClick={(e) => { e.stopPropagation(); onSelectColumn(c.column_id, t.table_id); }}>
                    <span className="schema-col-key">
                      {c.is_pk ? <span className="col-badge col-badge-pk">PK</span> : null}
                      {c.is_fk ? <span className="col-badge col-badge-fk">FK</span> : null}
                    </span>
                    <span className="schema-col-name">{c.column_name}</span>
                    {colHasOverride(c) ? <span className="gov-dot" title="Has governance override"></span> : null}
                    <span className="schema-col-type">{c.data_type}</span>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      <div className="legend">
        <div className="legend-title">Schema View</div>
        <div className="legend-item"><span className="col-badge col-badge-pk">PK</span> Primary key</div>
        <div className="legend-item"><span className="col-badge col-badge-fk">FK</span> Foreign key</div>
        <div className="legend-item"><span className="gov-dot"></span> Governance override</div>
        <div className="legend-item" style={{marginTop:4,color:'#888'}}>Drag headers · scroll to zoom</div>
      </div>
    </div>
  );
}

// ===== Governance inheritance display helpers =====
const SRC_LABEL = { system: 'Inherited', table: 'From table', column: 'Override', none: '—' };
function fmtGov(field, v) {
  if (v === null || v === undefined || v === '') return '—';
  if (field === 'contains_pii' || field === 'ferpa_protected') return v ? 'Yes' : 'No';
  return v;
}
function GovReadField({ label, field, gov }) {
  const g = (gov && gov[field]) || { value: null, source: 'none' };
  const inherited = g.source === 'system' || g.source === 'table';
  return (
    <div className="gov-field">
      <span className="field-label">{label}</span>
      <span className={`gov-val ${inherited ? 'inherited' : ''}`}>
        {fmtGov(field, g.value)}
        <span className={`src-tag src-tag-${g.source}`}>{SRC_LABEL[g.source]}</span>
      </span>
    </div>
  );
}

// ===== Inline Edit Helpers =====
function EditField({ label, value, onChange, type, options, invalid }) {
  const bad = invalid ? ' field-error' : '';
  const note = invalid ? <div className="field-error-msg">This field is required</div> : null;
  if (type === 'textarea') return (
    <div className="edit-field-row"><span className="field-label">{label}</span>
      <div style={{flex:1}}><textarea className={'edit-textarea'+bad} value={value||''}
        aria-invalid={!!invalid} onChange={e=>onChange(e.target.value)} />{note}</div></div>
  );
  if (type === 'select') return (
    <div className="edit-field-row"><span className="field-label">{label}</span>
      <div style={{flex:1}}><select className={'edit-select'+bad} value={value||''}
        aria-invalid={!!invalid} onChange={e=>onChange(e.target.value)}>
        {options.map(o=><option key={o} value={o}>{o}</option>)}</select>{note}</div></div>
  );
  if (type === 'checkbox') return (
    <div className="edit-field-row"><span className="field-label">{label}</span><label style={{display:'flex',alignItems:'center',gap:6,fontSize:13}}><input type="checkbox" checked={!!value} onChange={e=>onChange(e.target.checked?1:0)} /> {value ? 'Yes' : 'No'}</label></div>
  );
  return (
    <div className="edit-field-row"><span className="field-label">{label}</span>
      <div style={{flex:1}}><input className={'edit-input'+bad} value={value||''}
        aria-invalid={!!invalid} onChange={e=>onChange(e.target.value)} />{note}</div></div>
  );
}

function ReadField({ label, value, multiline }) {
  return <div className="field-row"><span className="field-label">{label}</span><span className={`field-value${multiline?' multiline':''}`}>{value || '—'}</span></div>;
}

function ClassificationBadge({ value }) {
  if (!value) return <span className="field-value">{'—'}</span>;
  return <span className={`badge badge-${CLASS_BADGE[value] || 'internal'}`}>{value}</span>;
}

// The same required fields the server enforces. Kept here so the panel can say
// what is missing rather than surfacing a 400 after the fact.
const PANEL_REQUIRED = {
  system: [
    { key: 'name', label: 'Name' },
    { key: 'system_type', label: 'Type' },
    { key: 'managed_by', label: 'Managed By' },
  ],
  flow: [
    { key: 'name', label: 'Name' },
    { key: 'source_system_id', label: 'Source' },
    { key: 'destination_system_id', label: 'Destination' },
    { key: 'frequency', label: 'Frequency' },
    { key: 'transfer_method', label: 'Method' },
    { key: 'format', label: 'Format' },
  ],
  element: [
    { key: 'name', label: 'Name' },
    { key: 'definition', label: 'Definition' },
  ],
  contributor: [
    { key: 'name', label: 'Name' },
    { key: 'organization_unit', label: 'Organization Unit' },
  ],
};

// ===== Detail Panel with Edit =====
function DetailPanel({ data, type, onClose, onSave, onDelete, systems, onDrill, canEdit, notify, contributors, isAdmin, systemTypes, onSchemaChanged }) {
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({});
  const [missing, setMissing] = useState([]);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const bodyRef = useRef(null);
  const isOpen = !!data;

  useEffect(() => { setEditing(false); setMissing([]); setConfirmDelete(false); }, [data, type]);

  const startEdit = () => { setForm({...data}); setMissing([]); setEditing(true); };
  const cancelEdit = () => { setEditing(false); setMissing([]); };

  const requiredGaps = (f) => (PANEL_REQUIRED[type] || []).filter(r => {
    const v = f[r.key];
    return v === undefined || v === null || String(v).trim() === '';
  });

  const saveEdit = async () => {
    // Blocking here keeps a record from being saved without its name, which the
    // database would happily accept as an empty string.
    const gaps = requiredGaps(form);
    if (gaps.length) {
      setMissing(gaps.map(g => g.key));
      if (bodyRef.current) bodyRef.current.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    setMissing([]);
    let url, saveData;
    if (type === 'system') {
      url = `/api/systems/${data.system_id}`;
      saveData = {
        name: form.name, description: form.description, system_type: form.system_type,
        vendor: form.vendor, technology: form.technology, environment: form.environment,
        managed_by: form.managed_by, organization: form.organization,
        contains_pii: form.contains_pii, ferpa_protected: form.ferpa_protected,
        status: form.status, notes: form.notes,
        data_classification: form.data_classification, access_method: form.access_method,
        encryption_at_rest: form.encryption_at_rest, encryption_in_transit: form.encryption_in_transit,
        last_security_review: form.last_security_review, has_audit_trail: form.has_audit_trail,
        data_steward_id: form.data_steward_id, retention_schedule: form.retention_schedule,
        destruction_method: form.destruction_method, backup_frequency: form.backup_frequency,
        disaster_recovery: form.disaster_recovery, data_standards: form.data_standards,
        authorized_users: form.authorized_users, data_sharing_restrictions: form.data_sharing_restrictions,
        entry_type: form.entry_type, entered_by: form.entered_by,
        entry_validation: form.entry_validation,
        entry_error_correction: form.entry_error_correction,
        target_system_id: form.target_system_id,
      };
    } else if (type === 'flow') {
      url = `/api/flows/${data.flow_id}`;
      saveData = {
        name: form.name, description: form.description,
        source_system_id: form.source_system_id, destination_system_id: form.destination_system_id,
        direction: form.direction, frequency: form.frequency,
        transfer_method: form.transfer_method, format: form.format,
        transformation_steps: form.transformation_steps, business_rules: form.business_rules,
        validations: form.validations, error_handling: form.error_handling,
        contains_pii: form.contains_pii, ferpa_protected: form.ferpa_protected,
        regulatory_driver: form.regulatory_driver, status: form.status, known_issues: form.known_issues,
        frequency_detail: form.frequency_detail, organization: form.organization,
        managed_by: form.managed_by, data_steward_id: form.data_steward_id,
        data_classification: form.data_classification, encryption_method: form.encryption_method,
        disclosure_avoidance: form.disclosure_avoidance,
        data_quality_measures: form.data_quality_measures, data_standard: form.data_standard,
        retention_at_destination: form.retention_at_destination, legal_authority: form.legal_authority,
      };
    } else if (type === 'element') {
      url = `/api/elements/${data.element_id}`;
      saveData = {
        name: form.name, aliases: form.aliases, definition: form.definition,
        data_type: form.data_type, valid_values: form.valid_values,
        is_pii: form.is_pii, ferpa_protected: form.ferpa_protected, notes: form.notes,
        data_classification: form.data_classification, data_standard: form.data_standard,
        business_meaning: form.business_meaning,
        data_owner_id: form.data_owner_id, data_steward_id: form.data_steward_id,
      };
    } else if (type === 'contributor') {
      url = `/api/contributors/${data.contributor_id}`;
      saveData = {
        name: form.name, title: form.title, organization_unit: form.organization_unit,
        email: form.email, phone: form.phone, role_type: form.role_type,
        governance_role: form.governance_role,
        governance_responsibilities: form.governance_responsibilities,
        training_status: form.training_status, last_training_date: form.last_training_date,
        notes: form.notes,
      };
    } else if (type === 'schema_table' || type === 'schema_column') {
      url = type === 'schema_table' ? `/api/schema/tables/${data.table_id}` : `/api/schema/columns/${data.column_id}`;
      saveData = {
        data_classification: form.data_classification, contains_pii: form.contains_pii,
        ferpa_protected: form.ferpa_protected, data_owner_id: form.data_owner_id,
        data_steward_id: form.data_steward_id, retention_schedule: form.retention_schedule,
        access_restrictions: form.access_restrictions, legal_authority: form.legal_authority,
        business_meaning: form.business_meaning, notes: form.notes,
      };
    }
    try {
      const result = await api.put(url, saveData);
      setEditing(false);
      onSave(type, result);
    } catch (err) {
      if (notify) notify(err.message, true);
      else alert(err.message);
    }
  };
  const set = (k, v) => setForm(f => ({...f, [k]: v}));

  const titleOf = () => {
    if (type === 'schema_table') return `${data.schema_name}.${data.table_name}`;
    if (type === 'schema_column') return data.column_name || '';
    return data.name || '';
  };

  const ContributorReadView = ({ data }) => (<>
    <CollapsibleSection title="Contributor">
      <ReadField label="ID" value={data.contributor_id} />
      <ReadField label="Name" value={data.name} />
      <ReadField label="Title" value={data.title} />
      <ReadField label="Organization Unit" value={data.organization_unit} />
      <ReadField label="Role Type" value={data.role_type} />
      <ReadField label="Email" value={data.email} />
      <ReadField label="Phone" value={data.phone} />
    </CollapsibleSection>
    <CollapsibleSection title="Governance" domainTag="leadership">
      <ReadField label="Governance Role" value={data.governance_role} />
      <ReadField label="Responsibilities" value={data.governance_responsibilities} multiline />
      <ReadField label="Training Status" value={data.training_status} />
      <ReadField label="Last Training" value={data.last_training_date} />
    </CollapsibleSection>
    {data.notes && <CollapsibleSection title="Notes">
      <div className="field-value multiline" style={{fontSize:'13px'}}>{data.notes}</div>
    </CollapsibleSection>}
  </>);

  const ContributorEditView = ({ form, set, missing }) => (<>
    <CollapsibleSection title="Contributor">
      <EditField label="Name" value={form.name} onChange={v=>set('name',v)}
                 invalid={(missing||[]).includes('name')} />
      <EditField label="Title" value={form.title} onChange={v=>set('title',v)} />
      <EditField label="Organization Unit" value={form.organization_unit}
                 onChange={v=>set('organization_unit',v)}
                 invalid={(missing||[]).includes('organization_unit')} />
      <EditField label="Role Type" value={form.role_type} onChange={v=>set('role_type',v)} />
      <EditField label="Email" value={form.email} onChange={v=>set('email',v)} />
      <EditField label="Phone" value={form.phone} onChange={v=>set('phone',v)} />
    </CollapsibleSection>
    <CollapsibleSection title="Governance" domainTag="leadership">
      <EditField label="Governance Role" value={form.governance_role} onChange={v=>set('governance_role',v)} />
      <EditField label="Responsibilities" value={form.governance_responsibilities} onChange={v=>set('governance_responsibilities',v)} type="textarea" />
      <EditField label="Training Status" value={form.training_status} onChange={v=>set('training_status',v)} type="select" options={['','Current','Overdue','Not required']} />
      <EditField label="Last Training" value={form.last_training_date} onChange={v=>set('last_training_date',v)} />
    </CollapsibleSection>
    <CollapsibleSection title="Notes">
      <EditField label="" value={form.notes} onChange={v=>set('notes',v)} type="textarea" />
    </CollapsibleSection>
  </>);

  return (
    <div className={`detail-panel ${isOpen ? '' : 'closed'}`}>
      {isOpen && <>
        <div className="panel-header">
          <h2>{editing ? `Edit: ${titleOf()}` : titleOf()}</h2>
          <button className="panel-close" onClick={onClose} aria-label="Close">&times;</button>
        </div>
        <div className="panel-actions">
          {!editing && canEdit && <button className="btn btn-edit" onClick={startEdit}>Edit</button>}
          {!editing && canEdit && onDelete && ['system','flow'].includes(type) &&
            <button className="btn btn-danger" onClick={() => setConfirmDelete(true)}>Delete</button>}
          {!editing && !canEdit && <span style={{fontSize:'12px',color:'#888'}}>
            Read-only — your role does not permit editing.</span>}
          {editing && <button className="btn btn-save" onClick={saveEdit}>Save Changes</button>}
          {editing && <button className="btn" onClick={cancelEdit}>Cancel</button>}
        </div>
        <div className="panel-body" ref={bodyRef}>
          {editing && missing.length > 0 && <div className="form-error-summary" role="alert">
            Please complete: {(PANEL_REQUIRED[type] || [])
              .filter(r => missing.includes(r.key)).map(r => r.label).join(', ')}.
          </div>}
          {type === 'system' && !editing && <SystemReadView data={data} onDrill={onDrill}
              contributors={contributors} canEdit={canEdit} notify={notify} isAdmin={isAdmin}
              systems={systems} onSchemaChanged={onSchemaChanged} />}
          {type === 'system' && editing && <SystemEditView form={form} set={set}
              contributors={contributors} systems={systems} systemTypes={systemTypes} missing={missing} />}
          {type === 'flow' && !editing && <FlowReadView data={data} contributors={contributors}
              canEdit={canEdit} notify={notify} />}
          {type === 'flow' && editing && <FlowEditView form={form} set={set} systems={systems}
              contributors={contributors} missing={missing} />}
          {type === 'element' && !editing && <ElementReadView data={data} />}
          {type === 'element' && editing && <ElementEditView form={form} set={set} missing={missing} />}
          {type === 'schema_table' && !editing && <SchemaTableReadView data={data} />}
          {type === 'schema_table' && editing && <SchemaGovEditView form={form} set={set} inherited={data.inherited} level="table" />}
          {type === 'schema_column' && !editing && <SchemaColumnReadView data={data} />}
          {type === 'schema_column' && editing && <SchemaGovEditView form={form} set={set} inherited={data.inherited} level="field" />}
          {type === 'contributor' && !editing && <ContributorReadView data={data} />}
          {type === 'contributor' && editing && <ContributorEditView form={form} set={set} missing={missing} />}
        </div>
      </>}
      {confirmDelete && <ConfirmDialog
        title={type === 'system' ? 'Delete this system?' : 'Delete this data flow?'}
        danger confirmLabel="Delete"
        message={`"${titleOf()}" will be permanently removed.`}
        detail={<div className="confirm-warn">
          {type === 'system'
            ? 'Any schema, attached documents and links belonging to this system go with it. A system still used by a data flow cannot be deleted.'
            : 'The links between this flow and its data elements, plus any attached documents, go with it.'}
          <div style={{marginTop:8}}>This cannot be undone from the audit log — restoring it would need a database backup.</div>
        </div>}
        onCancel={() => setConfirmDelete(false)}
        onConfirm={() => { setConfirmDelete(false); onDelete(type, data); }} />}
    </div>
  );
}

// ===== System Views =====
function SystemReadView({ data, onDrill, contributors, canEdit, notify, isAdmin, systems, onSchemaChanged }) {
  return (<>
    {data.schema_table_count > 0 && <div className="drill-banner">
      <span className="drill-icon">&#128451;</span>
      <div className="drill-text"><strong>Database schema available</strong>{data.schema_table_count} tables mapped for this system.</div>
      <button className="btn btn-primary" onClick={() => onDrill(data.system_id)}>Explore Schema &rarr;</button>
    </div>}
    <CollapsibleSection title="Overview">
      <ReadField label="ID" value={data.system_id} />
      <div className="field-row"><span className="field-label">Type</span><span className="field-value"><span className={`badge badge-${data.system_type?.toLowerCase().replace(/\s/g,'')}`}>{data.system_type}</span></span></div>
      <div className="field-row"><span className="field-label">Status</span><span className="field-value"><span className={`badge badge-${STATUS_BADGE[data.status]}`}>{data.status}</span></span></div>
      <ReadField label="Organization" value={data.organization} />
      <ReadField label="Managed By" value={data.managed_by} />
      <ReadField label="Vendor" value={data.vendor} />
      <ReadField label="Technology" value={data.technology} />
      <ReadField label="Environment" value={data.environment} />
      {data.description && <ReadField label="Description" value={data.description} multiline />}
      {data.notes && <ReadField label="Notes" value={data.notes} multiline />}

// ===== Schema Table / Column Governance Panels =====
function GovEditField({ field, label, form, set, inherited, type, options }) {
  const inh = (inherited && inherited[field]) || { value: null, source: 'none' };
  const hasInh = inh.value !== null && inh.value !== undefined && inh.value !== '';
  const raw = form[field];
  let control;
  if (type === 'tri') {
    const val = (raw === null || raw === undefined || raw === '') ? '' : String(raw);
    control = <select className="edit-select" value={val} onChange={e => { const v = e.target.value; set(field, v === '' ? null : Number(v)); }}>
      <option value="">(inherit)</option><option value="1">Yes</option><option value="0">No</option></select>;
  } else if (type === 'select') {
    control = <select className="edit-select" value={raw || ''} onChange={e => set(field, e.target.value)}>
      <option value="">(inherit)</option>{options.map(o => <option key={o} value={o}>{o}</option>)}</select>;
  } else if (type === 'textarea') {
    control = <textarea className="edit-textarea" value={raw || ''} placeholder="(inherit / none)" onChange={e => set(field, e.target.value)} />;
  } else {
    control = <input className="edit-input" value={raw || ''} placeholder="(inherit)" onChange={e => set(field, e.target.value)} />;
  }
  return (
    <div style={{ marginBottom: 10 }}>
      <div className="edit-field-row" style={{ marginBottom: 2 }}><span className="field-label">{label}</span>{control}</div>
      <div className="gov-hint" style={{ marginLeft: 140 }}>{hasInh ? `Inherits: ${fmtGov(field, inh.value)} (${SRC_LABEL[inh.source]})` : 'No inherited value'}</div>
    </div>
  );
}

function SchemaTableReadView({ data }) {
  return (<>
    <CollapsibleSection title="Table">
      <ReadField label="Schema" value={data.schema_name} />
      <ReadField label="Table" value={data.table_name} />
      <ReadField label="Primary Key" value={data.primary_key} />
      <ReadField label="Columns" value={String((data.columns || []).length)} />
      <ReadField label="Parent System" value={data.parent_system && data.parent_system.name} />
      {data.description && <ReadField label="Description" value={data.description} multiline />}
    </CollapsibleSection>
    <CollapsibleSection title="Governance" domainTag="security">
      <GovReadBlock gov={data.governance} />
    </CollapsibleSection>
    {(data.business_meaning || data.notes) && <CollapsibleSection title="Documentation">
      {data.business_meaning && <ReadField label="Business Meaning" value={data.business_meaning} multiline />}
      {data.notes && <ReadField label="Notes" value={data.notes} multiline />}
    </CollapsibleSection>}
  </>);
}

function SchemaColumnReadView({ data }) {
  const pt = data.parent_table || {};
  return (<>
    <CollapsibleSection title="Column">
      <ReadField label="Name" value={data.column_name} />
      <ReadField label="Table" value={pt.schema_name ? `${pt.schema_name}.${pt.table_name}` : pt.table_name} />
      <ReadField label="Data Type" value={data.data_type} />
      <div className="col-meta-row" style={{ marginTop: 4 }}>
        {data.is_pk ? <span className="chip">Primary Key</span> : null}
        {data.is_fk ? <span className="chip">Foreign Key</span> : null}
        {data.is_identity ? <span className="chip">Identity</span> : null}
        <span className="chip">{data.is_nullable ? 'Nullable' : 'Not Null'}</span>
      </div>
      {data.is_fk ? <ReadField label="References" value={data.fk_target_schema ? `${data.fk_target_schema}.${data.fk_target_table}.${data.fk_target_column}` : (data.fk_target_table || '—')} /> : null}
      {data.default_value ? <ReadField label="Default" value={data.default_value} /> : null}
    </CollapsibleSection>
    <CollapsibleSection title="Governance" domainTag="security">
      <GovReadBlock gov={data.governance} />
    </CollapsibleSection>
    {(data.business_meaning || data.notes) && <CollapsibleSection title="Documentation">
      {data.business_meaning && <ReadField label="Business Meaning" value={data.business_meaning} multiline />}
      {data.notes && <ReadField label="Notes" value={data.notes} multiline />}
    </CollapsibleSection>}
    <CollapsibleSection title="Upstream Lineage" defaultOpen={false}>
      <div style={{ fontSize: '12px', color: '#888', lineHeight: 1.6 }}>
        Field-level lineage tracing is not yet mapped. Once column-level source mappings are defined, this section will trace where this field originates, the transformations applied along the way, and the responsible owners and stewards at each hop.
      </div>
    </CollapsibleSection>
  </>);
}

function AddSystemModal({ onClose, onSave, systems, systemTypes }) {
  const [form, setForm] = useState({
    name:'', description:'', system_type:'', vendor:'', technology:'', environment:'Production',
    managed_by:'', organization:'', contains_pii:false, ferpa_protected:false, status:'Active', notes:'',
    data_classification:'', access_method:'', encryption_at_rest:'', encryption_in_transit:'',
    retention_schedule:'', data_standards:'',
    // Manual Entry, plus the inbound flow created alongside it
    entry_type:'Direct Entry', entered_by:'', target_system_id:'',
    entry_validation:'', entry_error_correction:'',
    flow_frequency:'Daily', flow_frequency_detail:'', flow_format:'',
    flow_transfer_method:'', flow_contains_pii:false, flow_ferpa_protected:false
  });
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const bodyRef = useRef(null);
  const req = useRequired([
    { key: 'name', label: 'Name' },
    { key: 'system_type', label: 'Type' },
    { key: 'managed_by', label: 'Managed By' },
  ].concat(form.system_type === 'Manual Entry'
      ? [{ key: 'target_system_id', label: 'Target data store' }] : []), bodyRef);
  return (
    <div className="modal-overlay" onClick={onClose}><div className="modal" role="dialog"
         aria-modal="true" aria-labelledby="add-sys-title" onClick={e=>e.stopPropagation()}>

        <button className="panel-close" onClick={onClose} aria-label="Close">&times;</button></div>
      <div className="modal-body" ref={bodyRef}>
        {req.summary(form) && <div className="form-error-summary" role="alert">{req.summary(form)}</div>}
        <div className="modal-section-title">Overview</div>
        <ReqField id="sys-name" label="Name *" value={form.name} onChange={v=>set('name',v)}
                  error={req.errorFor(form,'name')} placeholder="e.g., PowerSchool SIS" />
        <div className="form-row">
          <ReqField id="sys-type" label="Type *" type="select" value={form.system_type}

                    options={(systemTypes||[]).map(t=>t.type_name)} />

            <select id="sys-status" value={form.status} onChange={e=>set('status',e.target.value)}>
              <option>Active</option><option>Planned</option><option>Deprecated</option><option>Under Review</option>
            </select></div>
        </div>
        <div className="form-row"><div className="form-group"><label>Vendor</label><input value={form.vendor} onChange={e=>set('vendor',e.target.value)} /></div><div className="form-group"><label>Technology</label><input value={form.technology} onChange={e=>set('technology',e.target.value)} /></div></div>
        <ReqField id="sys-managed" label="Managed By *" value={form.managed_by}
                  onChange={v=>set('managed_by',v)} error={req.errorFor(form,'managed_by')} />
        <div className="form-group"><label>Organization</label><input value={form.organization} onChange={e=>set('organization',e.target.value)} /></div>
        <div className="form-group"><label>Description</label><textarea value={form.description} onChange={e=>set('description',e.target.value)} /></div>

        {form.system_type === 'Manual Entry' && <>
          <div className="modal-section-title">Manual Entry</div>
          <div className="form-row">
            <div className="form-group"><label>Entry type</label>
              <select value={form.entry_type} onChange={e=>set('entry_type',e.target.value)}>
                <option>Direct Entry</option><option>File Upload</option></select></div>
            <div className="form-group"><label>Who enters the data</label>
              <input value={form.entered_by} onChange={e=>set('entered_by',e.target.value)}
                     placeholder="e.g. District staff, State Help Desk staff" /></div>
          </div>
          <div className={`form-group ${req.errorFor(form,'target_system_id') ? '' : ''}`}>
            <label htmlFor="me-target">Target data store *</label>
            <select id="me-target" className={req.errorFor(form,'target_system_id') ? 'field-error' : ''}
                    value={form.target_system_id} onChange={e=>set('target_system_id',e.target.value)}>
              <option value="">Select…</option>
              {byName((systems||[]).filter(x=>x.system_type==='Data Store')).map(x=>
                <option key={x.system_id} value={x.system_id}>{systemOption(x)}</option>)}
            </select>
            {req.errorFor(form,'target_system_id') &&
              <div className="field-error-msg">This field is required</div>}
            <div style={{fontSize:'11px',color:'#888',marginTop:4}}>
              The data flow into this store is created for you, so you only answer
              the timing questions once.
            </div>
          </div>
          <div className="form-group"><label>What validates the data at entry?</label>
            <textarea value={form.entry_validation}
                      onChange={e=>set('entry_validation',e.target.value)} /></div>
          <div className="form-group"><label>How are errors corrected once entered?</label>
            <textarea value={form.entry_error_correction}
                      onChange={e=>set('entry_error_correction',e.target.value)} /></div>

          <div className="modal-section-title">The data flow into that store</div>
          <div className="form-row">
            <div className="form-group"><label>How often</label>
              <select value={form.flow_frequency} onChange={e=>set('flow_frequency',e.target.value)}>
                <option>Real-time</option><option>Daily</option><option>Weekly</option>
                <option>Monthly</option><option>Annually</option><option>Ad Hoc</option>
                <option>Event-triggered</option><option>Other</option></select></div>
            <div className="form-group"><label>Format</label>
              <input value={form.flow_format} onChange={e=>set('flow_format',e.target.value)}

          </div>
          {form.flow_frequency === 'Other' &&
            <div className="form-group"><label>Timing and conditions</label>
              <textarea value={form.flow_frequency_detail}
                        onChange={e=>set('flow_frequency_detail',e.target.value)}
                        placeholder="e.g. Whenever a correction is reported, and always before the October count" /></div>}
          <div className="checkbox-row">
            <label><input type="checkbox" checked={form.flow_contains_pii}
                          onChange={e=>set('flow_contains_pii',e.target.checked)} /> Flow contains PII</label>
            <label><input type="checkbox" checked={form.flow_ferpa_protected}
                          onChange={e=>set('flow_ferpa_protected',e.target.checked)} /> FERPA protected</label>
          </div>
        </>}

        <div className="modal-section-title">Security & Privacy</div>
        <div className="form-row">
          <div className="form-group"><label>Data Classification</label><select value={form.data_classification} onChange={e=>set('data_classification',e.target.value)}><option value="">Select...</option><option>Confidential</option><option>Sensitive</option><option>Internal</option><option>Public</option></select></div>
          <div className="form-group"><label>Access Method</label><select value={form.access_method} onChange={e=>set('access_method',e.target.value)}><option value="">Select...</option><option>Role-based access</option><option>SSO</option><option>Username/Password</option><option>API Key</option><option>Other</option></select></div>
        </div>
        <div className="form-row">
          <div className="form-group"><label>Encryption at Rest</label><select value={form.encryption_at_rest} onChange={e=>set('encryption_at_rest',e.target.value)}><option value="">Select...</option><option>AES-256</option><option>TDE (Transparent Data Encryption)</option><option>BitLocker</option><option>None</option><option>Unknown</option></select></div>
          <div className="form-group"><label>Encryption in Transit</label><select value={form.encryption_in_transit} onChange={e=>set('encryption_in_transit',e.target.value)}><option value="">Select...</option><option>TLS 1.2</option><option>TLS 1.3</option><option>HTTPS/TLS</option><option>VPN</option><option>None</option><option>Unknown</option></select></div>
        </div>
        <div className="checkbox-row"><label><input type="checkbox" checked={form.contains_pii} onChange={e=>set('contains_pii',e.target.checked)} /> Contains PII</label><label><input type="checkbox" checked={form.ferpa_protected} onChange={e=>set('ferpa_protected',e.target.checked)} /> FERPA Protected</label></div>

        <div className="modal-section-title">Data Management</div>
        <div className="form-row">
          <div className="form-group"><label>Retention Schedule</label><select value={form.retention_schedule} onChange={e=>set('retention_schedule',e.target.value)}><option value="">Select...</option><option>1 year</option><option>3 years</option><option>5 years</option><option>7 years per state policy</option><option>10 years</option><option>Permanent retention</option><option>Other</option></select></div>
          <div className="form-group"><label>Data Standards</label><input value={form.data_standards} onChange={e=>set('data_standards',e.target.value)} placeholder="e.g., SIF 3.x, CEDS, Ed-Fi" /></div>
        </div>
        <div className="form-group"><label>Notes</label><textarea value={form.notes} onChange={e=>set('notes',e.target.value)} /></div>
      </div>
      <div className="modal-footer"><button className="btn" onClick={onClose}>Cancel</button>
        <button className="btn btn-primary" onClick={()=>req.attempt(form, () => onSave({...form,
            contains_pii:form.contains_pii?1:0,
            ferpa_protected:form.ferpa_protected?1:0,
            flow_contains_pii:form.flow_contains_pii?1:0,
            flow_ferpa_protected:form.flow_ferpa_protected?1:0}))}>Add System</button></div>
    </div></div>
  );
}
