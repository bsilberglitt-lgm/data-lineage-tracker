                        from the membership row: that row is only refetched when
                        the scenario changes, so a role changed in User
                        Management would otherwise show stale here. */}
                    <td>{(users || []).find(u => u.user_id === m.user_id)?.role
                         || m.system_role}</td>
                    <td>
                      {m.role === 'owner' ? <span className="badge">Owner</span> : (
                        <select value={m.role} disabled={busy}
                                aria-label={`Scenario role for ${nameOf(m)}`}
                                onChange={e => setRole(m.user_id, e.target.value)}>
                          <option value="viewer">can view</option>
                          <option value="editor">can edit</option>
                        </select>
                      )}
                    </td>
                    <td>
                      {m.role !== 'owner' && (
                        <button className="btn btn-danger" disabled={busy}
                                aria-label={`Remove ${nameOf(m)}`}
                                onClick={() => removeMember(m.user_id)}>Remove</button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>

            <div className="modal-section-title">Invite someone</div>
            <PersonPicker users={(users || []).filter(u =>
                            !members.some(m => m.user_id === u.user_id))}
                          exclude={currentUserId} chosen={invite} onChange={setInvite} />
            <button className="btn btn-primary" onClick={addPeople}
                    disabled={busy || !invite.length}>Send invitations</button>

            {isSuper && (
              <React.Fragment>
                <div className="modal-section-title" style={{ marginTop: 18 }}>
                  Transfer ownership
                </div>
                <div className="gov-hint">
                  The current owner stays on as an editor rather than losing access
                  to their own work.
                </div>
                <select value={newOwner} aria-label="New owner"
                        onChange={e => setNewOwner(e.target.value)}>
                  <option value="">Choose a person…</option>
                  {(users || []).filter(u => u.is_active &&
                      u.user_id !== scenario.owner_user_id).map(u => (
                    <option key={u.user_id} value={u.user_id}>
                      {u.first_name} {u.last_name}
                    </option>
                  ))}
                </select>
                <button className="btn" onClick={transfer} disabled={busy || !newOwner}>
                  Transfer
                </button>
              </React.Fragment>
            )}
          </React.Fragment>
        )}

        {tab === 'danger' && (
          <React.Fragment>
            <div className="modal-section-title">Delete this scenario</div>
            <p style={{ fontSize: 13, lineHeight: 1.6 }}>
              Everyone invited loses access immediately and it disappears from
              their list. <strong>Current Architecture is not affected.</strong>
            </p>
            <p style={{ fontSize: 13, lineHeight: 1.6 }}>
              Nothing is actually destroyed — a SuperAdmin can restore it, with
              all of its systems, flows and history intact.
            </p>
            <button className="btn btn-danger" onClick={() => setConfirmDelete(true)}
                    disabled={busy}>Delete scenario</button>
          </React.Fragment>
        )}
      </div>
      <div className="modal-footer">
        <button className="btn" onClick={onClose}>Close</button>
      </div>
      {confirmDelete && (
        <ConfirmDialog
          title="Delete this scenario?"
          message={`“${scenario.name}” will disappear for everyone invited to it.`}
          detail={<div className="gov-hint" style={{ marginTop: 8 }}>
                    Current Architecture is untouched, and a SuperAdmin can
                    restore this scenario afterwards.
                  </div>}
          confirmLabel="Delete scenario" danger
          onConfirm={doDelete} onCancel={() => setConfirmDelete(false)} />
      )}
    </div></div>
  );
}

// Creating a scenario: name, what to start from, an optional focus, and who
// else can see it. Everything except the name can be changed afterwards.
function AddScenarioModal({ scenarios, users, currentUserId, onClose, onSave }) {
  const bodyRef = useRef(null);
  const [form, setForm] = useState({
    name: '', description: '', start_from: 'live', source_scenario_id: '',
  });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const [focus, setFocus] = useState([]);        // systems to keep visible
  const [useFocus, setUseFocus] = useState(false);
  // The systems available to focus on are the ones in whatever you chose to
  // start from — NOT the view you happen to be looking at. Reading them from
  // the current view offered systems belonging to other scenarios entirely.
  const [sourceSystems, setSourceSystems] = useState([]);
  const [loadingSystems, setLoadingSystems] = useState(false);
  const [invite, setInvite] = useState([]);      // [{user_id, role}]
  const [copyMembers, setCopyMembers] = useState(false);
  const [busy, setBusy] = useState(false);

  const req = useRequired(
    [{ key: 'name', label: 'Name' }].concat(
      form.start_from === 'scenario'
        ? [{ key: 'source_scenario_id', label: 'Scenario to copy' }] : []),
    bodyRef);

  const parent = scenarios.find(s => String(s.scenario_id) === String(form.source_scenario_id));

  useEffect(() => {
    // Anything ticked belonged to the previous source, so it cannot carry over.
    setFocus([]);
    if (form.start_from === 'blank') { setSourceSystems([]); return; }
    if (form.start_from === 'scenario' && !form.source_scenario_id) {
      setSourceSystems([]); return;
    }
    const url = form.start_from === 'scenario'
      ? `/api/systems?scenario=${form.source_scenario_id}`
      : '/api/systems';
    setLoadingSystems(true);
    // Bypass the view-scoping helper deliberately: this list is about the
    // chosen source, not the view the person is standing in.
    request('GET', url)
      .then(rows => setSourceSystems(Array.isArray(rows) ? rows : []))
      .catch(() => setSourceSystems([]))
      .finally(() => setLoadingSystems(false));
  }, [form.start_from, form.source_scenario_id]);

  const submit = () => req.attempt(form, () => {
    setBusy(true);
    onSave({
      name: form.name.trim(),
      description: form.description,
      start_from: form.start_from,
      source_scenario_id: form.start_from === 'scenario'
        ? Number(form.source_scenario_id) : null,
      focus_system_ids: (form.start_from !== 'blank' && useFocus) ? focus : [],
      invite,
      copy_members: form.start_from === 'scenario' && copyMembers,
    }).finally(() => setBusy(false));
  });

  const toggleFocus = (id) =>
    setFocus(focus.includes(id) ? focus.filter(x => x !== id) : [...focus, id]);

  return (
    <div className="modal-overlay"><div className="modal" role="dialog"
         aria-modal="true" aria-labelledby="add-scn-title">
      <div className="modal-header" id="add-scn-title">Add Scenario
        <button className="panel-close" onClick={onClose} aria-label="Close">&times;</button></div>
      <div className="modal-body" ref={bodyRef}>
        {req.summary(form) && <div className="form-error-summary" role="alert">{req.summary(form)}</div>}

        <div className="modal-section-title">About this scenario</div>
        <ReqField id="scn-name" label="Name *" value={form.name}
                  onChange={v => set('name', v)} error={req.errorFor(form, 'name')}
                  placeholder="e.g., SIS replacement" />
        <div className="gov-hint" style={{ marginTop: -6, marginBottom: 10 }}>
          Shown everywhere as &ldquo;{form.name.trim() || 'Your name'} (Scenario)&rdquo;.
        </div>
        <ReqField id="scn-desc" label="Description" type="textarea" value={form.description}
                  onChange={v => set('description', v)}
                  placeholder="What is being explored, and why" />

        <div className="modal-section-title">Starting point</div>
        <ReqField id="scn-start" label="Start from" type="select" value={form.start_from}
                  onChange={v => set('start_from', v)}
                  options={[
                    { value: 'live', label: LIVE_LABEL + ' — copy what exists today' },
                    { value: 'scenario', label: 'Another scenario' },
                    { value: 'blank', label: 'A blank page' },
                  ]} />

        {form.start_from === 'scenario' && (
          <React.Fragment>
            <ReqField id="scn-src" label="Scenario to copy *" type="select"
                      value={form.source_scenario_id}
                      onChange={v => set('source_scenario_id', v)}
                      error={req.errorFor(form, 'source_scenario_id')}
                      options={scenarios.map(s => ({ value: String(s.scenario_id), label: s.name }))} />
            {parent && (
              <label className="check-inline">
                <input type="checkbox" checked={copyMembers}
                       onChange={e => setCopyMembers(e.target.checked)} />
                Also invite the {(parent.members || []).length} people who can see
                &ldquo;{parent.name}&rdquo;
              </label>
            )}
          </React.Fragment>
        )}

        {form.start_from !== 'blank' && (
          <React.Fragment>
            <label className="check-inline">
              <input type="checkbox" checked={useFocus}
                     onChange={e => setUseFocus(e.target.checked)} />
              Focus on particular systems
            </label>
            <div className="gov-hint">
              Everything is still copied, so the scenario stays complete and nothing
              is lost &mdash; the rest simply starts hidden, and you can show it again
              whenever you want.
            </div>
            {useFocus && (
              <div className="pick-list" role="group" aria-label="Systems to keep visible">
                {loadingSystems && <div className="gov-hint">Loading…</div>}
                {!loadingSystems && sourceSystems.length === 0 && (
                  <div className="gov-hint">
                    {form.start_from === 'scenario' && !form.source_scenario_id
                      ? 'Choose a scenario above first.'
                      : 'Nothing to focus on — that starting point has no systems.'}
                  </div>
                )}
                {/* Sorted by name: the API returns them in whatever order the
                    database produced, which for a long list makes a specific
                    system hard to find. */}
                {byName(sourceSystems).map(sy => (
                  <label key={sy.system_id} className="check-inline">
                    <input type="checkbox" checked={focus.includes(sy.system_id)}
                           onChange={() => toggleFocus(sy.system_id)} />
                    {sy.name}
                  </label>
                ))}
                {focus.length === 0 && (
                  <div className="gov-hint">Nothing chosen yet &mdash; everything stays visible.</div>
                )}
              </div>
            )}
          </React.Fragment>
        )}

        <div className="modal-section-title">Who can see it</div>
        <div className="gov-hint">
          A scenario is private to the people invited to it. Someone can be an editor
          here whatever their role elsewhere, and you can invite more people later.
        </div>
        <PersonPicker users={users} exclude={currentUserId} chosen={invite}
                      onChange={setInvite} />
      </div>
      <div className="modal-footer">
        <button className="btn" onClick={onClose}>Cancel</button>
        <button className="btn btn-primary" onClick={submit} disabled={busy}>
          {busy ? 'Creating\u2026' : 'Create Scenario'}
        </button>
      </div>
    </div></div>
  );
}

function App({ user, settings, onSignOut, onSettingsChanged }) {
  const [view, setView] = useState('diagram');
  const appTitle = settings.app_title || 'DATA LINEAGE TRACKER';
  const appSubtitle = settings.app_subtitle || '';
  const [notice, setNotice] = useState(null);
  const [assignableRoles, setAssignableRoles] = useState(['Viewer', 'Editor']);
  const [version, setVersion] = useState(null);
  const [whatsNew, setWhatsNew] = useState([]);
  const [alerts, setAlerts] = useState([]);
  const [systemTypes, setSystemTypes] = useState([]);
  const canEdit = roleAtLeast(user.role, 'Editor');
  const isAdmin = roleAtLeast(user.role, 'Administrator');
  const isSuper = roleAtLeast(user.role, 'SuperAdmin');

  const notify = useCallback((message, isError) => {
    setNotice({ message, isError: !!isError });
    if (!isError) setTimeout(() => setNotice(null), 4000);
  }, []);

  const [systems, setSystems] = useState([]);
  const [flows, setFlows] = useState([]);
  const [elements, setElements] = useState([]);
  const [contributors, setContributors] = useState([]);
  const [selected, setSelected] = useState(null);
  const [detailData, setDetailData] = useState(null);
  const [detailType, setDetailType] = useState(null);
  const [showAddSystem, setShowAddSystem] = useState(false);
  const [showAddFlow, setShowAddFlow] = useState(false);
  const [showAddContributor, setShowAddContributor] = useState(false);
  // Held here rather than inside each canvas so the toolbar buttons and the
  // trackpad change the same number. Separate values because the two canvases
  // have different sensible ranges and you switch between them.
  const [diagramZoom, setDiagramZoom] = useState(1);
  const [schemaZoom, setSchemaZoom] = useState(0.85);
  const zoomLimits = view === 'schema' ? [0.25, 2.5] : [0.3, 3];
  const currentZoom = view === 'schema' ? schemaZoom : diagramZoom;
  const setCurrentZoom = view === 'schema' ? setSchemaZoom : setDiagramZoom;
  const stepZoom = (factor) => setCurrentZoom(z =>
    Math.max(zoomLimits[0], Math.min(zoomLimits[1], z * factor)));
  const resetZoom = () => setCurrentZoom(view === 'schema' ? 0.85 : 1);

  const [schemaSystemId, setSchemaSystemId] = useState(null);
  const [schemaSystemName, setSchemaSystemName] = useState('');
  const [schemaTables, setSchemaTables] = useState([]);

  // --- Scenarios ---------------------------------------------------------
  // `scenarioId` is the single source of truth for which view is on screen.
  // It is mirrored into the module-level `viewScenario` before any fetch, so
  // every existing API call is scoped without each one having to know.
  const [scenarios, setScenarios] = useState([]);
  const [scenarioId, setScenarioId] = useState(null);   // null = live
  const [showHidden, setShowHidden] = useState(false);
  const [showAddScenario, setShowAddScenario] = useState(false);
  const [showScenarioSettings, setShowScenarioSettings] = useState(false);
  const [helpOpen, setHelpOpen] = useState(false);
  const [allUsers, setAllUsers] = useState([]);
  const scenario = scenarios.find(s => s.scenario_id === scenarioId) || null;
  const inScenario = scenarioId !== null;
  // Inside a scenario, authority comes from the scenario role rather than the
  // system role — the server decides, this only hides controls.
  const canEditHere = inScenario ? !!(scenario && scenario.can_write) : canEdit;

  const loadScenarios = useCallback(() => (
    api.get('/api/scenarios').then(list => { setScenarios(list); return list; })
      .catch(() => [])
  ), []);

  const refresh = useCallback(() => {
    api.get('/api/systems').then(setSystems).catch(() => {});
    api.get('/api/flows').then(setFlows).catch(() => {});
    api.get('/api/elements').then(setElements).catch(() => {});
    api.get('/api/contributors').then(setContributors).catch(() => {});
  }, []);

  useEffect(() => { loadScenarios(); }, [loadScenarios]);

  // Switching view: point every subsequent request at the new scope, clear
  // anything on screen that belonged to the old one, then reload. Clearing
  // first matters — leaving a live record open while the diagram switches to a
  // scenario is exactly how someone edits the wrong thing.
  const switchView = useCallback((id) => {
    setViewScenario(id);
    setViewShowHidden(false);
    setShowHidden(false);
    setScenarioId(id);
    setSelected(null);
    setDetailData(null);
    setDetailType(null);
    setSchemaSystemId(null);
    setView(v => v === 'schema' ? 'diagram' : v);
    setSystems([]); setFlows([]); setElements([]); setContributors([]);
    refresh();
  }, [refresh]);

  // Only fetched when the invite list is actually needed: an Editor creating a
  // scenario would otherwise be denied /api/users, which requires Administrator.
  const loadUsersForInvite = useCallback(() => {
    api.get('/api/users').then(setAllUsers).catch(() => setAllUsers([]));
  }, []);

  const createScenario = useCallback((payload) => (
    api.post('/api/scenarios', payload)
      .then(created => {
        setShowAddScenario(false);
        return loadScenarios().then(() => {
          switchView(created.scenario_id);
          const bits = [];
          if (created.copied && created.copied.system)
            bits.push(`${created.copied.system} systems and ${created.copied.data_flow} data flows copied`);
          if (created.hidden_for_focus)
            bits.push(`${created.hidden_for_focus} hidden to focus the diagram`);
          if (created.invited) bits.push(`${created.invited} person(s) invited`);
          notify(`Scenario created${bits.length ? ' — ' + bits.join(', ') : ''}.`);
        });
      })
      .catch(e => { notify(e.message, true); throw e; })
  ), [loadScenarios, switchView, notify]);

  const setRecordsHidden = useCallback((systemIds, flowIds, hidden) => {
    if (scenarioId === null) return;
    return api.post(`/api/scenarios/${scenarioId}/visibility`,
                    { system_ids: systemIds, flow_ids: flowIds, hidden })
      .then(r => {
        refresh();
        const n = (r.changed.system || 0) + (r.changed.data_flow || 0);
        notify(hidden
          ? `${n} item(s) hidden. They are still in the scenario — use “Show hidden items” to bring them back.`
          : `${n} item(s) shown again.`);
      })
      .catch(e => notify(e.message, true));
  }, [scenarioId, refresh, notify]);

  const showEverything = useCallback(() => {
    if (scenarioId === null) return;
    return api.post(`/api/scenarios/${scenarioId}/visibility`, { all: true, hidden: false })
      .then(() => { refresh(); notify('Everything in this scenario is visible again.'); })
      .catch(e => notify(e.message, true));
  }, [scenarioId, refresh, notify]);

  const toggleHidden = useCallback(() => {
    setShowHidden(prev => {
      const next = !prev;
      setViewShowHidden(next);
      refresh();
      return next;
    });
  }, [refresh]);

  useEffect(() => { refresh(); }, [refresh]);

  // Re-read the data whenever a data view is opened, so edits made by someone
  // else (including node positions, which are shared) show up without a reload.
  useEffect(() => {
    if (['diagram', 'systems', 'flows', 'elements', 'contributors'].includes(view)) {
      refresh();
    }
  }, [view, refresh]);

  const selectSystem = useCallback((id) => {
    setSelected({ type: 'system', id });
    api.get(`/api/systems/${id}`).then(d => { setDetailData(d); setDetailType('system'); });
  }, []);

  const selectFlow = useCallback((id) => {
    setSelected({ type: 'flow', id });
    api.get(`/api/flows/${id}`).then(d => { setDetailData(d); setDetailType('flow'); });
  }, []);

  const selectElement = useCallback((id) => {
    setSelected({ type: 'element', id });
    api.get(`/api/elements/${id}`).then(d => { setDetailData(d); setDetailType('element'); });
  }, []);

  const selectContributor = useCallback((id) => {
    setSelected({ type: 'contributor', id });
    api.get(`/api/contributors/${id}`).then(d => { setDetailData(d); setDetailType('contributor'); });
  }, []);

  useEffect(() => {
    api.get('/api/auth/me')
      .then(me => setAssignableRoles(me.assignable_roles || []))
      .catch(() => {});
    api.get('/api/version').then(v => setVersion(v.version)).catch(() => {});
    // Releases published since this user last acknowledged, oldest first.
    api.get('/api/whats-new').then(d => setWhatsNew(d.unseen || [])).catch(() => {});
    // Alerts, e.g. a change of theirs that someone reverted.
    api.get('/api/notifications').then(d => setAlerts(d.unseen || [])).catch(() => {});
    loadSystemTypes();
  }, []);

  // System types drive both the dropdowns and the diagram colours.
  const loadSystemTypes = useCallback(() => {
    api.get('/api/system-types').then(d => {
      setSystemTypes(d.types || []);
      const map = {};
      (d.types || []).forEach(t => {
        map[t.type_name] = { fill: t.fill_color, stroke: t.stroke_color, text: t.text_color };
      });
      TYPE_COLORS = map;
    }).catch(() => {});
  }, []);

  const acknowledgeAlerts = async () => {
    try { await api.post('/api/notifications'); } catch (e) { /* non-critical */ }
    setAlerts([]);
  };

  const acknowledgeReleases = async () => {
    try { await api.post('/api/whats-new'); } catch (e) { /* non-critical */ }
    setWhatsNew([]);
  };

  const closeDetail = () => { setSelected(null); setDetailData(null); setDetailType(null); };

  // Saving where an arrow attaches and how it bends. Fire-and-forget like node
  // dragging: it happens constantly while arranging a diagram, and a failed
  // save is not worth interrupting someone for — the next load shows the truth.
  const updateRoute = useCallback((flowId, patch) => {
    setFlows(prev => prev.map(f => f.flow_id === flowId
      ? { ...f, ...(patch.waypoints !== undefined
                    ? { waypoints: JSON.stringify(patch.waypoints) } : {}),
          ...(patch.source_anchor !== undefined ? { source_anchor: patch.source_anchor } : {}),
          ...(patch.dest_anchor !== undefined ? { dest_anchor: patch.dest_anchor } : {}) }
      : f));
    api.quiet('PUT', `/api/flows/${flowId}/route`, patch);
  }, []);

  const resetRoute = useCallback((flowId) => {
    setFlows(prev => prev.map(f => f.flow_id === flowId
      ? { ...f, source_anchor: null, dest_anchor: null, waypoints: null } : f));
    api.put(`/api/flows/${flowId}/route`,
            { source_anchor: null, dest_anchor: null, waypoints: [] })
      .then(() => notify('Arrow reset to automatic routing.'))
      .catch(e => notify(e.message, true));
  }, [notify]);

  const updatePosition = useCallback((id, x, y) => {
    setSystems(prev => prev.map(s => s.system_id === id ? { ...s, x_pos: x, y_pos: y } : s));
  }, []);

  // --- Schema drill-down ---
  const loadSchema = useCallback((sid) => {
    return api.get(`/api/systems/${sid}/schema`).then(d => {
      setSchemaTables(d.tables || []);
      setSchemaSystemName(d.system ? d.system.name : '');
    });
  }, []);

  const drillIntoSchema = useCallback((sid) => {
    setSchemaSystemId(sid);
    closeDetail();
    loadSchema(sid).then(() => setView('schema'));
  }, [loadSchema]);

  const exitSchema = useCallback(() => { setView('diagram'); closeDetail(); }, []);

  const selectSchemaTable = useCallback((id) => {
    setSelected({ type: 'schema_table', id });
    api.get(`/api/schema/tables/${id}`).then(d => { setDetailData(d); setDetailType('schema_table'); });
  }, []);

  const selectSchemaColumn = useCallback((id, tableId) => {
    setSelected({ type: 'schema_column', id, parentTableId: tableId });
    api.get(`/api/schema/columns/${id}`).then(d => { setDetailData(d); setDetailType('schema_column'); });
  }, []);

  const updateSchemaPosition = useCallback((id, x, y) => {
    setSchemaTables(prev => prev.map(t => t.table_id === id ? { ...t, x_pos: x, y_pos: y } : t));
  }, []);

  const handleSave = useCallback((type, result) => {
    if (type === 'system') {
      refresh();
      api.get(`/api/systems/${result.system_id}`).then(d => { setDetailData(d); });
    } else if (type === 'flow') {
      refresh();
      const fid = result.flow_id || result.updated;
      api.get(`/api/flows/${fid}`).then(d => { setDetailData(d); });
    } else if (type === 'element') {
      refresh();
      setDetailData(result);
    } else if (type === 'contributor') {
      refresh();
      setDetailData(result);
    } else if (type === 'schema_table' || type === 'schema_column') {
      setDetailData(result);
      if (schemaSystemId) loadSchema(schemaSystemId);
    }
  }, [refresh, schemaSystemId, loadSchema]);

  const addSystem = async (data) => {
    // The modal always carries a 'proposed' flag; it is meaningless outside a
    // scenario and the server refuses it there, so drop it before sending.
    if (scenarioId === null) { data = { ...data }; delete data.proposed; }
    try { await api.post('/api/systems', data); refresh(); setShowAddSystem(false); notify('System added.'); }
    catch (err) { notify(err.message, true); }
  };
  const addFlow = async (data) => {
    if (scenarioId === null) { data = { ...data }; delete data.proposed; }
    try { await api.post('/api/flows', data); refresh(); setShowAddFlow(false); notify('Data flow added.'); }
    catch (err) { notify(err.message, true); }
  };
  // Retiring is not deleting. The capability has existed on the server since
  // 0.3.0 — it draws the item faded and struck through, so a plan reads as
  // "we retire these, we add those" — but nothing ever called it, so the only
  // way to express a retirement was to delete the item, which looked instead
  // like it had never existed.
  const retireRecord = useCallback(async (kind, record, retired) => {
    const base = kind === 'system'
      ? `/api/systems/${record.system_id}`
      : `/api/flows/${record.flow_id}`;
    const label = record.name || record.system_id || record.flow_id;
    try {
      await api.del(`${base}?mode=${retired ? 'remove' : 'restore'}`);
      closeDetail();
      refresh();
      notify(retired
        ? `"${label}" is marked as retired in this scenario.`
        : `"${label}" is no longer marked as retired.`);
    } catch (err) {
      notify(err.message, true);
    }
  }, [refresh, notify]);

  const deleteRecord = useCallback(async (kind, record) => {
    const url = kind === 'system'
      ? `/api/systems/${record.system_id}`
      : `/api/flows/${record.flow_id}`;
    const label = record.name || record.system_id || record.flow_id;
    try {
      await api.del(url);
      closeDetail();
      refresh();
      notify(`"${label}" deleted.`);
    } catch (err) {
      notify(err.message, true);
    }
  }, [refresh, notify]);

  const addContributor = async (data) => {
    try { await api.post('/api/contributors', data); refresh(); setShowAddContributor(false); notify('Contributor added.'); }
    catch (err) { notify(err.message, true); }
  };

  const panelOpen = !!detailData;

  return (
    <div className="app">
      <div className="sidebar">
        <div className="sidebar-header">
          <SidebarBrand settings={settings} title={appTitle} subtitle={appSubtitle} />
        </div>
        <nav className="sidebar-nav" aria-label="Main">
          <div className="nav-section">Views</div>
          <div className={`nav-item ${view==='diagram' && !inScenario ?'active':''}`}
               onClick={()=>{ switchView(null); setView('diagram'); }}>
            <span className="nav-icon">&#9678;</span> {LIVE_LABEL}</div>
          {scenarios.map(s => (
            <div key={s.scenario_id}
                 className={`nav-item nav-scenario ${scenarioId===s.scenario_id?'active':''}`}
                 onClick={()=>{ switchView(s.scenario_id); setView('diagram'); }}
                 title={s.description || ''}>
              <span className="nav-icon">&#9633;</span> {s.name} (Scenario)
            </div>
          ))}
          {canEdit && (
            <div className="nav-item nav-add" onClick={()=>{ setShowAddScenario(true); loadUsersForInvite(); }}>
              <span className="nav-icon">+</span> Add Scenario
            </div>
          )}
          <div className="nav-section">Catalog</div>
          <div className={`nav-item ${view==='systems'?'active':''}`} onClick={()=>setView('systems')}><span className="nav-icon">&#9634;</span> Systems ({systems.length})</div>
          <div className={`nav-item ${view==='flows'?'active':''}`} onClick={()=>setView('flows')}><span className="nav-icon">&#8594;</span> Data Flows ({flows.length})</div>
          <div className={`nav-item ${view==='elements'?'active':''}`} onClick={()=>setView('elements')}><span className="nav-icon">&#9830;</span> Data Elements ({elements.length})</div>
          <div className={`nav-item ${view==='contributors'?'active':''}`} onClick={()=>setView('contributors')}><span className="nav-icon">&#9787;</span> Contributors ({contributors.length})</div>
          <div className="nav-section">About</div>
          <div className={`nav-item ${view==='releases'?'active':''}`} onClick={()=>setView('releases')}><span className="nav-icon">&#9873;</span> Release Notes</div>
          {(isAdmin || isSuper) && <div className="nav-section">Administration</div>}
          {isAdmin && <div className={`nav-item ${view==='users'?'active':''}`} onClick={()=>setView('users')}><span className="nav-icon">&#9781;</span> Users</div>}
          {isSuper && <div className={`nav-item ${view==='preferences'?'active':''}`} onClick={()=>setView('preferences')}><span className="nav-icon">&#9881;</span> Preferences</div>}
          {isSuper && <div className={`nav-item ${view==='audit'?'active':''}`} onClick={()=>setView('audit')}><span className="nav-icon">&#9998;</span> Audit Log</div>}
        </nav>
        <div className="user-chip">
          <div className="avatar">{(user.first_name||'?').charAt(0)}{(user.last_name||'').charAt(0)}</div>
          <div className="who">
            <b title={user.email}>{user.first_name} {user.last_name}</b>
            <span>{user.role}</span>
          </div>
          <button onClick={onSignOut} title="Sign out">Sign out</button>
        </div>
      </div>

      <div className={`main-area${inScenario ? ' scenario-view' : ''}`}>
        <div className="toolbar">
          {view==='schema'
            ? <span className="breadcrumb"><span className="crumb-link" onClick={exitSchema}>{scenarioLabel(scenario)}</span><span className="crumb-sep">&rsaquo;</span><span>{schemaSystemName} &mdash; Database Schema</span></span>
            : <span className="toolbar-title">
                {(VIEW_TITLES[view] || '')}
                {SCOPED_VIEWS.includes(view) && (
                  <React.Fragment>
                    <span aria-hidden="true"> &mdash; </span>
                    <span>{scenarioLabel(scenario)}</span>
                    {inScenario && <span className="scenario-badge">Scenario</span>}
                  </React.Fragment>
                )}
              </span>}
          {SCOPED_VIEWS.includes(view) && scenarios.length > 0 && (
            <ScenarioPicker scenarios={scenarios} current={scenarioId} onChange={switchView} />
          )}
          <div className="toolbar-spacer"></div>
          {view==='schema' && <button className="btn" onClick={exitSchema}>&larr; Back to Lineage</button>}
          {canEditHere && (view==='diagram'||view==='systems')&&<button className="btn btn-primary" onClick={()=>setShowAddSystem(true)}>+ Add System</button>}
          {canEditHere && (view==='diagram'||view==='flows')&&<button className="btn btn-primary" onClick={()=>setShowAddFlow(true)}>+ Add Flow</button>}
          {canEditHere && view==='contributors'&&<button className="btn btn-primary" onClick={()=>setShowAddContributor(true)}>+ Add Contributor</button>}
        </div>
        {inScenario && SCOPED_VIEWS.includes(view) && (
          <div className="scenario-bar" role="status">
            <strong>{scenario ? scenario.name : ''} (Scenario)</strong>
            <span>&middot;</span>
            <span>{scenario ? scenario.status : ''}</span>
            {scenario && scenario.frozen && (
              <span title="Only Draft scenarios can be edited">
                &middot; read-only until returned to Draft
              </span>
            )}
            <span className="grow"></span>
            <label className="check-inline" style={{margin:0}}>
              <input type="checkbox" checked={showHidden} onChange={toggleHidden} />
              Show hidden items
            </label>
            {canEditHere && (
              <button className="btn" style={{padding:'2px 8px',fontSize:12}}
                      onClick={showEverything}>Un-hide everything</button>
            )}
            {scenario && scenario.can_manage && (
              <button className="btn" style={{padding:'2px 8px',fontSize:12}}
                      onClick={()=>{ setShowScenarioSettings(true); loadUsersForInvite(); }}>
                Manage scenario
              </button>
            )}
            <span>Changes here do not affect {LIVE_LABEL}.</span>
          </div>
        )}
        {notice && <div className={`banner ${notice.isError ? 'banner-error' : 'banner-ok'}`}
          role="status" aria-live="polite">
          <span style={{flex:1}}>{notice.message}</span>
          <button className="panel-close" onClick={()=>setNotice(null)} aria-label="Close">&times;</button>
        </div>}
        {['diagram','schema','systems','flows','elements','contributors'].includes(view) &&
        <div className="stats-bar">
          {view==='schema' ? <>
            <div className="stat"><div className="stat-value">{schemaTables.length}</div><div className="stat-label">Tables</div></div>
            <div className="stat"><div className="stat-value">{schemaTables.reduce((n,t)=>n+(t.columns?t.columns.length:0),0)}</div><div className="stat-label">Columns</div></div>
            <div className="stat"><div className="stat-value">{schemaTables.reduce((n,t)=>n+(t.columns?t.columns.filter(c=>c.is_fk&&c.fk_target_table_id).length:0),0)}</div><div className="stat-label">Relationships</div></div>
            <div className="stat"><div className="stat-value">{schemaTables.reduce((n,t)=>n+(t.columns?t.columns.filter(colHasOverride).length:0),0)}</div><div className="stat-label">Field Overrides</div></div>
          </> : <>
            <div className="stat"><div className="stat-value">{systems.length}</div><div className="stat-label">Systems</div></div>
            <div className="stat"><div className="stat-value">{flows.length}</div><div className="stat-label">Data Flows</div></div>
            <div className="stat"><div className="stat-value">{elements.length}</div><div className="stat-label">Data Elements</div></div>
            <div className="stat"><div className="stat-value">{elements.filter(e=>e.is_pii).length}</div><div className="stat-label">PII Elements</div></div>
          </>}
          {/* Zoom controls. Trackpad pinch-zoom is hard to land precisely, so
              these give a predictable step. Only shown where there is something
              to zoom. */}
          {['diagram', 'schema'].includes(view) && (
            <div className="zoom-controls">
              <button className="zoom-btn" onClick={() => stepZoom(1 / 1.2)}
                      aria-label="Zoom out" title="Zoom out"
                      disabled={currentZoom <= zoomLimits[0] + 0.001}>
                <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
                  <circle cx="8.5" cy="8.5" r="5.5" fill="none"
                          stroke="currentColor" strokeWidth="1.8" />
                  <line x1="12.8" y1="12.8" x2="17.5" y2="17.5"
                        stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
                  <line x1="6" y1="8.5" x2="11" y2="8.5"
                        stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
                </svg>
              </button>
              <button className="zoom-level" onClick={resetZoom}
                      title="Reset zoom to 100%" aria-label={
                        `Zoom is ${Math.round(currentZoom * 100)} percent. Reset to 100 percent.`}>
                {Math.round(currentZoom * 100)}%
              </button>
              <button className="zoom-btn" onClick={() => stepZoom(1.2)}
                      aria-label="Zoom in" title="Zoom in"
                      disabled={currentZoom >= zoomLimits[1] - 0.001}>
                <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
                  <circle cx="8.5" cy="8.5" r="5.5" fill="none"
                          stroke="currentColor" strokeWidth="1.8" />
                  <line x1="12.8" y1="12.8" x2="17.5" y2="17.5"
                        stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
                  <line x1="6" y1="8.5" x2="11" y2="8.5"
                        stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
                  <line x1="8.5" y1="6" x2="8.5" y2="11"
                        stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
                </svg>
              </button>
            </div>
          )}
        </div>}
        <div className="content-area">
          {view==='diagram' && <DiagramCanvas systems={systems} flows={flows} selected={selected}
            onSelectSystem={selectSystem} onSelectFlow={selectFlow} onUpdatePosition={updatePosition}
            onDrill={drillIntoSchema} canEdit={canEditHere} systemTypes={systemTypes}
            onUpdateRoute={updateRoute}
            inScenario={inScenario} zoom={diagramZoom} setZoom={setDiagramZoom}
            panelOpen={!!detailData} onDismissPanel={closeDetail} />}
          {view==='schema' && <SchemaCanvas tables={schemaTables} selected={selected} onSelectTable={selectSchemaTable} onSelectColumn={selectSchemaColumn} onUpdatePosition={updateSchemaPosition} canEdit={canEditHere}
            zoom={schemaZoom} setZoom={setSchemaZoom} />}
          {view==='systems' && <SystemsTable systems={systems} inScenario={inScenario} canEdit={canEditHere} onSetHidden={setRecordsHidden} onSelect={selectSystem} />}
          {view==='flows' && <FlowsTable flows={flows} inScenario={inScenario} canEdit={canEditHere} onSetHidden={setRecordsHidden} onSelect={selectFlow} />}
          {view==='elements' && <ElementsTable elements={elements} onSelect={selectElement} />}
          {view==='contributors' && <ContributorsTable contributors={contributors} onSelect={selectContributor} />}
          {view==='users' && isAdmin && <UsersScreen currentUser={user} assignableRoles={assignableRoles} notify={notify} />}
          {view==='preferences' && isSuper && <PreferencesScreen notify={notify} roles={ROLE_ORDER}
              onSaved={onSettingsChanged} onTypesChanged={loadSystemTypes} />}
          {view==='audit' && isSuper && <AuditScreen notify={notify} />}
          {view==='releases' && <ReleasesScreen canEdit={isSuper} notify={notify}
                                                currentVersion={version} />}
          {['diagram','schema','systems','flows','elements','contributors'].includes(view) &&
            <DetailPanel data={detailData} type={detailType} onClose={closeDetail} onSave={handleSave}
                         onDelete={deleteRecord} onRetire={retireRecord}
                         systems={systems} onDrill={drillIntoSchema} canEdit={canEditHere}
                         inScenario={inScenario} onSetHidden={setRecordsHidden}
                         onResetRoute={resetRoute}
                         notify={notify} contributors={contributors} isAdmin={isAdmin}
                         systemTypes={systemTypes} onSchemaChanged={refresh} />}
        </div>
      </div>

      {showScenarioSettings && scenario && (
        <ScenarioSettingsModal scenario={scenario} users={allUsers}
          currentUserId={user.user_id} isSuper={isSuper} notify={notify}
          onClose={()=>setShowScenarioSettings(false)}
          onSaved={(deleted)=>loadScenarios().then(list=>{
            // If it was deleted (or we lost access), fall back to the live view
            // rather than leaving the screen pointed at something gone.
            if (deleted || !list.some(x=>x.scenario_id===scenarioId)) switchView(null);
            else refresh();
          })} />
      )}
      {showAddScenario && <AddScenarioModal scenarios={scenarios}
        users={allUsers} currentUserId={user.user_id}
        onClose={()=>setShowAddScenario(false)} onSave={createScenario} />}
      {showAddSystem && <AddSystemModal systems={systems} systemTypes={systemTypes} inScenario={inScenario}
        onClose={()=>setShowAddSystem(false)} onSave={addSystem} />}
      {showAddFlow && <AddFlowModal systems={systems} inScenario={inScenario} contributors={contributors}
        onClose={()=>setShowAddFlow(false)} onSave={addFlow} />}
      {showAddContributor && <AddContributorModal onClose={()=>setShowAddContributor(false)} onSave={addContributor} />}
      {whatsNew.length > 0 && <WhatsNewModal releases={whatsNew}
        onLater={() => setWhatsNew([])} onAcknowledge={acknowledgeReleases} />}
      {whatsNew.length === 0 && alerts.length > 0 && <NotificationsModal items={alerts}
        onLater={() => setAlerts([])} onAcknowledge={acknowledgeAlerts} />}
      <HelpButton open={helpOpen} onToggle={() => setHelpOpen(o => !o)} />
      {helpOpen && (
        <HelpPanel screen={inScenario ? 'scenario' : view}
                   onClose={() => setHelpOpen(false)} notify={notify} />
      )}
      <VersionBadge version={version} onClick={() => setView('releases')} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper />);
</script>
</body>
</html>
