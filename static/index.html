<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Lineage Tracker</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* The label column in the details panel. A variable because a hint that
   explains the field above it has to line up with that field's VALUE, so the
   width is needed in two places that are nowhere near each other — and it was
   written out three times before, including as an inline `marginLeft: 140`. */
:root { --field-label-w: 140px; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a2332; height: 100vh; overflow: hidden; }
/* --- Scenario view ------------------------------------------------------
   A scenario is not the live diagram, and that must be obvious at a glance
   without relying on color alone: the header also names the scenario and
   carries a "(Scenario)" suffix, satisfying WCAG 1.4.1. The tint is
   #fcf7e3 — measurably different from the normal page background
   (dE 12.7) while keeping every text color above AA. See ACCESSIBILITY.md. */
.scenario-view { background: #fcf7e3; }
.scenario-view .data-table, .scenario-view .panel { background: #fffdf6; }
.scenario-view .schema-canvas, .scenario-view .table-view,
.scenario-view .diagram-canvas { background: #fcf7e3; }
.scenario-badge { display: inline-block; font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 10px; background: #f7ecc0; color: #6b5200;
  margin-left: 8px; vertical-align: middle; }
/* Proposed / removed, drawn so the pattern carries the meaning rather than
   the color: a dotted outline survives every kind of color blindness. */
.state-proposed { border-style: dashed !important; }
.state-removed { opacity: 0.55; text-decoration: line-through; }
.state-modified-dot { display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: #b35c00; margin-right: 5px; }
.row-hidden { opacity: 0.5; }
.scenario-picker select { font-size: 12px; padding: 3px 6px; border: 1px solid #c7d0da;
  border-radius: 4px; background: #fff; max-width: 260px; }
/* The view switcher is a Combo now, so the compact header sizing has to be
   restated for an input — a dropdown converted without this grows to the
   13px/8px of a form field and shoves the header apart. The `.combo-wrap`
   needs the max-width too: the input is 100% of it. */
.scenario-picker .combo-wrap { max-width: 260px; }
.scenario-picker .combo-wrap input.combo-input { font-size: 12px;
  padding: 3px 20px 3px 6px; border-color: #c7d0da; border-radius: 4px; }
.check-inline { display: flex; align-items: center; gap: 6px; font-size: 13px;
  margin: 6px 0; cursor: pointer; }
/* A checkbox row inside a .form-group has to beat two rules written for text
   inputs: `.form-group label` is display:block, which outranks .check-inline's
   flex on specificity, and `.form-group input` sets width:100% with padding and
   a border — which stretches the checkbox across the whole line and pushes its
   caption onto the next one, so the box looks stranded at the right. Both
   selectors below are deliberately more specific than those.

   **Radios need naming separately.** The 0.5.0 fix covered only
   `input[type="checkbox"]`, so when the export dialog arrived in 0.6.1 its
   radio buttons were stretched to the full width and their labels pushed far
   to the right — the identical bug, found again, because the fix had been
   written for the one control that had it rather than for the rule that
   causes it. */
.form-group label.check-inline { display: flex; }
.check-inline input[type="checkbox"],
.check-inline input[type="radio"] { width: auto; flex: 0 0 auto;
  padding: 0; border: none; border-radius: 0; margin: 0; }
.pick-list { max-height: 190px; overflow-y: auto; border: 1px solid #dde3ea;
  border-radius: 4px; padding: 8px 10px; margin: 6px 0 12px; background: #fff; }
.invite-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.invite-row select { font-size: 12px; padding: 2px 4px; }
.scenario-bar { display: flex; align-items: center; gap: 10px; padding: 6px 16px;
  background: #f7ecc0; border-bottom: 1px solid #e0d3a0; font-size: 12px; color: #5a4700; }
.scenario-bar .grow { flex: 1; }
.nav-scenario { padding-left: 26px; font-size: 12px; }
.nav-add { font-size: 12px; opacity: 0.85; }
.hide-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 7px 12px; background: #fff8dc; border: 1px solid #e0d3a0;
  border-radius: 4px; margin: 0 0 8px; font-size: 12px; }
.hide-bar .btn { padding: 3px 9px; font-size: 12px; }
.pick-col { width: 28px; text-align: center; }
/* An alignment guide. Dashed and thin so it reads as scaffolding rather than
   as part of the diagram, and in the accent orange already used for selection
   so it cannot be mistaken for a data flow. `vector-effect` keeps it one pixel
   wide at every zoom, which is what makes it look like a guide rather than a
   line that grows. */
.align-guide { stroke: #D4772C; stroke-width: 1; stroke-dasharray: 4 4;
  vector-effect: non-scaling-stroke; pointer-events: none; }
/* Inside .stats-actions now, so the auto margin belongs to that cluster
   rather than to this one. Two siblings both claiming `margin-left: auto`
   share the free space between them and end up pushed apart. */
.zoom-controls { display: flex; align-items: center; gap: 4px; }
/* Arrow routing. Handles only appear on the selected flow, so the diagram is
   not covered in dots while reading it. */
.route-handle { fill: #fff; stroke: #D4772C; stroke-width: 2.5; cursor: grab; }
.route-handle:active { cursor: grabbing; }
.route-handle:hover { fill: #D4772C; }
.route-bend { fill: #D4772C; stroke: #fff; stroke-width: 1.5; cursor: grab; }
.route-bend:active { cursor: grabbing; }
.anchor-dot { fill: #fff; stroke: #2E75B6; stroke-width: 1.5; opacity: 0.85;
  cursor: pointer; }
.anchor-dot:hover { fill: #eaf2fb; opacity: 1; }
.anchor-dot.hot { fill: #2E75B6; opacity: 1; }
.anchor-dot.in-use { fill: #2E75B6; opacity: 1; }
.flow-line.adjusting .flow-label-hit { stroke: #2E75B6; }
/* Help. The button sits beside the version badge; the panel rises from the
   bottom so the screen being asked about stays visible behind it. */
.help-button { position: fixed; right: 62px; bottom: 8px; z-index: 60;
  width: 20px; height: 20px; border-radius: 50%; border: 1px solid #d7dee6;
  background: #fff; color: #6b6b6b; font-family: inherit; font-size: 11px;
  font-weight: 700; line-height: 1; cursor: pointer; padding: 0; }
.help-button:hover, .help-button.active { color: #2E75B6; border-color: #b9d3ea;
  background: #eaf2fb; }
.help-sheet { position: fixed; right: 16px; bottom: 34px; z-index: 70;
  width: 420px; max-width: calc(100vw - 32px); height: 62vh; max-height: 560px;
  background: #fff; border: 1px solid #d7dee6; border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18); display: flex; flex-direction: column;
  animation: help-rise 0.16s ease-out; }
@keyframes help-rise { from { transform: translateY(12px); opacity: 0; }
                       to { transform: none; opacity: 1; } }
.help-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-bottom: 1px solid #eee; font-size: 14px; font-weight: 600; color: #1B3A5C; }
.help-header .btn { padding: 2px 8px; font-size: 11px; }
.help-search { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
.help-search input { width: 100%; padding: 6px 9px; border: 1px solid #c7d0da;
  border-radius: 4px; font-family: inherit; font-size: 13px; }
.help-body { flex: 1; overflow-y: auto; padding: 6px 12px 14px; }
.help-section { font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  color: #6b6b6b; font-weight: 600; margin: 12px 0 4px; }
.help-item { display: block; width: 100%; text-align: left; background: none;
  border: none; border-radius: 6px; padding: 8px 9px; cursor: pointer;
  font-family: inherit; }
.help-item:hover { background: #f2f7fc; }
.help-item-title { font-size: 13px; font-weight: 600; color: #1B3A5C; }
.help-item-summary { font-size: 11.5px; color: #6b6b6b; line-height: 1.45; margin-top: 2px; }
.help-empty { padding: 18px 9px; font-size: 12.5px; color: #6b6b6b; line-height: 1.6; }
.help-body .md { font-size: 13px; line-height: 1.62; }
.help-body .md h2 { font-size: 13px; margin: 14px 0 5px; color: #1B3A5C; }
.help-body .md p, .help-body .md li { margin-bottom: 7px; }
.help-body .md ul { padding-left: 18px; }
.md-img { max-width: 100%; border: 1px solid #e3e8ee; border-radius: 5px;
  margin: 8px 0; display: block; }
.zoom-btn { width: 26px; height: 26px; display: flex; align-items: center;
  justify-content: center; background: #fff; border: 1px solid #c7d0da;
  border-radius: 4px; color: #1B3A5C; cursor: pointer; padding: 0; }
.zoom-btn:hover:not(:disabled) { background: #eaf2fb; border-color: #2E75B6; }
.zoom-btn:disabled { opacity: 0.4; cursor: default; }
.zoom-level { min-width: 46px; background: none; border: none; font-family: inherit;
  font-size: 11px; color: #6b6b6b; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.zoom-level:hover { background: #eaf2fb; color: #1B3A5C; }
.person-picker { position: relative; margin: 6px 0 12px; }
.person-picker > input { width: 100%; padding: 6px 8px; border: 1px solid #c7d0da;
  border-radius: 4px; font-family: inherit; font-size: 13px; }
.picker-results { position: absolute; z-index: 30; left: 0; right: 0; background: #fff;
  border: 1px solid #c7d0da; border-radius: 4px; margin-top: 2px; max-height: 200px;
  overflow-y: auto; box-shadow: 0 4px 14px rgba(0,0,0,0.12); list-style: none; }
.picker-results li { padding: 6px 10px; font-size: 13px; cursor: pointer; }
.picker-results li.active { background: #eaf2fb; }
.picker-results li.no-match { color: #6b6b6b; cursor: default; }
.chosen-list { margin-top: 8px; border: 1px solid #dde3ea; border-radius: 4px; padding: 6px 10px; }
.chosen-list .invite-row { padding: 3px 0; font-size: 13px; }
.chosen-list .btn { padding: 1px 7px; font-size: 11px; margin-left: 6px; }
.tab-row { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid #e3e8ee; }
.tab-btn { background: none; border: none; border-bottom: 2px solid transparent;
  padding: 8px 12px; font-family: inherit; font-size: 13px; cursor: pointer; color: #6b6b6b; }
.tab-btn.active { color: #1B3A5C; border-bottom-color: #2E75B6; font-weight: 600; }

.app { display: flex; height: 100vh; }
.sidebar { width: 260px; background: #1B3A5C; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.sidebar-header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
.sidebar-header h1:hover { background: rgba(255,255,255,0.1); }
.sidebar-header p { font-size: 11px; opacity: 0.6; margin-top: 4px; cursor: pointer; border-radius: 4px; padding: 2px 4px; margin-left: -4px; }
.sidebar-header p:hover { background: rgba(255,255,255,0.1); }
.sidebar-header input { width: 100%; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; color: #fff; font-family: inherit; padding: 2px 4px; margin: -2px -4px; outline: none; }
.sidebar-header input.header-title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
.sidebar-header input.header-subtitle { font-size: 11px; margin-top: 4px; opacity: 0.8; }
/* --- Logo ---------------------------------------------------------------
   The sidebar is a fixed 260px with 20px of padding, so the header has 220px
   to work with and the layout has to survive any image a user uploads.

   Three rules keep it intact, and all three matter:
     1. The image is NEVER laid out at its intrinsic size. Every position puts
        it in a box with a fixed max height and `object-fit: contain`, so a
        3000px-wide banner and a square icon both fit without distorting.
     2. `min-width: 0` on the text column. A flex item defaults to
        `min-width: auto`, which means a long unbroken title refuses to shrink
        and pushes the logo out of the sidebar instead of wrapping.
     3. Nothing here can change the sidebar's width — the image is capped at
        100% and .sidebar is flex-shrink: 0.
   `object-position: left` on the stacked positions lines the logo up with the
   left edge of the text; centring it would look accidental against
   left-aligned type. */
.brand { display: flex; gap: 12px; }
.brand-text { min-width: 0; flex: 1; }
.brand-logo { display: block; flex-shrink: 0; }
.brand-left, .brand-right { flex-direction: row; align-items: center; }
.brand-right { flex-direction: row-reverse; }
.brand-left .brand-logo, .brand-right .brand-logo {
  max-height: 34px; max-width: 64px; width: auto; object-fit: contain; }
.brand-above, .brand-below { flex-direction: column; gap: 10px; align-items: stretch; }
.brand-below { flex-direction: column-reverse; }
.brand-above .brand-logo, .brand-below .brand-logo {
  max-height: 44px; max-width: 100%; width: auto;
  object-fit: contain; object-position: left; }
/* With the title hidden the logo is the header, so give it a little more room. */
.brand-only .brand-logo { max-height: 52px; max-width: 100%; }
.brand-only { gap: 0; }
/* The Preferences editor. The preview is a real 260px sidebar header on the
   real navy, so an image that would look wrong there looks wrong here first. */
.logo-editor { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.logo-preview { width: 260px; background: #1B3A5C; color: #fff; border-radius: 6px;
  overflow: hidden; flex-shrink: 0; }
.logo-preview .sidebar-header { border-bottom: none; }
.logo-preview-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  color: #6b6b6b; font-weight: 600; margin-bottom: 6px; }
.logo-controls { flex: 1; min-width: 240px; }
.logo-meta { font-size: 12px; color: #6b6b6b; margin-bottom: 10px; line-height: 1.5; }
.logo-meta b { display: block; color: #1a2332; font-size: 13px; }
.logo-buttons { display: flex; gap: 8px; margin-bottom: 10px; }
.logo-hint { font-size: 11.5px; color: #6b6b6b; line-height: 1.55; }
/* One line per definition: the name, its marker, and whether it is shared.
   The text itself lives on the marker — with 80 fields definable, printing
   every definition in full pushed the picker off the screen. */
.fd-row { display: flex; align-items: center; gap: 5px; padding: 5px 0;
  flex-wrap: wrap;
  border-bottom: 1px solid #f0f0f0; }
.fd-row:last-child { border-bottom: none; }
/* `.res-title-link` is `flex: 1` where it was first used — a resource row that
   wants the title to take up the slack and push its buttons to the right edge.
   Here the opposite is wanted: the name shrinks to its text so the marker and
   the badge sit immediately after it. `min-width: 0` lets a long name wrap
   rather than force the row wider than the panel. */
.fd-row .res-title-link { flex: 0 1 auto; min-width: 0; font-size: 12px;
  text-align: left; }
/* The sharing toggle, boxed so it reads as a decision rather than as another
   line of hint text. */
.fd-share { background: #f5f8fc; border: 1px solid #dde3ea; border-radius: 6px;
  padding: 9px 11px; margin-bottom: 12px; }
.fd-share .check-inline { margin: 0 0 4px; }
/* The export dialog's radio list, scoped to itself. An earlier version styled
   `.form-group label.check-inline` globally, which at 0,2,1 out-specifies
   `.fd-share .check-inline` at 0,2,0 — so it would have quietly retightened
   the sharing toggle in Preferences as well. A dialog's spacing is the
   dialog's business. */
.export-formats { margin-top: 6px; }
.export-formats .check-inline { margin: 0 0 8px; font-size: 13px; }
.export-formats .check-inline:last-child { margin-bottom: 0; }
/* A disabled input has to look unusable, not merely unresponsive. Measured:
   #5a6472 on #e4e9ef is 4.91:1, past AA for small text, so the value stays
   readable while the box plainly is not editable. The first attempt used
   #6b6b6b, which measured 4.37:1 and failed — gray-on-gray is exactly where
   "looks about right" and "passes" part company, so this was measured rather
   than eyeballed. */
.form-group input:disabled, .form-group textarea:disabled,
.form-group select:disabled { background: #e4e9ef; color: #5a6472;
  border-color: #c2cad3; cursor: not-allowed; }
/* A required field's toggle is shown rather than omitted, so the answer to
   "why can I not turn this one off?" is on the page instead of absent. */
.fd-disabled { opacity: 0.6; cursor: not-allowed; }
/* Measured: #8a4b00 on #fff3e0 is 6.20:1, comfortably past AA for small text.
   See ACCESSIBILITY.md — every badge color in this app is checked. */
.badge-manual { background: #fff3e0; color: #8a4b00; }
/* The deactivation warning. Scrolls rather than growing without limit: a
   contributor named on four hundred schema columns would otherwise push the
   buttons off the bottom of the dialog. */
.ref-warning { margin-top: 10px; max-height: 320px; overflow-y: auto; }
.ref-group { margin-bottom: 10px; font-size: 12.5px; }
.ref-group ul { margin: 4px 0 0; padding-left: 18px; }
.ref-group li { font-size: 12px; line-height: 1.6; }
.fd-off { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; color: #8a4b00; background: #fff3e0;
  border-radius: 3px; padding: 1px 5px; }
.fd-shared { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; background: #eaf2fb; color: #1B3A5C;
  border-radius: 3px; padding: 1px 5px; margin-left: 6px; }
.logo-unsaved { text-transform: none; letter-spacing: 0; font-weight: 600;
  background: #fff3cd; color: #856404; border-radius: 3px; padding: 1px 6px;
  margin-left: 8px; }
.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.nav-item { padding: 10px 20px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.15s; }
.nav-item:hover { background: rgba(255,255,255,0.08); }
.nav-item.active { background: rgba(255,255,255,0.15); border-left: 3px solid #5BA4E6; }
.nav-icon { width: 18px; text-align: center; opacity: 0.7; }
.nav-section { padding: 16px 20px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.4; }
.main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.toolbar { height: 48px; background: #fff; border-bottom: 1px solid #dde3ea; display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0; }
.toolbar-title { font-size: 15px; font-weight: 600; color: #1B3A5C; }
.toolbar-spacer { flex: 1; }
.btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #ccc; background: #fff; font-size: 12px; cursor: pointer; transition: all 0.15s; }
.btn:hover { background: #f5f5f5; }
.btn-primary { background: #2E75B6; color: #fff; border-color: #2E75B6; }
.btn-primary:hover { background: #245f96; }
.btn-edit { background: #fff; color: #2E75B6; border-color: #2E75B6; }
.btn-edit:hover { background: #e8f0fa; }
.btn-save { background: #27ae60; color: #fff; border-color: #27ae60; }
.btn-danger { background: #fff; color: #c0392b; border-color: #c0392b; }
.btn-danger:hover { background: #c0392b; color: #fff; }
.btn-save:hover { background: #1e8c4c; }
.content-area { flex: 1; display: flex; overflow: hidden; }
.canvas-container { flex: 1; min-width: 0; position: relative; overflow: hidden; background: #f5f8fb; transition: all 0.25s ease; }
.canvas-container svg { display: block; width: 100%; height: 100%; }
.detail-panel { width: 480px; background: #fff; border-left: 1px solid #dde3ea; overflow-y: auto; overflow-x: hidden; flex-shrink: 0; transition: width 0.3s ease, border 0.3s ease; }
.detail-panel.closed { width: 0; min-width: 0; border-left: none; overflow: hidden; padding: 0; }
.panel-header { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; }
.panel-header h2 { font-size: 15px; font-weight: 600; color: #1B3A5C; flex: 1; }
.panel-close { width: 28px; height: 28px; border-radius: 50%; border: none; background: #f0f0f0; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.panel-close:hover { background: #e0e0e0; }
.panel-body { padding: 16px 20px; }
.panel-section { margin-bottom: 20px; }
.panel-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #6b6b6b; margin-bottom: 8px; font-weight: 600; }
.field-row { display: flex; margin-bottom: 6px; font-size: 13px; line-height: 1.5; }
.field-label { width: var(--field-label-w); flex-shrink: 0; color: #666; font-weight: 500; }
.field-value { flex: 1; color: #1a2332; word-break: break-word; }
.field-value.multiline { white-space: pre-line; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-active { background: #e6f4ea; color: #1e7e34; }
.badge-deprecated { background: #fde8e8; color: #c0392b; }
.badge-planned { background: #fff3cd; color: #856404; }
.badge-broken { background: #fde8e8; color: #c0392b; }
.badge-pii { background: #ffeaa7; color: #6c5300; }
.badge-ferpa { background: #dfe6ff; color: #2c3e8c; }
.badge-source { background: #d5f5e3; color: #1a6b3c; }
.badge-destination { background: #fadbd8; color: #922b21; }
.badge-internal, .badge-etlprocess, .badge-datastore, .badge-manualprocess { background: #d6eaf8; color: #1a5276; }
.badge-confidential { background: #f5b7b1; color: #78281f; }
.badge-sensitive { background: #fdebd0; color: #7e5109; }
.badge-public { background: #d5f5e3; color: #1a6b3c; }
.system-node { cursor: grab; }
.system-node:active { cursor: grabbing; }
.system-node rect { rx: 10; ry: 10; transition: filter 0.15s; }
.system-node:hover rect { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15)); }
.system-node text { pointer-events: none; }
.flow-line { cursor: pointer; }
.flow-line:hover line { stroke-width: 4; }
.flow-label { font-size: 10px; fill: #333f4a; cursor: pointer; user-select: none; }
.flow-line.selected line { stroke: #D4772C; stroke-width: 4; }
.system-node.selected rect { stroke: #D4772C; stroke-width: 3; }
.table-view { padding: 20px; overflow-y: auto; flex: 1; }
.data-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.data-table th { background: #1B3A5C; color: #fff; padding: 10px 14px; text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.3px; }
.data-table td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #eee; }
.data-table tr:hover td { background: #f8fafc; }
.data-table tr.clickable { cursor: pointer; }
/* Modals holding a form do NOT close when the backdrop is clicked. A stray
   click beside a half-filled Add Data Flow used to throw the lot away with no
   warning and no undo. The way out is the X, Cancel, or saving. The details
   flyout is the opposite case and still closes on an outside click: it is a
   panel you glance at, and it holds nothing unsaved.
   Anything with inputs should follow this — do not add onClick={onClose} to a
   .modal-overlay. */
/* --- Tooltips -----------------------------------------------------------
   z-index 200 puts these above the modal overlay (100), so a tooltip inside a
   modal is not hidden by it. The anchor is inline-flex so it wraps a button
   without changing how the button lays out — the whole control is the hover
   target, not just its text. Opacity is animated but position is not, or the
   bubble would visibly slide in from wherever it was last shown. */
.tip-anchor { display: inline-flex; }
.tip-bubble { position: fixed; z-index: 200; transform: translate(-50%, -100%);
  background: #1a2332; color: #fff; font-size: 12px; line-height: 1.45;
  padding: 7px 10px; border-radius: 6px; pointer-events: none;
  box-shadow: 0 4px 14px rgba(0,0,0,0.22); animation: tip-in 0.12s ease-out; }
.tip-bubble.tip-bottom { transform: translate(-50%, 0); }
.tip-bubble::after { content: ''; position: absolute; left: 50%; margin-left: -5px;
  border: 5px solid transparent; }
.tip-bubble.tip-top::after { top: 100%; border-top-color: #1a2332; }
.tip-bubble.tip-bottom::after { bottom: 100%; border-bottom-color: #1a2332; }
@keyframes tip-in { from { opacity: 0; } to { opacity: 1; } }
/* A field label with a definition gets this marker. Deliberately quiet: it
   should be findable without competing with the value beside it. */
.tip-mark { display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; margin-left: 5px; border-radius: 50%;
  background: #dde3ea; color: #4a5764; font-size: 10px; font-weight: 700;
  cursor: help; flex-shrink: 0; }
.tip-mark:hover, .tip-mark:focus { background: #2E75B6; color: #fff; outline: none; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: #fff; border-radius: 12px; width: 600px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.modal-header { padding: 20px 24px; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 600; color: #1B3A5C; display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 20px 24px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; font-family: inherit; }
.form-group textarea { min-height: 70px; resize: vertical; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.modal-footer { padding: 16px 24px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 8px; }
.checkbox-row { display: flex; gap: 20px; margin-bottom: 14px; }
.checkbox-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.edit-input { width: 100%; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; }
.edit-textarea { width: 100%; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; min-height: 60px; resize: vertical; }
/* A <select> is as wide as its longest option unless told otherwise, and a flex
   item will not shrink below its content by default. Together those made the
   Source and Destination dropdowns — whose options read "Federal Reporting
   (SYS-002)" — run off the edge of the details panel. width and min-width: 0
   are both needed: the first stops it sizing to its content, the second lets
   flex shrink it the rest of the way. */
.edit-select { padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px;
  font-size: 13px; font-family: inherit; width: 100%; max-width: 100%; min-width: 0; }
/* Combo — the dropdown you can type into. See the component for why it is not
   a <datalist>. The list is portalled to <body>, so it is positioned fixed and
   sits above the modal overlay (100) and Tooltip (200).

   The wrapper is `position: relative` only to hold the caret; the list itself
   is NOT inside it, because a `position: absolute` list would be clipped by
   the flyout's own scrolling exactly as a native one was. */
.combo-wrap { position: relative; width: 100%; min-width: 0; }
/* Room for the caret, so a long label does not run underneath it.

   `.combo-wrap input.combo-input` rather than `.combo-input`, because inside an
   Add window the control sits in a `.form-group`, and `.form-group input` sets
   `padding: 8px 10px` at a higher specificity — it would win, and a long system
   name would run under the caret. The same hazard CLAUDE.md records for
   `.check-inline` and `.res-title-link`: a class carries the layout assumptions
   of the place it was written for. The rest of `.form-group input` is wanted
   here, which is why this overrides one property rather than opting out. */
.combo-wrap input.combo-input { padding-right: 24px; cursor: default; }
/* Dropped straight into a flex row — `.edit-field-row` — the wrapper has to
   take the slack, or it shrinks to nothing beside its label. */
.edit-field-row > .combo-wrap { flex: 1; }
.combo-caret { position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  font-size: 10px; color: #6b6b6b; pointer-events: none; }
.combo-list { position: fixed; z-index: 300; margin: 0; padding: 4px 0;
  list-style: none; background: #fff; border: 1px solid #b7bfc7; border-radius: 4px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18); max-height: 260px; overflow-y: auto;
  font-size: 13px; font-family: inherit; }
.combo-opt { padding: 5px 10px; cursor: pointer; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
/* One highlight, driven by the keyboard AND the mouse (mouseenter sets the
   same index), so there is never a second row that looks equally chosen.
   #1B3A5C on #e8eef5 measures 7.6:1. */
.combo-opt.active { background: #e8eef5; }
.combo-opt.sel { font-weight: 600; }
.combo-opt-hint { color: #6b6b6b; font-style: italic; }
/* Shown but not choosable. #767676 on white is 4.54:1, so it still passes AA
   for text — a grayed option has to stay readable, because the reason it is
   grayed is written in it. */
.combo-opt-off { color: #767676; cursor: default; }
.combo-group { padding: 6px 10px 2px; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em; color: #4a5764;
  border-top: 1px solid #e4e7ea; margin-top: 2px; }
.combo-list > .combo-group:first-child { border-top: 0; margin-top: 0; }
.combo-empty { padding: 6px 10px; color: #6b6b6b; font-style: italic; }
.edit-field-row { display: flex; margin-bottom: 10px; font-size: 13px; align-items: flex-start; }
/* Selects placed directly in the row, rather than inside a flex:1 wrapper. */
.edit-field-row > .edit-select { flex: 1; }
.edit-field-row .field-label { padding-top: 6px; }
/* A value shown as text rather than as a control still has to line up with its
   label. The label carries `padding-top: 6px` so it sits level with an input's
   text, and a bare `.field-value` beside it starts at the top of the row
   instead — 6px high. That only became visible when the value was EMPTY: the
   derived status with nothing set rendered '' and the hint below it rose to
   the top of the cell, above its own label. `display: block` so the hint sits
   underneath it rather than beside it. */
.edit-field-row .field-value { display: block; padding-top: 6px; }

.stats-bar { display: flex; align-items: center; gap: 24px; padding: 10px 20px;
  background: #fff; border-bottom: 1px solid #eee; }
/* The Add buttons and the zoom controls, right-aligned together. */
.stats-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.stat { text-align: center; }
.stat-value { font-size: 22px; font-weight: 700; color: #1B3A5C; }
.stat-label { font-size: 10px; color: #6b6b6b; text-transform: uppercase; letter-spacing: 0.5px; }
.legend { position: absolute; bottom: 16px; left: 16px; background: rgba(255,255,255,0.95); border-radius: 8px; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); font-size: 11px; z-index: 5; }
.legend-title { font-weight: 600; margin-bottom: 6px; color: #555; }
.legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.legend-color { width: 14px; height: 14px; border-radius: 3px; }
/* A task's circle. Deliberately NOT colored by status yet — status colors
   are a later release, and one neutral circle now is better than a palette
   that has to be explained before it is finished.

   The ring must read against every system fill in TYPE_PALETTE, because a
   task attached to a system is drawn INSIDE its box. #1B3A5C measures 8.69:1
   against the worst of the eight (purple, #e8daef) and 11.63:1 on white, so
   it clears AA everywhere. The fill is a soft gray rather than white, and the
   ring reads 9.02:1 against it, so the outline stays crisp while the circle
   reads as an object rather than a hole in the diagram. The fill itself is
   decorative — against some box fills it is nearly the same luminance
   (1.01:1 on magenta), and the *ring* is what delineates the shape, which is
   what WCAG 1.4.11 asks of a non-text indicator.

   **Selection is an outer halo, not a recolor.** Using the app's selected
   orange for the ring itself was the obvious thing and it fails: #D4772C is
   only 2.43:1 against that purple fill, under the 3:1 WCAG 1.4.11 needs for a
   non-text indicator — so a selected task inside a purple box would be less
   visible than an unselected one. The dark ring therefore stays put and the
   orange is drawn outside it, where its neighbors are the dark ring (3.58:1)
   and the fill. Selection is also never color alone: the flyout opens. */
/* No `fill` here any more. The status supplies it as an attribute, and a
   stylesheet rule beats a presentation attribute — the same trap as the legend
   swatch being stretched by `.canvas-container svg`. The `open` gray that used
   to live here is now `TASK_SIGNALS`' last entry, which is also what the
   legend draws, so the two cannot disagree. */
.task-node .task-ring { stroke: #1B3A5C; stroke-width: 2; }
.task-node .task-hit { fill: transparent; stroke: none; }
/* The status marks, in the ring's own color. #1B3A5C measures at worst 6.54:1
   against the five status fills (the red), so it clears AA as text as well as
   the 3:1 WCAG 1.4.11 asks of a non-text indicator. Measured over every fill,
   not guessed from the lightest — the mistake made and recorded for the
   selection halo.

   `pointer-events: none` so the mark never intercepts a drag: the circle is
   one gesture, and a press that lands on the check rather than the ring has to
   behave identically. */
.task-mark { fill: none; stroke: #1B3A5C; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.task-mark-dot, .task-mark-fill { fill: #1B3A5C; stroke: none;
  pointer-events: none; }
/* The legend swatches are drawn at r=6.5, so their strokes have to come down
   with them or the mark fills the ring. */
.legend svg .task-mark { stroke-width: 1.4; }
.task-node .task-halo { fill: none; stroke: #D4772C; stroke-width: 2.5;
  display: none; }
.task-node.selected .task-halo { display: inline; }
/* The legend swatch reuses the same class, so it cannot drift from the circle
   it is explaining.

   **No `fill` here.** It used to set `fill: #dfe3e8`, and a stylesheet rule
   beats a `fill` attribute on the element — so every swatch in the status key
   came out gray however it was drawn. Exactly the trap recorded two rules down
   for the swatch's *size*, where `width`/`height` attributes lose to
   `.canvas-container svg`; the comment was already in the file and I walked
   into the same thing with the color. The status supplies the fill, as it
   does on the diagram. */
.legend .task-ring { stroke: #1B3A5C; stroke-width: 2; }
/* A rule across the key, so System Types reads as one group and what follows
   as another. Without it the task entry looked like a ninth system type. */
.legend-divider { border-top: 1px solid #d7dde5; margin: 8px 0 7px; }
/* The line under a flyout's title, for context the title cannot carry — what
   a task is attached to. Quiet enough not to compete with the name. */
.panel-subtitle { font-size: 11px; color: #5a6472; margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A task's hover card. Appears immediately, which is the entire reason it
   exists rather than a `<title>`. Centered on the circle and lifted above it by
   its own transform, so the inline left/top can be the circle's screen
   position without this needing to know its own size. */
.task-card { position: absolute; z-index: 6; transform: translate(-50%, -100%);
  background: #1B3A5C; color: #fff; padding: 6px 9px; border-radius: 5px;
  font-size: 11px; line-height: 1.45; max-width: 240px; pointer-events: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
.task-card-name { font-weight: 700; }
/* The legend lives INSIDE .canvas-container, which sets
   `svg { width: 100%; height: 100% }` for the diagram itself — so a small
   swatch SVG dropped in here was stretched to the size of the whole canvas.
   Width and height attributes on the element do not win against that rule.
   Pinned to match `.legend-color`, which is the square beside it. */
.legend svg { width: 14px; height: 14px; flex: 0 0 auto; }

/* Collapsible section styles */

/* governance inheritance display */
.gov-field { display: flex; margin-bottom: 7px; font-size: 13px; line-height: 1.5; }
.gov-field .field-label { width: var(--field-label-w); flex-shrink: 0; color: #666; font-weight: 500; }
.gov-field .gov-val { flex: 1; color: #1a2332; word-break: break-word; }
.gov-val.inherited { color: #8a96a3; font-style: italic; }
.src-tag { display: inline-block; font-size: 8px; font-weight: 700; padding: 1px 5px; border-radius: 3px; margin-left: 6px; text-transform: uppercase; letter-spacing: 0.3px; vertical-align: middle; }
.src-tag-system { background: #eceff1; color: #607d8b; }
.src-tag-table { background: #e3f2fd; color: #1565c0; }
.src-tag-column { background: #fdebd0; color: #b9770e; }
.src-tag-none { background: #f5f5f5; color: #bbb; }
.gov-hint { font-size: 10px; color: #6b6b6b; margin-top: 2px; }
/* A hint that is a SIBLING of the field row above it, rather than nested
   inside it, explains that field — so it has to read as belonging to it.
   `.gov-hint` alone gives it 2px of its own margin on top of the row's
   margin-bottom and **nothing underneath**, so it sat further from the field
   it describes than from the next one down, reading as a caption for the wrong
   field. Ben reported it on the task dates and the status.

   Two things at once: pull it up so the gap above is smaller than the gap
   below, and indent it to the value column, because a hint about a value that
   starts under the LABEL looks like it belongs to the panel rather than to the
   field.

   Keyed on adjacency, so it only applies where the hint really is a sibling. A
   hint nested inside a row — the flow name, the display-name counter, the
   derived status in the task edit view — is already aligned with its value and
   already gets the row's bottom margin, and is left alone. */
.field-row + .gov-hint {
  margin-top: -2px; margin-bottom: 8px; margin-left: var(--field-label-w); }
.edit-field-row + .gov-hint {
  margin-top: -6px; margin-bottom: 12px; margin-left: var(--field-label-w); }
/* A task's checklist. Each step is a row of its own rather than a line in a
   textarea, because a step carries an assignee and a status as well as text.

   `.edit-input` is `width: 100%` where it was written — a field row that owns
   its whole line. Dropped into this flex header it would push the buttons off
   the end, so it is given `flex` and `min-width: 0` here instead. The same
   applies to `.edit-select` in the meta row below: both are reused classes
   carrying the layout assumptions of somewhere else. */
.task-step { border: 1px solid #e0e0e0; border-radius: 5px; padding: 8px;
  margin-bottom: 8px; background: #fafafa; }
.task-step-head { display: flex; align-items: center; gap: 6px; }
.task-step-head .edit-input { flex: 1; min-width: 0; }
.task-step-num { flex: 0 0 auto; width: 18px; font-size: 12px; font-weight: 600;
  color: #5a6472; text-align: right; }
.task-step-meta { display: flex; gap: 6px; margin-top: 6px; }
.task-step-meta .edit-select { flex: 1; min-width: 0; }
/* The four controls under a subtask's description, on a 2x2 grid.

   `margin-left` is the number column (18px) plus the head row's gap (6px), so
   the grid's left edge lands exactly under the description box, and the grid
   runs to the container's right edge, which is the Remove button's. That is
   what makes Status line up with Expected Start, and Person Responsible with
   Expected End, instead of each row dividing the width its own way.

   `.edit-input` and `.edit-select` carry width assumptions from the field rows
   they were written for, so both are pinned to the grid cell here. */
.task-step-grid { display: grid; grid-template-columns: 1fr 1fr;
  gap: 6px 10px; margin: 6px 0 0 24px; }
.task-step-grid label { display: flex; flex-direction: column; gap: 2px;
  min-width: 0; font-size: 11px; color: #5a6472; }
.task-step-grid label > span { font-weight: 600; }
.task-step-grid .edit-input,
.task-step-grid .edit-select { width: 100%; min-width: 0; box-sizing: border-box; }
/* A dropdown sitting on its "do something" line rather than on a value.
   Kept for the selects that are still native. The dropdowns over records are
   `Combo`s now and style their own rows, which sidesteps this entirely —
   `.combo-opt-hint` is ordinary markup and does what it says on every
   platform.

   **The style goes on the SELECT, not the OPTION.** macOS draws native select
   popups itself and ignores `option { color; font-style }` entirely, so
   styling the option looked right on one platform and did nothing on Ben's.
   Styling the control works everywhere, and the italics disappear by
   themselves the moment a real value is chosen. */
.select-hint { font-style: italic; color: #6b7684; }
/* Kept for the option as well: where a browser does honor it, the popup list

.opt-hint { font-style: italic; color: #6b7684; }

.form-group > .edit-select { width: 100%; box-sizing: border-box; }

/* "(Optional)" beside a section heading, smaller and quieter than the

/* A compact button for the controls inside a step row, where a full-size one

/* The account chip. It used to sit at the foot of the navy sidebar, where the

/* Screens that stack a toolbar above a scrolling table. The content area is a

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<script type="text/babel" data-presets="react">
/* @jsxRuntime classic */
// Uses the classic JSX runtime (React.createElement) — React is loaded globally
// above. Do not switch to the automatic runtime: it emits `import` statements
// that cannot run in this inline (non-module) script.
const { useState, useEffect, useCallback, useRef, useContext, useMemo } = React;

// ===== Session-aware API client =====
// The CSRF token is issued at login and must accompany every state-changing
// request. A 401 means the session expired or was revoked, so the app returns
// to the login screen rather than silently rendering empty panels.
const session = { csrf: null };
let onAuthLost = () => {};

class ApiError extends Error {
  constructor(status, payload) {
    super((payload && payload.error) || `Request failed (${status})`);
    this.status = status;
    this.payload = payload || {};
    this.problems = this.payload.problems || null;
  }
}

// Which view every request belongs to. null is Current Architecture; a number
// is that scenario. Held here rather than passed through every component
// because otherwise each of the ~40 existing API calls would have to be found
// and edited, and the one that got missed would quietly read live data while
// the user believed they were in a scenario.
let viewScenario = null;
let viewShowHidden = false;
const setViewScenario = (id) => { viewScenario = id === null ? null : Number(id); };
const setViewShowHidden = (on) => { viewShowHidden = !!on; };

// Endpoints that are the SAME whatever view you are in: accounts, settings,
// release notes, and the scenario machinery itself.
//
// This is a deny-list on purpose. It began as a list of scoped endpoints and
// that failed open: /api/schema was missing, so editing a field's governance
// inside a scenario sent no scenario at all and wrote straight to Current
// Architecture. Forgetting to add an endpoint here now means a harmless extra
// query parameter that unscoped handlers ignore, instead of a silent edit to
// live data.
// Views that get the counts bar across the top. **Every view with an Add
// button must be in here**, because the Add buttons are rendered inside that
// bar: leaving one out hides its button with no error anywhere. Tasks was
// missing in 0.7.0 and the + Add Task button simply never appeared on the
// Tasks catalog, while working fine on the diagram.
const STATS_BAR_VIEWS = ['diagram', 'schema', 'systems', 'flows', 'elements',
                         'contributors', 'tasks'];

const UNSCOPED_ENDPOINTS = [
  '/api/auth', '/api/users', '/api/sessions', '/api/preferences',
  '/api/releases', '/api/version', '/api/whats-new', '/api/notifications',
  '/api/scenarios', '/api/system-types', '/api/branding',
  // Task types are configuration, like system types — one list for every
  // view. `/api/tasks` is deliberately NOT here: tasks are records and are
  // scoped, so leaving them out is what makes a scenario's tasks separate
  // from live's. This being a deny-list is why that is the safe default.
  '/api/task-types',
];

function scopedUrl(url) {
  if (viewScenario === null && !viewShowHidden) return url;
  const path = url.split('?')[0];
  if (!path.startsWith('/api/')) return url;
  if (UNSCOPED_ENDPOINTS.some(p => path === p || path.startsWith(p + '/'))) return url;
  const parts = [];
  if (viewScenario !== null) parts.push(`scenario=${viewScenario}`);
  if (viewShowHidden) parts.push('include_hidden=1');
  return url + (url.includes('?') ? '&' : '?') + parts.join('&');
}

async function request(method, url, data) {
  url = scopedUrl(url);
  const opts = { method, credentials: 'same-origin', headers: {} };
  if (data !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(data);
  }
  if (method !== 'GET' && session.csrf) opts.headers['X-CSRF-Token'] = session.csrf;
  const r = await fetch(url, opts);
  if (r.status === 401) { onAuthLost(); throw new ApiError(401, { error: 'Your session has ended.' }); }
  const ctype = r.headers.get('Content-Type') || '';
  const payload = ctype.includes('json') ? await r.json().catch(() => ({})) : await r.text();
  if (!r.ok) throw new ApiError(r.status, typeof payload === 'object' ? payload : { error: payload });
  return payload;
}

// Multipart uploads can't go through request(): FormData sets its own
// Content-Type. This mirrors its error handling, including the case where the
// server answers with something that isn't JSON at all.
async function uploadFile(url, formData) {
  // Multipart uploads cannot go through request() — FormData sets its own
  // Content-Type — but they still belong to a view. Skipping this is why
  // attaching a document inside a scenario returned "Not found": the server
  // looked for the parent record on Current Architecture, where a scenario's
  // copy does not exist. The same applied to uploading a schema.
  url = scopedUrl(url);
  const r = await fetch(url, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'X-CSRF-Token': session.csrf }, body: formData,
  });
  if (r.status === 401) { onAuthLost(); throw new ApiError(401, { error: 'Your session has ended.' }); }
  const text = await r.text();
  let payload;
  try { payload = JSON.parse(text); }
  catch (e) {
    throw new ApiError(r.status, {
      error: r.ok
        ? 'The server returned an unexpected response.'
        : `Upload failed (${r.status} ${r.statusText}). The server did not return JSON — ` +
          `check the container logs with: docker compose logs --tail=50 app`,
    });
  }
  if (!r.ok) throw new ApiError(r.status, payload);
  return payload;
}

const api = {
  get: (url) => request('GET', url),
  post: (url, data) => request('POST', url, data === undefined ? {} : data),
  put: (url, data) => request('PUT', url, data === undefined ? {} : data),
  del: (url) => request('DELETE', url),
  // Fire-and-forget for high-frequency writes like node dragging.
  quiet: (method, url, data) => request(method, url, data).catch(() => {}),
};

// System types (and their colors) are configured in Preferences and loaded
// from the server. These are only a fallback for the first paint.
const FALLBACK_TYPE = { fill: '#e2e6ea', stroke: '#4a5764', text: '#333f4a' };
let TYPE_COLORS = {
  'Source': { fill: '#dce9fb', stroke: '#2f6fd0', text: '#123a6b' },
  'Destination': { fill: '#c9e6d2', stroke: '#116039', text: '#0d3d22' },
  'Data Store': { fill: '#e8daef', stroke: '#7d3c98', text: '#5b2c6f' },
  'Manual Entry': { fill: '#fce5cd', stroke: '#b35c00', text: '#7a3e00' },
};
const getColor = (type) => TYPE_COLORS[type] || FALLBACK_TYPE;
// "Deprecated" is no longer offered in any dropdown and migration 0010
// converted the records that had it. The mapping stays so that a stray value —
// one written through the API between the deploy and the migration, or in a
// database restored from before it — still renders as a styled badge instead
// of an unstyled one. Cheap insurance against a value that should not exist.
const STATUS_BADGE = { Active: 'active', Deprecated: 'deprecated', Planned: 'planned', Broken: 'broken', 'Under Review': 'planned' };
const CLASS_BADGE = { Confidential: 'confidential', Sensitive: 'sensitive', Internal: 'internal', Public: 'public' };

// Roles are ordered; a higher role inherits everything below it. This mirrors
// permissions.py on the server, which is where the rule is actually enforced —
// hiding a control here is only a convenience.
const ROLE_ORDER = ['Viewer', 'Editor', 'Administrator', 'SuperAdmin'];
const roleAtLeast = (role, minimum) =>
  ROLE_ORDER.indexOf(role) >= ROLE_ORDER.indexOf(minimum);

// ===== Sortable tables =====
// Click a header to sort ascending, click again for descending. Values are
// compared numerically when both sides are numeric, otherwise case-insensitively
// as text, with blanks always sorted last.
function useSort(rows, initialKey, initialDir) {
  const [sort, setSort] = useState({ key: initialKey || null, dir: initialDir || 'asc' });
  const toggle = (key) => setSort(s =>
    s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' });

  const sorted = React.useMemo(() => {
    if (!sort.key) return rows;
    const factor = sort.dir === 'asc' ? 1 : -1;
    const val = (r) => {
      const v = typeof sort.key === 'function' ? sort.key(r) : r[sort.key];
      return (v === null || v === undefined || v === '') ? null : v;
    };
    return [...rows].sort((a, b) => {
      const x = val(a), y = val(b);
      if (x === null && y === null) return 0;
      if (x === null) return 1;          // blanks last, regardless of direction
      if (y === null) return -1;
      const nx = Number(x), ny = Number(y);
      if (!Number.isNaN(nx) && !Number.isNaN(ny) && x !== true && y !== true) {
        return (nx - ny) * factor;
      }
      return String(x).localeCompare(String(y), undefined, { sensitivity: 'base' }) * factor;
    });
  }, [rows, sort]);

  return { sorted, sort, toggle };
}

function SortHeader({ label, sortKey, sort, toggle, style }) {
  const active = sort.key === sortKey;
  return (
    <th className={`sortable ${active ? 'sorted' : ''}`} style={style}
        onClick={() => toggle(sortKey)} role="columnheader" tabIndex={0}
        onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(sortKey); } }}
        aria-sort={active ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}
        title={`Sort by ${label}`}>
      {label}<span className="sort-arrow">{active ? (sort.dir === 'asc' ? '▲' : '▼') : '▴▾'}</span>
    </th>
  );
}

// Contributor references are stored as IDs; show the person's name with the ID
// in parentheses so the record is still easy to spot.
// A contributor reference, shown as a person rather than as a key. The
// identifier used to be all you got — "CON-003" in a governance field tells a
// reader nothing and gives them no way to ask the person a question.
//
// `contact_email` is resolved on the server, preferring the linked user
// account's address over the contributor's own typed-in one; see
// `contact_emails` in app.py. Falling back to the identifier matters: a
// reference must never render as nothing, or a field that *is* set looks unset.
function contributorLabel(id, contributors) {
  if (!id) return null;
  const c = (contributors || []).find(x => x.contributor_id === id);
  if (!c) return id;
  const email = c.contact_email || c.email;
  const base = email ? `${c.name} (${email})` : `${c.name} (${c.contributor_id})`;
  // Deactivating a contributor keeps every assignment that names them, so a
  // record can go on showing someone who is no longer in circulation. Saying
  // so is the point: the gap is meant to be visible, not tidied away.
  return isDeactivated(c) ? `${base} — deactivated` : base;
}

// A contributor row with no `is_active` has never been deactivated: the column
// arrived in 0.5.2 and every existing row defaults to 1.
function isDeactivated(c) {
  return !!c && c.is_active !== undefined && c.is_active !== null && !c.is_active;
}

// Who a picker should offer. Deactivated people are left out so nobody new is
// assigned to them — except on a record that already names one, where removing
// the current value from its own dropdown would leave the field looking empty
// and make the assignment impossible to see or to change.
function assignable(contributors, current) {
  return byName(contributors).filter(
    c => !isDeactivated(c) || c.contributor_id === current);
}
// No hiding check of its own: it renders a ReadField with the same label, and
// that is where the check happens. Adding one here would resolve the same
// field twice and, if the two labels ever differed, disagree.
function ContributorField({ label, value, contributors }) {
  return <ReadField label={label} value={contributorLabel(value, contributors)} />;
}
// A reference to a system, drawn the way a reference to a contributor is.
// `data_element.source_of_truth` is a foreign key to system.system_id, but was
// drawn as a free-text box and displayed as a raw ID. Typing a system's *name*
// into it therefore violated the foreign key — which only surfaced once the
// field started being sent at all, because until 0.5.2 it was dropped from the
// save payload and quietly did nothing.
function systemLabel(id, systems) {
  if (!id) return null;
  const s = (systems || []).find(x => x.system_id === id);
  return s ? systemOption(s) : id;
}

function SystemField({ label, value, systems }) {
  return <ReadField label={label} value={systemLabel(value, systems)} />;
}

function SystemSelect({ label, value, onChange, systems }) {
  if (useFieldHidden(label)) return null;
  return (
    <div className="edit-field-row"><span className="field-label">{label}<FieldInfo label={label} /></span>
      <div style={{flex:1, minWidth:0}}>
        <Combo value={value || ''} ariaLabel={label}
               onChange={v => onChange(v || null)}
               options={[{ value: '', label: '— none —' },
                         ...byName(systems).map(x =>
                           ({ value: x.system_id, label: systemOption(x) }))]} />
      </div>
    </div>
  );
}

function ContributorSelect({ label, value, onChange, contributors }) {
  if (useFieldHidden(label)) return null;
  return (
    <div className="edit-field-row"><span className="field-label">{label}<FieldInfo label={label} /></span>
      <div style={{flex:1, minWidth:0}}>
        <Combo value={value || ''} ariaLabel={label}
               onChange={v => onChange(v || null)}
               options={[{ value: '', label: '— none —' },
                         ...assignable(contributors, value).map(c =>
                           ({ value: c.contributor_id,
                              label: contributorLabel(c.contributor_id, contributors) }))]} />
      </div>
    </div>
  );
}

// Dropdowns of systems are sorted by name — hunting for an ID in creation order
// is needlessly hard once there are more than a handful.
const byName = (list) => [...(list || [])].sort((a, b) =>
  String(a.name || '').localeCompare(String(b.name || '')));
const systemOption = (s) => `${s.name} (${s.system_id})`;

// A data flow's name is nearly always "<source> to <destination>", so the two
// systems are chosen first and the name is offered ready-made.
function autoFlowName(systems, sourceId, destId) {
  if (!sourceId || !destId) return '';
  const list = systems || [];
  const a = list.find(s => s.system_id === sourceId);
  const b = list.find(s => s.system_id === destId);
  return (a && b) ? `${a.name} to ${b.name}` : '';
}

// Setter for Source and Destination that keeps a generated name in step.
//
// The rule is that the name follows the systems only while it is still the
// generated one. A name the user has written is theirs: changing an endpoint
// afterwards leaves it alone. An empty name counts as generated, so clearing
// it and picking systems fills it in again.
function endpointSetter(form, set, systems) {
  return (key, value) => {
    const generatedBefore = autoFlowName(systems, form.source_system_id,
                                         form.destination_system_id);
    const wasGenerated = !form.name || form.name === generatedBefore;
    set(key, value);
    if (!wasGenerated) return;
    const next = { ...form, [key]: value };
    const generatedAfter = autoFlowName(systems, next.source_system_id,
                                        next.destination_system_id);
    if (generatedAfter) set('name', generatedAfter);
  };
}

// Views that belong to a particular scenario (or to Current Architecture).
// The rest — users, preferences, releases — are the same wherever you are.
const SCOPED_VIEWS = ['diagram', 'schema', 'systems', 'flows', 'elements', 'contributors', 'audit'];

const VIEW_TITLES = {
  diagram: 'Lineage Diagram', systems: 'Systems Catalog',
  flows: 'Data Flows Catalog', elements: 'Data Elements Glossary',
  contributors: 'Contributors', users: 'User Management',
  preferences: 'Preferences', audit: 'Audit Log', releases: 'Release Notes',
};

// ===== Branding =====
const LOGO_POSITIONS = ['left', 'right', 'above', 'below'];

// The etag is hashed from the image's bytes, so a replaced logo has a new URL
// and any cached copy is bypassed. Without it, uploading a new logo would
// appear to do nothing until a hard refresh.
function logoUrl(settings) {
  if (!settings || !settings.logo_etag) return null;
  return '/api/branding/logo?v=' + encodeURIComponent(settings.logo_etag);
}

// The sidebar header: a logo in one of four positions, the title, or both.
// Kept as one component so the sign-in screen and the sidebar cannot drift.
function SidebarBrand({ settings, title, subtitle }) {
  const [failed, setFailed] = useState(false);
  const url = logoUrl(settings);
  const text = (
    <React.Fragment>
      <h1 style={{cursor:'default'}}>{title}</h1>
      {subtitle && <p style={{cursor:'default'}}>{subtitle}</p>}
    </React.Fragment>
  );
  // If the image 404s — removed in another tab, say — fall back to the text
  // rather than leaving a broken-image icon in the header.
  if (!url || failed) return text;

  const position = LOGO_POSITIONS.indexOf(settings.logo_position) >= 0
    ? settings.logo_position : 'left';
  // Hiding the text is only meaningful when a logo is standing in for it.
  const textHidden = !!settings.hide_app_title;
  return (
    <div className={'brand brand-' + position + (textHidden ? ' brand-only' : '')}>
      <img className="brand-logo" src={url} onError={() => setFailed(true)}
           alt={textHidden ? title : ''} />
      {!textHidden && <div className="brand-text">{text}</div>}
    </div>
  );
}

// The sign-in screen's logo. Always above the title and centered, because the
// card itself is centered — the sidebar's four positions would look arbitrary
// here. The title always stays: on a sign-in page the name of the thing you
// are signing in to is worth stating in words.
function LoginLogo({ settings }) {
  const [failed, setFailed] = useState(false);
  const url = logoUrl(settings);
  if (!url || failed) return null;
  return <img className="login-logo" src={url} alt="" onError={() => setFailed(true)} />;
}

// ===== Diagram geometry =====
// Pure functions, kept out of the component so they can be reasoned about (and
// tested) on their own. Everything here works in diagram coordinates; panning
// and zoom are applied by a transform on the group that contains it all.

const DIAGRAM_NODE_W = 200, DIAGRAM_NODE_H = 70;
const ANCHOR_SIDES = ['top', 'right', 'bottom', 'left'];
const ANCHORS_PER_SIDE = 3;

// Every connection point on a box, as {id, x, y}. Three per side: the middle
// one is where an automatic arrow lands, the outer two give parallel flows
// somewhere of their own to go.
function anchorPoints(sys, W = DIAGRAM_NODE_W, H = DIAGRAM_NODE_H) {
  const out = [];
  for (const side of ANCHOR_SIDES) {
    for (let i = 0; i < ANCHORS_PER_SIDE; i++) {
      const f = (i + 1) / (ANCHORS_PER_SIDE + 1);   // 0.25, 0.5, 0.75
      let x, y;
      if (side === 'top')         { x = sys.x_pos + W * f; y = sys.y_pos; }
      else if (side === 'bottom') { x = sys.x_pos + W * f; y = sys.y_pos + H; }
      else if (side === 'left')   { x = sys.x_pos;         y = sys.y_pos + H * f; }
      else                        { x = sys.x_pos + W;     y = sys.y_pos + H * f; }
      out.push({ id: `${side}:${i}`, side, index: i, x, y });
    }
  }
  return out;
}

function anchorPoint(sys, id, W, H) {
  return anchorPoints(sys, W, H).find(a => a.id === id) || null;
}

// Which side of the source box faces the destination. Used when an arrow has
// no anchor of its own, which is every arrow until someone drags one.
function facingSide(from, to, W = DIAGRAM_NODE_W, H = DIAGRAM_NODE_H) {
  const dx = (to.x_pos + W / 2) - (from.x_pos + W / 2);
  const dy = (to.y_pos + H / 2) - (from.y_pos + H / 2);
  // Compared against the box's own proportions so a wide box prefers its sides.
  if (Math.abs(dx) / W > Math.abs(dy) / H) return dx >= 0 ? 'right' : 'left';
  return dy >= 0 ? 'bottom' : 'top';
}

// Spread n flows across the three points on a side: one uses the middle, two
// use the outer pair, three use all of them, more start doubling up.
function spreadIndex(position, count) {
  if (count <= 1) return 1;
  if (count === 2) return position === 0 ? 0 : 2;
  return position % ANCHORS_PER_SIDE;
}

// Where each flow attaches, resolving automatic ones and fanning apart any
// group that runs between the same two systems. Returns {flow_id: {from, to}}.
function resolveEndpoints(flows, sysMap, W = DIAGRAM_NODE_W, H = DIAGRAM_NODE_H) {
  // Group by unordered pair, so A→B and B→A are spread apart together rather
  // than each independently choosing the middle point.
  const groups = {};
  flows.forEach(f => {
    const a = f.source_system_id, b = f.destination_system_id;
    const key = a < b ? `${a}|${b}` : `${b}|${a}`;
    (groups[key] = groups[key] || []).push(f);
  });

  const out = {};
  Object.values(groups).forEach(group => {
    group.forEach((f, i) => {
      const src = sysMap[f.source_system_id], dst = sysMap[f.destination_system_id];
      if (!src || !dst) return;
      const srcSide = facingSide(src, dst, W, H);
      const dstSide = facingSide(dst, src, W, H);
      const idx = spreadIndex(i, group.length);
      const from = f.source_anchor
        ? anchorPoint(src, f.source_anchor, W, H)
        : anchorPoint(src, `${srcSide}:${idx}`, W, H);
      const to = f.dest_anchor
        ? anchorPoint(dst, f.dest_anchor, W, H)
        : anchorPoint(dst, `${dstSide}:${idx}`, W, H);
      if (from && to) out[f.flow_id] = { from, to };
    });
  });
  return out;
}

function parseWaypoints(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw;
  try {
    const v = JSON.parse(raw);
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}

// The full point list for one arrow: start, any bends, end.
function flowPoints(flow, ends) {
  if (!ends) return [];
  return [ends.from, ...parseWaypoints(flow.waypoints), ends.to];
}

// --- line crossings ---------------------------------------------------------
// Where two flows cross, the one drawn later hops over the other with a small
// arc, so it reads as "passing over" rather than "joining".

function segmentIntersection(p1, p2, p3, p4) {
  const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
  if (Math.abs(d) < 1e-9) return null;              // parallel
  const t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
  const u = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
  // Excludes the very ends, so two arrows meeting at the same anchor are not
  // treated as a crossing.
  if (t <= 0.02 || t >= 0.98 || u <= 0.02 || u >= 0.98) return null;
  return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y), t };
}

// An SVG path for one arrow, arcing over each supplied crossing point.
function pathWithHops(points, hops, r = 5) {
  if (points.length < 2) return '';
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i];
    const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    const ux = (b.x - a.x) / len, uy = (b.y - a.y) / len;
    // Only the hops on this segment, in order along it.
    const on = hops
      .filter(h => h.seg === i - 1)
      .sort((p, q) => p.t - q.t);
    on.forEach(h => {
      const bx = h.x - ux * r, by = h.y - uy * r;
      const ax = h.x + ux * r, ay = h.y + uy * r;
      d += ` L ${bx.toFixed(1)} ${by.toFixed(1)}`;
      // Sweep direction is constant, so parallel hops all bow the same way.
      d += ` A ${r} ${r} 0 0 1 ${ax.toFixed(1)} ${ay.toFixed(1)}`;
    });
    d += ` L ${b.x} ${b.y}`;
  }
  return d;
}

// For every flow, the crossings it should hop over: those against flows drawn
// before it, so exactly one of each pair hops.
function computeHops(order, pointsById) {
  const hops = {};
  order.forEach((id, i) => {
    hops[id] = [];
    const mine = pointsById[id] || [];
    for (let s = 0; s + 1 < mine.length; s++) {
      for (let j = 0; j < i; j++) {
        const theirs = pointsById[order[j]] || [];
        for (let t = 0; t + 1 < theirs.length; t++) {
          const hit = segmentIntersection(mine[s], mine[s + 1], theirs[t], theirs[t + 1]);
          if (hit) hops[id].push({ ...hit, seg: s });
        }
      }
    }
  });
  return hops;
}

// What an arrow is labeled with: its short display name when one is set,
// otherwise its identifier. The identifier is unambiguous but says nothing, and
// the full name is usually a sentence — far too long to sit on a line.
function flowLabel(flow) {
  const dn = (flow.display_name || '').trim();
  return dn || flow.flow_id;
}

function labelWidth(flow) {
  // Roughly 6px per character at 10px type, with padding, so the pill fits
  // the text rather than always being sized for an identifier.
  return Math.max(44, flowLabel(flow).length * 6 + 14);
}

// The point on a path halfway along its length, for the flow's number label.
function midpointOf(points) {
  if (points.length < 2) return { x: 0, y: 0 };
  let total = 0;
  const lens = [];
  for (let i = 1; i < points.length; i++) {
    const l = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
    lens.push(l); total += l;
  }
  let want = total / 2;
  for (let i = 0; i < lens.length; i++) {
    if (want <= lens[i]) {
      const f = lens[i] ? want / lens[i] : 0;
      return { x: points[i].x + (points[i + 1].x - points[i].x) * f,
               y: points[i].y + (points[i + 1].y - points[i].y) * f };
    }
    want -= lens[i];
  }
  return points[points.length - 1];
}

// Where a flow's label sits.
//
// The midpoint is right almost everywhere, and wrong in exactly one case: a
// SHORT flow pointing UPWARD puts the label box on top of its own arrowhead,
// hiding the one thing that shows which way the data moves.
//
// The clearance is derived, not guessed. The label box is drawn 23px above its
// anchor and is 16px tall, so it occupies [anchor-23, anchor-7]. The arrowhead
// marker is 10 wide with refX 10, so it reaches 10px back from the tip — for an
// upward flow, from end.y down to end.y+10. Clearing it needs
// anchor-23 > end.y+10, so the anchor must sit at least 33px below the tip.
// 36 leaves a little air.
//
// Only upward, predominantly-vertical flows move. Everything else keeps the
// midpoint it already had, because everything else already reads correctly.
// ===== Exporting the diagram =====
// SVG rather than an image: the diagram already *is* SVG, so the export is
// nearly lossless, stays sharp at any size, and opens in Visio, Illustrator
// and PowerPoint. A PNG would have meant rasterizing at some arbitrary
// resolution and choosing wrong.
//
// Three things have to be fixed up, and all three are the difference between a
// file that opens correctly and one that looks broken:
//
//   1. **The styles are in a stylesheet, not on the elements.** Everything the
//      diagram draws is styled by class from the page's <style> block, which
//      does not travel with a copied <svg>. The rules are inlined into the
//      clone as a <style> element.
//   2. **The viewBox has to cover the whole diagram**, not the scrolled
//      viewport. Ben asked for the whole thing, and a viewport-sized export
//      would silently crop whatever was off-screen.
//   3. **The pan and zoom have to go.** They live on a transform that makes
//      sense only while someone is looking at the screen.
const EXPORT_PADDING = 40;
const EXPORT_TITLE_SPACE = 54;

// The stylesheet rules the diagram actually uses. Taken from the page's own
// <style> block rather than hand-maintained, so a color changed in one place
// does not need changing in two — the export would otherwise drift out of
// agreement with the screen and nobody would notice until they opened a file.
//
// **Which rules, decided by what is in the file rather than by a prefix list.**
// The first version matched selectors starting with a handful of guessed
// prefixes, and missed `.system-node rect { rx: 10; ry: 10 }` — the rule that
// rounds every box. Exports came out with sharp corners, which is not a
// difference anyone would think to look for in a checklist. So: collect the
// classes actually present in the clone and keep any rule that mentions one,
// plus the bare element rules, and the list maintains itself.
function diagramStyles(root) {
  const used = new Set();
  Array.prototype.slice.call(root.querySelectorAll('*')).forEach(el => {
    const cls = el.getAttribute && el.getAttribute('class');
    if (cls) String(cls).split(/\s+/).forEach(c => c && used.add(c));
  });

  const keep = (selector) => {
    const classes = selector.match(/\.[-\w]+/g);
    // No class at all: an element or universal rule such as `text { ... }`.
    // Those are cheap and cannot do harm inside a standalone SVG.
    if (!classes) return true;
    return classes.some(c => used.has(c.slice(1)));
  };

  const out = [];
  Array.prototype.slice.call(document.styleSheets).forEach(sheet => {
    let rules;
    // A stylesheet from another origin throws on access. There are none here,
    // but a browser extension can inject one.
    try { rules = sheet.cssRules; } catch (err) { return; }
    Array.prototype.slice.call(rules || []).forEach(rule => {
      if (rule.selectorText && keep(rule.selectorText)) out.push(rule.cssText);
    });
  });
  // Text does not inherit a font from nowhere once the file leaves the page.
  out.push('text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", '
           + 'Roboto, Helvetica, Arial, sans-serif; }');
  return out.join('\n');
}

// The box every system occupies, so the export can be cropped to the content
// rather than to the window.
function diagramExtent(systems, w, h, padding) {
  if (!systems.length) return { x: 0, y: 0, width: 400, height: 200 };
  const xs = systems.map(s => s.x_pos), ys = systems.map(s => s.y_pos);
  const minX = Math.min.apply(null, xs), minY = Math.min.apply(null, ys);
  const maxX = Math.max.apply(null, xs) + w, maxY = Math.max.apply(null, ys) + h;
  return {
    x: minX - padding,
    // Room above for the title, which is drawn into the export rather than
    // existing on screen.
    y: minY - padding - EXPORT_TITLE_SPACE,
    width: (maxX - minX) + padding * 2,
    height: (maxY - minY) + padding * 2 + EXPORT_TITLE_SPACE,
  };
}

// What the diagram is called, on the exported file and in the dialog's own
// title. One helper rather than two strings, so the heading someone reads in
// the dialog is the heading they get in the file.
function exportHeading(viewName) {
  return 'Lineage Diagram \u2014 ' + (viewName || 'Current Architecture');
}

// "Maine DOE Data Lineage — Current Architecture — 2026-10-29"
//
// Without an extension: the dialog shows this as the editable stem and appends
// the one belonging to whichever format is chosen, so switching from SVG to
// PNG does not leave a name ending in the wrong thing.
function exportFilename(title, scenario) {
  const today = new Date().toISOString().slice(0, 10);
  const parts = [title || 'Data Lineage', scenario || 'Current Architecture', today];
  // Keep the spaces and the dashes — this is a file a person will recognize in
  // a Downloads folder, not something a script reads. Only the characters a
  // filesystem objects to are removed.
  return parts.join(' \u2014 ').replace(/[\\/:*?"<>|]/g, '');
}

// What the browser is handed. Separated from the name so the dialog can show
// one and build the other.
//
// PDF sits in the list because that is where someone looks for it, but it is
// not a download: `print: true` sends it through the browser's print dialog,
// where "Save as PDF" is a destination. A real PDF download would mean jsPDF
// and its SVG plugin — roughly 400KB on every page load — for a button used
// rarely, and print-to-PDF is lossless vector anyway.
const EXPORT_FORMATS = [
  { id: 'svg', label: 'SVG', ext: '.svg' },
  { id: 'png', label: 'PNG', ext: '.png' },
  { id: 'jpg', label: 'JPG', ext: '.jpg' },
  { id: 'pdf', label: 'PDF', ext: '.pdf', print: true },
];

// Rasters are drawn at twice the diagram's own size: crisp on a projector and
// on a high-resolution screen, and still a sensible file size.
const EXPORT_RASTER_SCALE = 2;

// A filename is only safe once: the stem comes from a text box the user can
// type anything into, so it is cleaned again here rather than trusting what
// `exportFilename` produced earlier.
function exportDownloadName(stem, formatId) {
  const fmt = EXPORT_FORMATS.filter(f => f.id === formatId)[0] || EXPORT_FORMATS[0];
  const safe = String(stem || '').replace(/[\\/:*?"<>|]/g, '').trim();
  return (safe || 'Data Lineage') + fmt.ext;
}

// ===== Alignment guides =====
// Dragging a box compares its edges against every other box and snaps to the
// nearest match, drawing the dotted line that shows why — the behavior
// PowerPoint and every diagram tool has, and the reason you can line boxes up
// without eyeballing it.
//
// Against other boxes only. Guides to the canvas center were considered and
// dropped: on a sparse diagram the center is near everything, so the guide
// fires constantly and means nothing.
//
// Six pixels, which the caller divides by the zoom so the stickiness feels the
// same whether you are zoomed in or out — the arithmetic here is in diagram
// units, and a fixed six of those is a sixth of a centimetre at 3x and half a
// centimetre at 0.3x.
const ALIGN_TOLERANCE = 6;

// The three interesting coordinates on each axis. Center is included because
// two boxes of different widths look aligned when their centers match, not
// their left edges.
function edgesOf(pos, size) {
  return [pos, pos + size / 2, pos + size];
}

// Pure: no DOM, no React, so tools/tests/t_align.js can exercise it directly.
//
// `others` are **system rows as the API returns them**, carrying `x_pos` and
// `y_pos`. The first version read `o.x` and `o.y`, which are not properties a
// system has, so every comparison was against `undefined` and no guide ever
// appeared. The Node suite passed throughout, because its fixtures were
// written from the same wrong assumption as the code — a test built on the
// author's misunderstanding confirms the misunderstanding. Reading the real
// field names here means the fixtures have to use them too.
//
// Returns { x, y, guides }. `guides` is what to draw: for each axis that
// snapped, the coordinate and the span the dotted line should cover, which is
// the union of the dragged box and every other box sharing that coordinate —
// so the line reaches from one to the other rather than floating.
function alignSnap(x, y, w, h, others, tolerance) {
  const tol = tolerance === undefined ? ALIGN_TOLERANCE : tolerance;
  const out = { x: x, y: y, guides: [] };

  const axis = (pos, size, otherPos, otherSize) => {
    let best = null;
    const mine = edgesOf(pos, size);
    for (let i = 0; i < others.length; i++) {
      const theirs = edgesOf(otherPos(others[i]), otherSize);
      for (let a = 0; a < mine.length; a++) {
        for (let b = 0; b < theirs.length; b++) {
          const delta = theirs[b] - mine[a];
          // `<` not `<=` on the comparison keeps the FIRST of two equally
          // good candidates, which makes the result stable as the pointer
          // moves rather than flickering between two boxes at the same
          // distance.
          if (Math.abs(delta) <= tol
              && (!best || Math.abs(delta) < Math.abs(best.delta))) {
            best = { delta: delta, at: theirs[b] };
          }
        }
      }
    }
    return best;
  };

  const vx = axis(x, w, (o) => o.x_pos, w);
  if (vx) out.x = x + vx.delta;
  const vy = axis(y, h, (o) => o.y_pos, h);
  if (vy) out.y = y + vy.delta;

  // The spans are computed from the *snapped* position, so the line starts at
  // the box's final edge rather than where the pointer happened to be.
  if (vx) {
    const sharing = others.filter(o => edgesOf(o.x_pos, w).some(
      e => Math.abs(e - vx.at) < 0.5));
    const tops = sharing.map(o => o.y_pos).concat([out.y]);
    const bottoms = sharing.map(o => o.y_pos + h).concat([out.y + h]);
    out.guides.push({ orient: 'v', at: vx.at,
                      from: Math.min.apply(null, tops),
                      to: Math.max.apply(null, bottoms) });
  }
  if (vy) {
    const sharing = others.filter(o => edgesOf(o.y_pos, h).some(
      e => Math.abs(e - vy.at) < 0.5));
    const lefts = sharing.map(o => o.x_pos).concat([out.x]);
    const rights = sharing.map(o => o.x_pos + w).concat([out.x + w]);
    out.guides.push({ orient: 'h', at: vy.at,
                      from: Math.min.apply(null, lefts),
                      to: Math.max.apply(null, rights) });
  }
  return out;
}

// ===== Snapping an arrow segment to 45 degrees =====
// Measured from horizontal, not between adjacent segments. A segment within
// five degrees of horizontal, vertical or either diagonal becomes exactly
// that; anything else is left alone. Measuring between segments was the other
// option and is harder to predict while dragging, because moving one end
// changes the answer for two segments at once.
const ANGLE_SNAP_DEGREES = 45;
const ANGLE_SNAP_TOLERANCE = 5;

// Moves `point` so the segment from `anchor` to it lies on the nearest
