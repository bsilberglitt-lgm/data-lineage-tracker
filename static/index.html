// ===== Diagram geometry =====
// Pure functions, kept out of the component so they can be reasoned about (and
// tested) on their own. Everything here works in diagram coordinates; panning
// and zoom are applied by a transform on the group that contains it all.

const DIAGRAM_NODE_W = 200, DIAGRAM_NODE_H = 70;
const ANCHOR_SIDES = ['top', 'right', 'bottom', 'left'];
const ANCHORS_PER_SIDE = 3;

// Every connection point on a box, as {id, x, y}. Three per side: the middle
// one is where an automatic arrow lands, the outer two give parallel flows
// somewhere of their own to go.
function anchorPoints(sys, W = DIAGRAM_NODE_W, H = DIAGRAM_NODE_H) {
  const out = [];
  for (const side of ANCHOR_SIDES) {
    for (let i = 0; i < ANCHORS_PER_SIDE; i++) {
      const f = (i + 1) / (ANCHORS_PER_SIDE + 1);   // 0.25, 0.5, 0.75
      let x, y;
      if (side === 'top')         { x = sys.x_pos + W * f; y = sys.y_pos; }
      else if (side === 'bottom') { x = sys.x_pos + W * f; y = sys.y_pos + H; }
      else if (side === 'left')   { x = sys.x_pos;         y = sys.y_pos + H * f; }
      else                        { x = sys.x_pos + W;     y = sys.y_pos + H * f; }
      out.push({ id: `${side}:${i}`, side, index: i, x, y });
    }
  }
  return out;
}

function anchorPoint(sys, id, W, H) {
  return anchorPoints(sys, W, H).find(a => a.id === id) || null;
}

// Which side of the source box faces the destination. Used when an arrow has
// no anchor of its own, which is every arrow until someone drags one.
function facingSide(from, to, W = DIAGRAM_NODE_W, H = DIAGRAM_NODE_H) {
  const dx = (to.x_pos + W / 2) - (from.x_pos + W / 2);
  const dy = (to.y_pos + H / 2) - (from.y_pos + H / 2);
  // Compared against the box's own proportions so a wide box prefers its sides.
  if (Math.abs(dx) / W > Math.abs(dy) / H) return dx >= 0 ? 'right' : 'left';
  return dy >= 0 ? 'bottom' : 'top';
}

// Spread n flows across the three points on a side: one uses the middle, two
// use the outer pair, three use all of them, more start doubling up.
function spreadIndex(position, count) {
  if (count <= 1) return 1;
  if (count === 2) return position === 0 ? 0 : 2;
  return position % ANCHORS_PER_SIDE;
}

// Where each flow attaches, resolving automatic ones and fanning apart any
// group that runs between the same two systems. Returns {flow_id: {from, to}}.
function resolveEndpoints(flows, sysMap, W = DIAGRAM_NODE_W, H = DIAGRAM_NODE_H) {
  // Group by unordered pair, so A→B and B→A are spread apart together rather
  // than each independently choosing the middle point.
  const groups = {};
  flows.forEach(f => {
    const a = f.source_system_id, b = f.destination_system_id;
    const key = a < b ? `${a}|${b}` : `${b}|${a}`;
    (groups[key] = groups[key] || []).push(f);
  });

  const out = {};
  Object.values(groups).forEach(group => {
    group.forEach((f, i) => {
      const src = sysMap[f.source_system_id], dst = sysMap[f.destination_system_id];
      if (!src || !dst) return;
      const srcSide = facingSide(src, dst, W, H);
      const dstSide = facingSide(dst, src, W, H);
      const idx = spreadIndex(i, group.length);
      const from = f.source_anchor
        ? anchorPoint(src, f.source_anchor, W, H)
        : anchorPoint(src, `${srcSide}:${idx}`, W, H);
      const to = f.dest_anchor
        ? anchorPoint(dst, f.dest_anchor, W, H)
        : anchorPoint(dst, `${dstSide}:${idx}`, W, H);
      if (from && to) out[f.flow_id] = { from, to };
    });
  });
  return out;
}

function parseWaypoints(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw;
  try {
    const v = JSON.parse(raw);
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}

// The full point list for one arrow: start, any bends, end.
function flowPoints(flow, ends) {
  if (!ends) return [];
  return [ends.from, ...parseWaypoints(flow.waypoints), ends.to];
}

// --- line crossings ---------------------------------------------------------
// Where two flows cross, the one drawn later hops over the other with a small
// arc, so it reads as "passing over" rather than "joining".

function segmentIntersection(p1, p2, p3, p4) {
  const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
  if (Math.abs(d) < 1e-9) return null;              // parallel
  const t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
  const u = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
  // Excludes the very ends, so two arrows meeting at the same anchor are not
  // treated as a crossing.
  if (t <= 0.02 || t >= 0.98 || u <= 0.02 || u >= 0.98) return null;
  return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y), t };
}

// An SVG path for one arrow, arcing over each supplied crossing point.
function pathWithHops(points, hops, r = 5) {
  if (points.length < 2) return '';
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i];
    const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    const ux = (b.x - a.x) / len, uy = (b.y - a.y) / len;
    // Only the hops on this segment, in order along it.
    const on = hops
      .filter(h => h.seg === i - 1)
      .sort((p, q) => p.t - q.t);
    on.forEach(h => {
      const bx = h.x - ux * r, by = h.y - uy * r;
      const ax = h.x + ux * r, ay = h.y + uy * r;
      d += ` L ${bx.toFixed(1)} ${by.toFixed(1)}`;
      // Sweep direction is constant, so parallel hops all bow the same way.
      d += ` A ${r} ${r} 0 0 1 ${ax.toFixed(1)} ${ay.toFixed(1)}`;
    });
    d += ` L ${b.x} ${b.y}`;
  }
  return d;
}

// For every flow, the crossings it should hop over: those against flows drawn
// before it, so exactly one of each pair hops.
function computeHops(order, pointsById) {
  const hops = {};
  order.forEach((id, i) => {
    hops[id] = [];
    const mine = pointsById[id] || [];
    for (let s = 0; s + 1 < mine.length; s++) {
      for (let j = 0; j < i; j++) {
        const theirs = pointsById[order[j]] || [];
        for (let t = 0; t + 1 < theirs.length; t++) {
          const hit = segmentIntersection(mine[s], mine[s + 1], theirs[t], theirs[t + 1]);
          if (hit) hops[id].push({ ...hit, seg: s });
        }
      }
    }
  });
  return hops;
}

// What an arrow is labelled with: its short display name when one is set,
// otherwise its identifier. The identifier is unambiguous but says nothing, and
// the full name is usually a sentence — far too long to sit on a line.
function flowLabel(flow) {
  const dn = (flow.display_name || '').trim();
  return dn || flow.flow_id;
}

function labelWidth(flow) {
  // Roughly 6px per character at 10px type, with padding, so the pill fits
  // the text rather than always being sized for an identifier.
  return Math.max(44, flowLabel(flow).length * 6 + 14);
}

// The point on a path halfway along its length, for the flow's number label.
function midpointOf(points) {
  if (points.length < 2) return { x: 0, y: 0 };
  let total = 0;
  const lens = [];
  for (let i = 1; i < points.length; i++) {
    const l = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
    lens.push(l); total += l;
  }
  let want = total / 2;
  for (let i = 0; i < lens.length; i++) {
    if (want <= lens[i]) {
      const f = lens[i] ? want / lens[i] : 0;
      return { x: points[i].x + (points[i + 1].x - points[i].x) * f,
               y: points[i].y + (points[i + 1].y - points[i].y) * f };
    }
    want -= lens[i];
  }
  return points[points.length - 1];
}

// Where a flow's label sits.
//
// The midpoint is right almost everywhere, and wrong in exactly one case: a
// SHORT flow pointing UPWARD puts the label box on top of its own arrowhead,
// hiding the one thing that shows which way the data moves.
//
// The clearance is derived, not guessed. The label box is drawn 23px above its
// anchor and is 16px tall, so it occupies [anchor-23, anchor-7]. The arrowhead
// marker is 10 wide with refX 10, so it reaches 10px back from the tip — for an
// upward flow, from end.y down to end.y+10. Clearing it needs
// anchor-23 > end.y+10, so the anchor must sit at least 33px below the tip.
// 36 leaves a little air.
//
// Only upward, predominantly-vertical flows move. Everything else keeps the
// midpoint it already had, because everything else already reads correctly.
const LABEL_CLEARANCE = 36;

function pathLengthOf(points) {
  let total = 0;
  for (let i = 1; i < points.length; i++)
    total += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
  return total;
}

// A point `dist` back along the polyline from its final point.
function pointBackFromEnd(points, dist) {
  for (let i = points.length - 1; i > 0; i--) {
    const a = points[i], b = points[i - 1];
    const seg = Math.hypot(b.x - a.x, b.y - a.y);
    if (dist <= seg) {
      const f = seg ? dist / seg : 0;
      return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
    }
    dist -= seg;
  }
  return points[0];
}

// Below the clearance there is nowhere good to put the label at all: the gap
// between the two boxes is smaller than the box's own height, so every position
// collides with the arrowhead, a system, or both. An earlier attempt moved the
// label *below* the anchor in that range, which hid it behind the source box —
// so dragging two systems together made the name vanish abruptly instead of
// being gradually covered, which is how every other flow behaves. Falling back
// to the midpoint keeps that familiar behaviour; the arrowhead only needs
// protecting on flows long enough to read in the first place.
function labelPointOf(points) {
  if (points.length < 2) return midpointOf(points);
  const start = points[0], end = points[points.length - 1];
  const dx = end.x - start.x, dy = end.y - start.y;
  // Upward puts the arrowhead at the top; predominantly vertical means the
  // label has nowhere sideways to escape to.
  if (!(dy < 0 && Math.abs(dy) > Math.abs(dx))) return midpointOf(points);
  const total = pathLengthOf(points);
  if (total < LABEL_CLEARANCE) return midpointOf(points);
  return pointBackFromEnd(points, Math.max(total / 2, LABEL_CLEARANCE));
}

// Closest point on a polyline to (px,py), and which segment it fell on — used
// to decide where a new bend goes when someone drags the line itself.
function closestOnPath(points, px, py) {
  let best = null;
  for (let i = 0; i + 1 < points.length; i++) {
    const a = points[i], b = points[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy || 1;
    let t = ((px - a.x) * dx + (py - a.y) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const x = a.x + dx * t, y = a.y + dy * t;
    const dist = Math.hypot(px - x, py - y);
    if (!best || dist < best.dist) best = { dist, x, y, segment: i };
  }
  return best;
}

// ===== SVG Diagram =====
function DiagramCanvas({ systems, flows, selected, onSelectSystem, onSelectFlow, onUpdatePosition, onUpdateRoute, onDrill, canEdit, panelOpen, onDismissPanel, systemTypes, inScenario, zoom, setZoom }) {
  const svgRef = useRef(null);
  const dragRef = useRef(null);
  const [panOffset, setPanOffset] = useState({ x: 0, y: 0 });

  const isPanning = useRef(false);
  const panStart = useRef({ x: 0, y: 0 });
  const NODE_W = 200, NODE_H = 70, NODE_EDGE = 12;  // NODE_EDGE = draggable border band

  const handleMouseDown = useCallback((e, sys) => {
    if (sys && !canEdit) { e.stopPropagation(); return; }   // viewers cannot rearrange
    // While an arrow is being adjusted its connection points sit on the box's
    // draggable border. Allowing the box to move as well made the two
    // impossible to tell apart, so boxes are pinned until adjustment ends.
    if (sys && adjustFlowRef.current) { e.stopPropagation(); return; }
    if (sys) {
      e.stopPropagation();
      const svg = svgRef.current;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
      dragRef.current = { id: sys.system_id, offsetX: svgP.x / zoom - panOffset.x / zoom - sys.x_pos, offsetY: svgP.y / zoom - panOffset.y / zoom - sys.y_pos };
    } else {
      isPanning.current = true;
      panStart.current = { x: e.clientX - panOffset.x, y: e.clientY - panOffset.y };
    }
  }, [panOffset, zoom, canEdit]);

  const handleMouseMove = useCallback((e) => {
    if (dragRef.current) {
      const svg = svgRef.current;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
      const newX = svgP.x / zoom - panOffset.x / zoom - dragRef.current.offsetX;
      const newY = svgP.y / zoom - panOffset.y / zoom - dragRef.current.offsetY;
      onUpdatePosition(dragRef.current.id, newX, newY);
    } else if (isPanning.current) {
      setPanOffset({ x: e.clientX - panStart.current.x, y: e.clientY - panStart.current.y });
    }
  }, [onUpdatePosition, panOffset, zoom]);

  const handleMouseUp = useCallback(() => {
    if (dragRef.current) {
      const sys = systems.find(s => s.system_id === dragRef.current.id);
      if (sys) api.quiet('PUT', `/api/systems/${sys.system_id}/position`, { x_pos: sys.x_pos, y_pos: sys.y_pos });
      dragRef.current = null;
    }
    isPanning.current = false;
  }, [systems]);

  const handleWheel = useCallback((e) => {
    e.preventDefault();
    setZoom(z => Math.max(0.3, Math.min(3, z * (e.deltaY > 0 ? 0.9 : 1.1))));
  }, []);

  useEffect(() => {
    const svg = svgRef.current;
    if (svg) svg.addEventListener('wheel', handleWheel, { passive: false });
    return () => { if (svg) svg.removeEventListener('wheel', handleWheel); };
  }, [handleWheel]);

  const [showTypeKey, setShowTypeKey] = useState(false);
  const sysMap = {};
  systems.forEach(s => { sysMap[s.system_id] = s; });

  // --- routing -------------------------------------------------------------
  // routeDrag holds the in-progress gesture. It is state rather than a ref
  // because the anchor dots and the rubber-banding have to re-render as the
  // pointer moves.
  const [routeDrag, setRouteDrag] = useState(null);
  // Which arrow is being adjusted. Entered by clicking the line, left by
  // clicking away or pressing Escape. Kept separate from `selected` so that
  // opening a flow's record and rearranging its arrow are different acts.
  const [adjustFlow, setAdjustFlow] = useState(null);
  const adjustFlowRef = useRef(null);
  useEffect(() => { adjustFlowRef.current = adjustFlow; }, [adjustFlow]);

  const flowById = {};
  flows.forEach(f => { flowById[f.flow_id] = f; });
  // A stable order so "the later one hops" does not change between renders.
  const flowOrder = flows.map(f => f.flow_id).sort();
  const endpoints = resolveEndpoints(flows, sysMap, NODE_W, NODE_H);

  // While dragging, show the arrow where it *would* land rather than where it
  // is stored — otherwise the line only moves once the drag is released.
  const livePoints = (flow, ends) => {
    let from = ends.from, to = ends.to;
    let bends = parseWaypoints(flow.waypoints);
    if (routeDrag && routeDrag.flowId === flow.flow_id) {
      if (routeDrag.kind === 'end' && routeDrag.at) {
        if (routeDrag.end === 'source') from = routeDrag.at; else to = routeDrag.at;
      } else if (routeDrag.kind === 'bend' && routeDrag.at) {
        bends = bends.slice();
        if (routeDrag.index === null) bends.splice(routeDrag.insertAt, 0, routeDrag.at);
        else bends[routeDrag.index] = routeDrag.at;
      }
    }
    return [from, ...bends, to];
  };

  const pointsById = {};
  flowOrder.forEach(fid => {
    const f = flowById[fid], e = endpoints[fid];
    if (f && e) pointsById[fid] = livePoints(f, e);
  });
  const hops = computeHops(flowOrder, pointsById);

  const diagramPoint = (e) => {
    const svg = svgRef.current;
    const rect = svg.getBoundingClientRect();
    return { x: (e.clientX - rect.left - panOffset.x) / zoom,
             y: (e.clientY - rect.top - panOffset.y) / zoom };
  };

  const beginEndDrag = (e, flow, end) => {
    e.stopPropagation(); e.preventDefault();
    setRouteDrag({ kind: 'end', flowId: flow.flow_id, end, at: null, over: null });
  };

  const beginBendDrag = (e, flow, index) => {
    e.stopPropagation(); e.preventDefault();
    setRouteDrag({ kind: 'bend', flowId: flow.flow_id, index, at: null });
  };

  // Dragging the line itself inserts a new bend at the point grabbed.
  const beginBend = (e, flow, pts) => {
    e.stopPropagation(); e.preventDefault();
    const p = diagramPoint(e);
    const near = closestOnPath(pts, p.x, p.y);
    if (!near) return;
    setRouteDrag({ kind: 'bend', flowId: flow.flow_id, index: null,
                   insertAt: near.segment, at: { x: p.x, y: p.y } });
  };

  // Snap radius for a connection point, in diagram units.
  const SNAP = 26;

  const routeMove = useCallback((e) => {
    if (!routeDrag) return;
    const p = diagramPoint(e);
    if (routeDrag.kind === 'end') {
      // Find the nearest connection point on any box.
      let best = null;
      systems.forEach(sys => {
        anchorPoints(sys, NODE_W, NODE_H).forEach(a => {
          const d = Math.hypot(a.x - p.x, a.y - p.y);
          if (d < SNAP && (!best || d < best.d)) {
            best = { d, system: sys.system_id, anchor: a.id, x: a.x, y: a.y };
          }
        });
      });
      setRouteDrag(rd => ({ ...rd, at: best ? { x: best.x, y: best.y } : p,
                            over: best }));
    } else {
      setRouteDrag(rd => ({ ...rd, at: { x: p.x, y: p.y } }));
    }
  }, [routeDrag, systems, panOffset, zoom]);

  const routeUp = useCallback(() => {
    if (!routeDrag) return;
    const flow = flowById[routeDrag.flowId];
    const rd = routeDrag;
    setRouteDrag(null);
    if (!flow || !onUpdateRoute) return;

    if (rd.kind === 'end') {
      // Dropped away from any connection point: leave it as it was. A data
      // flow always joins two systems, so an end cannot float.
      if (!rd.over) return;
      const endSystem = rd.end === 'source'
        ? flow.source_system_id : flow.destination_system_id;
      // Only the shape is editable here, not which systems are connected —
      // that is a change to the record, and belongs in the details panel.
      if (rd.over.system !== endSystem) return;
      onUpdateRoute(flow.flow_id, rd.end === 'source'
        ? { source_anchor: rd.over.anchor } : { dest_anchor: rd.over.anchor });
      return;
    }

    const bends = parseWaypoints(flow.waypoints).slice();
    if (rd.index === null) {
      if (!rd.at) return;
      bends.splice(rd.insertAt, 0, rd.at);
    } else {
      // Dragged back onto the straight line between its neighbours: remove it,
      // which is how a bend is undone.
      const ends = endpoints[flow.flow_id];
      const all = [ends.from, ...bends, ends.to];
      const before = all[rd.index], after = all[rd.index + 2];
      const onLine = closestOnPath([before, after], rd.at.x, rd.at.y);
      if (onLine && onLine.dist < 8) bends.splice(rd.index, 1);
      else bends[rd.index] = rd.at;
    }
    onUpdateRoute(flow.flow_id, { waypoints: bends });
  }, [routeDrag, flowById, endpoints, onUpdateRoute]);

  // Escape leaves adjustment, and so does clicking the empty canvas.
  useEffect(() => {
    if (!adjustFlow) return;
    const onKey = (e) => { if (e.key === 'Escape') setAdjustFlow(null); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [adjustFlow]);

  useEffect(() => {
    if (!routeDrag) return;
    window.addEventListener('mousemove', routeMove);
    window.addEventListener('mouseup', routeUp);
    return () => {
      window.removeEventListener('mousemove', routeMove);
      window.removeEventListener('mouseup', routeUp);
    };
  }, [routeDrag, routeMove, routeUp]);

  return (
    <div className="canvas-container">
      {/* While a details panel is open the diagram is frozen: the next click
          anywhere closes the panel and does nothing else. Scrolling still zooms,
          so you can still look around what you are reading about. */}
      {panelOpen && <div className="diagram-freeze" onMouseDown={(e) => {
        e.preventDefault(); e.stopPropagation(); onDismissPanel();
      }} title="Click to close the details panel" />}
      <svg ref={svgRef} role="img"
           aria-label={`Data lineage diagram: ${systems.length} systems and ${flows.length} data flows.`
             + (systems.some(s=>s.change_state && s.change_state!=='unchanged') || flows.some(f=>f.change_state && f.change_state!=='unchanged')
                ? ` This is a scenario: ${systems.filter(s=>s.change_state==='proposed').length + flows.filter(f=>f.change_state==='proposed').length} proposed item(s) are drawn with a dashed outline and `
                  + `${systems.filter(s=>s.change_state==='removed').length + flows.filter(f=>f.change_state==='removed').length} item(s) being retired are faded.`
                : '')
             + ' The Systems and Data Flows tables in the sidebar list the same information.'}
           onMouseDown={(e) => { setAdjustFlow(null); handleMouseDown(e, null); }}
           onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}>
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#6b6b6b"><polygon points="0 0, 10 3.5, 0 7" /></marker>
          <marker id="arrowhead-sel" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#D4772C"><polygon points="0 0, 10 3.5, 0 7" /></marker>
        </defs>
        <g transform={`translate(${panOffset.x},${panOffset.y}) scale(${zoom})`}>
          {flowOrder.map(fid => {
            const flow = flowById[fid];
            const ends = endpoints[fid];
            if (!flow || !ends) return null;
            const isSel = selected && selected.type === 'flow' && selected.id === flow.flow_id;
            const adjusting = adjustFlow === flow.flow_id;
            const pts = livePoints(flow, ends);
            const mid = labelPointOf(pts);
            return (
              <g key={flow.flow_id}
                 className={`flow-line ${isSel?'selected':''} ${adjusting?'adjusting':''}`}
                 onMouseDown={(e)=>e.stopPropagation()}>
                <path d={pathWithHops(pts, hops[fid] || [])} fill="none"
                      stroke={adjusting ? '#2E75B6' : (isSel?'#D4772C':'#6b6b6b')}
                      strokeWidth={(isSel||adjusting)?3:2}
                      strokeDasharray={flow.change_state==='proposed' ? '7,5' : undefined}
                      opacity={flow.change_state==='removed' ? 0.45 : 1}
                      markerEnd={isSel?'url(#arrowhead-sel)':'url(#arrowhead)'} />

                {/* Clicking the LINE adjusts the arrow; clicking the label opens
                    the record. Two targets, two jobs — previously both did the
                    same thing and the adjustment handles were undiscoverable. */}
                <path d={pathWithHops(pts, [])} fill="none" stroke="transparent"
                      strokeWidth="16"
                      style={{ cursor: canEdit ? 'pointer' : 'default' }}
                      onClick={(e)=>{
                        e.stopPropagation();
                        if (!canEdit) { onSelectFlow(flow.flow_id); return; }
                        if (!adjusting) { setAdjustFlow(flow.flow_id); return; }
                        // Already adjusting: a second click on the line adds a
                        // bend where it was clicked.
                        const p = diagramPoint(e);
                        const near = closestOnPath(pts, p.x, p.y);
                        if (!near) return;
                        const bends = parseWaypoints(flow.waypoints).slice();
                        bends.splice(near.segment, 0, { x: p.x, y: p.y });
                        onUpdateRoute(flow.flow_id, { waypoints: bends });
                      }} />

                {/* The label opens the record. Sized to its text. */}
                <rect className="flow-label-hit"
                      x={mid.x - labelWidth(flow)/2} y={mid.y-23}
                      width={labelWidth(flow)} height={16}
                      rx="8" fill="#fff" fillOpacity="0.85"
                      stroke={isSel?'#D4772C':'#d7dde5'}
                      style={{ cursor: 'pointer' }}
                      onClick={(e)=>{e.stopPropagation(); onSelectFlow(flow.flow_id);}} />
                <text className="flow-label" x={mid.x} y={mid.y-12} textAnchor="middle"
                      fontSize="10" fontWeight={isSel?'700':'400'}
                      style={{ cursor: 'pointer' }}
                      onClick={(e)=>{e.stopPropagation(); onSelectFlow(flow.flow_id);}}>
                  {flowLabel(flow)}
                </text>
              </g>
            );
          })}

          {systems.map(sys => {
            const c = getColor(sys.system_type);
            const isSel = selected && selected.type === 'system' && selected.id === sys.system_id;
            return (
              <g key={sys.system_id} className={`system-node ${isSel?'selected':''}`}
                 opacity={sys.change_state==='removed' ? 0.45 : 1}
                 onDoubleClick={(e)=>{e.stopPropagation(); if(sys.schema_table_count>0 && onDrill) onDrill(sys.system_id);}}
                 transform={`translate(${sys.x_pos},${sys.y_pos})`}>
                {/* Outer band: grab here to move the node. A dashed border marks
                    something proposed — a pattern rather than a colour, so it
                    survives every form of colour blindness. */}
                <rect className={`node-frame ${canEdit ? '' : 'locked'}`}
                      width={NODE_W} height={NODE_H} fill={c.fill}
                      stroke={isSel?'#D4772C':c.stroke} strokeWidth={isSel?3:2}
                      strokeDasharray={sys.change_state==='proposed' ? '8,4' : undefined}
                      onMouseDown={(e)=>handleMouseDown(e,sys)} />
                {/* Inner area: click here to open the details panel. */}
                <rect className="node-body" x={NODE_EDGE} y={NODE_EDGE}
                      width={NODE_W-NODE_EDGE*2} height={NODE_H-NODE_EDGE*2}
                      fill={c.fill} stroke="none"
                      onMouseDown={(e)=>e.stopPropagation()}
                      onClick={(e)=>{e.stopPropagation(); onSelectSystem(sys.system_id);}} />
                <text x={NODE_W/2} y={24} textAnchor="middle" fontSize="11" fontWeight="700" fill={c.text}>{sys.name.length>28?sys.name.substring(0,26)+'...':sys.name}</text>
                <text x={NODE_W/2} y={40} textAnchor="middle" fontSize="9" fill="#6b6b6b">{sys.system_type}</text>
                <text x={NODE_W/2} y={56} textAnchor="middle" fontSize="9" fill="#aaa">{sys.system_id}</text>
                {sys.change_state==='removed' && (
                  <line x1={8} y1={NODE_H/2} x2={NODE_W-8} y2={NODE_H/2}
                        stroke={c.text} strokeWidth={1.5} />
                )}

                {sys.schema_table_count>0 ? <g style={{cursor:'pointer'}} onMouseDown={(e)=>e.stopPropagation()} onClick={(e)=>{e.stopPropagation(); onDrill && onDrill(sys.system_id);}}>
                  <rect x={6} y={NODE_H-18} width={64} height={14} rx="7" fill="#1B3A5C" />
                  <text x={38} y={NODE_H-8} textAnchor="middle" fontSize="8" fill="#fff" fontWeight="700">&#9707; SCHEMA</text>
                </g> : null}
              </g>
            );
          })}
          {/* Everything below is painted AFTER the systems on purpose. SVG has
              no z-index — document order is paint order — and an arrow's ends
              land ON a box's border, which is also the box's drag handle. Drawn
              earlier, the dots and grab handles sat underneath the boxes and
              could not be clicked at all. */}

          {/* Connection points on the two systems this arrow joins. Clicking
              one attaches that end to it. */}
          {adjustFlow && flowById[adjustFlow] && [
            flowById[adjustFlow].source_system_id,
            flowById[adjustFlow].destination_system_id,
          ].map((sysId, whichEnd) => {
            const sys = sysMap[sysId];
            if (!sys) return null;
            const end = whichEnd === 0 ? 'source' : 'dest';
            const live = endpoints[adjustFlow];
            const currentId = live && live[end === 'source' ? 'from' : 'to'].id;
            return (
              <g key={'anchors-' + end + '-' + sysId}>
                {anchorPoints(sys, NODE_W, NODE_H).map(a => {
                  const dragHot = routeDrag && routeDrag.kind === 'end'
                    && routeDrag.over && routeDrag.over.system === sysId
                    && routeDrag.over.anchor === a.id;
                  const inUse = currentId === a.id;
                  return (
                    <circle key={a.id} cx={a.x} cy={a.y} r={dragHot ? 8 : 5}
                            className={'anchor-dot' + (dragHot ? ' hot' : '')
                                       + (inUse ? ' in-use' : '')}
                            onMouseDown={(e)=>e.stopPropagation()}
                            onClick={(e)=>{
                              e.stopPropagation();
                              onUpdateRoute(adjustFlow, end === 'source'
                                ? { source_anchor: a.id } : { dest_anchor: a.id });
                            }}>
                      <title>Attach this end here</title>
                    </circle>
                  );
                })}
              </g>
            );
          })}

          {/* The grab handles, on top of the dots: they share coordinates at the
              arrow's current end, and the handle is the one you drag. */}
          {adjustFlow && flowById[adjustFlow] && endpoints[adjustFlow] && (
            <g className="route-overlay">
              <circle className="route-handle"
                      cx={endpoints[adjustFlow].from.x}
                      cy={endpoints[adjustFlow].from.y} r={6}
                      onMouseDown={(e)=>beginEndDrag(e, flowById[adjustFlow], 'source')}>
                <title>Drag to move this end to another connection point</title>
              </circle>
              <circle className="route-handle"
                      cx={endpoints[adjustFlow].to.x}
                      cy={endpoints[adjustFlow].to.y} r={6}
                      onMouseDown={(e)=>beginEndDrag(e, flowById[adjustFlow], 'dest')}>
                <title>Drag to move this end to another connection point</title>
              </circle>
              {parseWaypoints(flowById[adjustFlow].waypoints).map((w, i) => (
                <circle key={i} className="route-bend" cx={w.x} cy={w.y} r={5}
                        onMouseDown={(e)=>beginBendDrag(e, flowById[adjustFlow], i)}
                        onDoubleClick={(e)=>{
                          e.stopPropagation();
                          const bends = parseWaypoints(
                            flowById[adjustFlow].waypoints).slice();
                          bends.splice(i, 1);
                          onUpdateRoute(adjustFlow, { waypoints: bends });
                        }}>
                  <title>Drag to move this bend, or double-click to remove it</title>
                </circle>
              ))}
            </g>
          )}

        </g>
      </svg>
      <div className="legend">
        <div className="legend-title">
          System Types
          <button className="type-key-info" aria-label="What do these system types mean?"
                  title="What do these mean?" onClick={() => setShowTypeKey(true)}>&#9432;</button>
        </div>
        {/* Sorted alphabetically so the key is predictable as types are added. */}
        {[...(systemTypes || [])].sort((a, b) => a.type_name.localeCompare(b.type_name)).map(t => (
          <div key={t.type_name} className="legend-item">
            <div className="legend-color" style={{background: t.fill_color,
                 border: `2px solid ${t.stroke_color}`}}></div>{t.type_name}
          </div>
        ))}
        {/* Only shown in a scenario: on Current Architecture nothing is
            proposed or being retired, so the entries would be noise. */}
        {inScenario && (
          <React.Fragment>
            <div className="legend-title" style={{marginTop:10}}>In this scenario</div>
            <div className="legend-item">
              <div className="legend-color" style={{background:'#fff',
                   border:'2px dashed #4a5764'}}></div>Proposed &mdash; new here
            </div>
            <div className="legend-item">
              <div className="legend-color" style={{background:'#e2e6ea',
                   border:'2px solid #4a5764', opacity:0.45}}></div>Being retired
            </div>
            <div className="legend-item" style={{color:'#6b6b6b'}}>
              Hidden items are left out until you show them
            </div>
          </React.Fragment>
        )}
      </div>
      {showTypeKey && <SystemTypeKeyModal types={systemTypes}
                                          onClose={() => setShowTypeKey(false)} />}
    </div>
  );
}

// ===== Schema Drill-Down Canvas =====
const GOV_OVERRIDE_FIELDS = ['data_classification','contains_pii','ferpa_protected','data_owner_id','data_steward_id','retention_schedule','access_restrictions','legal_authority','business_meaning','notes'];
const colHasOverride = (c) => GOV_OVERRIDE_FIELDS.some(f => c[f] !== null && c[f] !== undefined && c[f] !== '');

const CARD_W = 240, HEADER_H = 34, ROW_H = 21, MAX_BODY = 220;
const cardHeight = (t) => HEADER_H + Math.min((t.columns ? t.columns.length : 0) * ROW_H, MAX_BODY);

function rectEdge(cx, cy, w, h, tx, ty) {
  const dx = tx - cx, dy = ty - cy;
  if (dx === 0 && dy === 0) return { x: cx, y: cy };
  const sx = dx === 0 ? Infinity : (w / 2) / Math.abs(dx);
  const sy = dy === 0 ? Infinity : (h / 2) / Math.abs(dy);
  const s = Math.min(sx, sy);
  return { x: cx + dx * s, y: cy + dy * s };
}

function SchemaCanvas({ tables, selected, onSelectTable, onSelectColumn, onUpdatePosition, canEdit, zoom, setZoom }) {
  const canvasRef = useRef(null);
  const dragRef = useRef(null);
  const [panOffset, setPanOffset] = useState({ x: 40, y: 20 });
  
  const isPanning = useRef(false);
  const panStart = useRef({ x: 0, y: 0 });

  const tableMap = {};
  tables.forEach(t => { tableMap[t.table_id] = t; });

  const handleHeaderDown = useCallback((e, t) => {
    e.stopPropagation();
    if (!canEdit) return;   // viewers cannot rearrange the shared layout
    dragRef.current = { id: t.table_id, mx: e.clientX, my: e.clientY, x0: t.x_pos, y0: t.y_pos, moved: false };
  }, [canEdit]);

  const handleMouseMove = useCallback((e) => {
    if (dragRef.current) {
      const d = dragRef.current;
      d.moved = true;
      onUpdatePosition(d.id, d.x0 + (e.clientX - d.mx) / zoom, d.y0 + (e.clientY - d.my) / zoom);
    } else if (isPanning.current) {
      setPanOffset({ x: e.clientX - panStart.current.x, y: e.clientY - panStart.current.y });
    }
  }, [onUpdatePosition, zoom]);

  const endDrag = useCallback(() => {
    if (dragRef.current) {
      const t = tableMap[dragRef.current.id];
      if (t && dragRef.current.moved) api.quiet('PUT', `/api/schema/tables/${t.table_id}/position`, { x_pos: t.x_pos, y_pos: t.y_pos });
      dragRef.current = null;
    }
    isPanning.current = false;
  }, [tableMap]);

  const handleBgDown = useCallback((e) => {
    isPanning.current = true;
    panStart.current = { x: e.clientX - panOffset.x, y: e.clientY - panOffset.y };
  }, [panOffset]);

  const handleWheel = useCallback((e) => {
    e.preventDefault();
    setZoom(z => Math.max(0.25, Math.min(2.5, z * (e.deltaY > 0 ? 0.9 : 1.1))));
  }, []);

  useEffect(() => {
    const el = canvasRef.current;
    if (el) el.addEventListener('wheel', handleWheel, { passive: false });
    return () => { if (el) el.removeEventListener('wheel', handleWheel); };
  }, [handleWheel]);

  // Build deduped FK links between tables
  const linkSet = {};
  tables.forEach(t => {
    (t.columns || []).forEach(c => {
      if (c.is_fk && c.fk_target_table_id && tableMap[c.fk_target_table_id] && c.fk_target_table_id !== t.table_id) {
        linkSet[`${t.table_id}->${c.fk_target_table_id}`] = { src: t.table_id, dst: c.fk_target_table_id };
      }
    });
  });
  const links = Object.values(linkSet);
  const selId = selected && selected.type === 'schema_table' ? selected.id
              : selected && selected.type === 'schema_column' ? selected.parentTableId : null;
  const connected = new Set();
  if (selId) { connected.add(selId); links.forEach(l => { if (l.src === selId) connected.add(l.dst); if (l.dst === selId) connected.add(l.src); }); }

  const transform = `translate(${panOffset.x}px,${panOffset.y}px) scale(${zoom})`;

  return (
    <div ref={canvasRef} className={`schema-canvas ${isPanning.current ? 'panning' : ''}`}
         onMouseDown={handleBgDown} onMouseMove={handleMouseMove} onMouseUp={endDrag} onMouseLeave={endDrag}>
      {tables.length === 0 && <div className="schema-empty">No schema tables defined for this system yet.</div>}
      <svg className="schema-links">
        <defs>
          <marker id="fk-arrow" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#9fb3c8"><polygon points="0 0, 9 3, 0 6" /></marker>
          <marker id="fk-arrow-hl" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#D4772C"><polygon points="0 0, 9 3, 0 6" /></marker>
        </defs>
        <g transform={`translate(${panOffset.x},${panOffset.y}) scale(${zoom})`}>
          {links.map(l => {
            const s = tableMap[l.src], d = tableMap[l.dst];
            if (!s || !d) return null;
            const sH = cardHeight(s), dH = cardHeight(d);
            const sc = { x: s.x_pos + CARD_W / 2, y: s.y_pos + sH / 2 };
            const dc = { x: d.x_pos + CARD_W / 2, y: d.y_pos + dH / 2 };
            const p1 = rectEdge(sc.x, sc.y, CARD_W, sH, dc.x, dc.y);
            const p2 = rectEdge(dc.x, dc.y, CARD_W, dH, sc.x, sc.y);
            const hl = selId && (l.src === selId || l.dst === selId);
            return <line key={`${l.src}->${l.dst}`} className={`schema-link-line ${hl ? 'hl' : ''}`}
                         x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y}
                         markerEnd={hl ? 'url(#fk-arrow-hl)' : 'url(#fk-arrow)'} />;
          })}
        </g>
      </svg>
      <div className="schema-world" style={{ transform }}>
        {tables.map(t => {
          const isSel = selId === t.table_id;
          const dim = selId && !connected.has(t.table_id);
          const colSelId = selected && selected.type === 'schema_column' ? selected.id : null;
          return (
            <div key={t.table_id} className={`schema-card ${isSel ? 'selected' : ''} ${dim ? 'dimmed' : ''}`}
                 style={{ left: t.x_pos, top: t.y_pos, width: CARD_W }}>
              <div className="schema-card-header" onMouseDown={(e) => handleHeaderDown(e, t)}
                   onClick={(e) => { e.stopPropagation(); if (!dragRef.current || !dragRef.current.moved) onSelectTable(t.table_id); }}>
                <span className="schema-card-schema">{t.schema_name}</span>
                <span className="schema-card-title">{t.table_name}</span>
              </div>
              <div className="schema-card-body">
                {(t.columns || []).map(c => (
                  <div key={c.column_id} className={`schema-col-row ${colSelId === c.column_id ? 'selected' : ''}`}
                       onMouseDown={(e) => e.stopPropagation()}
                       onClick={(e) => { e.stopPropagation(); onSelectColumn(c.column_id, t.table_id); }}>
                    <span className="schema-col-key">
                      {c.is_pk ? <span className="col-badge col-badge-pk">PK</span> : null}
                      {c.is_fk ? <span className="col-badge col-badge-fk">FK</span> : null}
                    </span>
                    <span className="schema-col-name">{c.column_name}</span>
                    {colHasOverride(c) ? <span className="gov-dot" title="Has governance override"></span> : null}
                    <span className="schema-col-type">{c.data_type}</span>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      <div className="legend">
        <div className="legend-title">Schema View</div>
        <div className="legend-item"><span className="col-badge col-badge-pk">PK</span> Primary key</div>
        <div className="legend-item"><span className="col-badge col-badge-fk">FK</span> Foreign key</div>
        <div className="legend-item"><span className="gov-dot"></span> Governance override</div>
        <div className="legend-item" style={{marginTop:4,color:'#6b6b6b'}}>Drag headers · scroll to zoom</div>
      </div>
    </div>
  );
}

// ===== Governance inheritance display helpers =====
const SRC_LABEL = { system: 'Inherited', table: 'From table', column: 'Override', none: '—' };
function fmtGov(field, v) {
  if (v === null || v === undefined || v === '') return '—';
  if (field === 'contains_pii' || field === 'ferpa_protected') return v ? 'Yes' : 'No';
  return v;
}
function GovReadField({ label, field, gov }) {
  const g = (gov && gov[field]) || { value: null, source: 'none' };
  const inherited = g.source === 'system' || g.source === 'table';
  return (
    <div className="gov-field">
      <span className="field-label">{label}</span>
      <span className={`gov-val ${inherited ? 'inherited' : ''}`}>
        {fmtGov(field, g.value)}
        <span className={`src-tag src-tag-${g.source}`}>{SRC_LABEL[g.source]}</span>
      </span>
    </div>
  );
}

// ===== Inline Edit Helpers =====
function EditField({ label, value, onChange, type, options, invalid }) {
  const bad = invalid ? ' field-error' : '';
  const note = invalid ? <div className="field-error-msg">This field is required</div> : null;
  if (type === 'textarea') return (
    <div className="edit-field-row"><span className="field-label">{label}</span>
      <div style={{flex:1}}><textarea className={'edit-textarea'+bad} value={value||''}
        aria-invalid={!!invalid} onChange={e=>onChange(e.target.value)} />{note}</div></div>
  );
  if (type === 'select') return (
    <div className="edit-field-row"><span className="field-label">{label}</span>
      <div style={{flex:1}}><select className={'edit-select'+bad} value={value||''}
        aria-invalid={!!invalid} onChange={e=>onChange(e.target.value)}>
        {options.map(o=><option key={o} value={o}>{o}</option>)}</select>{note}</div></div>
  );
  // The box used to be followed by the word "Yes" or "No" reflecting the
  // current value, which read as a choice being offered rather than a state —
  // an unticked box beside the word "No" looks like "No" is what you are about
  // to select, and ticking it made the word change, which is stranger still.
  // The field's own label is the question; the box is the answer.
  //
  // Nothing explains individual fields here on purpose: field-level definitions
  // are coming, and one mechanism for that is better than captions hard-coded
  // at each call site.
  //
  // aria-label is needed because the wrapping label has no text of its own —
  // without it the checkbox would have no accessible name at all.
  if (type === 'checkbox') return (
    <div className="edit-field-row"><span className="field-label">{label}</span>
      <div style={{flex:1}}>
        <input type="checkbox" checked={!!value} aria-label={label}
               onChange={e=>onChange(e.target.checked?1:0)} />
      </div></div>
  );
  return (
    <div className="edit-field-row"><span className="field-label">{label}</span>
      <div style={{flex:1}}><input className={'edit-input'+bad} value={value||''}
        aria-invalid={!!invalid} onChange={e=>onChange(e.target.value)} />{note}</div></div>
  );
}

function ReadField({ label, value, multiline }) {
  return <div className="field-row"><span className="field-label">{label}</span><span className={`field-value${multiline?' multiline':''}`}>{value || '—'}</span></div>;
}

function ClassificationBadge({ value }) {
  if (!value) return <span className="field-value">{'—'}</span>;
  return <span className={`badge badge-${CLASS_BADGE[value] || 'internal'}`}>{value}</span>;
}

// The same required fields the server enforces. Kept here so the panel can say
// what is missing rather than surfacing a 400 after the fact.
const PANEL_REQUIRED = {
  system: [
    { key: 'name', label: 'Name' },
    { key: 'system_type', label: 'Type' },
    { key: 'managed_by', label: 'Managed By' },
  ],
  flow: [
    { key: 'name', label: 'Name' },
    { key: 'source_system_id', label: 'Source' },
    { key: 'destination_system_id', label: 'Destination' },
    { key: 'frequency', label: 'Frequency' },
  ],
  element: [
    { key: 'name', label: 'Name' },
    { key: 'definition', label: 'Definition' },
  ],
  contributor: [
    { key: 'name', label: 'Name' },
    { key: 'organization_unit', label: 'Organization Unit' },
  ],
};

// ===== Detail Panel with Edit =====
function DetailPanel({ data, type, onClose, onSave, onDelete, onRetire, systems, onDrill, canEdit, notify, contributors, isAdmin, systemTypes, onSchemaChanged, inScenario, onSetHidden, onResetRoute }) {
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({});
  const [missing, setMissing] = useState([]);
  const [confirmDelete, setConfirmDelete] = useState(false);
  // null = no dialog; true = about to retire; false = about to bring back.
  const [confirmRetire, setConfirmRetire] = useState(null);
  const bodyRef = useRef(null);
  const isOpen = !!data;

  useEffect(() => { setEditing(false); setMissing([]); setConfirmDelete(false); }, [data, type]);

  const startEdit = () => {
    // 'proposed' is derived from change_state rather than stored separately, so
    // it has to be unpacked for the checkbox and packed again on save.
    setForm({ ...data, proposed: data.change_state === 'proposed' });
    setMissing([]); setEditing(true);
  };
  const cancelEdit = () => { setEditing(false); setMissing([]); };

  const requiredGaps = (f) => (PANEL_REQUIRED[type] || []).filter(r => {
    const v = f[r.key];
    return v === undefined || v === null || String(v).trim() === '';
  });

  const saveEdit = async () => {
    // Blocking here keeps a record from being saved without its name, which the
    // database would happily accept as an empty string.
    const gaps = requiredGaps(form);
    if (gaps.length) {
      setMissing(gaps.map(g => g.key));
      if (bodyRef.current) bodyRef.current.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    setMissing([]);
    // Only systems and flows carry a change state, and only inside a scenario.
    // Sending it on Current Architecture is refused by the server, so it is
    // left out entirely rather than sent as false.
    const proposedField = (inScenario && ['system', 'flow'].includes(type))
      ? { proposed: !!form.proposed } : {};
    let url, saveData;
    if (type === 'system') {
      url = `/api/systems/${data.system_id}`;
      saveData = {
        name: form.name, description: form.description, system_type: form.system_type,
        vendor: form.vendor, technology: form.technology, environment: form.environment,
        managed_by: form.managed_by, organization: form.organization,
        contains_pii: form.contains_pii, ferpa_protected: form.ferpa_protected,
        status: form.status, notes: form.notes,
        data_classification: form.data_classification, access_method: form.access_method,
        encryption_at_rest: form.encryption_at_rest, encryption_in_transit: form.encryption_in_transit,
        last_security_review: form.last_security_review, has_audit_trail: form.has_audit_trail,
        data_steward_id: form.data_steward_id, retention_schedule: form.retention_schedule,
        destruction_method: form.destruction_method, backup_frequency: form.backup_frequency,
        disaster_recovery: form.disaster_recovery, data_standards: form.data_standards,
        authorized_users: form.authorized_users, data_sharing_restrictions: form.data_sharing_restrictions,
        entry_type: form.entry_type, entered_by: form.entered_by,
        entry_validation: form.entry_validation,
        entry_error_correction: form.entry_error_correction,
        target_system_id: form.target_system_id,
        ...proposedField,
      };
    } else if (type === 'flow') {
      url = `/api/flows/${data.flow_id}`;
      saveData = {
        name: form.name, description: form.description,
        display_name: form.display_name,
        source_system_id: form.source_system_id, destination_system_id: form.destination_system_id,
        direction: form.direction, frequency: form.frequency,
        transfer_method: form.transfer_method, format: form.format,
        transformation_steps: form.transformation_steps, business_rules: form.business_rules,
        validations: form.validations, error_handling: form.error_handling,
        contains_pii: form.contains_pii, ferpa_protected: form.ferpa_protected,
        regulatory_driver: form.regulatory_driver, status: form.status, known_issues: form.known_issues,
        frequency_detail: form.frequency_detail, organization: form.organization,
        managed_by: form.managed_by, data_steward_id: form.data_steward_id,
        data_classification: form.data_classification, encryption_method: form.encryption_method,
        disclosure_avoidance: form.disclosure_avoidance,
        data_quality_measures: form.data_quality_measures, data_standard: form.data_standard,
        retention_at_destination: form.retention_at_destination, legal_authority: form.legal_authority,
        ...proposedField,
      };
    } else if (type === 'element') {
      url = `/api/elements/${data.element_id}`;
      saveData = {
        name: form.name, aliases: form.aliases, definition: form.definition,
        data_type: form.data_type, valid_values: form.valid_values,
        is_pii: form.is_pii, ferpa_protected: form.ferpa_protected, notes: form.notes,
        data_classification: form.data_classification, data_standard: form.data_standard,
        business_meaning: form.business_meaning,
        data_owner_id: form.data_owner_id, data_steward_id: form.data_steward_id,
      };
    } else if (type === 'contributor') {
      url = `/api/contributors/${data.contributor_id}`;
      saveData = {
        name: form.name, title: form.title, organization_unit: form.organization_unit,
        email: form.email, phone: form.phone, role_type: form.role_type,
        governance_role: form.governance_role,
        governance_responsibilities: form.governance_responsibilities,
        training_status: form.training_status, last_training_date: form.last_training_date,
        notes: form.notes,
      };
    } else if (type === 'schema_table' || type === 'schema_column') {
      url = type === 'schema_table' ? `/api/schema/tables/${data.table_id}` : `/api/schema/columns/${data.column_id}`;
      saveData = {
        data_classification: form.data_classification, contains_pii: form.contains_pii,
        ferpa_protected: form.ferpa_protected, data_owner_id: form.data_owner_id,
        data_steward_id: form.data_steward_id, retention_schedule: form.retention_schedule,
        access_restrictions: form.access_restrictions, legal_authority: form.legal_authority,
        business_meaning: form.business_meaning, notes: form.notes,
      };
    }
    try {
      const result = await api.put(url, saveData);
      setEditing(false);
      onSave(type, result);
    } catch (err) {
      if (notify) notify(err.message, true);
      else alert(err.message);
    }
  };
  const set = (k, v) => setForm(f => ({...f, [k]: v}));

  const titleOf = () => {
    if (type === 'schema_table') return `${data.schema_name}.${data.table_name}`;
    if (type === 'schema_column') return data.column_name || '';
    return data.name || '';
  };

  const ContributorReadView = ({ data }) => (<>
    <CollapsibleSection title="Contributor">
      <ReadField label="ID" value={data.contributor_id} />
      <ReadField label="Name" value={data.name} />
      <ReadField label="Title" value={data.title} />
      <ReadField label="Organization Unit" value={data.organization_unit} />
      <ReadField label="Role Type" value={data.role_type} />
      <ReadField label="Email" value={data.email} />
      <ReadField label="Phone" value={data.phone} />
    </CollapsibleSection>
    <CollapsibleSection title="Governance" domainTag="leadership">
      <ReadField label="Governance Role" value={data.governance_role} />
      <ReadField label="Responsibilities" value={data.governance_responsibilities} multiline />
      <ReadField label="Training Status" value={data.training_status} />
      <ReadField label="Last Training" value={data.last_training_date} />
    </CollapsibleSection>
    {data.notes && <CollapsibleSection title="Notes">
      <div className="field-value multiline" style={{fontSize:'13px'}}>{data.notes}</div>
    </CollapsibleSection>}
  </>);

  const ContributorEditView = ({ form, set, missing }) => (<>
    <CollapsibleSection title="Contributor">
      <EditField label="Name" value={form.name} onChange={v=>set('name',v)}
                 invalid={(missing||[]).includes('name')} />
      <EditField label="Title" value={form.title} onChange={v=>set('title',v)} />
      <EditField label="Organization Unit" value={form.organization_unit}
                 onChange={v=>set('organization_unit',v)}
                 invalid={(missing||[]).includes('organization_unit')} />
      <EditField label="Role Type" value={form.role_type} onChange={v=>set('role_type',v)} />
      <EditField label="Email" value={form.email} onChange={v=>set('email',v)} />
      <EditField label="Phone" value={form.phone} onChange={v=>set('phone',v)} />
    </CollapsibleSection>
    <CollapsibleSection title="Governance" domainTag="leadership">
      <EditField label="Governance Role" value={form.governance_role} onChange={v=>set('governance_role',v)} />
      <EditField label="Responsibilities" value={form.governance_responsibilities} onChange={v=>set('governance_responsibilities',v)} type="textarea" />
      <EditField label="Training Status" value={form.training_status} onChange={v=>set('training_status',v)} type="select" options={['','Current','Overdue','Not required']} />
      <EditField label="Last Training" value={form.last_training_date} onChange={v=>set('last_training_date',v)} />
    </CollapsibleSection>
    <CollapsibleSection title="Notes">
      <EditField label="" value={form.notes} onChange={v=>set('notes',v)} type="textarea" />
    </CollapsibleSection>
  </>);

  return (
    <div className={`detail-panel ${isOpen ? '' : 'closed'}`}>
      {isOpen && <>
        <div className="panel-header">
          <h2>{editing ? `Edit: ${titleOf()}` : titleOf()}</h2>
          <button className="panel-close" onClick={onClose} aria-label="Close">&times;</button>
        </div>
        <div className="panel-actions">
          {!editing && canEdit && <button className="btn btn-edit" onClick={startEdit}>Edit</button>}
          {!editing && canEdit && onResetRoute && type === 'flow' &&
            (data.source_anchor || data.dest_anchor || data.waypoints) && (
            <button className="btn"
                    title="Put this arrow back to automatic routing"
                    onClick={() => onResetRoute(data.flow_id)}>
              Reset arrow
            </button>)}
          {!editing && canEdit && onSetHidden && inScenario && ['system','flow'].includes(type) &&
            <button className="btn"
                    title={data.is_hidden
                      ? 'Show this again on the scenario diagram'
                      : 'Take this off the scenario diagram. Nothing is deleted.'}
                    onClick={() => onSetHidden(
                      type === 'system' ? [data.system_id] : [],
                      type === 'flow' ? [data.flow_id] : [],
                      !data.is_hidden)}>
              {data.is_hidden ? 'Show on diagram' : 'Hide from diagram'}
            </button>}
          {/* Retire sits beside Delete because the two are easily confused and
              the distinction matters: retiring says "this plan takes it out of
              service" and keeps it visible, struck through; deleting says "this
              never existed" and removes it from the picture entirely. Only
              inside a scenario, and never for something the scenario proposed —
              there is nothing to retire from. */}
          {!editing && canEdit && onRetire && inScenario && ['system','flow'].includes(type) &&
            data.change_state !== 'proposed' &&
            <Tooltip text={data.change_state === 'removed'
                      ? 'Stop marking this as retired by this plan. It goes back to being shown normally.'
                      : 'Mark this as taken out of service by this plan. It stays on the diagram, faded and struck through, so the plan shows what goes as well as what arrives. Nothing is deleted.'}>
              <button className="btn"
                      onClick={() => setConfirmRetire(data.change_state !== 'removed')}>
                {data.change_state === 'removed' ? 'Not retired after all' : 'Retire in this scenario'}
              </button>
            </Tooltip>}
          {!editing && canEdit && onDelete && ['system','flow'].includes(type) &&
            <Tooltip text={inScenario
                      ? 'Delete this from the scenario entirely, as though it had never been there. To show it being taken out of service instead, use Retire.'
                      : 'Delete this permanently.'}>
              <button className="btn btn-danger" onClick={() => setConfirmDelete(true)}>Delete</button>
            </Tooltip>}
          {!editing && !canEdit && <span style={{fontSize:'12px',color:'#6b6b6b'}}>
            Read-only — your role does not permit editing.</span>}
          {editing && <button className="btn btn-save" onClick={saveEdit}>Save Changes</button>}
          {editing && <button className="btn" onClick={cancelEdit}>Cancel</button>}
        </div>
        <div className="panel-body" ref={bodyRef}>
          {editing && missing.length > 0 && <div className="form-error-summary" role="alert">
            Please complete: {(PANEL_REQUIRED[type] || [])
              .filter(r => missing.includes(r.key)).map(r => r.label).join(', ')}.
          </div>}
          {type === 'system' && !editing && <SystemReadView data={data} onDrill={onDrill}
              contributors={contributors} canEdit={canEdit} notify={notify} isAdmin={isAdmin}
              systems={systems} onSchemaChanged={onSchemaChanged} />}
          {type === 'system' && editing && <SystemEditView form={form} set={set} inScenario={inScenario}
              contributors={contributors} systems={systems} systemTypes={systemTypes} missing={missing} />}
          {type === 'flow' && !editing && <FlowReadView data={data} contributors={contributors}
              canEdit={canEdit} notify={notify} />}
          {type === 'flow' && editing && <FlowEditView form={form} set={set} systems={systems} inScenario={inScenario}
              contributors={contributors} missing={missing} />}
          {type === 'element' && !editing && <ElementReadView data={data} />}
          {type === 'element' && editing && <ElementEditView form={form} set={set} missing={missing} />}
          {type === 'schema_table' && !editing && <SchemaTableReadView data={data} />}
          {type === 'schema_table' && editing && <SchemaGovEditView form={form} set={set} inherited={data.inherited} level="table" />}
          {type === 'schema_column' && !editing && <SchemaColumnReadView data={data} />}
          {type === 'schema_column' && editing && <SchemaGovEditView form={form} set={set} inherited={data.inherited} level="field" />}
          {type === 'contributor' && !editing && <ContributorReadView data={data} />}
          {type === 'contributor' && editing && <ContributorEditView form={form} set={set} missing={missing} />}
        </div>
      </>}
      {confirmDelete && <ConfirmDialog
        title={type === 'system' ? 'Delete this system?' : 'Delete this data flow?'}
        danger confirmLabel="Delete"
        message={`"${titleOf()}" will be permanently removed.`}
        detail={<div className="confirm-warn">
          {type === 'system'
            ? 'Any schema, attached documents and links belonging to this system go with it. A system still used by a data flow cannot be deleted.'
            : 'The links between this flow and its data elements, plus any attached documents, go with it.'}
          <div style={{marginTop:8}}>This cannot be undone from the audit log — restoring it would need a database backup.</div>
        </div>}
        onCancel={() => setConfirmDelete(false)}
        onConfirm={() => { setConfirmDelete(false); onDelete(type, data); }} />}
      {confirmRetire !== null && <ConfirmDialog
        title={confirmRetire
          ? (type === 'system' ? 'Retire this system in the scenario?'
                               : 'Retire this data flow in the scenario?')
          : 'No longer retired?'}
        confirmLabel={confirmRetire ? 'Retire it' : 'Bring it back'}
        message={confirmRetire
          ? `"${titleOf()}" will be shown as being taken out of service by this plan.`
          : `"${titleOf()}" will go back to being shown normally in this scenario.`}
        detail={<div className="gov-hint" style={{ marginTop: 8 }}>
          {confirmRetire
            ? 'It stays on the diagram, faded and struck through, so the plan shows what goes as well as what arrives. Nothing is deleted, Current Architecture is untouched, and you can undo this at any time.'
            : 'Nothing was ever deleted, so there is nothing to restore — this only changes how the scenario describes it.'}
        </div>}
        onCancel={() => setConfirmRetire(null)}
        onConfirm={() => { const r = confirmRetire; setConfirmRetire(null); onRetire(type, data, r); }} />}
    </div>
  );
}

// ===== System Views =====
function SystemReadView({ data, onDrill, contributors, canEdit, notify, isAdmin, systems, onSchemaChanged }) {
  return (<>
    {data.schema_table_count > 0 && <div className="drill-banner">

function FlowEditView({ form, set, systems, contributors, missing, inScenario }) {
  const bad = (k) => (missing || []).includes(k);
  const setEndpoint = endpointSetter(form, set, systems);
  // Only true while the name is still the one generated from the two systems.
  const nameIsGenerated = !form.name ||
    form.name === autoFlowName(systems, form.source_system_id, form.destination_system_id);
  return (<>
    <CollapsibleSection title="Flow Overview">
      {/* Source and Destination sit above the name because the name follows
          from them: while it is still the generated "A to B", changing either
          system rewrites it. Once someone types their own name it is left
          alone, however the systems change afterwards. */}
      <div className="edit-field-row"><span className="field-label">Source</span>
        <select className="edit-select" value={form.source_system_id || ''}
                onChange={e=>setEndpoint('source_system_id', e.target.value)}>
          {byName(systems).map(s => <option key={s.system_id} value={s.system_id}>{systemOption(s)}</option>)}
        </select></div>
      <div className="edit-field-row"><span className="field-label">Destination</span>
        <select className="edit-select" value={form.destination_system_id || ''}
                onChange={e=>setEndpoint('destination_system_id', e.target.value)}>
          {byName(systems).map(s => <option key={s.system_id} value={s.system_id}>{systemOption(s)}</option>)}
        </select></div>
      <div className="edit-field-row"><span className="field-label">Name</span>
        <div style={{flex:1}}>
          <input className={'edit-input' + (bad('name') ? ' field-error' : '')}
                 value={form.name || ''} aria-invalid={bad('name')}
                 onChange={e=>set('name', e.target.value)} />
          {bad('name') && <div className="field-error-msg">This field is required</div>}
          {nameIsGenerated && form.name && !bad('name') &&
            <div className="gov-hint">Follows the two systems above until you change it.</div>}

      {/* Short label for the diagram. The full name is usually a sentence and
          would cover the picture, so this is separate rather than derived. */}
      <div className="edit-field-row"><span className="field-label">Display Name</span>
        <div style={{flex:1}}>
          <input className="edit-input" value={form.display_name || ''} maxLength={20}
                 placeholder="Optional — shown on the diagram instead of the ID"
                 onChange={e=>set('display_name', e.target.value)} />

      <EditField label="Format" value={form.format} onChange={v=>set('format',v)} invalid={bad('format')} />

// ===== Schema Table / Column Governance Panels =====
function GovEditField({ field, label, form, set, inherited, type, options }) {
  const inh = (inherited && inherited[field]) || { value: null, source: 'none' };
  const hasInh = inh.value !== null && inh.value !== undefined && inh.value !== '';
  const raw = form[field];
  let control;
  if (type === 'tri') {
    const val = (raw === null || raw === undefined || raw === '') ? '' : String(raw);
    control = <select className="edit-select" value={val} onChange={e => { const v = e.target.value; set(field, v === '' ? null : Number(v)); }}>
      <option value="">(inherit)</option><option value="1">Yes</option><option value="0">No</option></select>;
  } else if (type === 'select') {
    control = <select className="edit-select" value={raw || ''} onChange={e => set(field, e.target.value)}>
      <option value="">(inherit)</option>{options.map(o => <option key={o} value={o}>{o}</option>)}</select>;
  } else if (type === 'textarea') {
    control = <textarea className="edit-textarea" value={raw || ''} placeholder="(inherit / none)" onChange={e => set(field, e.target.value)} />;
  } else {
    control = <input className="edit-input" value={raw || ''} placeholder="(inherit)" onChange={e => set(field, e.target.value)} />;
  }
  return (
    <div style={{ marginBottom: 10 }}>
      <div className="edit-field-row" style={{ marginBottom: 2 }}><span className="field-label">{label}</span>{control}</div>
      <div className="gov-hint" style={{ marginLeft: 140 }}>{hasInh ? `Inherits: ${fmtGov(field, inh.value)} (${SRC_LABEL[inh.source]})` : 'No inherited value'}</div>
    </div>
  );
}

// ===== Table Views =====
// Multi-select hiding. Only offered inside a scenario, where hiding means
// "not part of what I am planning" — on Current Architecture there is nothing
// to tidy away, and a hidden live record would just be a record people cannot
// find. Selection lives here rather than in App because it is scratch state:
// switching view or reloading should forget it.
function useHideSelection(rows, idKey) {
  const [picked, setPicked] = useState([]);
  const present = new Set((rows || []).map(r => r[idKey]));
  const valid = picked.filter(id => present.has(id));
  const toggle = (id) => setPicked(p =>
    p.includes(id) ? p.filter(x => x !== id) : p.concat([id]));
  const clear = () => setPicked([]);
  const all = () => setPicked((rows || []).map(r => r[idKey]));
  return { picked: valid, toggle, clear, all,
           allPicked: valid.length > 0 && valid.length === (rows || []).length };
}

// ===== Required-field validation =====
// The Save button stays enabled; pressing it surfaces what's missing rather
// than leaving the user guessing why a greyed-out button won't respond.
function useRequired(fields, scrollRef) {
  const [touched, setTouched] = useState(false);
  // Required fields are often below the fold, so a failed save must bring the
  // message into view — otherwise pressing Save looks like it did nothing.
  const revealErrors = () => {
    // The element holding the fields is not always the one that scrolls: in the
    // Add modals the scroll container is the modal itself, so scrolling the
    // body did nothing and pressing Save looked like it was ignored. Walk up
    // until something can actually move.
    let el = scrollRef && scrollRef.current;
    while (el && el.scrollHeight <= el.clientHeight + 1) el = el.parentElement;
    if (!el) el = scrollRef && scrollRef.current;
    if (!el) return;
    if (typeof el.scrollTo === 'function') el.scrollTo({ top: 0, behavior: 'smooth' });
    else el.scrollTop = 0;
  };
  const missing = (form) => fields.filter(f => {
    const v = form[f.key];
    return v === undefined || v === null || String(v).trim() === '';
  });
  return {
    touched, setTouched,
    missing,
    attempt: (form, onValid) => {
      const gaps = missing(form);
      if (gaps.length) { setTouched(true); revealErrors(); return gaps; }
      setTouched(false);
      onValid();
      return [];
    },
    errorFor: (form, key) => touched &&
      missing(form).some(f => f.key === key) ? 'This field is required' : null,
    summary: (form) => {
      if (!touched) return null;
      const gaps = missing(form);
      if (!gaps.length) return null;
      return `Please complete: ${gaps.map(g => g.label).join(', ')}.`;
    },
  };
}

// A labelled input that shows its own required-field error.

                  aria-invalid={!!error} aria-describedby={error ? id + '-err' : undefined}>
            <option value="">Select…</option>
            {(options || []).map(o =>
              <option key={typeof o === 'string' ? o : o.value}
                      value={typeof o === 'string' ? o : o.value}>
                {typeof o === 'string' ? o : o.label}</option>)}
          </select>
        : type === 'textarea'
        ? <textarea id={id} className={cls} value={value || ''} placeholder={placeholder}
                    onChange={e => onChange(e.target.value)} aria-invalid={!!error}
                    aria-describedby={error ? id + '-err' : undefined} />
        : <input id={id} className={cls} value={value || ''} placeholder={placeholder}
                 onChange={e => onChange(e.target.value)} aria-invalid={!!error}
                 aria-describedby={error ? id + '-err' : undefined} />}

  );
}

// ===== Minimal markdown =====
// Release notes support a deliberately small subset: headings, bullets, bold,
// italic and links. Input is escaped first, so notes can never inject markup.
function renderMarkdown(text) {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = (s) => esc(s)
    // Images, before links, since ![alt](src) also matches the link pattern.
    // Only local files under /help/ are allowed — that is where the static
    // handler serves static/help/ from. Release notes are editable inside the
    // app, and permitting a remote image would let another server see who read
    // them and when.
    .replace(/!\[([^\]]*)\]\((\/help\/[A-Za-z0-9._-]+)\)/g,
             '<img src="$2" alt="$1" class="md-img" loading="lazy" />')
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, '')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
             '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');

  // Blocks are separated by blank lines, not by line endings. Source text is
  // hard-wrapped for readability, so treating every line as its own paragraph
  // broke sentences apart and stranded the last word on its own line.
  const out = [];
  let list = null;      // accumulated <li> html
  let item = null;      // the current list item's text, still being collected
  let para = null;      // the current paragraph's text, still being collected

  const closeItem = () => {
    if (item !== null) { list.push(`<li>${inline(item)}</li>`); item = null; }
  };
  const closeList = () => {
    closeItem();
    if (list && list.length) out.push(`<ul>${list.join('')}</ul>`);
    list = null;
  };
  const closePara = () => {
    if (para !== null) { out.push(`<p>${inline(para)}</p>`); para = null; }
  };

  (text || '').split('\n').forEach(raw => {
    const line = raw.replace(/\s+$/, '');
    const bullet = line.match(/^\s*[-*]\s+(.*)$/);
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    const indented = /^\s+\S/.test(line);

    if (!line.trim()) { closeList(); closePara(); return; }

    if (heading) { closeList(); closePara(); out.push(`<h2>${inline(heading[2])}</h2>`); return; }

    if (bullet) {
      closePara();
      if (!list) list = [];
      closeItem();
      item = bullet[1];
      return;
    }

    // An indented line under a bullet continues that bullet.
    if (item !== null && indented) { item += ' ' + line.trim(); return; }

    closeList();
    para = para === null ? line.trim() : para + ' ' + line.trim();
  });

  closeList();
  closePara();
  return out.join('');
}

// ===== Help / knowledge base =====
// A panel that slides up from the bottom, so it can sit over whatever you were
// looking at without navigating away — the question is nearly always about the
// screen you are on.
function HelpPanel({ screen, onClose, notify }) {
  const [data, setData] = useState({ for_this_screen: [], articles: [] });
  const [query, setQuery] = useState('');
  const [openId, setOpenId] = useState(null);
  const [loading, setLoading] = useState(true);
  const searchRef = useRef(null);
  const bodyRef = useRef(null);

  useEffect(() => {
    setLoading(true);
    api.get(`/api/help?screen=${encodeURIComponent(screen || '')}`)
      .then(setData)
      .catch(e => notify(e.message, true))
      .finally(() => setLoading(false));
  }, [screen, notify]);

  // Escape closes the panel, and closes an open article first, so it never
  // takes two guesses to get back to where you were.
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== 'Escape') return;
      if (openId) setOpenId(null); else onClose();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [openId, onClose]);

  useEffect(() => { if (searchRef.current) searchRef.current.focus(); }, []);
  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = 0; }, [openId]);

  const q = query.trim().toLowerCase();
  const matches = !q ? [] : data.articles.filter(a =>
    a.title.toLowerCase().includes(q) ||
    a.summary.toLowerCase().includes(q) ||
    (a.body || '').toLowerCase().includes(q));

  const open = data.articles.find(a => a.id === openId);
  const relevantIds = new Set((data.for_this_screen || []).map(a => a.id));
  const pinnedIds = new Set((data.pinned || []).map(a => a.id));

  // A short piece of the article around the first match, so a search result
  // shows why it matched rather than just repeating the summary.
  const snippet = (a) => {
    const body = (a.body || '').replace(/[#*`>]/g, ' ').replace(/\s+/g, ' ');
    const at = body.toLowerCase().indexOf(q);
    if (at < 0) return a.summary;
    const from = Math.max(0, at - 60);
    return (from > 0 ? '…' : '') + body.slice(from, at + 140).trim() + '…';
  };

  const Item = ({ a }) => (
    <button className="help-item" onClick={() => setOpenId(a.id)}>
      <div className="help-item-title">{a.title}</div>
      <div className="help-item-summary">{q ? snippet(a) : a.summary}</div>
    </button>
  );

  return (
    <div className="help-sheet" role="dialog" aria-modal="false"
         aria-labelledby="help-title">
      <div className="help-header">
        <span id="help-title">{open ? open.title : 'Help'}</span>
        {open && (
          <button className="btn" onClick={() => setOpenId(null)}>
            &larr; All articles
          </button>
        )}
        <span style={{ flex: 1 }} />
        <button className="panel-close" onClick={onClose} aria-label="Close help">
          &times;
        </button>
      </div>

      {!open && (
        <div className="help-search">
          <label htmlFor="help-q" className="sr-only">Search help articles</label>
          <input id="help-q" ref={searchRef} type="text" value={query}
                 placeholder="Search help…" autoComplete="off"
                 onChange={e => setQuery(e.target.value)} />
        </div>
      )}

      <div className="help-body" ref={bodyRef}>
        {loading && <div className="help-empty">Loading…</div>}

        {!loading && open && (
          <div className="md" dangerouslySetInnerHTML={{ __html: renderMarkdown(open.body) }} />
        )}

        {!loading && !open && q && (
          <React.Fragment>
            <div className="help-section">
              {matches.length} {matches.length === 1 ? 'result' : 'results'}
            </div>
            {matches.map(a => <Item key={a.id} a={a} />)}
            {matches.length === 0 && (
              <div className="help-empty">
                Nothing matched “{query}”. Try a word that would appear in the
                app itself — “scenario”, “governance”, “schema”.
              </div>
            )}
          </React.Fragment>
        )}

        {!loading && !open && !q && (
          <React.Fragment>
            {/* Pinned articles sit above everything with no heading of their
                own — an introduction does not belong under "For this screen",
                but it should still be the first thing anyone sees. */}
            {data.articles.filter(a => pinnedIds.has(a.id))
              .map(a => <Item key={a.id} a={a} />)}
            {relevantIds.size > 0 && (
              <React.Fragment>
                <div className="help-section">For this screen</div>
                {data.articles.filter(a => relevantIds.has(a.id))
                  .map(a => <Item key={a.id} a={a} />)}
                <div className="help-section">Everything else</div>
              </React.Fragment>
            )}
            {data.articles.filter(a => !relevantIds.has(a.id) && !pinnedIds.has(a.id))
              .map(a => <Item key={a.id} a={a} />)}
          </React.Fragment>
        )}
      </div>
    </div>
  );
}
