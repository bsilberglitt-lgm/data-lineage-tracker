// multiple of 45 degrees, keeping the segment's length. Returns the point
// unchanged when nothing is close enough, so a deliberate 47-degree line
// survives — and the caller skips this entirely while Shift is held.
//
// On its own this is not enough to draw a right angle, which is what
// `snapBend` below exists to fix.
function snapAngle(anchor, point, tolerance) {
  const tol = tolerance === undefined ? ANGLE_SNAP_TOLERANCE : tolerance;
  const dx = point.x - anchor.x, dy = point.y - anchor.y;
  const length = Math.sqrt(dx * dx + dy * dy);
  // Nothing to rotate, and dividing by zero below.
  if (length < 0.001) return point;

  const degrees = Math.atan2(dy, dx) * 180 / Math.PI;
  const nearest = Math.round(degrees / ANGLE_SNAP_DEGREES) * ANGLE_SNAP_DEGREES;
  // The difference has to be measured the short way round: -179 and 179 are
  // two degrees apart, not 358.
  let off = degrees - nearest;
  while (off > 180) off -= 360;
  while (off < -180) off += 360;
  if (Math.abs(off) > tol) return point;

  const radians = nearest * Math.PI / 180;
  return { x: anchor.x + Math.cos(radians) * length,
           y: anchor.y + Math.sin(radians) * length };
}

// How close a bend has to be to a neighbor's axis before it lines up exactly.
// In diagram units, divided by the zoom at the call site like the box guides.
const BEND_AXIS_TOLERANCE = 8;

// Where a dragged bend should actually go.
//
// Rotating the incoming segment onto the nearest 45 degrees — `snapAngle`
// alone — makes a diagonal look deliberate, which is why that part felt right
// immediately. It cannot produce a **right angle**, because a square corner is
// a property of *two* segments and only the incoming one was being adjusted:
// the outgoing segment kept whatever angle the destination happened to impose,
// so the corner never squared up however carefully you dragged. That is the
// "45 works, 90 does nothing" Ben reported.
//
// So: line the point up with either neighbor's x or y when it is close. That
// is exact, it makes both segments axis-aligned, and it is how every diagram
// tool behaves. Angle snapping stays as the fallback for everything that is
// not near an axis, which is what keeps diagonals feeling the way they do.
function snapBend(point, prev, next, axisTolerance, degreeTolerance) {
  const tol = axisTolerance === undefined ? BEND_AXIS_TOLERANCE : axisTolerance;
  const out = { x: point.x, y: point.y };
  let lockedX = false, lockedY = false;

  // Nearer neighbor first, so when both are in range the closer one decides.
  const neighbors = [prev, next].filter(Boolean).slice().sort((a, b) =>
    (Math.abs(a.x - point.x) + Math.abs(a.y - point.y))
    - (Math.abs(b.x - point.x) + Math.abs(b.y - point.y)));

  neighbors.forEach(n => {
    if (!lockedX && Math.abs(n.x - point.x) <= tol) { out.x = n.x; lockedX = true; }
    if (!lockedY && Math.abs(n.y - point.y) <= tol) { out.y = n.y; lockedY = true; }
  });

  // Both axes locked to the same neighbor would collapse the segment to
  // nothing, which is not a bend at all. Keep the nearer axis and let the
  // other float.
  if (lockedX && lockedY && prev && out.x === prev.x && out.y === prev.y) {
    if (Math.abs(prev.x - point.x) <= Math.abs(prev.y - point.y)) out.y = point.y;
    else out.x = point.x;
  }

  if (lockedX || lockedY) return out;
  return prev ? snapAngle(prev, point, degreeTolerance) : point;
}

const LABEL_CLEARANCE = 36;

function pathLengthOf(points) {
  let total = 0;
  for (let i = 1; i < points.length; i++)
    total += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
  return total;
}

// A point `dist` back along the polyline from its final point.
function pointBackFromEnd(points, dist) {
  for (let i = points.length - 1; i > 0; i--) {
    const a = points[i], b = points[i - 1];
    const seg = Math.hypot(b.x - a.x, b.y - a.y);
    if (dist <= seg) {
      const f = seg ? dist / seg : 0;
      return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
    }
    dist -= seg;
  }
  return points[0];
}

// Below the clearance there is nowhere good to put the label at all: the gap
// between the two boxes is smaller than the box's own height, so every position
// collides with the arrowhead, a system, or both. An earlier attempt moved the
// label *below* the anchor in that range, which hid it behind the source box —
// so dragging two systems together made the name vanish abruptly instead of
// being gradually covered, which is how every other flow behaves. Falling back
// to the midpoint keeps that familiar behavior; the arrowhead only needs
// protecting on flows long enough to read in the first place.
function labelPointOf(points) {
  if (points.length < 2) return midpointOf(points);
  const start = points[0], end = points[points.length - 1];
  const dx = end.x - start.x, dy = end.y - start.y;
  // Upward puts the arrowhead at the top; predominantly vertical means the
  // label has nowhere sideways to escape to.
  if (!(dy < 0 && Math.abs(dy) > Math.abs(dx))) return midpointOf(points);
  const total = pathLengthOf(points);
  if (total < LABEL_CLEARANCE) return midpointOf(points);
  return pointBackFromEnd(points, Math.max(total / 2, LABEL_CLEARANCE));
}

// ===== What a task's circle says about where it stands =====
// Status color coding. Five states, in strict precedence. The order is the
// whole design, so it is written out rather than left to a chain of
// conditionals to imply:
//
//   1. **complete** — the status says completed. It wins over every date: a
//      task finished after its end date is finished, not late. Coloring it
//      red teaches people to ignore red.
//   2. **overdue** — an expected end has passed with nothing saying the work
//      is done. A fact about the record, not a guess.
//   3. **active** — the status says in progress. Ahead of the start-date rule
//      below, because a task that has begun cannot also be failing to begin.
//   4. **late_start** — an expected start has passed and the thing has not
//      begun. "Not begun" includes a status nobody has set: see below.
//   5. **open** — everything else. The plain gray circle, and the only state
//      with no mark inside it, so an absence of information is shown as an
//      absence — the same way the catalog shows a dash.
//
// **A subtask's dates count, not just the task's own.** This is the bug Ben
// found: a subtask set to In progress with an end date of yesterday left the
// circle yellow, because rules 2 and 4 read only `task.expected_end` and
// `task.expected_start`. A task with subtasks already does not own its
// *status* — `derived_task_status` computes it from them — and it was
// inconsistent for the dates to work the other way, since the subtask dates
// are exactly where the slippage shows up first. So both date rules ask the
// task **and** its subtasks, and each date is judged against the status that
// owns it: a subtask past its end date only counts if that subtask is not
// completed, and a subtask past its start date only counts if that subtask
// has not begun.
//
// **An unset status past its start date reads as late.** Ben asked for this
// explicitly, and it reverses the call made when the feature was first built.
// The argument then was that "nobody has assessed this" and "somebody said it
// has not started" are different facts — the point of migration 0019 — and
// only the second can be late. That distinction is real and it is still drawn
// everywhere it is about *reporting* a status: the catalog shows a dash, the
// hover card leaves the parentheses out, and the derivation ignores unset
// subtasks. It is the wrong distinction for a **date** rule, because what the
// start date tells you does not depend on whether anyone filled the field in:
// the day came and went and nothing here says the work began. Treating that
// as "nothing to see" hides the slippage precisely where nobody is paying
// attention, which is where it matters most.
//
// Dates are 'YYYY-MM-DD' throughout, so a string comparison is the date
// comparison and no parsing is needed — the same reason `type="date"` is used
// for the inputs.
//
// **The color is never the only cue.** Each state but `open` draws a mark in
// the ring, because the five fills cannot be told apart by hue: active yellow
// and late_start orange are 15 degrees apart, which is no distinction for
// anyone with a color deficiency, and WCAG 1.4.1 asks that color not be the
// sole carrier. The marks are drawn in the same #1B3A5C as the ring, at worst
// 6.54:1 against these fills, so they clear AA as text as well as the 3:1
// WCAG 1.4.11 wants of a non-text indicator.
//
// **The ring itself does not change color.** It is what delineates the shape
// against the eight system fills a circle may sit on (8.69:1 against the worst
// of them), and recoloring it per status would put that measurement back in
// play five times over. The status goes in the fill, where the only contrast
// that has to hold is against the ring and the mark.
const TASK_SIGNALS = [
  { key: 'complete',   label: 'Completed',          fill: '#b2dcb6' },
  { key: 'overdue',    label: 'Past its end date',  fill: '#f2b3ab' },
  { key: 'blocked',    label: 'Blocked \u2014 waiting on another task', fill: '#e8938a' },
  { key: 'active',     label: 'In progress',        fill: '#f6e08f' },
  { key: 'late_start', label: 'Not started, past its start date', fill: '#f8c489' },
  // Two resting states. `automated` is not a stage of the work — it is a fact
  // about who does it — so it stands in for `open` rather than competing with
  // the stages: a task that is late is drawn late whether or not a machine
  // runs it, because that is the thing needing attention. The blue shows up
  // exactly where there is nothing else to report, which is most of the time,
  // and that is what makes "which of these need a person" readable at a
  // glance.
  { key: 'automated',  label: 'Automated \u2014 nothing recorded yet', fill: '#93bde4' },
  { key: 'open',       label: 'Nothing recorded yet', fill: '#dfe3e8' },
];

// The two states that mean "nothing to report". Named once because three
// different places ask the question and a list written out at each would
// drift the first time a state is added.
const TASK_RESTING = ['open', 'automated'];

const TASK_SIGNAL_BY_KEY = TASK_SIGNALS.reduce(
  (m, s) => { m[s.key] = s; return m; }, {});

// Declared with `function` rather than as a `const` arrow so the Node suite can
// reach them: a `const` does not escape an `eval`, which CLAUDE.md records the
// hard way.

// Has this piece of work not begun? True for a status nobody has set as well
// as for an explicit "not started" — see the long note above on why a date
// rule reads an absent status differently from a report of one.
function taskNotBegun(status) {
  return status !== 'in_progress' && status !== 'completed';
}

// Have all of this task's dependencies finished? `false` when it has none,
// because "nothing is holding this up" and "everything that was holding it up
// is done" are different facts and only the second should start the clock.
// Callers that care about the difference ask `(task.dependencies || []).length`
// as well, which is why this does not try to answer both questions at once.
function taskDepsComplete(task) {
  const deps = (task && task.dependencies) || [];
  return deps.length > 0 && deps.every(d => d.status === 'completed');
}

// Did `late_start` come from the dependencies rather than from a date?
//
// Exact rather than a guess: `startPassed` requires a start date to exist, so
// a `late_start` on a task with no start date anywhere can only have come from
// the dateless-dependency clause below. Nothing else reaches it.
function taskLateFromDeps(task) {
  if (!task) return false;
  const steps = task.steps || [];
  const anyStartSet = !!task.expected_start || steps.some(x => x.expected_start);
  return !anyStartSet && taskDepsComplete(task);
}

// The wording for a state, which is not always the state's own label.
//
// Ben: a task with no start date whose dependencies have all finished should
// read "Not started, dependencies completed" rather than "past its start
// date", because it has no start date to be past. The color and the mark are
// the same — it is the same state, reached a different way — and only the
// sentence changes, so this is a labeling function rather than a sixth signal.
// A state whose own label contradicts the record is worse than a vague one:
// somebody reads "past its start date", opens the task, finds the field empty,
// and stops trusting the circle.
const LATE_START_FROM_DEPS = 'Not started, dependencies completed';

function taskSignalLabel(task, today) {
  const sg = taskSignal(task, today);
  if (sg === 'late_start' && taskLateFromDeps(task)) return LATE_START_FROM_DEPS;
  return TASK_SIGNAL_BY_KEY[sg].label;
}

function taskSignal(task, today) {
  if (!task) return 'open';
  const st = task.status || null;
  const steps = task.steps || [];

  if (st === 'completed') return 'complete';

  // Any end date that has passed with the work not done — the task's own, or
  // a subtask's.
  const endPassed = (end, status) =>
    !!(end && today && end < today && status !== 'completed');
  if (endPassed(task.expected_end, st)) return 'overdue';
  if (steps.some(x => endPassed(x.expected_end, x.status))) return 'overdue';

  // The subtask clause is belt and braces. `task_rows` derives the status from
  // the subtasks on read, so a task with one in progress arrives with
  // `status: 'in_progress'` already — but asking the subtasks directly means
  // this function does not depend on the server having got that right, and the
  // two cannot disagree about the color. A test fixture that omitted the
  // derived status is what exposed the dependency.
  if (st === 'in_progress') return 'active';
  if (steps.some(x => x.status === 'in_progress')) return 'active';

  const startPassed = (start, status) =>
    !!(start && today && start < today && taskNotBegun(status));
  const anyStartPassed = startPassed(task.expected_start, st)
    || steps.some(x => startPassed(x.expected_start, x.status));
  const anyStartSet = !!task.expected_start || steps.some(x => x.expected_start);
  const deps = task.dependencies || [];
  const depsDone = taskDepsComplete(task);

  // **Blocked: a start date has passed and something it waits on has not
  // finished.** Ben's refinement, and it is better than the rule we started
  // from. The first draft had the start date *override* the dependencies;
  // this makes the start date the thing that gives them teeth. Before the
  // date there is nothing to report — waiting is simply what the plan says
  // should be happening. After it, waiting is the reason the work has not
  // begun, and that is worth a color.
  if (anyStartPassed && deps.length && !depsDone) return 'blocked';

  // Past a start date and not blocked: the ordinary late start.
  if (anyStartPassed) return 'late_start';

  // **No date anywhere, and everything it waits on is done.** The dependencies
  // stand in for a start date that nobody set: the moment the last one
  // finishes, this task could have begun. Only when NO start date exists at
  // the task or on any subtask — with one, the date is the statement of
  // intent and this would be second-guessing it.
  if (!anyStartSet && depsDone) return 'late_start';

  return task.is_automated ? 'automated' : 'open';
}

// Whether anybody is using statuses or dates on these tasks. Drives how much
// of the key the legend shows: the five-state color key is only worth its
// complexity once something is actually color-coded, and until then a single
// gray circle labeled "Task" says everything true about the diagram.
//
// Asked as "is any circle not gray" rather than "has anyone set a status",
// because the two date-driven states color a circle without anyone having
// touched a status field, and a legend that omitted them would leave an
// orange circle unexplained.
function tasksUseSignals(tasks, today) {
  return (tasks || []).some(
    t => TASK_RESTING.indexOf(taskSignal(t, today)) < 0);
}

// Whether anything on this diagram is automated. Asked separately from the
// above because the two legends answer different questions: one is "is the
// status coding in use", the other is "is the automated/manual distinction
// in use". A diagram of nothing but automated tasks with no statuses needs
// the blue explained and nothing else.
function tasksUseAutomated(tasks) {
  return (tasks || []).some(t => t && t.is_automated);
}

// Today as the same 'YYYY-MM-DD' the dates are stored in, in the **viewer's**
// own timezone rather than UTC. `toISOString()` is UTC, so for anyone west of
// Greenwich it reports tomorrow's date for part of every evening — which would
// turn a task due today red several hours early.
function todayISO() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// ===== Where a task's circle sits =====
// Pure functions: numbers in, numbers out, no DOM and no React. That is the
// only reason `tools/tests/t_taskpos.js` can exercise them — there is no
// browser in the assistant's sandbox, so placement logic that reached into the
// DOM would be placement nobody could check until Ben clicked on it.
//
// **A task stores `pos_main` / `pos_cross`, and what they mean depends on the
// parent** (see migration 0016). On a flow, `pos_main` is a fraction 0..1
// along the path and `pos_cross` a perpendicular offset in diagram units; on a
// system, both are offsets from the box's own origin. Storing absolute
// coordinates would strand every circle in open space the first time somebody
// moved a system or rerouted an arrow.
const TASK_R = 11;                 // circle radius, in diagram units
const TASK_SLOT = TASK_R * 2 + 6;  // center-to-center spacing between circles
// How far along a flow the first circle sits, and how far it steps when that
// spot is taken. 0.5 is the midpoint.
const TASK_FLOW_STEP = 0.12;
// **A circle on a flow sits ON the line, always.** `pos_cross` is kept in the
// schema but is forced to zero for a flow, so the only thing a drag can change
// is how far along the line the circle sits.
//
// It was a free perpendicular offset first, clamped to a distance after Ben
// could drag a circle anywhere. Clamping was not enough: where two flows run
// close together, a circle a little off one line is ambiguous between them,
// and the one thing the circle has to communicate is which flow it belongs
// to. Centered on the path there is nothing to misread. It also removes a
// degree of freedom nobody needed — dragging up and down the line is the whole
// gesture.
const TASK_FLOW_OFFSET = 0;

// The point a fraction of the way along a polyline, with the unit tangent and
// normal there. One traversal, because every caller wants all three.
function pointAlong(points, t) {
  if (!points || points.length < 2) return { x: 0, y: 0, tx: 1, ty: 0, nx: 0, ny: -1 };
  const clamped = Math.max(0, Math.min(1, Number(t) || 0));
  const lens = [];
  let total = 0;
  for (let i = 1; i < points.length; i++) {
    const l = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
    lens.push(l); total += l;
  }
  let want = total * clamped;
  for (let i = 0; i < lens.length; i++) {
    // `<=` with a zero-length segment would return the joint itself and a
    // meaningless tangent, so a degenerate segment is stepped over.
    if (lens[i] > 0 && want <= lens[i]) {
      const a = points[i], b = points[i + 1];
      const f = want / lens[i];
      const tx = (b.x - a.x) / lens[i], ty = (b.y - a.y) / lens[i];
      return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f,
               tx, ty, nx: -ty, ny: tx };
    }
    want -= lens[i];
  }
  const a = points[points.length - 2], b = points[points.length - 1];
  const l = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  const tx = (b.x - a.x) / l, ty = (b.y - a.y) / l;
  return { x: b.x, y: b.y, tx, ty, nx: -ty, ny: tx };
}

// The absolute position of a task's circle. `parent` is the flow's point list
// or the system row, depending on `anchor_kind`.
function taskPoint(task, parent, W = DIAGRAM_NODE_W, H = DIAGRAM_NODE_H) {
  const main = task.pos_main, cross = task.pos_cross;
  if (task.anchor_kind === 'data_flow') {
    const pts = parent || [];
    if (pts.length < 2) return null;
    const at = pointAlong(pts, main === null || main === undefined ? 0.5 : main);
    // `cross` is deliberately ignored: a circle on a flow is centered on the
    // line. A non-zero value stored by an earlier build is simply not used,
    // so those circles snap onto their lines rather than needing a migration.
    return { x: at.x, y: at.y };
  }
  const sys = parent;
  if (!sys) return null;
  // `x_pos` / `y_pos`, because that is what a system row carries — the
  // property-name mistake that made alignment guides never appear once
  // already. The Node suite asserts an `x`/`y`-shaped system places nothing.
  if (sys.x_pos === undefined || sys.y_pos === undefined) return null;
  const slot = taskSystemSlotXY(main, cross, W, H);
  return { x: sys.x_pos + slot.x, y: sys.y_pos + slot.y };
}

// A slot inside a system box, as an offset from the box origin. Defaults put
// the first circle just inside the top-left corner.
function taskSystemSlotXY(main, cross, W = DIAGRAM_NODE_W, H = DIAGRAM_NODE_H) {
  const x = main === null || main === undefined ? TASK_R + 4 : main;
  const y = cross === null || cross === undefined ? TASK_R + 4 : cross;
  // Kept inside the box however it was dragged or stored, so a circle cannot
  // end up floating beside a system it belongs to.
  return { x: Math.max(TASK_R + 2, Math.min(W - TASK_R - 2, x)),
           y: Math.max(TASK_R + 2, Math.min(H - TASK_R - 2, y)) };
}

// --- default placement ------------------------------------------------------
// Both of these take the slots already in use, so a new task does not land on
// top of an existing one. "In use" is compared loosely: two circles closer
// than one slot apart read as one circle.

// On a flow: near the midpoint, but clear of the label.
//
// The label sits at `labelPointOf` — usually the midpoint — in a box about
// 23px ABOVE the line. So the circle goes on the other side, below it, which
// is free whatever the label says. Where the midpoint is taken, the next task
// slides ALONG the path rather than further from it: drifting outward would
// stop it looking attached to the flow, while sliding along keeps every circle
// the same distance from its own line.
//
// Sliding alternates either side of the middle — 0.5, 0.38, 0.62, 0.26 — so a
// pair of tasks straddles the midpoint instead of trailing off toward one end.
function taskFlowSlot(taken) {
  const used = (taken || []).filter(v => v !== null && v !== undefined);
  const tooClose = (t) => used.some(u => Math.abs(u - t) < TASK_FLOW_STEP * 0.75);
  // **The midpoint itself is skipped**, because the flow's label is drawn
  // there. The label used to be cleared by offsetting the circle sideways;
  // now that circles sit ON the line, the only way past it is along the path.
  // One step clears a typical label: a label is 44-120 units wide and a path
  // is usually several hundred, so 0.12 of the length is more than half a
  // label plus the circle's radius for anything but a very short flow.
  //
  // Candidates alternate either side — 0.38, 0.62, 0.26, 0.74 — so a pair of
  // tasks straddles the middle instead of trailing off toward one end.
  for (let i = 0; i < 12; i++) {
    const step = (Math.floor(i / 2) + 1) * TASK_FLOW_STEP * (i % 2 ? 1 : -1);
    const t = 0.5 + step;
    if (t < 0.06 || t > 0.94) continue;
    if (!tooClose(t)) return { pos_main: t, pos_cross: 0 };
  }
  // Nowhere left: stacking beats falling off the end of the line.
  return { pos_main: 0.5 - TASK_FLOW_STEP, pos_cross: 0 };
}

// In a system: the first free slot, filling from the top-left, left to right
// and then down. A box is 200x70 and a slot is 28, so a row holds six and the
// box holds two rows — beyond that it stacks on the last slot rather than
// spilling outside the box, because a circle outside its own system would be
// worse than two overlapping.
function taskSystemSlot(taken, W = DIAGRAM_NODE_W, H = DIAGRAM_NODE_H) {
  const used = (taken || []).map(p => taskSystemSlotXY(p.pos_main, p.pos_cross, W, H));
  const free = (x, y) => !used.some(u => Math.hypot(u.x - x, u.y - y) < TASK_SLOT * 0.75);
  const x0 = TASK_R + 4, y0 = TASK_R + 4;
  const cols = Math.max(1, Math.floor((W - x0 - TASK_R - 2) / TASK_SLOT) + 1);
  const rows = Math.max(1, Math.floor((H - y0 - TASK_R - 2) / TASK_SLOT) + 1);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = x0 + c * TASK_SLOT, y = y0 + r * TASK_SLOT;
      if (free(x, y)) return { pos_main: x, pos_cross: y };
    }
  }
  return { pos_main: x0, pos_cross: y0 };
}

// The slot a newly created or copied task should take, worked out from what is
// already on the diagram. Called from the browser rather than the server
// because only the browser knows where the arrows currently run: a flow's path
// depends on resolved anchors and waypoints, which the server does not compute.
//
// Returns null when the parent is not on this diagram at all, in which case
// the task keeps no position and falls back to its default slot when drawn.
function defaultTaskSlot(task, tasks, flows, systems) {
  if (!task) return null;
  const siblings = (tasks || []).filter(
    t => t.task_id !== task.task_id
      && t.anchor_kind === task.anchor_kind
      && t.anchor_id === task.anchor_id);
  if (task.anchor_kind === 'data_flow') {
    const flow = (flows || []).find(f => f.flow_id === task.anchor_id);
    if (!flow) return null;
    return taskFlowSlot(siblings.map(t => t.pos_main));
  }
  const sys = (systems || []).find(x => x.system_id === task.anchor_id);
  if (!sys) return null;
  return taskSystemSlot(siblings);
}

// Where a dragged circle lands, in the parent's own terms. The inverse of
// `taskPoint`, so a drag followed by a re-render leaves the circle under the
// cursor rather than somewhere near it.
function taskDropPosition(kind, parent, x, y, W = DIAGRAM_NODE_W, H = DIAGRAM_NODE_H) {
  if (kind === 'data_flow') {
    const pts = parent || [];
    if (pts.length < 2) return null;
    // Sample rather than solve: a polyline with bends has no closed form for
    // "fraction nearest this point", and 200 samples over a path a few hundred
    // units long is sub-pixel.
    let best = null;
    for (let i = 0; i <= 200; i++) {
      const t = i / 200;
      const at = pointAlong(pts, t);
      const d = Math.hypot(at.x - x, at.y - y);
      if (!best || d < best.d) best = { d, t, at };
    }
    // Only the position along the path is taken from the cursor. How far the
    // pointer strayed sideways is discarded rather than stored, which is what
    // keeps every circle on its own line — see TASK_FLOW_OFFSET.
    return { pos_main: best.t, pos_cross: 0 };
  }
  const sys = parent;
  if (!sys || sys.x_pos === undefined || sys.y_pos === undefined) return null;
  const slot = taskSystemSlotXY(x - sys.x_pos, y - sys.y_pos, W, H);
  return { pos_main: slot.x, pos_cross: slot.y };
}

// Closest point on a polyline to (px,py), and which segment it fell on — used
// to decide where a new bend goes when someone drags the line itself.
function closestOnPath(points, px, py) {
  let best = null;
  for (let i = 0; i + 1 < points.length; i++) {
    const a = points[i], b = points[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy || 1;
    let t = ((px - a.x) * dx + (py - a.y) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const x = a.x + dx * t, y = a.y + dy * t;
    const dist = Math.hypot(px - x, py - y);
    if (!best || dist < best.dist) best = { dist, x, y, segment: i };
  }
  return best;
}

// ===== SVG Diagram =====
function DiagramCanvas({ systems, flows, tasks, selected, onSelectSystem, onSelectFlow, onSelectTask, onUpdatePosition, onUpdateRoute, onUpdateTaskPosition, onDrill, canEdit, panelOpen, onDismissPanel, systemTypes, inScenario, zoom, setZoom, exportTitle, exportScenario, exportRef }) {
  const svgRef = useRef(null);
  const dragRef = useRef(null);
  // Per render rather than module level: the app is left open overnight and a
  // date fixed at load time would color tasks against yesterday.
  const today = todayISO();
  const [panOffset, setPanOffset] = useState({ x: 0, y: 0 });
  // Guides for the box currently being dragged. Cleared on mouse up, so they
  // never linger over a diagram nobody is rearranging.
  const [guides, setGuides] = useState([]);

  const isPanning = useRef(false);
  const panStart = useRef({ x: 0, y: 0 });
  const NODE_W = 200, NODE_H = 70, NODE_EDGE = 12;  // NODE_EDGE = draggable border band

  const handleMouseDown = useCallback((e, sys) => {
    if (sys && !canEdit) { e.stopPropagation(); return; }   // viewers cannot rearrange
    // While an arrow is being adjusted its connection points sit on the box's
    // draggable border. Allowing the box to move as well made the two
    // impossible to tell apart, so boxes are pinned until adjustment ends.
    if (sys && adjustFlowRef.current) { e.stopPropagation(); return; }
    if (sys) {
      e.stopPropagation();
      const svg = svgRef.current;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
      dragRef.current = { id: sys.system_id, offsetX: svgP.x / zoom - panOffset.x / zoom - sys.x_pos, offsetY: svgP.y / zoom - panOffset.y / zoom - sys.y_pos };
    } else {
      isPanning.current = true;
      panStart.current = { x: e.clientX - panOffset.x, y: e.clientY - panOffset.y };
    }
  }, [panOffset, zoom, canEdit]);

  const handleMouseMove = useCallback((e) => {
    if (dragRef.current) {
      const svg = svgRef.current;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
      const rawX = svgP.x / zoom - panOffset.x / zoom - dragRef.current.offsetX;
      const rawY = svgP.y / zoom - panOffset.y / zoom - dragRef.current.offsetY;
      // Shift drags freely. Tolerance is divided by the zoom so the snap feels
      // equally sticky at any magnification: the arithmetic is in diagram
      // units, and six of those cover very different distances on screen.
      if (e.shiftKey) {
        setGuides([]);
        onUpdatePosition(dragRef.current.id, rawX, rawY);
      } else {
        const others = systems.filter(s => s.system_id !== dragRef.current.id);
        const snapped = alignSnap(rawX, rawY, NODE_W, NODE_H, others,
                                  ALIGN_TOLERANCE / zoom);
        setGuides(snapped.guides);
        onUpdatePosition(dragRef.current.id, snapped.x, snapped.y);
      }
    } else if (isPanning.current) {
      setPanOffset({ x: e.clientX - panStart.current.x, y: e.clientY - panStart.current.y });
    }
  }, [onUpdatePosition, panOffset, zoom, systems]);

  const handleMouseUp = useCallback(() => {
    setGuides([]);
    if (dragRef.current) {
      const sys = systems.find(s => s.system_id === dragRef.current.id);
      if (sys) api.quiet('PUT', `/api/systems/${sys.system_id}/position`, { x_pos: sys.x_pos, y_pos: sys.y_pos });
      dragRef.current = null;
    }
    isPanning.current = false;
  }, [systems]);

  const handleWheel = useCallback((e) => {
    e.preventDefault();
    setZoom(z => Math.max(0.3, Math.min(3, z * (e.deltaY > 0 ? 0.9 : 1.1))));
  }, []);

  useEffect(() => {
    const svg = svgRef.current;
    if (svg) svg.addEventListener('wheel', handleWheel, { passive: false });
    return () => { if (svg) svg.removeEventListener('wheel', handleWheel); };
  }, [handleWheel]);

  const [showTypeKey, setShowTypeKey] = useState(false);
  const sysMap = {};
  systems.forEach(s => { sysMap[s.system_id] = s; });

  // --- routing -------------------------------------------------------------
  // routeDrag holds the in-progress gesture. It is state rather than a ref
  // because the anchor dots and the rubber-banding have to re-render as the
  // pointer moves.
  const [routeDrag, setRouteDrag] = useState(null);
  // Which arrow is being adjusted. Entered by clicking the line, left by
  // clicking away or pressing Escape. Kept separate from `selected` so that
  // opening a flow's record and rearranging its arrow are different acts.
  const [adjustFlow, setAdjustFlow] = useState(null);
  const adjustFlowRef = useRef(null);
  useEffect(() => { adjustFlowRef.current = adjustFlow; }, [adjustFlow]);

  const flowById = {};
  flows.forEach(f => { flowById[f.flow_id] = f; });
  // A stable order so "the later one hops" does not change between renders.
  const flowOrder = flows.map(f => f.flow_id).sort();
  const endpoints = resolveEndpoints(flows, sysMap, NODE_W, NODE_H);

  // While dragging, show the arrow where it *would* land rather than where it
  // is stored — otherwise the line only moves once the drag is released.
  const livePoints = (flow, ends) => {
    let from = ends.from, to = ends.to;
    let bends = parseWaypoints(flow.waypoints);
    if (routeDrag && routeDrag.flowId === flow.flow_id) {
      if (routeDrag.kind === 'end' && routeDrag.at) {
        if (routeDrag.end === 'source') from = routeDrag.at; else to = routeDrag.at;
      } else if (routeDrag.kind === 'bend' && routeDrag.at) {
        bends = bends.slice();
        if (routeDrag.index === null) bends.splice(routeDrag.insertAt, 0, routeDrag.at);
        else bends[routeDrag.index] = routeDrag.at;
      }
    }
    return [from, ...bends, to];
  };

  const pointsById = {};
  flowOrder.forEach(fid => {
    const f = flowById[fid], e = endpoints[fid];
    if (f && e) pointsById[fid] = livePoints(f, e);
  });
  const hops = computeHops(flowOrder, pointsById);

  // --- tasks on the diagram ------------------------------------------------
  // A task is drawn on its parent, so its position is resolved from the
  // parent's live geometry — which means a circle follows its arrow while the
  // arrow is being rerouted, and follows its box while the box is dragged.
  const [taskDrag, setTaskDrag] = useState(null);
  // Which circle the pointer is over, and so which hover card to draw. Held
  // here rather than relying on the browser's own tooltip: a `<title>` waits
  // about a second and restarts that timer on every pixel of movement, so it
  // needs one steady spot and feels broken on something as small as a circle.
  // That is the same complaint that produced the app's `Tooltip` component —
  // which cannot be used here, because it renders through a DOM portal and a
  // portal cannot be a child of an SVG node.
  const [taskHover, setTaskHover] = useState(null);
  const taskList = tasks || [];
  // Whether the key shows the five-state color legend or the single gray
  // "Task" row. Computed here, beside the list it is about, so the legend
  // itself stays a straight render of a decision made in one place.
  const taskSignalsShown = tasksUseSignals(taskList, today);
  const taskAutomatedShown = tasksUseAutomated(taskList);
  const taskParentOf = (t) => t.anchor_kind === 'data_flow'
    ? pointsById[t.anchor_id]
    : sysMap[t.anchor_id];
  // While dragging, draw where it *would* land rather than where it is stored,
  // or the circle only moves once the mouse is released.
  const taskPositions = {};
  taskList.forEach(t => {
    const parent = taskParentOf(t);
    if (!parent) return;                 // parent not in this view
    const live = taskDrag && taskDrag.taskId === t.task_id && taskDrag.pos
      ? { ...t, ...taskDrag.pos } : t;
    const at = taskPoint(live, parent, NODE_W, NODE_H);
    if (at) taskPositions[t.task_id] = at;
  });

  const diagramPoint = (e) => {
    const svg = svgRef.current;
    const rect = svg.getBoundingClientRect();
    return { x: (e.clientX - rect.left - panOffset.x) / zoom,
             y: (e.clientY - rect.top - panOffset.y) / zoom };
  };

  const beginEndDrag = (e, flow, end) => {
    e.stopPropagation(); e.preventDefault();
    setRouteDrag({ kind: 'end', flowId: flow.flow_id, end, at: null, over: null });
  };

  const beginBendDrag = (e, flow, index) => {
    e.stopPropagation(); e.preventDefault();
    setRouteDrag({ kind: 'bend', flowId: flow.flow_id, index, at: null });
  };

  // Dragging the line itself inserts a new bend at the point grabbed.
  const beginBend = (e, flow, pts) => {
    e.stopPropagation(); e.preventDefault();
    const p = diagramPoint(e);
    const near = closestOnPath(pts, p.x, p.y);
    if (!near) return;
    setRouteDrag({ kind: 'bend', flowId: flow.flow_id, index: null,
                   insertAt: near.segment, at: { x: p.x, y: p.y } });
  };

  const beginTaskDrag = (e, task) => {
    e.stopPropagation(); e.preventDefault();
    setTaskDrag({ taskId: task.task_id, pos: null, moved: false });
  };

  const taskMove = useCallback((e) => {
    if (!taskDrag) return;
    const task = taskList.find(t => t.task_id === taskDrag.taskId);
    if (!task) return;
    const parent = task.anchor_kind === 'data_flow'
      ? pointsById[task.anchor_id] : sysMap[task.anchor_id];
    const p = diagramPoint(e);
    const pos = taskDropPosition(task.anchor_kind, parent, p.x, p.y, NODE_W, NODE_H);
    if (pos) setTaskDrag(d => d && ({ ...d, pos, moved: true }));
  }, [taskDrag, taskList, pointsById, sysMap, panOffset, zoom]);

  const taskUp = useCallback(() => {
    if (!taskDrag) return;
    // A click that never moved is a click, not a drag: it opens the record.
    // Without this, every attempt to open a task from the diagram would also
    // save a position identical to the one it already had, writing an audit
    // entry for nothing.
    if (taskDrag.moved && taskDrag.pos && onUpdateTaskPosition) {
      onUpdateTaskPosition(taskDrag.taskId, taskDrag.pos);
    } else if (!taskDrag.moved && onSelectTask) {
      onSelectTask(taskDrag.taskId);
    }
    setTaskDrag(null);
  }, [taskDrag, onUpdateTaskPosition, onSelectTask]);

  // Build a standalone copy of the diagram and hand it to the browser as a
  // download. Everything here operates on a *clone* — the live SVG is never
  // touched, so an export cannot disturb what is on screen.
  // Returns the standalone SVG as a string, which is what every format starts
  // from: SVG is written out directly, PNG and JPG are drawn through a canvas.
  const buildSvg = useCallback(() => {
    const live = svgRef.current;
    if (!live) return;
    const clone = live.cloneNode(true);

    // The pan-and-zoom transform is a property of looking at a screen.
    const moved = clone.querySelector('g[transform]');
    if (moved) moved.removeAttribute('transform');

    // Selection is a state of the app, not of the diagram.
    Array.prototype.slice.call(clone.querySelectorAll('.node-selected'))
      .forEach(el => el.classList.remove('node-selected'));
    Array.prototype.slice.call(
      clone.querySelectorAll('.align-guide, .anchor-dot, .grab-handle'))
      .forEach(el => el.parentNode && el.parentNode.removeChild(el));

    const box = diagramExtent(systems, NODE_W, NODE_H, EXPORT_PADDING);
    clone.setAttribute('viewBox',
      `${box.x} ${box.y} ${box.width} ${box.height}`);
    clone.setAttribute('width', box.width);
    clone.setAttribute('height', box.height);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    // A white background: an SVG is transparent by default, which looks fine
    // on a page and turns into whatever is behind it in a slide.
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('x', box.x); bg.setAttribute('y', box.y);
    bg.setAttribute('width', box.width); bg.setAttribute('height', box.height);
    bg.setAttribute('fill', '#ffffff');
    clone.insertBefore(bg, clone.firstChild);

    const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    // Passed the clone, so the rules kept are the ones its own classes need.
    style.textContent = diagramStyles(clone);
    clone.insertBefore(style, clone.firstChild);

    // What the diagram is, drawn into the file. On screen this lives in the
    // toolbar, which is not part of the diagram and does not get exported.
    // One line: the application's own title and subtitle were here first and
    // said nothing about *which* diagram this is, which is the only thing a
    // reader of the file needs from a heading.
    const heading = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    heading.setAttribute('x', box.x + EXPORT_PADDING);
    heading.setAttribute('y', box.y + 34);
    heading.setAttribute('font-size', '20');
    heading.setAttribute('font-weight', '700');
    heading.setAttribute('fill', '#1B3A5C');
    heading.textContent = exportHeading(exportScenario);
    clone.appendChild(heading);

    return {
      markup: '<?xml version="1.0" encoding="UTF-8"?>\n'
              + new XMLSerializer().serializeToString(clone),
      width: box.width,
      height: box.height,
    };
  }, [systems, exportScenario]);

  // One place that hands a blob to the browser, so the download mechanics —
  // including the revoke timing below — exist once rather than per format.
  const download = (blob, name) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // Released on the next check: revoking immediately cancels the download in
    // some browsers before it has started.
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  // PNG and JPG: draw the SVG into a canvas and read it back. The diagram
  // references no external images, so nothing taints the canvas and
  // `toBlob` is allowed to produce data.
  const exportRaster = (built, name, mime, done) => {
    const scale = EXPORT_RASTER_SCALE;
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(built.width * scale));
    canvas.height = Math.max(1, Math.round(built.height * scale));
    const ctx = canvas.getContext('2d');
    // JPG has no transparency, so an unpainted canvas would come out black
    // rather than white. The SVG carries its own white rectangle, but this
    // covers the margins the scaling introduces.
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const svgUrl = URL.createObjectURL(
      new Blob([built.markup], { type: 'image/svg+xml;charset=utf-8' }));
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(svgUrl);
      canvas.toBlob((blob) => {
        if (blob) download(blob, name);
        done(blob ? null : 'The image could not be created.');
      }, mime, mime === 'image/jpeg' ? 0.92 : undefined);
    };
    img.onerror = () => {
      URL.revokeObjectURL(svgUrl);
      done('The diagram could not be converted to an image.');
    };
    img.src = svgUrl;
  };

  const runExport = useCallback((formatId, stem, onDone) => {
    const built = buildSvg();
    if (!built) { onDone('There is nothing to export.'); return; }
    const name = exportDownloadName(stem, formatId);
    if (formatId === 'svg') {
      download(new Blob([built.markup],
                        { type: 'image/svg+xml;charset=utf-8' }), name);
      onDone(null);
      return;
    }
    exportRaster(built, name,
                 formatId === 'jpg' ? 'image/jpeg' : 'image/png', onDone);
  }, [buildSvg]);

  // Printing goes through the browser, where "Save as PDF" is a destination.
  // That avoids a PDF library — about 400KB on every page load and two more
  // pinned versions — for a button most people will use rarely, and it covers
  // actual paper as well.
  const printDiagram = useCallback(() => {
    const built = buildSvg();
    if (!built) return;
    const w = window.open('', '_blank');
    if (!w) return;   // pop-up blocked; nothing useful to do but stop
    w.document.write('<!doctype html><html><head><title>'
      + String(exportTitle || 'Data Lineage').replace(/[<>&]/g, '')
      + '</title><style>@page { size: landscape; margin: 10mm }'
      + 'body { margin: 0 } svg { width: 100%; height: auto }</style>'
      + '</head><body>' + built.markup + '</body></html>');
    w.document.close();
    // The image has to be laid out before the print dialog measures it.
    w.onload = () => { w.focus(); w.print(); };
  }, [buildSvg, exportTitle]);

  // The Export button sits in the view bar, which belongs to App, while the
  // SVG it has to serialize is here. Publishing the function through a ref
  // keeps the DOM work next to the element it operates on, rather than
  // lifting the whole diagram's internals up a level to reach a button.
  useEffect(() => {
    if (exportRef) exportRef.current = { run: runExport, print: printDiagram };
    return () => { if (exportRef) exportRef.current = null; };
  }, [exportRef, runExport, printDiagram]);

  // Snap radius for a connection point, in diagram units.
  const SNAP = 26;

  // The two points a dragged bend sits between. Both are needed: a right angle
  // is a property of the pair, so adjusting only the incoming side can never
  // produce one.
  const bendNeighbours = useCallback((rd) => {
    const flow = flowById[rd.flowId];
    if (!flow) return { prev: null, next: null };
    // `endpoints` is already resolved once per render for every flow; using it
    // keeps the anchors identical to the ones the arrow is drawn from.
    const ends = endpoints[rd.flowId];
    if (!ends) return { prev: null, next: null };
    const bends = parseWaypoints(flow.waypoints);
    // An existing bend sits at `index`; a new one is being inserted into the
    // segment numbered `insertAt`, so it lands between insertAt-1 and insertAt.
    const at = rd.index === null ? rd.insertAt : rd.index;
    const prev = at > 0 ? (bends[at - 1] || ends.from) : ends.from;
    // For an existing bend the following point is the next bend; for a new one
    // it is whatever currently occupies that position.
    const afterIndex = rd.index === null ? at : at + 1;
    const next = bends[afterIndex] || ends.to;
    return { prev, next };
  }, [flowById, endpoints]);

  const routeMove = useCallback((e) => {
    if (!routeDrag) return;
    const p = diagramPoint(e);
    if (routeDrag.kind === 'end') {
      // Find the nearest connection point on any box.
      let best = null;
      systems.forEach(sys => {
        anchorPoints(sys, NODE_W, NODE_H).forEach(a => {
          const d = Math.hypot(a.x - p.x, a.y - p.y);
          if (d < SNAP && (!best || d < best.d)) {
            best = { d, system: sys.system_id, anchor: a.id, x: a.x, y: a.y };
          }
        });
      });
      setRouteDrag(rd => ({ ...rd, at: best ? { x: best.x, y: best.y } : p,
                            over: best }));
    } else {
      // Lines up with either neighbor's axis when close — which is what
      // makes a square corner possible — and otherwise rotates onto the
      // nearest 45 degrees. Shift holds both off, because a deliberate odd
      // angle has to stay possible.
      const n = bendNeighbours(routeDrag);
      const at = e.shiftKey
        ? { x: p.x, y: p.y }
        : snapBend({ x: p.x, y: p.y }, n.prev, n.next,
                   BEND_AXIS_TOLERANCE / zoom);
      setRouteDrag(rd => ({ ...rd, at }));
    }
  }, [routeDrag, systems, panOffset, zoom, bendNeighbours]);

  const routeUp = useCallback(() => {
    if (!routeDrag) return;
    const flow = flowById[routeDrag.flowId];
    const rd = routeDrag;
    setRouteDrag(null);
    if (!flow || !onUpdateRoute) return;

    if (rd.kind === 'end') {
      // Dropped away from any connection point: leave it as it was. A data
      // flow always joins two systems, so an end cannot float.
      if (!rd.over) return;
      const endSystem = rd.end === 'source'
        ? flow.source_system_id : flow.destination_system_id;
      // Only the shape is editable here, not which systems are connected —
      // that is a change to the record, and belongs in the details panel.
      if (rd.over.system !== endSystem) return;
      onUpdateRoute(flow.flow_id, rd.end === 'source'
        ? { source_anchor: rd.over.anchor } : { dest_anchor: rd.over.anchor });
      return;
    }

    const bends = parseWaypoints(flow.waypoints).slice();
    if (rd.index === null) {
      if (!rd.at) return;
      bends.splice(rd.insertAt, 0, rd.at);
    } else {
      // Dragged back onto the straight line between its neighbors: remove it,
      // which is how a bend is undone.
      const ends = endpoints[flow.flow_id];
      const all = [ends.from, ...bends, ends.to];
      const before = all[rd.index], after = all[rd.index + 2];
      const onLine = closestOnPath([before, after], rd.at.x, rd.at.y);
      if (onLine && onLine.dist < 8) bends.splice(rd.index, 1);
      else bends[rd.index] = rd.at;
    }
    onUpdateRoute(flow.flow_id, { waypoints: bends });
  }, [routeDrag, flowById, endpoints, onUpdateRoute]);

  // Escape leaves adjustment, and so does clicking the empty canvas.
  useEffect(() => {
    if (!adjustFlow) return;
    const onKey = (e) => { if (e.key === 'Escape') setAdjustFlow(null); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [adjustFlow]);

  useEffect(() => {
    if (!routeDrag) return;
    window.addEventListener('mousemove', routeMove);
    window.addEventListener('mouseup', routeUp);
    return () => {
      window.removeEventListener('mousemove', routeMove);
      window.removeEventListener('mouseup', routeUp);
    };
  }, [routeDrag, routeMove, routeUp]);

  useEffect(() => {
    if (!taskDrag) return;
    window.addEventListener('mousemove', taskMove);
    window.addEventListener('mouseup', taskUp);
    return () => {
      window.removeEventListener('mousemove', taskMove);
      window.removeEventListener('mouseup', taskUp);
    };
  }, [taskDrag, taskMove, taskUp]);

  return (
    <div className="canvas-container">
      {/* While a details panel is open the diagram is frozen: the next click
          anywhere closes the panel and does nothing else. Scrolling still zooms,
          so you can still look around what you are reading about. */}
      {panelOpen && <div className="diagram-freeze" onMouseDown={(e) => {
        e.preventDefault(); e.stopPropagation(); onDismissPanel();
      }} title="Click to close the details panel" />}
      <svg ref={svgRef} role="img"
           aria-label={`Data lineage diagram: ${systems.length} systems and ${flows.length} data flows.`
             + (systems.some(s=>s.change_state && s.change_state!=='unchanged') || flows.some(f=>f.change_state && f.change_state!=='unchanged')
                ? ` This is a scenario: ${systems.filter(s=>s.change_state==='proposed').length + flows.filter(f=>f.change_state==='proposed').length} proposed item(s) are drawn with a dashed outline and `
                  + `${systems.filter(s=>s.change_state==='removed').length + flows.filter(f=>f.change_state==='removed').length} item(s) being retired are faded.`
                : '')
             + ' The Systems and Data Flows tables in the sidebar list the same information.'}
           onMouseDown={(e) => { setAdjustFlow(null); handleMouseDown(e, null); }}
           onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}>
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#6b6b6b"><polygon points="0 0, 10 3.5, 0 7" /></marker>
          <marker id="arrowhead-sel" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#D4772C"><polygon points="0 0, 10 3.5, 0 7" /></marker>
        </defs>
        <g transform={`translate(${panOffset.x},${panOffset.y}) scale(${zoom})`}>
          {/* Alignment guides, drawn first so a box never sits under one. The
              line is extended 12 units past both boxes so it reads as a guide
              rather than as a connector between them. */}
          {guides.map((g, k) => (
            <line key={k} className="align-guide"
                  x1={g.orient === 'v' ? g.at : g.from - 12}
                  x2={g.orient === 'v' ? g.at : g.to + 12}
                  y1={g.orient === 'v' ? g.from - 12 : g.at}
                  y2={g.orient === 'v' ? g.to + 12 : g.at} />
          ))}
          {flowOrder.map(fid => {
            const flow = flowById[fid];
            const ends = endpoints[fid];
            if (!flow || !ends) return null;
            const isSel = selected && selected.type === 'flow' && selected.id === flow.flow_id;
            const adjusting = adjustFlow === flow.flow_id;
            const pts = livePoints(flow, ends);
            const mid = labelPointOf(pts);
            return (
              <g key={flow.flow_id}
                 className={`flow-line ${isSel?'selected':''} ${adjusting?'adjusting':''}`}
                 onMouseDown={(e)=>e.stopPropagation()}>
                <path d={pathWithHops(pts, hops[fid] || [])} fill="none"
                      stroke={adjusting ? '#2E75B6' : (isSel?'#D4772C':'#6b6b6b')}
                      strokeWidth={(isSel||adjusting)?3:2}
                      strokeDasharray={flow.change_state==='proposed' ? '7,5' : undefined}
                      opacity={flow.change_state==='removed' ? 0.45 : 1}
                      markerEnd={isSel?'url(#arrowhead-sel)':'url(#arrowhead)'} />

                {/* Clicking the LINE adjusts the arrow; clicking the label opens
                    the record. Two targets, two jobs — previously both did the
                    same thing and the adjustment handles were undiscoverable. */}
                <path d={pathWithHops(pts, [])} fill="none" stroke="transparent"
                      strokeWidth="16"
                      style={{ cursor: canEdit ? 'pointer' : 'default' }}
                      onClick={(e)=>{
                        e.stopPropagation();
                        if (!canEdit) { onSelectFlow(flow.flow_id); return; }
                        if (!adjusting) { setAdjustFlow(flow.flow_id); return; }
                        // Already adjusting: a second click on the line adds a
                        // bend where it was clicked.
                        const p = diagramPoint(e);
                        const near = closestOnPath(pts, p.x, p.y);
                        if (!near) return;
                        const bends = parseWaypoints(flow.waypoints).slice();
                        bends.splice(near.segment, 0, { x: p.x, y: p.y });
                        onUpdateRoute(flow.flow_id, { waypoints: bends });
                      }} />

                {/* The label opens the record. Sized to its text. */}
                <rect className="flow-label-hit"
                      x={mid.x - labelWidth(flow)/2} y={mid.y-23}
                      width={labelWidth(flow)} height={16}
                      rx="8" fill="#fff" fillOpacity="0.85"
                      stroke={isSel?'#D4772C':'#d7dde5'}
                      style={{ cursor: 'pointer' }}
                      onClick={(e)=>{e.stopPropagation(); onSelectFlow(flow.flow_id);}} />
                <text className="flow-label" x={mid.x} y={mid.y-12} textAnchor="middle"
                      fontSize="10" fontWeight={isSel?'700':'400'}
                      style={{ cursor: 'pointer' }}
                      onClick={(e)=>{e.stopPropagation(); onSelectFlow(flow.flow_id);}}>
                  {flowLabel(flow)}
                </text>
              </g>
            );
          })}

          {systems.map(sys => {
            const c = getColor(sys.system_type);
            const isSel = selected && selected.type === 'system' && selected.id === sys.system_id;
            return (
              <g key={sys.system_id} className={`system-node ${isSel?'selected':''}`}
                 opacity={sys.change_state==='removed' ? 0.45 : 1}
                 onDoubleClick={(e)=>{e.stopPropagation(); if(sys.schema_table_count>0 && onDrill) onDrill(sys.system_id);}}
                 transform={`translate(${sys.x_pos},${sys.y_pos})`}>
                {/* Outer band: grab here to move the node. A dashed border marks
                    something proposed — a pattern rather than a color, so it
                    survives every form of color blindness. */}
                <rect className={`node-frame ${canEdit ? '' : 'locked'}`}
                      width={NODE_W} height={NODE_H} fill={c.fill}
                      stroke={isSel?'#D4772C':c.stroke} strokeWidth={isSel?3:2}
                      strokeDasharray={sys.change_state==='proposed' ? '8,4' : undefined}
                      onMouseDown={(e)=>handleMouseDown(e,sys)} />
                {/* Inner area: click here to open the details panel. */}
                <rect className="node-body" x={NODE_EDGE} y={NODE_EDGE}
                      width={NODE_W-NODE_EDGE*2} height={NODE_H-NODE_EDGE*2}
                      fill={c.fill} stroke="none"
                      onMouseDown={(e)=>e.stopPropagation()}
                      onClick={(e)=>{e.stopPropagation(); onSelectSystem(sys.system_id);}} />
                <text x={NODE_W/2} y={24} textAnchor="middle" fontSize="11" fontWeight="700" fill={c.text}>{sys.name.length>28?sys.name.substring(0,26)+'...':sys.name}</text>
                <text x={NODE_W/2} y={40} textAnchor="middle" fontSize="9" fill="#6b6b6b">{sys.system_type}</text>
                <text x={NODE_W/2} y={56} textAnchor="middle" fontSize="9" fill="#aaa">{sys.system_id}</text>
                {sys.change_state==='removed' && (
                  <line x1={8} y1={NODE_H/2} x2={NODE_W-8} y2={NODE_H/2}
                        stroke={c.text} strokeWidth={1.5} />
                )}

                {sys.schema_table_count>0 ? <g style={{cursor:'pointer'}} onMouseDown={(e)=>e.stopPropagation()} onClick={(e)=>{e.stopPropagation(); onDrill && onDrill(sys.system_id);}}>
                  <rect x={6} y={NODE_H-18} width={64} height={14} rx="7" fill="#1B3A5C" />
                  <text x={38} y={NODE_H-8} textAnchor="middle" fontSize="8" fill="#fff" fontWeight="700">&#9707; SCHEMA</text>
                </g> : null}
              </g>
            );
          })}
          {/* Everything below is painted AFTER the systems on purpose. SVG has
              no z-index — document order is paint order — and an arrow's ends
              land ON a box's border, which is also the box's drag handle. Drawn
              earlier, the dots and grab handles sat underneath the boxes and
              could not be clicked at all. */}

          {/* Task circles. A task attached to a system sits INSIDE its box, so
              drawn before the systems it would be covered by exactly the box
              it belongs to — the same trap as the anchor dots, and it looks
              like a dead click handler rather than a paint-order mistake. */}
          {taskList.map(task => {
            const at = taskPositions[task.task_id];
            if (!at) return null;
            const isSel = selected && selected.type === 'task'
                          && selected.id === task.task_id;
            const dragging = taskDrag && taskDrag.taskId === task.task_id;
            const n = (task.steps || []).length;
            const done = (task.steps || []).filter(x => x.status === 'completed').length;
            return (
              <g key={task.task_id}
                 className={`task-node${isSel ? ' selected' : ''}`}
                 role="img" aria-label={taskTooltip(task, today).replace(/\n/g, '. ')}
                 opacity={task.change_state === 'removed' ? 0.45 : 1}
                 transform={`translate(${at.x},${at.y})`}
                 style={{ cursor: canEdit ? (dragging ? 'grabbing' : 'grab') : 'pointer' }}
                 onMouseDown={(e) => {
                   // A press starts a drag; releasing without moving opens the
                   // record (see taskUp). One gesture, so there is no separate
                   // handle to discover.
                   if (canEdit) beginTaskDrag(e, task);
                   else e.stopPropagation();
                 }}
                 onMouseEnter={() => setTaskHover(task.task_id)}
                 onMouseLeave={() => setTaskHover(h => h === task.task_id ? null : h)}
                 onClick={(e) => {
                   e.stopPropagation();
                   if (!canEdit && onSelectTask) onSelectTask(task.task_id);
                 }}>
                {/* The halo is drawn first so the dark ring sits on top of
                    it, which is what keeps the dark ring's contrast against
                    the fill intact. */}
                {/* An invisible disc wider than the circle, so hovering and
                    grabbing have a target the size of the thing you are
                    pointing at rather than the thing that is drawn. Without
                    it the tooltip only appeared over a few pixels, and at low
                    zoom the circle is small enough to be hard to hit at all.
                    First child, so it is under everything else and nothing
                    drawn later steals its events. */}
                <circle className="task-hit" r={TASK_R + 6} />
                <circle className="task-halo" r={TASK_R + 3} />
                <circle className="task-ring" r={TASK_R}
                        fill={(TASK_SIGNAL_BY_KEY[taskSignal(task, today)]
                               || TASK_SIGNAL_BY_KEY.open).fill}
                        strokeDasharray={task.change_state === 'proposed'
                          ? '4,3' : undefined} />
                <TaskMark signal={taskSignal(task, today)} />
                {task.change_state === 'removed' && (
                  <line x1={-TASK_R} y1={0} x2={TASK_R} y2={0}
                        stroke="#1B3A5C" strokeWidth={1.5} />
                )}
                {/* No <title>: the hover card replaces it. The same text is on
                    the group's aria-label, which is what a screen reader
                    reads and what a visual card cannot provide. */}
              </g>
            );
          })}

          {/* Connection points on the two systems this arrow joins. Clicking
              one attaches that end to it. */}
          {adjustFlow && flowById[adjustFlow] && [
            flowById[adjustFlow].source_system_id,
            flowById[adjustFlow].destination_system_id,
          ].map((sysId, whichEnd) => {
            const sys = sysMap[sysId];
            if (!sys) return null;
            const end = whichEnd === 0 ? 'source' : 'dest';
            const live = endpoints[adjustFlow];
            const currentId = live && live[end === 'source' ? 'from' : 'to'].id;
            return (
              <g key={'anchors-' + end + '-' + sysId}>
                {anchorPoints(sys, NODE_W, NODE_H).map(a => {
                  const dragHot = routeDrag && routeDrag.kind === 'end'
                    && routeDrag.over && routeDrag.over.system === sysId
                    && routeDrag.over.anchor === a.id;
                  const inUse = currentId === a.id;
                  return (
                    <circle key={a.id} cx={a.x} cy={a.y} r={dragHot ? 8 : 5}
                            className={'anchor-dot' + (dragHot ? ' hot' : '')
                                       + (inUse ? ' in-use' : '')}
                            onMouseDown={(e)=>e.stopPropagation()}
                            onClick={(e)=>{
                              e.stopPropagation();
                              onUpdateRoute(adjustFlow, end === 'source'
                                ? { source_anchor: a.id } : { dest_anchor: a.id });
                            }}>
                      <title>Attach this end here</title>
                    </circle>
                  );
                })}
              </g>
            );
          })}

          {/* The grab handles, on top of the dots: they share coordinates at the
              arrow's current end, and the handle is the one you drag. */}
          {adjustFlow && flowById[adjustFlow] && endpoints[adjustFlow] && (
            <g className="route-overlay">
              <circle className="route-handle"
                      cx={endpoints[adjustFlow].from.x}
                      cy={endpoints[adjustFlow].from.y} r={6}
                      onMouseDown={(e)=>beginEndDrag(e, flowById[adjustFlow], 'source')}>
                <title>Drag to move this end to another connection point</title>
              </circle>
              <circle className="route-handle"
                      cx={endpoints[adjustFlow].to.x}
                      cy={endpoints[adjustFlow].to.y} r={6}
                      onMouseDown={(e)=>beginEndDrag(e, flowById[adjustFlow], 'dest')}>
                <title>Drag to move this end to another connection point</title>
              </circle>
              {parseWaypoints(flowById[adjustFlow].waypoints).map((w, i) => (
                <circle key={i} className="route-bend" cx={w.x} cy={w.y} r={5}
                        onMouseDown={(e)=>beginBendDrag(e, flowById[adjustFlow], i)}
                        onDoubleClick={(e)=>{
                          e.stopPropagation();
                          const bends = parseWaypoints(
                            flowById[adjustFlow].waypoints).slice();
                          bends.splice(i, 1);
                          onUpdateRoute(adjustFlow, { waypoints: bends });
                        }}>
                  <title>Drag to move this bend, or double-click to remove it</title>
                </circle>
              ))}
            </g>
          )}

        </g>
      </svg>
      {/* The hover card, in HTML rather than SVG so it can have a shadow,
          padding and wrapping text. Positioned from the circle's diagram
          coordinates through the same pan and zoom the circles use.
          `pointer-events: none` so it can never come between the cursor and
          the circle it describes, which would make it flicker. */}
      {(() => {
        if (!taskHover) return null;
        const task = taskList.find(t => t.task_id === taskHover);
        const at = taskPositions[taskHover];
        if (!task || !at) return null;
        const lines = taskTooltip(task, today).split('\n');
        return (
          <div className="task-card" style={{
            left: at.x * zoom + panOffset.x,
            top: at.y * zoom + panOffset.y - TASK_R * zoom - 8,
          }}>
            {lines.map((line, i) =>
              <div key={i} className={i === 0 ? 'task-card-name' : undefined}>
                {line}</div>)}
          </div>
        );
      })()}
      <div className="legend">
        <div className="legend-title">
          System Types
          <button className="type-key-info" aria-label="What do these system types mean?"
                  title="What do these mean?" onClick={() => setShowTypeKey(true)}>&#9432;</button>
        </div>
        {/* Sorted alphabetically so the key is predictable as types are added. */}
        {[...(systemTypes || [])].sort((a, b) => a.type_name.localeCompare(b.type_name)).map(t => (
          <div key={t.type_name} className="legend-item">
            <div className="legend-color" style={{background: t.fill_color,
                 border: `2px solid ${t.stroke_color}`}}></div>{t.type_name}
          </div>
        ))}
        {/* A rule under the last system type, so the key reads as groups
            rather than one list in which a circle looks like a ninth system
            type. Drawn whenever anything follows it. */}
        {(taskList.length > 0 || inScenario) && <div className="legend-divider" />}
        {/* The key grows with what the diagram is actually doing, in three
            steps, because a key is only worth its space when it explains
            something present:

              * no tasks in this view — nothing at all, not even "Task"
              * tasks, but nothing color-coded — one gray circle, "Task"
              * something color-coded — the five-state key

            The middle step is the 0.7.0 legend, and keeping it is Ben's point:
            the complexity of five rows should only arrive once somebody is
            using statuses or dates. Until then the gray circle is the whole
            truth about the diagram, and five rows explaining colors that
            appear nowhere on screen is just noise to read past.

            Every swatch is the real thing — `<circle className="task-ring">`
            with the same fill and the same `TaskMark` the diagram draws — so
            the key cannot drift from what it explains. Sized to match the
            system-type swatches beside it at 14px, the same as
            `.legend-color`. */}
        {taskList.length > 0 && !taskSignalsShown && (
          <div className="legend-item">
            <svg width="14" height="14" viewBox="-8 -8 16 16" aria-hidden="true"
                 style={{flex:'0 0 auto'}}>
              <circle className="task-ring" r={6.5}
                      fill={TASK_SIGNAL_BY_KEY.open.fill} />
            </svg>
            Task
          </div>
        )}
        {/* The automated row appears whenever anything is automated, in both
            the short and the full key — and only then. A key explaining a
            blue that is nowhere on the diagram is the same noise as a key
            explaining colors nobody is using. */}
        {taskList.length > 0 && !taskSignalsShown && taskAutomatedShown && (
          <div className="legend-item">
            <svg width="14" height="14" viewBox="-8 -8 16 16" aria-hidden="true"
                 style={{flex:'0 0 auto'}}>
              <circle className="task-ring" r={6.5}
                      fill={TASK_SIGNAL_BY_KEY.automated.fill} />
              <TaskMark signal="automated" r={6.5} />
            </svg>
            Automated task
          </div>
        )}
        {taskSignalsShown && <div className="legend-title">Tasks</div>}
        {taskSignalsShown && TASK_SIGNALS
          .filter(sig => sig.key !== 'automated' || taskAutomatedShown)
          .map(sig => (
          <div className="legend-item" key={sig.key}>
            <svg width="14" height="14" viewBox="-8 -8 16 16" aria-hidden="true"
                 style={{flex:'0 0 auto'}}>
              <circle className="task-ring" r={6.5} fill={sig.fill} />
              <TaskMark signal={sig.key} r={6.5} />
            </svg>
            {sig.label}
          </div>
        ))}
        {/* Only shown in a scenario: on Current Architecture nothing is
            proposed or being retired, so the entries would be noise. */}
        {inScenario && (
          <React.Fragment>
            {taskList.length > 0 && <div className="legend-divider" />}
            <div className="legend-title">In this scenario</div>
            <div className="legend-item">
              <div className="legend-color" style={{background:'#fff',
                   border:'2px dashed #4a5764'}}></div>Proposed
            </div>
            <div className="legend-item">
              <div className="legend-color" style={{background:'#e2e6ea',
                   border:'2px solid #4a5764', opacity:0.45}}></div>Being retired
            </div>
          </React.Fragment>
        )}
      </div>
      {showTypeKey && <SystemTypeKeyModal types={systemTypes}
                                          onClose={() => setShowTypeKey(false)} />}
    </div>
  );
}

// ===== Schema Drill-Down Canvas =====
const GOV_OVERRIDE_FIELDS = ['data_classification','contains_pii','ferpa_protected','data_owner_id','data_steward_id','retention_schedule','access_restrictions','legal_authority','business_meaning','notes'];
const colHasOverride = (c) => GOV_OVERRIDE_FIELDS.some(f => c[f] !== null && c[f] !== undefined && c[f] !== '');

const CARD_W = 240, HEADER_H = 34, ROW_H = 21, MAX_BODY = 220;
const cardHeight = (t) => HEADER_H + Math.min((t.columns ? t.columns.length : 0) * ROW_H, MAX_BODY);

function rectEdge(cx, cy, w, h, tx, ty) {
  const dx = tx - cx, dy = ty - cy;
  if (dx === 0 && dy === 0) return { x: cx, y: cy };
  const sx = dx === 0 ? Infinity : (w / 2) / Math.abs(dx);
  const sy = dy === 0 ? Infinity : (h / 2) / Math.abs(dy);
  const s = Math.min(sx, sy);
  return { x: cx + dx * s, y: cy + dy * s };
}

function SchemaCanvas({ tables, selected, onSelectTable, onSelectColumn, onUpdatePosition, canEdit, zoom, setZoom }) {
  const canvasRef = useRef(null);
  const dragRef = useRef(null);
  const [panOffset, setPanOffset] = useState({ x: 40, y: 20 });
  
  const isPanning = useRef(false);
  const panStart = useRef({ x: 0, y: 0 });

  const tableMap = {};
  tables.forEach(t => { tableMap[t.table_id] = t; });

  const handleHeaderDown = useCallback((e, t) => {
    e.stopPropagation();
    if (!canEdit) return;   // viewers cannot rearrange the shared layout
    dragRef.current = { id: t.table_id, mx: e.clientX, my: e.clientY, x0: t.x_pos, y0: t.y_pos, moved: false };
  }, [canEdit]);

  const handleMouseMove = useCallback((e) => {
    if (dragRef.current) {
      const d = dragRef.current;
      d.moved = true;
      onUpdatePosition(d.id, d.x0 + (e.clientX - d.mx) / zoom, d.y0 + (e.clientY - d.my) / zoom);
    } else if (isPanning.current) {
      setPanOffset({ x: e.clientX - panStart.current.x, y: e.clientY - panStart.current.y });
    }
  }, [onUpdatePosition, zoom]);

  const endDrag = useCallback(() => {
    if (dragRef.current) {
      const t = tableMap[dragRef.current.id];
      if (t && dragRef.current.moved) api.quiet('PUT', `/api/schema/tables/${t.table_id}/position`, { x_pos: t.x_pos, y_pos: t.y_pos });
      dragRef.current = null;
    }
    isPanning.current = false;
  }, [tableMap]);

  const handleBgDown = useCallback((e) => {
    isPanning.current = true;
    panStart.current = { x: e.clientX - panOffset.x, y: e.clientY - panOffset.y };
  }, [panOffset]);

  const handleWheel = useCallback((e) => {
    e.preventDefault();
    setZoom(z => Math.max(0.25, Math.min(2.5, z * (e.deltaY > 0 ? 0.9 : 1.1))));
  }, []);

  useEffect(() => {
    const el = canvasRef.current;
    if (el) el.addEventListener('wheel', handleWheel, { passive: false });
    return () => { if (el) el.removeEventListener('wheel', handleWheel); };
  }, [handleWheel]);

  // Build deduped FK links between tables
  const linkSet = {};
  tables.forEach(t => {
    (t.columns || []).forEach(c => {
      if (c.is_fk && c.fk_target_table_id && tableMap[c.fk_target_table_id] && c.fk_target_table_id !== t.table_id) {
        linkSet[`${t.table_id}->${c.fk_target_table_id}`] = { src: t.table_id, dst: c.fk_target_table_id };
      }
    });
  });
  const links = Object.values(linkSet);
  const selId = selected && selected.type === 'schema_table' ? selected.id
              : selected && selected.type === 'schema_column' ? selected.parentTableId : null;
  const connected = new Set();
  if (selId) { connected.add(selId); links.forEach(l => { if (l.src === selId) connected.add(l.dst); if (l.dst === selId) connected.add(l.src); }); }

  const transform = `translate(${panOffset.x}px,${panOffset.y}px) scale(${zoom})`;

  return (
    <div ref={canvasRef} className={`schema-canvas ${isPanning.current ? 'panning' : ''}`}
         onMouseDown={handleBgDown} onMouseMove={handleMouseMove} onMouseUp={endDrag} onMouseLeave={endDrag}>
      {tables.length === 0 && <div className="schema-empty">No schema tables defined for this system yet.</div>}
      <svg className="schema-links">
        <defs>
          <marker id="fk-arrow" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#9fb3c8"><polygon points="0 0, 9 3, 0 6" /></marker>
          <marker id="fk-arrow-hl" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#D4772C"><polygon points="0 0, 9 3, 0 6" /></marker>
        </defs>
        <g transform={`translate(${panOffset.x},${panOffset.y}) scale(${zoom})`}>
          {links.map(l => {
            const s = tableMap[l.src], d = tableMap[l.dst];
            if (!s || !d) return null;
            const sH = cardHeight(s), dH = cardHeight(d);
            const sc = { x: s.x_pos + CARD_W / 2, y: s.y_pos + sH / 2 };
            const dc = { x: d.x_pos + CARD_W / 2, y: d.y_pos + dH / 2 };
            const p1 = rectEdge(sc.x, sc.y, CARD_W, sH, dc.x, dc.y);
            const p2 = rectEdge(dc.x, dc.y, CARD_W, dH, sc.x, sc.y);
            const hl = selId && (l.src === selId || l.dst === selId);
            return <line key={`${l.src}->${l.dst}`} className={`schema-link-line ${hl ? 'hl' : ''}`}
                         x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y}
                         markerEnd={hl ? 'url(#fk-arrow-hl)' : 'url(#fk-arrow)'} />;
          })}
        </g>
      </svg>
      <div className="schema-world" style={{ transform }}>
        {tables.map(t => {
          const isSel = selId === t.table_id;
          const dim = selId && !connected.has(t.table_id);
          const colSelId = selected && selected.type === 'schema_column' ? selected.id : null;
          return (
            <div key={t.table_id} className={`schema-card ${isSel ? 'selected' : ''} ${dim ? 'dimmed' : ''}`}
                 style={{ left: t.x_pos, top: t.y_pos, width: CARD_W }}>
              <div className="schema-card-header" onMouseDown={(e) => handleHeaderDown(e, t)}
                   onClick={(e) => { e.stopPropagation(); if (!dragRef.current || !dragRef.current.moved) onSelectTable(t.table_id); }}>
                <span className="schema-card-schema">{t.schema_name}</span>
                <span className="schema-card-title">{t.table_name}</span>
              </div>
              <div className="schema-card-body">
                {(t.columns || []).map(c => (
                  <div key={c.column_id} className={`schema-col-row ${colSelId === c.column_id ? 'selected' : ''}`}
                       onMouseDown={(e) => e.stopPropagation()}
                       onClick={(e) => { e.stopPropagation(); onSelectColumn(c.column_id, t.table_id); }}>
                    <span className="schema-col-key">
                      {c.is_pk ? <span className="col-badge col-badge-pk">PK</span> : null}
                      {c.is_fk ? <span className="col-badge col-badge-fk">FK</span> : null}
                    </span>
                    <span className="schema-col-name">{c.column_name}</span>
                    {colHasOverride(c) ? <span className="gov-dot" title="Has governance override"></span> : null}
                    <span className="schema-col-type">{c.data_type}</span>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      <div className="legend">
        <div className="legend-title">Schema View</div>
        <div className="legend-item"><span className="col-badge col-badge-pk">PK</span> Primary key</div>
        <div className="legend-item"><span className="col-badge col-badge-fk">FK</span> Foreign key</div>
        <div className="legend-item"><span className="gov-dot"></span> Governance override</div>
        <div className="legend-item" style={{marginTop:4,color:'#6b6b6b'}}>Drag headers · scroll to zoom</div>
      </div>
    </div>
  );
}

// ===== Governance inheritance display helpers =====
