        This deployment is running <strong>v{currentVersion}</strong>.
      </div>
      {canEdit && <button className="btn btn-primary"
        onClick={() => { setForm(blank); setAdding(true); }}>+ Add Release</button>}
    </div>
    {releases.length === 0 && <div className="empty-state">No releases recorded yet.</div>}
    {releases.map(r => (
      <div className="pref-group release-card" key={r.version}>
        <div className="release-card-body">
          <ReleaseEntry release={r} />
          {canEdit && <div className="res-actions">
            <button className="btn btn-edit" onClick={() => {
              setForm({ ...blank, ...r }); setEditing(r);
            }}>Edit</button>
            <button className="btn" onClick={() => publish(r, r.is_published ? 0 : 1)}>
              {r.is_published ? 'Unpublish' : 'Publish'}
            </button>
          </div>}
        </div>
      </div>
    ))}

    {(adding || editing) && <div className="modal-overlay">
      <div className="modal release-modal" role="dialog" aria-modal="true">
        <div className="modal-header">{editing ? `Edit v${editing.version}` : 'Add Release'}
          <button className="panel-close"
                  onClick={() => { setAdding(false); setEditing(null); }}>&times;</button></div>
        <div className="modal-body" style={{ overflowY: 'auto' }}>
          <div className="form-row">
            <div className="form-group"><label>Version *</label>
              <input value={form.version} disabled={!!editing}
                     onChange={e => set('version', e.target.value)} placeholder="0.3.0" /></div>
            <div className="form-group"><label>Release date</label>
              <input type="date" value={form.released_date || ''}
                     onChange={e => set('released_date', e.target.value)} /></div>
          </div>
          <div className="form-group"><label>Title</label>
            <input value={form.title || ''} onChange={e => set('title', e.target.value)} /></div>
          <div className="form-group"><label>Notes (markdown: ## heading, * bullet, **bold**, [link](url))</label>
            <textarea style={{ minHeight: 200, fontFamily: 'ui-monospace, Menlo, monospace', fontSize: 12 }}
                      value={form.notes || ''} onChange={e => set('notes', e.target.value)} /></div>
          <div className="checkbox-row"><label>
            <input type="checkbox" checked={!!form.is_published}
                   onChange={e => set('is_published', e.target.checked ? 1 : 0)} />
            Published — everyone sees this, and it triggers the what's-new modal
          </label></div>
          {form.notes && <>
            <div className="modal-section-title">Preview</div>
            <ReleaseBody notes={form.notes} />
          </>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={() => { setAdding(false); setEditing(null); }}>Cancel</button>
          <button className="btn btn-primary" onClick={save}>Save</button>
        </div>
      </div></div>}
  </div></div>);
}

// ===== Tasks =====
// A task is the work that keeps a flow or a store running: the validation
// steps before a load is accepted, the stored procedure somebody runs, the
// file a person moves by hand. Four things about the shape, because they are
// what the UI has to respect:
//
// * **One parent.** A task is attached to exactly one system or one flow, and
//   the picker offers both lists for that reason rather than two controls.
// * **One start and one end — no recurrence.** A quarterly job is four tasks,
//   made with Copy, so each occurrence keeps its own outcome.
// * **The status is the steps' status**, wherever there are steps. The control
//   is shown as a fixed value in that case, with a line saying why, rather
//   than hidden: a missing control looks like a bug, and a disabled one that
//   explains itself does not.
// * **Subtasks are an ordered list**, each with its own assignee, status and
//   optional date range, replaced wholesale on save. The database table is
//   still `task_step`; "subtask" is the word users see. See CLAUDE.md.
const TASK_STATUS_OPTIONS = [
  { value: 'not_started', label: 'Not started' },
  { value: 'in_progress', label: 'In progress' },
  { value: 'completed',   label: 'Completed' },
];

// What the circle says on hover. One function because it is the only place a
// task's identity is read as a sentence, and because the rules about what to
// leave out are easier to see in one place than spread across JSX.
const taskTooltip = (task, today) => {
  const lines = [];
  const status = taskStatusLabel(task.status);
  const steps = task.steps || [];
  const n = steps.length;
  const done = steps.filter(x => x.status === 'completed').length;
  // Whether anybody has said anything about any subtask, which is not the same
  // as whether any has started. Until one of them has a status, counting how
  // many are "done" answers a question nobody has asked and makes an
  // unassessed task look assessed — the same distinction migration 0019 drew
  // between NULL and 'not_started'. So the count is bare until then.
  const assessed = steps.some(x => x.status);
  const word = `subtask${n === 1 ? '' : 's'}`;
  // No status means no parentheses. A task that nobody has set a status on is
  // a real state, and "Name ()" reads as a fault.
  lines.push(task.name + (status ? ` (${status})` : ''));
  if (n) lines.push(assessed ? `${done} of ${n} ${word} done` : `${n} ${word}`);
  // Why the circle is the color it is, but only when the color says
  // something the status does not. A red circle whose status reads "In
  // progress" is otherwise unexplained, and the alternative — naming the state
  // every time — would have the card say "Completed" twice.
  const sg = taskSignal(task, today);
  if (sg === 'overdue' || sg === 'late_start') {
    // `taskSignalLabel`, not the state's own label: a dateless task whose
    // dependencies have finished must not claim to be past a start date it
    // does not have.
    lines.push(taskSignalLabel(task, today));
  }
  // Blocked names the culprits rather than restating the color. "Blocked" on
  // its own sends you into the flyout to find out by what, which is exactly
  // the trip a hover card exists to save.
  if (sg === 'blocked') {
    const waiting = (task.dependencies || [])
      .filter(d => d.status !== 'completed').map(d => d.name);
    lines.push(waiting.length
      ? `Waiting on ${waiting.join(', ')}`
      : TASK_SIGNAL_BY_KEY.blocked.label);
  }
  const type = task.type_label || task.task_type;
  if (type) lines.push(type);
  return lines.join('\n');
};

// An unset status reads as nothing, not as a dash: callers decide how to show
// an absence, and the tooltip's answer ("leave the parentheses out") is
// different from the catalog's ("show a dash").
// The choices a status dropdown offers: the empty one first, phrased as an
// invitation rather than as a value, then the three real states. One list so
// the flyout and every subtask row cannot disagree about either the wording or
// the order.
const TASK_STATUS_CHOICES = [
  { value: '', label: 'Add Status', hint: true },
  ...TASK_STATUS_OPTIONS,
];

const taskStatusLabel = (value) => {
  const found = TASK_STATUS_OPTIONS.find(o => o.value === value);
  return found ? found.label : '';
};

// What a task is attached to, named rather than identified. The server sends
// `anchor_name` already resolved, because the catalog would otherwise need
// every system and flow loaded to render one column.
const taskParentLabel = (task) => {
  if (!task) return '—';
  const kind = task.anchor_kind === 'system' ? 'System' : 'Data flow';
  return `${kind}: ${task.anchor_name || task.anchor_id}`;
};

// The options for the parent picker: every system and every flow in one list,
// each value carrying both halves of the answer. A single control because a
// task has a single parent — two dropdowns would allow both or neither, which
// is the state the schema deliberately cannot store.
const taskParentOptions = (systems, flows) => [
  ...byName(systems).map(s => ({
    value: `system:${s.system_id}`, label: `System — ${systemOption(s)}` })),
  ...byName(flows).map(f => ({
    value: `data_flow:${f.flow_id}`, label: `Data flow — ${f.name} (${f.flow_id})` })),
];

const taskParentValue = (t) =>
  t && t.anchor_kind && t.anchor_id ? `${t.anchor_kind}:${t.anchor_id}` : '';

const splitParent = (value) => {
  const at = String(value || '').indexOf(':');
  return at < 0 ? { anchor_kind: '', anchor_id: '' }
                : { anchor_kind: value.slice(0, at), anchor_id: value.slice(at + 1) };
};

// Picking a parent out of a list of every system and every flow.
//
// This was an input with a `<datalist>`, and the datalist is what Ben reported
// as the dropdown "only shows what the task is currently attached to, so if
// you want to move it to a different data flow or system you have to recreate
// it". The browser filters a datalist's suggestions against the text already
// in the box, so a control showing its current parent matched only that parent
// and the list looked like it held a single item. The field was never
// read-only — every other option was hidden behind the value already there,
// and nothing about the option list could fix that from outside.
//
// `Combo` is built around opening on the whole list for exactly this reason;
// its own comment is where that is explained. The old note here said a
// hand-built combobox "would be a few hundred lines of focus management to get
// the same thing slightly worse". The first half was about right and the
// second was wrong.
//
// Still its own component rather than `Combo` at both call sites, because the
// required-field message and the moving-the-circle hint belong with it, and
// the flyout and the Add window would otherwise repeat them.
function TaskParentPicker({ id, value, options, onChange, invalid, hint }) {
  return (<>
    <Combo id={id} value={value} options={options} onChange={onChange}
           invalid={invalid} ariaLabel="Attached to"
           placeholder="Type to find a system or data flow"
           describedBy={invalid ? id + '-err' : undefined} />
    {invalid && <div className="field-error-msg" id={id + '-err'}>This field is required</div>}
    {hint && <div className="gov-hint">{hint}</div>}
  </>);
}

// A subtask's dates as one phrase, for the places that have room for a line
// and not a table: the circle's tooltip. The flyout labels each date
// separately instead. Either end can be missing — a subtask with only a
// due date is common, and printing "to 2027-01-09" with nothing before it
// would look like a bug.
const dateRangeLabel = (row) => {
  const a = row.expected_start, b = row.expected_end;
  if (a && b) return `${a} to ${b}`;
  if (a) return `from ${a}`;
  if (b) return `due ${b}`;
  return '';
};

// "Other" is always offered, whatever the configured list holds, with a box
// to say what the task actually is. The free text is a separate column rather
// than a value in `task_type` — see migration 0018: a typed value landing in
// the controlled list would make every Editor a type author, and fifty one-off
// spellings would make the catalog's Type column useless.
//
// The constant comes from the server (`/api/task-types` reports it) so the
// browser is not the second place that decides what the word is.
const TASK_TYPE_OTHER = 'Other';

const taskTypeLabel = (row) => {
  const base = (row && row.task_type) || '';
  const other = ((row && row.task_type_other) || '').trim();
  return base === TASK_TYPE_OTHER && other ? `${base} \u2014 ${other}` : base;
};

function TaskReadView({ data, contributors, canEdit, notify }) {
  const people = (data.contributor_ids || []);
  return (<>
    <CollapsibleSection title="Task">
      <ReadField label="ID" value={data.task_id} />
      <ReadField label="Name" value={data.name} />
      <ReadField label="Task Type" value={data.type_label || taskTypeLabel(data)} />
      {data.change_state === 'proposed' && (
        <div className="field-row"><span className="field-label">In this scenario</span>
          <span className="field-value">Proposed</span></div>
      )}
      <ReadField label="Description" value={data.description} multiline />
      {/* Hand-written: the parent is two columns stored together and read as
          one sentence, so there is no single column for a definition or for
          hiding to resolve against. Same reason as the four hand-written
          blocks on a data flow. */}
      <div className="field-row"><span className="field-label">Attached to</span>
        <span className="field-value">{taskParentLabel(data)}</span></div>
    </CollapsibleSection>
    <CollapsibleSection title="Timing and progress">
      {/* `effective_*` falls back to the span the subtasks occupy when the
          task has no date of its own. The raw column is what the edit view
          shows and sends, so this display never becomes a stored value by
          itself — see the note in `task_rows`.

          `data.expected_start || …` second rather than first: the catalog
          generator takes the first `data.X` the EDIT view established as a
          real column, and `effective_expected_start` is not one. Keeping the
          real column in the expression is what lets a definition written for
          "Expected Start" still resolve here. */}
      <ReadField label="Expected Start"
                 value={data.expected_start || data.effective_expected_start} />
      {!!data.start_from_steps && <div className="gov-hint">From the earliest subtask</div>}
      <ReadField label="Expected End"
                 value={data.expected_end || data.effective_expected_end} />
      {!!data.end_from_steps && <div className="gov-hint">From the latest subtask</div>}
      {/* Shown as Yes/No rather than only when true: "no" is a fact somebody
          recorded about this work, and a row that appears only sometimes reads
          as a field that is missing. */}
      <ReadField label="Automated Task"
                 value={data.is_automated ? 'Yes' : 'No'} />
      {/* Hand-written rather than a ReadField: this is a list, and like the
          people and the parent it has no single column for a definition or
          for field hiding to resolve against. Each row names the dependency
          and says where it stands, because "waiting on two things" is only
          useful once you know which two and whether they have moved. */}
      {(data.dependencies || []).length > 0 && (
        <div className="field-row">
          <span className="field-label">Depends on</span>
          <div className="field-value">
            {data.dependencies.map(d => (
              <div key={d.task_id}>
                {d.name} ({d.task_id}){' \u2014 '}
                {taskStatusLabel(d.status) || 'no status recorded'}
              </div>
            ))}
          </div>
        </div>
      )}
      <ReadField label="Status" value={taskStatusLabel(data.status)} />
      {!!data.status_from_steps &&
        <div className="gov-hint">Determined based on subtasks</div>}
      <ReadField label="Completed Date" value={data.completed_date} />
      {/* Hand-written, and here rather than under a heading of its own: a list
          of people is not one column, so neither a definition nor hiding has
          anything to attach to, and one row did not justify a section. */}
      <div className="field-row">
        <span className="field-label">Person Responsible</span>
        <span className="field-value">
          {people.length === 0 ? '—'
            : people.map(cid => contributorLabel(cid, contributors)).join(', ')}
        </span>
      </div>
    </CollapsibleSection>
    {(data.steps || []).length > 0 && (
      <CollapsibleSection title={`Subtasks (${data.steps.length})`} defaultOpen>
        {/* One labeled block per subtask, numbered, with a rule between them.
            The first version put the description in a value column and crammed
            status, person and dates into one gray line underneath — which read
            as a jumble, left most of the values unlabeled, and made a missing
            one impossible to tell from a value nobody had entered.

            These are NOT `ReadField`s, deliberately. `ReadField` resolves
            hiding by LABEL, so a task field hidden in Preferences called
            "Status" would blank a subtask's status too — two unrelated things
            sharing a word. */}
        {data.steps.map((s, i) => (
          <div className="subtask-read" key={s.step_id || i}>
            <div className="subtask-read-num">Subtask {i + 1}</div>
            <div className="field-row"><span className="field-label">Description</span>
              <span className="field-value">{s.description || '—'}</span></div>
            <div className="field-row"><span className="field-label">Status</span>
              <span className="field-value">
                {taskStatusLabel(s.status) || '—'}</span></div>
            <div className="field-row"><span className="field-label">Person Responsible</span>
              <span className="field-value">
                {s.contributor_id
                  ? contributorLabel(s.contributor_id, contributors) : '—'}</span></div>
            <div className="field-row"><span className="field-label">Expected Start</span>
              <span className="field-value">{s.expected_start || '—'}</span></div>
            <div className="field-row"><span className="field-label">Expected End</span>
              <span className="field-value">{s.expected_end || '—'}</span></div>
            {s.completed_date && (
              <div className="field-row"><span className="field-label">Completed</span>
                <span className="field-value">{s.completed_date}</span></div>)}
            {s.notes && (
              <div className="field-row"><span className="field-label">Notes</span>
                <span className="field-value multiline">{s.notes}</span></div>)}
          </div>))}
      </CollapsibleSection>)}
    {data.notes && <CollapsibleSection title="Notes">
      <ReadField label="Notes" value={data.notes} multiline />
    </CollapsibleSection>}
    {/* Wrapped in a section, as it is on a system and a data flow — without
        the heading the documents list sat at the bottom of the panel with
        nothing saying what it was. */}
    <CollapsibleSection title="Resources">
      <ResourcesSection entityType="task" entityId={data.task_id}
                        canEdit={canEdit} notify={notify} />
    </CollapsibleSection>
  </>);
}

function TaskEditView({ form, set, onParent, original, missing, contributors,
                        systems, flows, taskTypes, inScenario, allTasks }) {
  const fromSteps = (form.steps || []).length > 0;
  const types = (taskTypes || []).map(t => t.type_name);
  return (<>
    <CollapsibleSection title="Task">
      {/* Only inside a scenario, and first, exactly as it is on a system and a
          data flow: whether this is something the plan invents is the frame
          for everything below it. The server has always accepted `proposed`
          on a task — the checkbox was simply never drawn, so the state could
          be set when creating one and never changed afterwards. That is the
          silently-unsaveable-field shape from the other direction: the field
          worked, the control was missing. */}
      {inScenario && (
        <EditField label="Proposed" type="checkbox" value={form.proposed}
                   onChange={v => set('proposed', !!v)} />
      )}
      <EditField label="Name" value={form.name} onChange={v=>set('name',v)}
                 invalid={(missing||[]).includes('name')} />
      <EditField label="Task Type" value={form.task_type}
                 onChange={v=>set('task_type',v)} type="select"
                 options={['', ...types, TASK_TYPE_OTHER]}
                 invalid={(missing||[]).includes('task_type')} />
      {form.task_type === TASK_TYPE_OTHER &&
        <EditField label="Type (other)" value={form.task_type_other}
                   onChange={v=>set('task_type_other',v)} />}
      <EditField label="Description" value={form.description}
                 onChange={v=>set('description',v)} type="textarea" />
      {/* Hand-written: see TaskReadView. Changing the parent clears the stored
          position, because a position on a flow and a position in a box are
          measured differently — the server does the same thing, and the circle
          falls back to its default placement. */}
      <div className="edit-field-row">
        <span className="field-label">Attached to</span>
        <div style={{flex:1}}>
          <TaskParentPicker id="task-parent-edit" value={taskParentValue(form)}
                            options={taskParentOptions(systems, flows)}
                            onChange={onParent}
                            hint={taskParentValue(form) !== taskParentValue(original)
                              ? 'Moving this task puts the circle back to its default position on the new parent.'
                              : null} />
        </div>
      </div>
    </CollapsibleSection>
    <CollapsibleSection title="Timing and progress">
      {/* Deliberately bound to the RAW columns, not the effective ones. A box
          pre-filled with the derived date would be sent back on the next save
          and become a stored override, so a task would stop tracking its
          subtasks the first time anybody saved it for an unrelated reason.
          Blank here means "derived"; typing a date overrides it; clearing it
          again returns to derived. */}
      <EditField label="Expected Start" type="date" value={form.expected_start}
                 onChange={v=>set('expected_start',v)}
                 max={form.expected_end || original.derived_end} />
      {!form.expected_start && original.derived_start &&
        <div className="gov-hint">
          Using {original.derived_start}, the earliest subtask start. Enter a
          date to override it.
        </div>}
      <EditField label="Expected End" type="date" value={form.expected_end}
                 onChange={v=>set('expected_end',v)}
                 min={form.expected_start || original.derived_start} />
      {!form.expected_end && original.derived_end &&
        <div className="gov-hint">
          Using {original.derived_end}, the latest subtask end. Enter a date to
          override it.
        </div>}
      {/* Under the dates rather than between them. Ben asked for the automated
          checkbox directly above the dependency one, and the two of them
          wedged between Expected Start and Expected End split a pair of dates
          that reads as a pair. Below both, the reason dependencies sit here at
          all still holds: a dependency does nothing until a start date passes,
          and with no date anywhere the dependencies stand in for one. */}
      <TaskExtras form={form} set={set} selfId={original && original.task_id}
                  allTasks={allTasks} />
      {fromSteps
        /* Shown as a value, not a control: with steps present the server
           recomputes this on every save, so an editable box would accept a
           choice and then overwrite it. */
        ? <div className="edit-field-row">
            <span className="field-label">Status</span>
            <div style={{flex:1}}>
              {/* The dash, not '', when the subtasks have produced no status.
                  `ReadField` already falls back this way, and an empty cell
                  here left the row with no value at all and the hint sitting
                  where the value should be. An absence shown as an absence. */}
              <span className="field-value">{taskStatusLabel(form.status) || '\u2014'}</span>
              <div className="gov-hint">Determined based on subtasks</div>
            </div>
          </div>
        : <EditField label="Status" value={form.status || ''}
                     onChange={v=>set('status',v)} type="select"
                     options={TASK_STATUS_CHOICES} />}
      <EditField label="Completed Date" type="date" value={form.completed_date}
                 onChange={v=>set('completed_date',v)} />
      {/* The people sit here rather than under a heading of their own: one
          contributor row did not justify a section, and it belongs beside the
          dates it is answerable for. */}
      <TaskPeople value={form.contributor_ids} contributors={contributors}
                  onChange={v=>set('contributor_ids',v)} />
    </CollapsibleSection>
    <CollapsibleSection title="Subtasks" defaultOpen>
      <TaskSubtasks steps={form.steps} contributors={contributors} showHint
                    onChange={v=>set('steps',v)} />
    </CollapsibleSection>
    <CollapsibleSection title="Notes">
      <EditField label="Notes" value={form.notes}
                 onChange={v=>set('notes',v)} type="textarea" />
    </CollapsibleSection>
  </>);
}

// One or more people responsible for the task as a whole. A row of dropdowns
// rather than a multi-select list box: a native multiple-select needs
// ctrl-click to add a second name and nothing on screen says so, and the
// people here are chosen one at a time from a list of hundreds.
//
// Deactivated contributors are kept out by `assignable`, except where one is
// already named — removing the current value from its own dropdown would make
// the assignment impossible to see or change.
// `variant` decides which of the app's two field layouts to use: `panel` is
// the flyout's label-beside-control row, `modal` is the Add window's
// label-above-control block. Without it the people rows kept the flyout's
// styling inside the Add window, where every field around them is laid out the
// other way — the label was a different size, weight and position from
// "Expected start" directly above it.
//
// Two layouts rather than one is the app's existing convention, not something
// introduced here; this component is simply the first to appear in both.
function TaskPeople({ value, contributors, onChange, variant }) {
  const modal = variant === 'modal';
  const Row = ({ label, children }) => modal
    ? <div className="form-group"><label>{label}</label>{children}</div>
    : <div className="edit-field-row">
        <span className="field-label">{label}</span>
        <div style={{flex:1}}>{children}</div>
      </div>;
  const chosen = value || [];
  const setAt = (i, cid) => {
    const next = [...chosen];
    if (!cid) next.splice(i, 1); else next[i] = cid;
    onChange(next);
  };
  const taken = new Set(chosen);
  return (<>
    {chosen.map((cid, i) => (
      <Row label="Person Responsible" key={cid + i}>
        <Combo value={cid} ariaLabel="Person Responsible"
               onChange={v => setAt(i, v)}
               options={[{ value: '', label: '— remove —' },
                         ...assignable(contributors, cid)
                           .filter(c => c.contributor_id === cid
                                        || !taken.has(c.contributor_id))
                           .map(c => ({ value: c.contributor_id,
                             label: contributorLabel(c.contributor_id, contributors) }))]} />
      </Row>))}
    <Row label={chosen.length ? 'Add another' : 'Person Responsible'}>
      {/* The empty choice is the invitation, in gray italics, rather than a
          dash: a dropdown whose first line reads "— none —" says what is
          selected, not what to do with it. */}
      <Combo value="" ariaLabel="Add a person responsible"
             onChange={v => { if (v) onChange([...chosen, v]); }}
             options={[{ value: '', label: 'Add Contributor', hint: true },
                       ...assignable(contributors, null)
                         .filter(c => !taken.has(c.contributor_id))
                         .map(c => ({ value: c.contributor_id,
                           label: contributorLabel(c.contributor_id, contributors) }))]} />
    </Row>
  </>);
}

// The automated flag and the dependency block, in that order, as one
// component used by BOTH the flyout and the Add window.
//
// Ben asked for both in both places, and two copies of a control with this
// much behavior in it is how one of them quietly stops matching the other —
// the Proposed checkbox was missing from the Add window for a whole release
// for exactly that reason, and `is_automated` was missing from the flyout's
// save payload for about an hour of this one.
//
// `modal` picks the surrounding markup rather than a second component. The two
// windows have different field families — the flyout is a 140px label column
// (`edit-field-row`), the Add window is `form-group` with the label above the
// control — and a control that brings the wrong one with it looks like a bug
// even though it works. That is the reused-CSS lesson in CLAUDE.md, met head
// on instead of walked into.
function TaskExtras({ form, set, selfId, allTasks, modal }) {
  return (<>
    {modal
      ? <div style={{marginBottom:12}}>
          <ModalCheck entity="task" col="is_automated" label="Automated task"
                      checked={form.is_automated}
                      onChange={v=>set('is_automated', v ? 1 : 0)} />
        </div>
      : <EditField label="Automated task" type="checkbox"
                   value={form.is_automated}
                   onChange={v=>set('is_automated', v)} />}
    <TaskDependencies form={form} set={set} selfId={selfId}
                      allTasks={allTasks} modal={modal} />
  </>);
}

// What a task waits on. A checkbox that reveals the pickers, as Ben asked for,
// because most tasks have no dependencies and an always-present empty picker
// would be a question asked of everyone to serve a few.
//
// **Unchecking it clears the list**, and says so before it does. The
// alternative — hiding dependencies that are still in force — would leave a
// task drawn blocked on the diagram with nothing in its own panel explaining
// why, which is the worst of both. Hiding a thing is not the same as not
// having it, and a checkbox that means two different things depending on what
// is behind it is the kind of control people stop trusting.
//
// Only tasks in the same view are offered: a dependency across the boundary
// is refused by the server (`check_task_dependencies`) for the same reason a
// parent is, so offering one would be offering a save that cannot succeed.
function TaskDependencies({ form, set, selfId, allTasks, modal }) {
  const chosen = form.dependency_ids || [];
  const [open, setOpen] = useState(chosen.length > 0);
  const [confirmClear, setConfirmClear] = useState(false);

  // Everything except this task itself. The server also refuses a loop; this
  // only removes the one case that is certain without a graph walk, because a
  // picker that offers an option guaranteed to fail is worse than a short list.
  const options = (allTasks || [])
    .filter(t => t.task_id !== selfId)
    .map(t => ({ value: t.task_id,
                 label: `${t.name} (${t.task_id})` }));

  const setAt = (i, id) => {
    const next = [...chosen];
    if (!id) next.splice(i, 1); else next[i] = id;
    set('dependency_ids', next);
  };
  const taken = new Set(chosen);

  // One row, in whichever field family the surrounding window uses.
  const Row = ({ label, children }) => modal
    ? <div className="form-group"><label>{label}</label>{children}</div>
    : <div className="edit-field-row">
        <span className="field-label">{label}</span>
        <div style={{flex:1, minWidth:0}}>{children}</div>
      </div>;

  const toggle = (
    <label className="check-inline" style={modal ? undefined : {margin:0}}>
      <input type="checkbox" checked={open}
             onChange={e => {
               if (!e.target.checked && chosen.length) {
                 setConfirmClear(true);   // ask before discarding them
                 return;
               }
               setOpen(e.target.checked);
             }} />
      Add Dependencies
    </label>
  );

  return (<>
    {modal
      ? <div style={{marginBottom: open ? 12 : 0}}>{toggle}</div>
      : <div className="edit-field-row">
          <span className="field-label">Dependencies</span>
          <div style={{flex:1}}>{toggle}</div>
        </div>}
    {open && (<>
      {chosen.map((id, i) => (
        <Row label="Depends on" key={id + i}>
          <Combo value={id} ariaLabel="Depends on"
                 onChange={v => setAt(i, v)}
                 options={[{ value: '', label: '\u2014 remove \u2014' },
                           ...options.filter(o => o.value === id
                                                  || !taken.has(o.value))]} />
        </Row>
      ))}
      <Row label={chosen.length ? 'Add another' : 'Depends on'}>
        <Combo value="" ariaLabel="Add a dependency"
               onChange={v => { if (v) set('dependency_ids', [...chosen, v]); }}
               options={[{ value: '', label: 'Add Dependency', hint: true },
                         ...options.filter(o => !taken.has(o.value))]} />
      </Row>
      {!form.expected_start && !(form.steps || []).some(x => x.expected_start) &&
        <div className="gov-hint">
          With no start date set here or on a subtask, this task counts as
          ready to start once every dependency is completed.
        </div>}
    </>)}
    {confirmClear && <ConfirmDialog
      title="Remove the dependencies?"
      message={`This task waits on ${chosen.length} other ` +
               `${chosen.length === 1 ? 'task' : 'tasks'}.`}
      detail={<div className="gov-hint">
        Unchecking the box removes those links. The diagram will stop showing
        this task as blocked.
      </div>}
      confirmLabel="Remove them"
      danger
      onConfirm={() => { set('dependency_ids', []); setOpen(false);
                         setConfirmClear(false); }}
      onCancel={() => setConfirmClear(false)} />}
  </>);
}

// The checklist. Each subtask carries its own description, assignee, status
// and optional date range, and the order is the order on screen —
// `sort_order` is assigned by the server from the position in the list, so
// moving one up is a local change that needs no ids.
//
// A subtask's dates are its own, not a slice of the task's. The task's pair is
// the outer window; a validation whose first check happens the day the file
// lands and whose sign-off is a week later has two dates that matter, and one
// range over the whole task hides which part is late. Either end can be left
// blank, because plenty of subtasks only have a due date.
//
// Subtasks are not record fields, so nothing here goes through `EditField`:
// there is no column for a definition or for hiding to resolve against, the
// same reason the parent picker and the people list are hand-written.
//
// The prop is still called `steps` and the table is still `task_step`. See
// CLAUDE.md: "subtask" is the word users see, and renaming the table would
// mean editing a migration that has already run.
function TaskSubtasks({ steps, contributors, onChange, showHint }) {
  const list = steps || [];
  const change = (i, patch) =>
    onChange(list.map((s, j) => j === i ? { ...s, ...patch } : s));
  const move = (i, by) => {
    const j = i + by;
    if (j < 0 || j >= list.length) return;
    const next = [...list];
    [next[i], next[j]] = [next[j], next[i]];
    onChange(next);
  };
  return (<>
    {list.length === 0 && showHint && (
      <div className="gov-hint">
        A task with no subtasks carries a status you set yourself; add subtasks
        and the status follows them instead.
      </div>)}
    {list.map((s, i) => (
      <div className="task-step" key={i}>
        <div className="task-step-head">
          <span className="task-step-num">{i + 1}</span>
          <input className="edit-input" value={s.description || ''}
                 aria-label={`Subtask ${i + 1} description`}
                 placeholder="What has to be done"
                 onChange={e => change(i, { description: e.target.value })} />
          <button className="btn btn-small" aria-label={`Move subtask ${i + 1} up`}
                  disabled={i === 0} onClick={() => move(i, -1)}>&uarr;</button>
          <button className="btn btn-small" aria-label={`Move subtask ${i + 1} down`}
                  disabled={i === list.length - 1} onClick={() => move(i, 1)}>&darr;</button>
          <button className="btn btn-small btn-danger"
                  aria-label={`Remove subtask ${i + 1}`}
                  onClick={() => onChange(list.filter((_, j) => j !== i))}>
            Remove</button>
        </div>
        {/* Two columns, indented to start under the description box and
            running out to the Remove button's right edge. So Status sits above
            Start and shares its edges, and Person Responsible sits above End
            and shares its edges — four controls on a grid rather than two rows
            that each divide the width differently. */}
        <div className="task-step-grid">
          <label>
            <span>Status</span>
            <Combo value={s.status || ''} ariaLabel="Subtask status"
                   options={TASK_STATUS_CHOICES}
                   onChange={v => change(i, { status: v || null })} />
          </label>
          <label>
            <span>Person Responsible</span>
            <Combo value={s.contributor_id || ''} ariaLabel="Subtask person responsible"
                   onChange={v => change(i, { contributor_id: v || null })}
                   options={[{ value: '', label: 'Add Contributor', hint: true },
                             ...assignable(contributors, s.contributor_id).map(c =>
                               ({ value: c.contributor_id,
                                  label: contributorLabel(c.contributor_id, contributors) }))]} />
          </label>
          {/* Captions matter more here than anywhere: a date input shows no
              placeholder, so two empty boxes side by side say nothing about
              which is which. */}
          <label>
            <span>Expected Start</span>
            <input type="date" className="edit-input"
                   value={s.expected_start || ''}
                   max={s.expected_end || undefined}
                   onChange={e => change(i, { expected_start: e.target.value || null })} />
          </label>
          <label>
            <span>Expected End</span>
            <input type="date" className="edit-input"
                   value={s.expected_end || ''}
                   min={s.expected_start || undefined}
                   onChange={e => change(i, { expected_end: e.target.value || null })} />
          </label>
        </div>
      </div>))}
    {/* `display: block` rather than inline: with no subtasks yet the button
        was the only thing after the heading and sat on the same line as it,
        reading as part of the heading rather than as an action. */}
    <button className="btn btn-small" style={{marginTop:6, display:'block'}}
            onClick={() => onChange([...list, { description: '', status: null,
                                                contributor_id: null,
                                                expected_start: null,
                                                expected_end: null }])}>
      Add Subtask
    </button>
  </>);
}
