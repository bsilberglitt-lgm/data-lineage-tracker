<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Lineage Tracker</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a2332; height: 100vh; overflow: hidden; }
/* --- Scenario view ------------------------------------------------------
   A scenario is not the live diagram, and that must be obvious at a glance
   without relying on colour alone: the header also names the scenario and
   carries a "(Scenario)" suffix, satisfying WCAG 1.4.1. The tint is
   #fcf7e3 — measurably different from the normal page background
   (dE 12.7) while keeping every text colour above AA. See ACCESSIBILITY.md. */
.scenario-view { background: #fcf7e3; }
.scenario-view .data-table, .scenario-view .panel { background: #fffdf6; }
.scenario-view .schema-canvas, .scenario-view .table-view,
.scenario-view .diagram-canvas { background: #fcf7e3; }
.scenario-badge { display: inline-block; font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 10px; background: #f7ecc0; color: #6b5200;
  margin-left: 8px; vertical-align: middle; }
/* Proposed / removed, drawn so the pattern carries the meaning rather than
   the colour: a dotted outline survives every kind of colour blindness. */
.state-proposed { border-style: dashed !important; }
.state-removed { opacity: 0.55; text-decoration: line-through; }
.state-modified-dot { display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: #b35c00; margin-right: 5px; }
.row-hidden { opacity: 0.5; }
.scenario-picker select { font-size: 12px; padding: 3px 6px; border: 1px solid #c7d0da;
  border-radius: 4px; background: #fff; max-width: 260px; }
.check-inline { display: flex; align-items: center; gap: 6px; font-size: 13px;
  margin: 6px 0; cursor: pointer; }
.pick-list { max-height: 190px; overflow-y: auto; border: 1px solid #dde3ea;
  border-radius: 4px; padding: 8px 10px; margin: 6px 0 12px; background: #fff; }
.invite-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.invite-row select { font-size: 12px; padding: 2px 4px; }
.scenario-bar { display: flex; align-items: center; gap: 10px; padding: 6px 16px;
  background: #f7ecc0; border-bottom: 1px solid #e0d3a0; font-size: 12px; color: #5a4700; }
.scenario-bar .grow { flex: 1; }
.nav-scenario { padding-left: 26px; font-size: 12px; }
.nav-add { font-size: 12px; opacity: 0.85; }
.hide-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 7px 12px; background: #fff8dc; border: 1px solid #e0d3a0;
  border-radius: 4px; margin: 0 0 8px; font-size: 12px; }
.hide-bar .btn { padding: 3px 9px; font-size: 12px; }
.pick-col { width: 28px; text-align: center; }
.zoom-controls { margin-left: auto; display: flex; align-items: center; gap: 4px; }
/* Arrow routing. Handles only appear on the selected flow, so the diagram is
   not covered in dots while reading it. */
.route-handle { fill: #fff; stroke: #D4772C; stroke-width: 2.5; cursor: grab; }
.route-handle:active { cursor: grabbing; }
.route-handle:hover { fill: #D4772C; }
.route-bend { fill: #D4772C; stroke: #fff; stroke-width: 1.5; cursor: grab; }
.route-bend:active { cursor: grabbing; }
.anchor-dot { fill: #fff; stroke: #2E75B6; stroke-width: 1.5; opacity: 0.85;
  cursor: pointer; }
.anchor-dot:hover { fill: #eaf2fb; opacity: 1; }
.anchor-dot.hot { fill: #2E75B6; opacity: 1; }
.anchor-dot.in-use { fill: #2E75B6; opacity: 1; }
.flow-line.adjusting .flow-label-hit { stroke: #2E75B6; }
/* Help. The button sits beside the version badge; the panel rises from the
   bottom so the screen being asked about stays visible behind it. */
.help-button { position: fixed; right: 62px; bottom: 8px; z-index: 60;
  width: 20px; height: 20px; border-radius: 50%; border: 1px solid #d7dee6;
  background: #fff; color: #6b6b6b; font-family: inherit; font-size: 11px;
  font-weight: 700; line-height: 1; cursor: pointer; padding: 0; }
.help-button:hover, .help-button.active { color: #2E75B6; border-color: #b9d3ea;
  background: #eaf2fb; }
.help-sheet { position: fixed; right: 16px; bottom: 34px; z-index: 70;
  width: 420px; max-width: calc(100vw - 32px); height: 62vh; max-height: 560px;
  background: #fff; border: 1px solid #d7dee6; border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18); display: flex; flex-direction: column;
  animation: help-rise 0.16s ease-out; }
@keyframes help-rise { from { transform: translateY(12px); opacity: 0; }
                       to { transform: none; opacity: 1; } }
.help-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-bottom: 1px solid #eee; font-size: 14px; font-weight: 600; color: #1B3A5C; }
.help-header .btn { padding: 2px 8px; font-size: 11px; }
.help-search { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
.help-search input { width: 100%; padding: 6px 9px; border: 1px solid #c7d0da;
  border-radius: 4px; font-family: inherit; font-size: 13px; }
.help-body { flex: 1; overflow-y: auto; padding: 6px 12px 14px; }
.help-section { font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  color: #6b6b6b; font-weight: 600; margin: 12px 0 4px; }
.help-item { display: block; width: 100%; text-align: left; background: none;
  border: none; border-radius: 6px; padding: 8px 9px; cursor: pointer;
  font-family: inherit; }
.help-item:hover { background: #f2f7fc; }
.help-item-title { font-size: 13px; font-weight: 600; color: #1B3A5C; }
.help-item-summary { font-size: 11.5px; color: #6b6b6b; line-height: 1.45; margin-top: 2px; }
.help-empty { padding: 18px 9px; font-size: 12.5px; color: #6b6b6b; line-height: 1.6; }
.help-body .md { font-size: 13px; line-height: 1.62; }
.help-body .md h2 { font-size: 13px; margin: 14px 0 5px; color: #1B3A5C; }
.help-body .md p, .help-body .md li { margin-bottom: 7px; }
.help-body .md ul { padding-left: 18px; }
.md-img { max-width: 100%; border: 1px solid #e3e8ee; border-radius: 5px;
  margin: 8px 0; display: block; }
.zoom-btn { width: 26px; height: 26px; display: flex; align-items: center;
  justify-content: center; background: #fff; border: 1px solid #c7d0da;
  border-radius: 4px; color: #1B3A5C; cursor: pointer; padding: 0; }
.zoom-btn:hover:not(:disabled) { background: #eaf2fb; border-color: #2E75B6; }
.zoom-btn:disabled { opacity: 0.4; cursor: default; }
.zoom-level { min-width: 46px; background: none; border: none; font-family: inherit;
  font-size: 11px; color: #6b6b6b; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.zoom-level:hover { background: #eaf2fb; color: #1B3A5C; }
.person-picker { position: relative; margin: 6px 0 12px; }
.person-picker > input { width: 100%; padding: 6px 8px; border: 1px solid #c7d0da;
  border-radius: 4px; font-family: inherit; font-size: 13px; }
.picker-results { position: absolute; z-index: 30; left: 0; right: 0; background: #fff;
  border: 1px solid #c7d0da; border-radius: 4px; margin-top: 2px; max-height: 200px;
  overflow-y: auto; box-shadow: 0 4px 14px rgba(0,0,0,0.12); list-style: none; }
.picker-results li { padding: 6px 10px; font-size: 13px; cursor: pointer; }
.picker-results li.active { background: #eaf2fb; }
.picker-results li.no-match { color: #6b6b6b; cursor: default; }
.chosen-list { margin-top: 8px; border: 1px solid #dde3ea; border-radius: 4px; padding: 6px 10px; }
.chosen-list .invite-row { padding: 3px 0; font-size: 13px; }
.chosen-list .btn { padding: 1px 7px; font-size: 11px; margin-left: 6px; }
.tab-row { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid #e3e8ee; }
.tab-btn { background: none; border: none; border-bottom: 2px solid transparent;
  padding: 8px 12px; font-family: inherit; font-size: 13px; cursor: pointer; color: #6b6b6b; }
.tab-btn.active { color: #1B3A5C; border-bottom-color: #2E75B6; font-weight: 600; }

.app { display: flex; height: 100vh; }
.sidebar { width: 260px; background: #1B3A5C; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.sidebar-header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
.sidebar-header h1:hover { background: rgba(255,255,255,0.1); }
.sidebar-header p { font-size: 11px; opacity: 0.6; margin-top: 4px; cursor: pointer; border-radius: 4px; padding: 2px 4px; margin-left: -4px; }
.sidebar-header p:hover { background: rgba(255,255,255,0.1); }
.sidebar-header input { width: 100%; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; color: #fff; font-family: inherit; padding: 2px 4px; margin: -2px -4px; outline: none; }
.sidebar-header input.header-title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
.sidebar-header input.header-subtitle { font-size: 11px; margin-top: 4px; opacity: 0.8; }
/* --- Logo ---------------------------------------------------------------
   The sidebar is a fixed 260px with 20px of padding, so the header has 220px
   to work with and the layout has to survive any image a user uploads.

   Three rules keep it intact, and all three matter:
     1. The image is NEVER laid out at its intrinsic size. Every position puts
        it in a box with a fixed max height and `object-fit: contain`, so a
        3000px-wide banner and a square icon both fit without distorting.
     2. `min-width: 0` on the text column. A flex item defaults to
        `min-width: auto`, which means a long unbroken title refuses to shrink
        and pushes the logo out of the sidebar instead of wrapping.
     3. Nothing here can change the sidebar's width — the image is capped at
        100% and .sidebar is flex-shrink: 0.
   `object-position: left` on the stacked positions lines the logo up with the
   left edge of the text; centring it would look accidental against
   left-aligned type. */
.brand { display: flex; gap: 12px; }
.brand-text { min-width: 0; flex: 1; }
.brand-logo { display: block; flex-shrink: 0; }
.brand-left, .brand-right { flex-direction: row; align-items: center; }
.brand-right { flex-direction: row-reverse; }
.brand-left .brand-logo, .brand-right .brand-logo {
  max-height: 34px; max-width: 64px; width: auto; object-fit: contain; }
.brand-above, .brand-below { flex-direction: column; gap: 10px; align-items: stretch; }
.brand-below { flex-direction: column-reverse; }
.brand-above .brand-logo, .brand-below .brand-logo {
  max-height: 44px; max-width: 100%; width: auto;
  object-fit: contain; object-position: left; }
/* With the title hidden the logo is the header, so give it a little more room. */
.brand-only .brand-logo { max-height: 52px; max-width: 100%; }
.brand-only { gap: 0; }
/* The Preferences editor. The preview is a real 260px sidebar header on the
   real navy, so an image that would look wrong there looks wrong here first. */
.logo-editor { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.logo-preview { width: 260px; background: #1B3A5C; color: #fff; border-radius: 6px;
  overflow: hidden; flex-shrink: 0; }
.logo-preview .sidebar-header { border-bottom: none; }
.logo-preview-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  color: #6b6b6b; font-weight: 600; margin-bottom: 6px; }
.logo-controls { flex: 1; min-width: 240px; }
.logo-meta { font-size: 12px; color: #6b6b6b; margin-bottom: 10px; line-height: 1.5; }
.logo-meta b { display: block; color: #1a2332; font-size: 13px; }
.logo-buttons { display: flex; gap: 8px; margin-bottom: 10px; }
.logo-hint { font-size: 11.5px; color: #6b6b6b; line-height: 1.55; }
.logo-unsaved { text-transform: none; letter-spacing: 0; font-weight: 600;
  background: #fff3cd; color: #856404; border-radius: 3px; padding: 1px 6px;
  margin-left: 8px; }
.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.nav-item { padding: 10px 20px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.15s; }
.nav-item:hover { background: rgba(255,255,255,0.08); }
.nav-item.active { background: rgba(255,255,255,0.15); border-left: 3px solid #5BA4E6; }
.nav-icon { width: 18px; text-align: center; opacity: 0.7; }
.nav-section { padding: 16px 20px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.4; }
.main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.toolbar { height: 48px; background: #fff; border-bottom: 1px solid #dde3ea; display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0; }
.toolbar-title { font-size: 15px; font-weight: 600; color: #1B3A5C; }
.toolbar-spacer { flex: 1; }
.btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #ccc; background: #fff; font-size: 12px; cursor: pointer; transition: all 0.15s; }
.btn:hover { background: #f5f5f5; }
.btn-primary { background: #2E75B6; color: #fff; border-color: #2E75B6; }
.btn-primary:hover { background: #245f96; }
.btn-edit { background: #fff; color: #2E75B6; border-color: #2E75B6; }
.btn-edit:hover { background: #e8f0fa; }
.btn-save { background: #27ae60; color: #fff; border-color: #27ae60; }
.btn-danger { background: #fff; color: #c0392b; border-color: #c0392b; }
.btn-danger:hover { background: #c0392b; color: #fff; }
.btn-save:hover { background: #1e8c4c; }
.content-area { flex: 1; display: flex; overflow: hidden; }
.canvas-container { flex: 1; min-width: 0; position: relative; overflow: hidden; background: #f5f8fb; transition: all 0.25s ease; }
.canvas-container svg { display: block; width: 100%; height: 100%; }
.detail-panel { width: 480px; background: #fff; border-left: 1px solid #dde3ea; overflow-y: auto; overflow-x: hidden; flex-shrink: 0; transition: width 0.3s ease, border 0.3s ease; }
.detail-panel.closed { width: 0; min-width: 0; border-left: none; overflow: hidden; padding: 0; }
.panel-header { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; }
.panel-header h2 { font-size: 15px; font-weight: 600; color: #1B3A5C; flex: 1; }
.panel-close { width: 28px; height: 28px; border-radius: 50%; border: none; background: #f0f0f0; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.panel-close:hover { background: #e0e0e0; }
.panel-body { padding: 16px 20px; }
.panel-section { margin-bottom: 20px; }
.panel-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #6b6b6b; margin-bottom: 8px; font-weight: 600; }
.field-row { display: flex; margin-bottom: 6px; font-size: 13px; line-height: 1.5; }
.field-label { width: 140px; flex-shrink: 0; color: #666; font-weight: 500; }
.field-value { flex: 1; color: #1a2332; word-break: break-word; }
.field-value.multiline { white-space: pre-line; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-active { background: #e6f4ea; color: #1e7e34; }
.badge-deprecated { background: #fde8e8; color: #c0392b; }
.badge-planned { background: #fff3cd; color: #856404; }
.badge-broken { background: #fde8e8; color: #c0392b; }
.badge-pii { background: #ffeaa7; color: #6c5300; }
.badge-ferpa { background: #dfe6ff; color: #2c3e8c; }
.badge-source { background: #d5f5e3; color: #1a6b3c; }
.badge-destination { background: #fadbd8; color: #922b21; }
.badge-internal, .badge-etlprocess, .badge-datastore, .badge-manualprocess { background: #d6eaf8; color: #1a5276; }
.badge-confidential { background: #f5b7b1; color: #78281f; }
.badge-sensitive { background: #fdebd0; color: #7e5109; }
.badge-public { background: #d5f5e3; color: #1a6b3c; }
.system-node { cursor: grab; }
.system-node:active { cursor: grabbing; }
.system-node rect { rx: 10; ry: 10; transition: filter 0.15s; }
.system-node:hover rect { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15)); }
.system-node text { pointer-events: none; }
.flow-line { cursor: pointer; }
.flow-line:hover line { stroke-width: 4; }
.flow-label { font-size: 10px; fill: #333f4a; cursor: pointer; user-select: none; }
.flow-line.selected line { stroke: #D4772C; stroke-width: 4; }
.system-node.selected rect { stroke: #D4772C; stroke-width: 3; }
.table-view { padding: 20px; overflow-y: auto; flex: 1; }
.data-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.data-table th { background: #1B3A5C; color: #fff; padding: 10px 14px; text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.3px; }
.data-table td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #eee; }
.data-table tr:hover td { background: #f8fafc; }
.data-table tr.clickable { cursor: pointer; }
/* Modals holding a form do NOT close when the backdrop is clicked. A stray
   click beside a half-filled Add Data Flow used to throw the lot away with no
   warning and no undo. The way out is the X, Cancel, or saving. The details
   flyout is the opposite case and still closes on an outside click: it is a
   panel you glance at, and it holds nothing unsaved.
   Anything with inputs should follow this — do not add onClick={onClose} to a
   .modal-overlay. */
/* --- Tooltips -----------------------------------------------------------
   z-index 200 puts these above the modal overlay (100), so a tooltip inside a
   modal is not hidden by it. The anchor is inline-flex so it wraps a button
   without changing how the button lays out — the whole control is the hover
   target, not just its text. Opacity is animated but position is not, or the
   bubble would visibly slide in from wherever it was last shown. */
.tip-anchor { display: inline-flex; }
.tip-bubble { position: fixed; z-index: 200; transform: translate(-50%, -100%);
  background: #1a2332; color: #fff; font-size: 12px; line-height: 1.45;
  padding: 7px 10px; border-radius: 6px; pointer-events: none;
  box-shadow: 0 4px 14px rgba(0,0,0,0.22); animation: tip-in 0.12s ease-out; }
.tip-bubble.tip-bottom { transform: translate(-50%, 0); }
.tip-bubble::after { content: ''; position: absolute; left: 50%; margin-left: -5px;
  border: 5px solid transparent; }
.tip-bubble.tip-top::after { top: 100%; border-top-color: #1a2332; }
.tip-bubble.tip-bottom::after { bottom: 100%; border-bottom-color: #1a2332; }
@keyframes tip-in { from { opacity: 0; } to { opacity: 1; } }
/* A field label with a definition gets this marker. Deliberately quiet: it
   should be findable without competing with the value beside it. */
.tip-mark { display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; margin-left: 5px; border-radius: 50%;
  background: #dde3ea; color: #4a5764; font-size: 10px; font-weight: 700;
  cursor: help; flex-shrink: 0; }
.tip-mark:hover, .tip-mark:focus { background: #2E75B6; color: #fff; outline: none; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: #fff; border-radius: 12px; width: 600px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.modal-header { padding: 20px 24px; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 600; color: #1B3A5C; display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 20px 24px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; font-family: inherit; }
.form-group textarea { min-height: 70px; resize: vertical; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.modal-footer { padding: 16px 24px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 8px; }
.checkbox-row { display: flex; gap: 20px; margin-bottom: 14px; }
.checkbox-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.edit-input { width: 100%; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; }
.edit-textarea { width: 100%; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; min-height: 60px; resize: vertical; }
/* A <select> is as wide as its longest option unless told otherwise, and a flex
   item will not shrink below its content by default. Together those made the
   Source and Destination dropdowns — whose options read "Federal Reporting
   (SYS-002)" — run off the edge of the details panel. width and min-width: 0
   are both needed: the first stops it sizing to its content, the second lets
   flex shrink it the rest of the way. */
.edit-select { padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px;
  font-size: 13px; font-family: inherit; width: 100%; max-width: 100%; min-width: 0; }
.edit-field-row { display: flex; margin-bottom: 10px; font-size: 13px; align-items: flex-start; }
/* Selects placed directly in the row, rather than inside a flex:1 wrapper. */
.edit-field-row > .edit-select { flex: 1; }
.edit-field-row .field-label { padding-top: 6px; }
.panel-actions { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid #eee; background: #fafbfc; }
.stats-bar { display: flex; gap: 24px; padding: 10px 20px; background: #fff; border-bottom: 1px solid #eee; }
.stat { text-align: center; }
.stat-value { font-size: 22px; font-weight: 700; color: #1B3A5C; }
.stat-label { font-size: 10px; color: #6b6b6b; text-transform: uppercase; letter-spacing: 0.5px; }
.legend { position: absolute; bottom: 16px; left: 16px; background: rgba(255,255,255,0.95); border-radius: 8px; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); font-size: 11px; z-index: 5; }

<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script type="text/babel" data-presets="react">
/* @jsxRuntime classic */
// Uses the classic JSX runtime (React.createElement) — React is loaded globally
// above. Do not switch to the automatic runtime: it emits `import` statements
// that cannot run in this inline (non-module) script.
const { useState, useEffect, useCallback, useRef } = React;

// ===== Session-aware API client =====
// The CSRF token is issued at login and must accompany every state-changing
// request. A 401 means the session expired or was revoked, so the app returns
// to the login screen rather than silently rendering empty panels.
const session = { csrf: null };
let onAuthLost = () => {};

class ApiError extends Error {
  constructor(status, payload) {
    super((payload && payload.error) || `Request failed (${status})`);
    this.status = status;
    this.payload = payload || {};
    this.problems = this.payload.problems || null;
  }
}

// Which view every request belongs to. null is Current Architecture; a number
// is that scenario. Held here rather than passed through every component
// because otherwise each of the ~40 existing API calls would have to be found
// and edited, and the one that got missed would quietly read live data while
// the user believed they were in a scenario.
let viewScenario = null;
let viewShowHidden = false;
const setViewScenario = (id) => { viewScenario = id === null ? null : Number(id); };
const setViewShowHidden = (on) => { viewShowHidden = !!on; };

// Endpoints that are the SAME whatever view you are in: accounts, settings,
// release notes, and the scenario machinery itself.
//
// This is a deny-list on purpose. It began as a list of scoped endpoints and
// that failed open: /api/schema was missing, so editing a field's governance
// inside a scenario sent no scenario at all and wrote straight to Current
// Architecture. Forgetting to add an endpoint here now means a harmless extra
// query parameter that unscoped handlers ignore, instead of a silent edit to
// live data.
const UNSCOPED_ENDPOINTS = [
  '/api/auth', '/api/users', '/api/sessions', '/api/preferences',
  '/api/releases', '/api/version', '/api/whats-new', '/api/notifications',
  '/api/scenarios', '/api/system-types', '/api/branding',
];

function scopedUrl(url) {
  if (viewScenario === null && !viewShowHidden) return url;
  const path = url.split('?')[0];
  if (!path.startsWith('/api/')) return url;
  if (UNSCOPED_ENDPOINTS.some(p => path === p || path.startsWith(p + '/'))) return url;
  const parts = [];
  if (viewScenario !== null) parts.push(`scenario=${viewScenario}`);
  if (viewShowHidden) parts.push('include_hidden=1');
  return url + (url.includes('?') ? '&' : '?') + parts.join('&');
}

async function request(method, url, data) {
  url = scopedUrl(url);
  const opts = { method, credentials: 'same-origin', headers: {} };
  if (data !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(data);
  }
  if (method !== 'GET' && session.csrf) opts.headers['X-CSRF-Token'] = session.csrf;
  const r = await fetch(url, opts);
  if (r.status === 401) { onAuthLost(); throw new ApiError(401, { error: 'Your session has ended.' }); }
  const ctype = r.headers.get('Content-Type') || '';
  const payload = ctype.includes('json') ? await r.json().catch(() => ({})) : await r.text();
  if (!r.ok) throw new ApiError(r.status, typeof payload === 'object' ? payload : { error: payload });
  return payload;
}

// Multipart uploads can't go through request(): FormData sets its own
// Content-Type. This mirrors its error handling, including the case where the
// server answers with something that isn't JSON at all.
async function uploadFile(url, formData) {
  // Multipart uploads cannot go through request() — FormData sets its own
  // Content-Type — but they still belong to a view. Skipping this is why
  // attaching a document inside a scenario returned "Not found": the server
  // looked for the parent record on Current Architecture, where a scenario's
  // copy does not exist. The same applied to uploading a schema.
  url = scopedUrl(url);
  const r = await fetch(url, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'X-CSRF-Token': session.csrf }, body: formData,
  });
  if (r.status === 401) { onAuthLost(); throw new ApiError(401, { error: 'Your session has ended.' }); }
  const text = await r.text();
  let payload;
  try { payload = JSON.parse(text); }
  catch (e) {
    throw new ApiError(r.status, {
      error: r.ok
        ? 'The server returned an unexpected response.'
        : `Upload failed (${r.status} ${r.statusText}). The server did not return JSON — ` +
          `check the container logs with: docker compose logs --tail=50 app`,
    });
  }
  if (!r.ok) throw new ApiError(r.status, payload);
  return payload;
}

// ===== Sortable tables =====
// Click a header to sort ascending, click again for descending. Values are
// compared numerically when both sides are numeric, otherwise case-insensitively
// as text, with blanks always sorted last.
function useSort(rows, initialKey, initialDir) {
  const [sort, setSort] = useState({ key: initialKey || null, dir: initialDir || 'asc' });
  const toggle = (key) => setSort(s =>
    s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' });

  const sorted = React.useMemo(() => {
    if (!sort.key) return rows;
    const factor = sort.dir === 'asc' ? 1 : -1;
    const val = (r) => {
      const v = typeof sort.key === 'function' ? sort.key(r) : r[sort.key];
      return (v === null || v === undefined || v === '') ? null : v;
    };
    return [...rows].sort((a, b) => {
      const x = val(a), y = val(b);
      if (x === null && y === null) return 0;
      if (x === null) return 1;          // blanks last, regardless of direction
      if (y === null) return -1;
      const nx = Number(x), ny = Number(y);
      if (!Number.isNaN(nx) && !Number.isNaN(ny) && x !== true && y !== true) {
        return (nx - ny) * factor;
      }
      return String(x).localeCompare(String(y), undefined, { sensitivity: 'base' }) * factor;
    });
  }, [rows, sort]);

  return { sorted, sort, toggle };
}

function SortHeader({ label, sortKey, sort, toggle, style }) {
  const active = sort.key === sortKey;
  return (
    <th className={`sortable ${active ? 'sorted' : ''}`} style={style}
        onClick={() => toggle(sortKey)} role="columnheader" tabIndex={0}
        onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(sortKey); } }}
        aria-sort={active ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}
        title={`Sort by ${label}`}>
      {label}<span className="sort-arrow">{active ? (sort.dir === 'asc' ? '▲' : '▼') : '▴▾'}</span>
    </th>
  );
}

// A data flow's name is nearly always "<source> to <destination>", so the two
// systems are chosen first and the name is offered ready-made.
function autoFlowName(systems, sourceId, destId) {
  if (!sourceId || !destId) return '';
  const list = systems || [];
  const a = list.find(s => s.system_id === sourceId);
  const b = list.find(s => s.system_id === destId);
  return (a && b) ? `${a.name} to ${b.name}` : '';
}

// Setter for Source and Destination that keeps a generated name in step.
//
// The rule is that the name follows the systems only while it is still the
// generated one. A name the user has written is theirs: changing an endpoint
// afterwards leaves it alone. An empty name counts as generated, so clearing
// it and picking systems fills it in again.
function endpointSetter(form, set, systems) {
  return (key, value) => {
    const generatedBefore = autoFlowName(systems, form.source_system_id,
                                         form.destination_system_id);
    const wasGenerated = !form.name || form.name === generatedBefore;
    set(key, value);
    if (!wasGenerated) return;
    const next = { ...form, [key]: value };
    const generatedAfter = autoFlowName(systems, next.source_system_id,
                                        next.destination_system_id);
    if (generatedAfter) set('name', generatedAfter);
  };
}
