const SRC_LABEL = { system: 'Inherited', table: 'From table', column: 'Override', none: '—' };
// Two governance fields hold a contributor key rather than a value, so without
// the lookup the schema drill-down showed "CON-003" as a Data Owner — and the
// inherited line beneath it said "Inherits: CON-003 (System)" too.
const GOV_PERSON_FIELDS = ['data_owner_id', 'data_steward_id'];

function fmtGov(field, v, contributors) {
  if (v === null || v === undefined || v === '') return '—';
  if (field === 'contains_pii' || field === 'ferpa_protected') return v ? 'Yes' : 'No';
  if (GOV_PERSON_FIELDS.includes(field)) return contributorLabel(v, contributors) || v;
  return v;
}
function GovReadField({ label, field, gov, contributors }) {
  const g = (gov && gov[field]) || { value: null, source: 'none' };
  const inherited = g.source === 'system' || g.source === 'table';
  return (
    <div className="gov-field">
      <span className="field-label">{label}</span>
      <span className={`gov-val ${inherited ? 'inherited' : ''}`}>
        {fmtGov(field, g.value, contributors)}
        <span className={`src-tag src-tag-${g.source}`}>{SRC_LABEL[g.source]}</span>
      </span>
    </div>
  );
}

// ===== Inline Edit Helpers =====
// Returns true when this field has been turned off for the record type the
// surrounding panel is showing. The four components below know only the label
// they were handed, so the label-to-column map in context does the resolving.
function useFieldHidden(label, col) {
  const ctx = useContext(FieldDefs);
  return isHidden(ctx, ctx.entity, { col, label });
}

// NOTE ON PLACEMENT: this lives here, with the other components, and not
// beside `taskSignal` and `TASK_SIGNALS` where it belongs by subject. Three
// Node suites — t_labelpos, t_taskpos, t_tasksignal — `eval` slices of the
// geometry region, and JSX is not evaluable: a component written in there
// takes every one of them down with `SyntaxError: Unexpected token '<'`.
// Keep JSX out of that region.
// The mark inside a task's circle, drawn in the ring's own color. Its own
// component because the legend draws the identical thing: a key that can drift
// from what it explains is worse than no key, which is the same reason the
// legend swatch reuses `.task-ring`.
//
// Each mark is sized against TASK_R rather than in absolute units, so a change
// to the circle's radius carries through instead of leaving the marks the
// wrong size inside it.
//
// `open` draws nothing. See the precedence note below.
function TaskMark({ signal, r = TASK_R }) {
  const u = r / 11;   // the marks were drawn at r = 11
  if (signal === 'complete') {
    return <path className="task-mark" d={`M ${-4.4 * u} ${0.2 * u}
      L ${-1.2 * u} ${3.6 * u} L ${4.6 * u} ${-3.8 * u}`} />;
  }
  if (signal === 'overdue') {
    return (<>
      <path className="task-mark" d={`M 0 ${-5.2 * u} L 0 ${1.2 * u}`} />
      <circle className="task-mark-dot" cy={4 * u} r={1.25 * u} />
    </>);
  }
  if (signal === 'active') {
    // A half-filled disc: unmistakable at this size, and it reads as
    // "part way" without needing a legend to decode it.
    return <path className="task-mark-fill"
                 d={`M 0 ${-6 * u} A ${6 * u} ${6 * u} 0 0 1 0 ${6 * u} Z`} />;
  }
  if (signal === 'blocked') {
    // A cross. Two strokes, so it reads at the size an exclamation mark does
    // and cannot be confused with it — the two share a color family, which
    // is what Ben asked for, so the marks carry the whole distinction.
    return (<>
      <path className="task-mark" d={`M ${-3.6 * u} ${-3.6 * u}
        L ${3.6 * u} ${3.6 * u}`} />
      <path className="task-mark" d={`M ${3.6 * u} ${-3.6 * u}
        L ${-3.6 * u} ${3.6 * u}`} />
    </>);
  }
  if (signal === 'automated') {
    // A play triangle: the one glyph that reads as "runs on its own" at this
    // size. A gear would be the obvious symbol and is unreadable inside an
    // 11px circle. Filled, so it cannot be confused with the hollow ring, and
    // pointing right rather than up so it is not read as a status arrow.
    return <path className="task-mark-fill"
                 d={`M ${-2.6 * u} ${-4.2 * u} L ${4.2 * u} 0
                     L ${-2.6 * u} ${4.2 * u} Z`} />;
  }
  if (signal === 'late_start') {
    // A hollow ring, not a dash: a horizontal bar is what a retired task
    // already draws across itself, and two marks that look alike on the same
    // canvas is worse than one that needs a glance at the key.
    return <circle className="task-mark" cy={0} r={3.2 * u} fill="none" />;
  }
  return null;
}

// ===== Combo: a dropdown you can type into =====
// Ben's words: "the lists are starting to get unwieldy and it can be hard to
// find the item you want." Every dropdown over records — systems, data flows,
// people, task parents — grows with the department, and a native <select> can
// only be scrolled or jumped through letter by letter.
//
// **This replaces a `<datalist>`, and that is worth recording, because the
// datalist was the obvious answer and it is wrong here.** The browser filters
// a datalist's suggestions against the text already in the box. So a control
// pre-filled with its current value matches only itself, and the list appears
// to hold one item — exactly Ben's report that a task's "Attached to" dropdown
// "only shows what the task is currently attached to, so if you want to move
// it to a different data flow or system you have to recreate it". The field
// was never read-only; the browser was hiding every other option behind the
// value already there. No amount of option-list work fixes that from outside.
//
// So the rule this component is built around: **opening shows the whole list,
// whatever the current value is.** The filter applies only to what somebody
// types after opening. Seeding the query with the selected label would
// reproduce the datalist bug in our own code.
//
// The listbox renders through a **portal**, for the same reason `Tooltip` does:
// the details flyout scrolls, so a list drawn inside it is clipped at the
// panel edge, and these controls live in the flyout and in modals both. It
// sits at z-index 300 — above the modal overlay at 100 and `Tooltip` at 200.
//
// Options may be plain strings or `{value, label, hint}`, the same shapes
// `EditField` already accepted, so call sites did not have to change. Two more
// keys exist because the two longest lists in the app needed what a native
// `<select>` gave them for free, and dropping either would have been a
// regression dressed up as a new feature:
//
// * `disabled` — an option that is shown but cannot be chosen. The account
//   picker lists already-linked accounts this way rather than omitting them,
//   so nobody hunts for a colleague who is simply absent. The arrow keys step
//   **over** these: landing on a row that Enter ignores is a dead end the user
//   has to diagnose.
// * `group` — a heading above a run of options, which `<optgroup>` did for the
//   80-field definition picker. The heading is not selectable and is skipped
//   the same way.
const COMBO_MAX_H = 260;

// An option whose label is empty is the "nothing chosen" row that several
// selects carry as `''`. A blank row has nothing to click and nothing to read
// aloud, so it is drawn as a dash — the same thing the read views show for an
// absent value.
const comboLabel = (o) => (o.label === '' || o.label === undefined ? '—' : o.label);

function Combo({ id, value, options, onChange, invalid, placeholder, disabled,
                 ariaLabel, describedBy }) {
  const opts = (options || []).map(
    o => (typeof o === 'string' ? { value: o, label: o } : o));
  const current = opts.find(
    o => !o.disabled && o.value === (value == null ? '' : value));
  const shown = current ? comboLabel(current) : '';

  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const [active, setActive] = useState(0);
  const [rect, setRect] = useState(null);
  const inputRef = useRef(null);
  const listRef = useRef(null);
  const listId = (id || 'combo') + '-list';

  const q = query.trim().toLowerCase();
  const matches = q
    ? opts.filter(o => comboLabel(o).toLowerCase().includes(q))
    : opts;

  const measure = () => {
    const el = inputRef.current;
    if (el) setRect(el.getBoundingClientRect());
  };

  // Whether a row can be chosen. Group headings and disabled options are
  // drawn but never land under the highlight.
  const pickable = (o) => !!o && !o.disabled;
  // The next pickable row in a direction, or the current one if there is none.
  // Written as a scan rather than index arithmetic because a run of disabled
  // rows at either end has to be stepped over in one go.
  const step = (from, dir) => {
    for (let i = from + dir; i >= 0 && i < matches.length; i += dir) {
      if (pickable(matches[i])) return i;
    }
    return from;
  };
  const firstPickable = (list) => {
    const i = list.findIndex(pickable);
    return i < 0 ? 0 : i;
  };

  const openList = () => {
    if (disabled || open) return;
    measure();
    // Deliberately empty: see the note above. The whole list, every time.
    setQuery('');
    const at = opts.findIndex(o => o === current);
    setActive(at >= 0 ? at : firstPickable(opts));
    setOpen(true);
  };
  const close = () => { setOpen(false); setQuery(''); };

  const commit = (opt) => {
    if (!pickable(opt)) return;
    onChange(opt.value);
    close();
    // Focus stays on the control, so the keyboard user is where they were.
    if (inputRef.current) inputRef.current.focus();
  };

  // Re-measured rather than closed on scroll or resize. Closing is what
  // `Tooltip` does, but opening a control near the bottom of a panel can make
  // the browser scroll it into view, which would then close the list the user
  // had just opened.
  useEffect(() => {
    if (!open) return;
    const again = () => measure();
    window.addEventListener('scroll', again, true);
    window.addEventListener('resize', again);
    const away = (e) => {
      const i = inputRef.current, l = listRef.current;
      if (i && i.contains(e.target)) return;
      if (l && l.contains(e.target)) return;
      close();
    };
    document.addEventListener('mousedown', away, true);
    return () => {
      window.removeEventListener('scroll', again, true);
      window.removeEventListener('resize', again);
      document.removeEventListener('mousedown', away, true);
    };
  }, [open]);

  // Keep the highlighted row in view when arrowing through a long list.
  useEffect(() => {
    if (!open || !listRef.current) return;
    const row = listRef.current.querySelector('.combo-opt.active');
    if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
  }, [open, active]);

  const key = (e) => {
    if (disabled) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!open) return openList();
      setActive(a => step(a, 1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!open) return openList();
      setActive(a => step(a, -1));
    } else if (e.key === 'Enter') {
      // Only swallowed when there is a list to choose from, so Enter still
      // submits elsewhere.
      if (open) { e.preventDefault(); commit(matches[active]); }
    } else if (e.key === 'Escape') {
      if (open) { e.preventDefault(); close(); }
    } else if (e.key === 'Tab') {
      // Moving on abandons what was typed rather than guessing at it: a
      // half-typed filter is not a choice.
      if (open) close();
    }
  };

  const hint = !!(current && current.hint) || (!current && !!placeholder);
  const style = rect ? {
    left: rect.left,
    width: rect.width,
    // Below unless there is more room above, which is what a control near the
    // foot of a modal needs.
    ...(rect.bottom + COMBO_MAX_H > window.innerHeight
        && rect.top > window.innerHeight - rect.bottom
      ? { bottom: window.innerHeight - rect.top + 2 }
      : { top: rect.bottom + 2 }),
  } : null;

  return (
    <React.Fragment>
      <div className="combo-wrap">
        <input id={id} ref={inputRef} role="combobox" autoComplete="off"
               className={'edit-input combo-input' + (invalid ? ' field-error' : '')
                          + (hint && !open ? ' select-hint' : '')}
               value={open ? query : shown}
               placeholder={open ? (shown || placeholder || 'Type to filter')
                                 : (placeholder || '')}
               disabled={!!disabled}
               aria-label={ariaLabel}
               aria-invalid={!!invalid}
               aria-describedby={describedBy}
               aria-expanded={open}
               aria-controls={open ? listId : undefined}
               aria-autocomplete="list"
               aria-activedescendant={open && matches[active]
                 ? listId + '-' + active : undefined}
               onMouseDown={() => (open ? close() : openList())}
               onChange={e => { if (!open) openList();
                                const t = e.target.value;
                                setQuery(t);
                                setActive(firstPickable(
                                  t.trim() ? opts.filter(o => comboLabel(o)
                                    .toLowerCase().includes(t.trim().toLowerCase()))
                                           : opts)); }}
               onKeyDown={key} />
        <span className="combo-caret" aria-hidden="true">&#9662;</span>
      </div>
      {open && style && ReactDOM.createPortal(
        <ul id={listId} role="listbox" ref={listRef}
            className="combo-list" style={style}>
          {matches.length === 0 && <li className="combo-empty">No matches</li>}
          {matches.map((o, i) => (o.group !== undefined
            ? <li key={'g' + i} className="combo-group" role="presentation">{o.group}</li>
            : <li key={o.value + ':' + i} id={listId + '-' + i} role="option"
                aria-selected={current === o}
                aria-disabled={o.disabled ? true : undefined}
                className={'combo-opt' + (i === active ? ' active' : '')
                           + (current === o ? ' sel' : '')
                           + (o.disabled ? ' combo-opt-off' : '')
                           + (o.hint ? ' combo-opt-hint' : '')}
                onMouseEnter={() => { if (pickable(o)) setActive(i); }}
                onMouseDown={e => { e.preventDefault(); commit(o); }}>
              {comboLabel(o)}
            </li>
          ))}
        </ul>,
        document.body)}
    </React.Fragment>
  );
}

function EditField({ label, value, onChange, type, options, invalid, min, max }) {
  if (useFieldHidden(label)) return null;
  const bad = invalid ? ' field-error' : '';
  const note = invalid ? <div className="field-error-msg">This field is required</div> : null;
  if (type === 'textarea') return (
    <div className="edit-field-row"><span className="field-label">{label}<FieldInfo label={label} /></span>
      <div style={{flex:1}}><textarea className={'edit-textarea'+bad} value={value||''}
        aria-invalid={!!invalid} onChange={e=>onChange(e.target.value)} />{note}</div></div>
  );
  // An option may be a plain string or a {value,label} pair. It was strings
  // only, so a column storing `not_started` offered the user "not_started" —
  // a database value read aloud in a dropdown.
  // A Combo rather than a <select>: every one of these lists can grow with the
  // data, and the hint styling works here because the markup is ours — macOS
  // draws native select popups itself and ignores `option { font-style }`.
  if (type === 'select') return (
    <div className="edit-field-row"><span className="field-label">{label}<FieldInfo label={label} /></span>
      <div style={{flex:1, minWidth:0}}>
        <Combo value={value} options={options} onChange={onChange}
               invalid={invalid} ariaLabel={label} />{note}</div></div>
  );
  // The box used to be followed by the word "Yes" or "No" reflecting the
  // current value, which read as a choice being offered rather than a state —
  // an unchecked box beside the word "No" looks like "No" is what you are about
  // to select, and checking it made the word change, which is stranger still.
  // The field's own label is the question; the box is the answer.
  //
  // Nothing explains individual fields here on purpose: field-level definitions
  // are coming, and one mechanism for that is better than captions hard-coded
  // at each call site.
  //
  // aria-label is needed because the wrapping label has no text of its own —
  // without it the checkbox would have no accessible name at all.
  if (type === 'checkbox') return (
    <div className="edit-field-row"><span className="field-label">{label}<FieldInfo label={label} /></span>
      <div style={{flex:1}}>
        <input type="checkbox" checked={!!value} aria-label={label}
               onChange={e=>onChange(e.target.checked?1:0)} />
      </div></div>
  );
  // `type="date"` gives the browser's own calendar, and it reads and writes
  // exactly the YYYY-MM-DD the database stores, so no parsing is needed on
  // either side. A free-text box invited "Jan 5" and "5/1/27", which sort
  // wrongly and compare wrongly.
  // `min`/`max` bound the native picker, which is how an end date before its
  // start becomes hard to enter rather than merely refused afterwards. It is a
  // convenience and not the boundary — it can be typed past, and it says
  // nothing about rows that predate the rule — so the server checks too
  // (`check_task_dates`).
  if (type === 'date') return (
    <div className="edit-field-row"><span className="field-label">{label}<FieldInfo label={label} /></span>
      <div style={{flex:1}}><input type="date" className={'edit-input'+bad} value={value||''}
        min={min || undefined} max={max || undefined}
        aria-invalid={!!invalid} onChange={e=>onChange(e.target.value)} />{note}</div></div>
  );
  return (
    <div className="edit-field-row"><span className="field-label">{label}<FieldInfo label={label} /></span>
      <div style={{flex:1}}><input className={'edit-input'+bad} value={value||''}
        aria-invalid={!!invalid} onChange={e=>onChange(e.target.value)} />{note}</div></div>
  );
}

function ReadField({ label, value, multiline }) {
  if (useFieldHidden(label)) return null;
  return <div className="field-row">
    <span className="field-label">{label}<FieldInfo label={label} /></span>
    <span className={`field-value${multiline?' multiline':''}`}>{value || '—'}</span></div>;
}

function ClassificationBadge({ value }) {
  if (!value) return <span className="field-value">{'—'}</span>;
  return <span className={`badge badge-${CLASS_BADGE[value] || 'internal'}`}>{value}</span>;
}

// The same required fields the server enforces. Kept here so the panel can say
// what is missing rather than surfacing a 400 after the fact.
const PANEL_REQUIRED = {
  system: [
    { key: 'name', label: 'Name' },
    { key: 'system_type', label: 'Type' },
    { key: 'managed_by', label: 'Managed By' },
  ],
  flow: [
    { key: 'name', label: 'Name' },
    { key: 'source_system_id', label: 'Source' },
    { key: 'destination_system_id', label: 'Destination' },
    { key: 'frequency', label: 'Frequency' },
  ],
  task: [
    { key: 'name', label: 'Name' },
    { key: 'task_type', label: 'Task Type' },
  ],
  element: [
    { key: 'name', label: 'Name' },
    { key: 'definition', label: 'Definition' },
  ],
  contributor: [
    { key: 'name', label: 'Name' },
    { key: 'organization_unit', label: 'Organization Unit' },
  ],
};

// ===== Detail Panel with Edit =====
function DetailPanel({ data, type, fieldMeta, onClose, onSave, onDelete, onRetire, systems, flows, tasks, taskTypes, onCopyTask, onDrill, canEdit, notify, contributors, isAdmin, isSuper, systemTypes, onSchemaChanged, inScenario, onSetHidden, onResetRoute }) {
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({});
  const [missing, setMissing] = useState([]);
  // null = no dialog; true = about to retire; false = about to bring back.
  const [confirmRetire, setConfirmRetire] = useState(null);
  // What names this contributor, fetched when Deactivate is pressed rather
  // than when the panel opens: it is five queries, and most people looking at
  // a contributor are not about to deactivate them.
  const [refs, setRefs] = useState(null);
  const [refsBusy, setRefsBusy] = useState(false);
  // What a delete would destroy, fetched when Delete is pressed. `typed` is
  // the confirmation name for a system carrying a schema.
  const [impact, setImpact] = useState(null);
  const [typed, setTyped] = useState('');
  // A task's delete needs no counted cascade: its steps and assignments are
  // parts of it, not records of their own, so the dialog can say what goes
  // without asking the server first.
  const [confirmTaskDelete, setConfirmTaskDelete] = useState(false);
  // Memoized so the provider does not hand every field a new object on each
  // keystroke, which would re-render all 30-odd of them while typing.
  const defsContext = useMemo(
    () => ({ ...(fieldMeta || {}), entity: PANEL_ENTITY[type] || null }),
    [type, fieldMeta]);
  const bodyRef = useRef(null);
  const isOpen = !!data;

  useEffect(() => {
    // Reset per-record state when the panel switches records, or a dialog
    // opened for one record would still be open over the next.
    setEditing(false); setMissing([]);
    setImpact(null); setRefs(null); setTyped('');
    setConfirmTaskDelete(false);
  }, [data, type]);

  const startEdit = () => {
    // 'proposed' is derived from change_state rather than stored separately, so
    // it has to be unpacked for the checkbox and packed again on save.
    setForm({ ...data, proposed: data.change_state === 'proposed' });
    setMissing([]); setEditing(true);
  };
  const cancelEdit = () => { setEditing(false); setMissing([]); };

  const requiredGaps = (f) => (PANEL_REQUIRED[type] || []).filter(r => {
    const v = f[r.key];
    return v === undefined || v === null || String(v).trim() === '';
  });

  const saveEdit = async () => {
    // Blocking here keeps a record from being saved without its name, which the
    // database would happily accept as an empty string.
    const gaps = requiredGaps(form);
    if (gaps.length) {
      setMissing(gaps.map(g => g.key));
      if (bodyRef.current) bodyRef.current.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    setMissing([]);
    // Only systems and flows carry a change state, and only inside a scenario.
    // Sending it on Current Architecture is refused by the server, so it is
    // left out entirely rather than sent as false.
    // A task carries a change state too, but builds its own payload below,
    // so it is deliberately not in this list.
    const proposedField = (inScenario && ['system', 'flow'].includes(type))
      ? { proposed: !!form.proposed } : {};
    // These payloads are hand-written and have to name every field the server
    // will accept, because the update loop writes only the keys it is sent:
    // anything missing here is silently unsaveable — the control works, the
    // save reports success, and the value never changes. Owner on a data flow
    // was missing for months, and Source of Truth on a data element with it.
    // tools/check_payloads.py compares these lists against the server's field
    // tuples and fails if they drift again; run it after editing this block.
    let url, saveData;
    if (type === 'system') {
      url = `/api/systems/${data.system_id}`;
      saveData = {
        name: form.name, description: form.description, system_type: form.system_type,
        vendor: form.vendor, technology: form.technology, environment: form.environment,
        managed_by: form.managed_by, organization: form.organization,
        contains_pii: form.contains_pii, ferpa_protected: form.ferpa_protected,
        status: form.status, notes: form.notes,
        data_classification: form.data_classification, access_method: form.access_method,
        encryption_at_rest: form.encryption_at_rest, encryption_in_transit: form.encryption_in_transit,
        last_security_review: form.last_security_review, has_audit_trail: form.has_audit_trail,
        data_steward_id: form.data_steward_id, retention_schedule: form.retention_schedule,
        destruction_method: form.destruction_method, backup_frequency: form.backup_frequency,
        disaster_recovery: form.disaster_recovery, data_standards: form.data_standards,
        authorized_users: form.authorized_users, data_sharing_restrictions: form.data_sharing_restrictions,
        entry_type: form.entry_type, entered_by: form.entered_by,
        entry_validation: form.entry_validation,
        entry_error_correction: form.entry_error_correction,
        target_system_id: form.target_system_id,
        ...proposedField,
      };
    } else if (type === 'flow') {
      url = `/api/flows/${data.flow_id}`;
      saveData = {
        name: form.name, description: form.description,
        display_name: form.display_name,
        source_system_id: form.source_system_id, destination_system_id: form.destination_system_id,
        direction: form.direction, frequency: form.frequency,
        transfer_method: form.transfer_method, format: form.format,
        manual_steps: form.manual_steps ? 1 : 0,
        transformation_steps: form.transformation_steps, business_rules: form.business_rules,
        validations: form.validations, error_handling: form.error_handling,
        contains_pii: form.contains_pii, ferpa_protected: form.ferpa_protected,
        regulatory_driver: form.regulatory_driver, status: form.status, known_issues: form.known_issues,
        frequency_detail: form.frequency_detail, organization: form.organization,
        managed_by: form.managed_by, data_steward_id: form.data_steward_id,
        owner_id: form.owner_id,
        data_classification: form.data_classification, encryption_method: form.encryption_method,
        disclosure_avoidance: form.disclosure_avoidance,
        data_quality_measures: form.data_quality_measures, data_standard: form.data_standard,
        retention_at_destination: form.retention_at_destination, legal_authority: form.legal_authority,
        ...proposedField,
      };
    } else if (type === 'element') {
      url = `/api/elements/${data.element_id}`;
      saveData = {
        name: form.name, aliases: form.aliases, definition: form.definition,
        data_type: form.data_type, valid_values: form.valid_values,
        is_pii: form.is_pii, ferpa_protected: form.ferpa_protected, notes: form.notes,
        source_of_truth: form.source_of_truth,
        data_classification: form.data_classification, data_standard: form.data_standard,
        business_meaning: form.business_meaning,
        data_owner_id: form.data_owner_id, data_steward_id: form.data_steward_id,
      };
    } else if (type === 'contributor') {
      url = `/api/contributors/${data.contributor_id}`;
      saveData = {
        name: form.name, title: form.title, organization_unit: form.organization_unit,
        email: form.email, phone: form.phone, role_type: form.role_type,
        governance_role: form.governance_role,
        governance_responsibilities: form.governance_responsibilities,
        training_status: form.training_status, last_training_date: form.last_training_date,
        notes: form.notes,
        // Sent only by a SuperAdmin: the server refuses it from anyone else
        // rather than ignoring it, so sending it unconditionally would make
        // every Editor's save fail.
        ...(isSuper ? { is_active: form.is_active === undefined ? 1
                                   : (form.is_active ? 1 : 0) } : {}),
      };
    } else if (type === 'task') {
      url = `/api/tasks/${data.task_id}`;
      saveData = {
        name: form.name, task_type: form.task_type,
        task_type_other: form.task_type_other, description: form.description,
        anchor_kind: form.anchor_kind, anchor_id: form.anchor_id,
        is_automated: form.is_automated ? 1 : 0,
        expected_start: form.expected_start, expected_end: form.expected_end,
        // Sent on every task save, like the people and the subtasks: the
        // server replaces the list wholesale, so omitting the key would leave
        // the control working and the value never changing.
        dependency_ids: form.dependency_ids || [],
        completed_date: form.completed_date, notes: form.notes,
        // Steps and the people are parts of the task, replaced wholesale.
        steps: (form.steps || [])
          .filter(st => (st.description || '').trim())
          .map(st => ({ description: st.description,
                        status: st.status || null,
                        contributor_id: st.contributor_id || null,
                        expected_start: st.expected_start || null,
                        expected_end: st.expected_end || null,
                        completed_date: st.completed_date || null,
                        notes: st.notes || null })),
        contributor_ids: form.contributor_ids || [],
        // Only meaningful with no steps: with steps the server recomputes it,
        // which is why the edit view shows it as a value rather than a control.
        ...((form.steps || []).length ? {} : { status: form.status || null }),
        ...(inScenario ? { proposed: !!form.proposed } : {}),
      };
    } else if (type === 'schema_table' || type === 'schema_column') {
      url = type === 'schema_table' ? `/api/schema/tables/${data.table_id}` : `/api/schema/columns/${data.column_id}`;
      saveData = {
        data_classification: form.data_classification, contains_pii: form.contains_pii,
        ferpa_protected: form.ferpa_protected, data_owner_id: form.data_owner_id,
        data_steward_id: form.data_steward_id, retention_schedule: form.retention_schedule,
        access_restrictions: form.access_restrictions, legal_authority: form.legal_authority,
        business_meaning: form.business_meaning, notes: form.notes,
      };
    }
    try {
      const result = await api.put(url, saveData);
      setEditing(false);
      onSave(type, result);
    } catch (err) {
      if (notify) notify(err.message, true);
      else alert(err.message);
    }
  };
  const set = (k, v) => setForm(f => ({...f, [k]: v}));

  const loadReferences = async () => {
    setRefsBusy(true);
    try {
      setRefs(await api.get(`/api/contributors/${data.contributor_id}/references`));
    } catch (err) {
      if (notify) notify(err.message, true);
    } finally { setRefsBusy(false); }
  };

  const loadImpact = async () => {
    setTyped('');
    const path = type === 'system'
      ? `/api/systems/${data.system_id}/delete-impact`
      : `/api/flows/${data.flow_id}/delete-impact`;
    try {
      setImpact(await api.get(path));
    } catch (err) {
      // Falling back to the generic warning is better than refusing to delete
      // because a count could not be fetched.
      setImpact({ record: { name: titleOf() }, counts: [], blockers: [],
                  heavy: false, unavailable: true });
      if (notify) notify(err.message, true);
    }
  };

  const deactivate = async () => {
    setRefs(null);
    try {
      const result = await api.put(`/api/contributors/${data.contributor_id}`,
                                   { is_active: 0 });
      onSave('contributor', result);
      if (notify) notify(`${data.name} deactivated.`);
    } catch (err) {
      if (notify) notify(err.message, true);
    }
  };

  const titleOf = () => {
    if (type === 'schema_table') return `${data.schema_name}.${data.table_name}`;
    if (type === 'schema_column') return data.column_name || '';
    return data.name || '';
  };

  const ContributorReadView = ({ data }) => (<>
    {isDeactivated(data) && (
      <div className="drill-banner" style={{ marginTop: 0 }}>
        <span className="drill-icon">&#9432;</span>
        <div className="drill-text">
          <strong style={{display:'inline'}}>Deactivated.</strong> Only a
          SuperAdmin can see this contributor, and they are not offered when
          assigning an Owner or Data Steward. Records that already name them
          still do. Edit to reactivate.
        </div>
      </div>
    )}
    <CollapsibleSection title="Contributor">
      <ReadField label="ID" value={data.contributor_id} />
      <ReadField label="Name" value={data.name} />
      <ReadField label="Title" value={data.effective_title || data.title} />
      <ReadField label="Organization Unit" value={data.organization_unit} />
      <ReadField label="Role Type" value={data.role_type} />
      <ReadField label="Email" value={data.email} />
      <ReadField label="Phone" value={data.phone} />
    </CollapsibleSection>
    <CollapsibleSection title="Governance" domainTag="leadership">
      <ReadField label="Governance Role" value={data.governance_role} />
      <ReadField label="Responsibilities" value={data.governance_responsibilities} multiline />
      <ReadField label="Training Status" value={data.training_status} />
      <ReadField label="Last Training" value={data.last_training_date} />
    </CollapsibleSection>
    {data.notes && <CollapsibleSection title="Notes">
      <div className="field-value multiline" style={{fontSize:'13px'}}>{data.notes}</div>
    </CollapsibleSection>}
  </>);

  const ContributorEditView = ({ form, set, missing }) => (<>
    {isSuper && isDeactivated(form) && (
      <div className="drill-banner" style={{ marginTop: 0 }}>
        <span className="drill-icon">&#9432;</span>
        <div className="drill-text">
          This contributor is deactivated.
          {' '}
          <button className="res-title-link" style={{display:'inline'}}
                  onClick={() => set('is_active', 1)}>Reactivate them</button>
          {' '}and save.
        </div>
      </div>
    )}
    <CollapsibleSection title="Contributor">
      <EditField label="Name" value={form.name} onChange={v=>set('name',v)}
                 invalid={(missing||[]).includes('name')} />
      {/* A contributor with a linked account takes their title from it, so
          editing the contributor's own copy would write to a value nothing
          reads. Shown, with where it comes from, rather than hidden. */}
      {form.account_title
        ? <div className="field-row"><span className="field-label">Title</span>
            <span className="field-value">{form.account_title}
              <span className="gov-hint" style={{display:'block'}}>
                From their user account. They change it in their own profile.
              </span></span></div>
        : <EditField label="Title" value={form.title} onChange={v=>set('title',v)} />}
      <EditField label="Organization Unit" value={form.organization_unit}
                 onChange={v=>set('organization_unit',v)}
                 invalid={(missing||[]).includes('organization_unit')} />
      <EditField label="Role Type" value={form.role_type} onChange={v=>set('role_type',v)} />
      <EditField label="Email" value={form.email} onChange={v=>set('email',v)} />
      <EditField label="Phone" value={form.phone} onChange={v=>set('phone',v)} />
    </CollapsibleSection>
    <CollapsibleSection title="Governance" domainTag="leadership">
      <EditField label="Governance Role" value={form.governance_role} onChange={v=>set('governance_role',v)} />
      <EditField label="Responsibilities" value={form.governance_responsibilities} onChange={v=>set('governance_responsibilities',v)} type="textarea" />
      <EditField label="Training Status" value={form.training_status} onChange={v=>set('training_status',v)} type="select" options={['','Current','Overdue','Not required']} />
      <EditField label="Last Training" value={form.last_training_date} onChange={v=>set('last_training_date',v)} />
    </CollapsibleSection>
    <CollapsibleSection title="Notes">
      <EditField label="" value={form.notes} onChange={v=>set('notes',v)} type="textarea" />
    </CollapsibleSection>
  </>);

  return (
    <div className={`detail-panel ${isOpen ? '' : 'closed'}`}>
      {isOpen && <>
        <div className="panel-header">
          <div style={{flex:1, minWidth:0}}>
            <h2>{editing ? `Edit: ${titleOf()}` : titleOf()}</h2>
            {/* A task's name says nothing about which flow or store it belongs
                to, and that is the first thing you want to know when a flyout
                opens from a circle on the diagram. */}
            {type === 'task' && <div className="panel-subtitle">
              {taskParentLabel(data)}</div>}
          </div>
          <button className="panel-close" onClick={onClose} aria-label="Close">&times;</button>
        </div>
        <div className="panel-actions">
          {!editing && canEdit && <button className="btn btn-edit" onClick={startEdit}>Edit</button>}
          {/* Deactivating is the contributor equivalent of retiring: the record
              stays, the assignments stay, and the person stops being offered.
              It asks first and says what still names them, because the useful
              question is not "are you sure" but "do you realize this person is
              the Data Steward on four systems". */}
          {!editing && isSuper && type === 'contributor' && !isDeactivated(data) &&
            <Tooltip text="Take this contributor out of circulation. Nothing is deleted and existing assignments are kept; they stop being offered when assigning an Owner or Data Steward.">
              <button className="btn" disabled={refsBusy}
                      onClick={loadReferences}>
                {refsBusy ? 'Checking…' : 'Deactivate'}
              </button>
            </Tooltip>}
          {!editing && canEdit && onResetRoute && type === 'flow' &&
            (data.source_anchor || data.dest_anchor || data.waypoints) && (
            <button className="btn"
                    title="Put this arrow back to automatic routing"
                    onClick={() => onResetRoute(data.flow_id)}>
              Reset arrow
            </button>)}
          {!editing && canEdit && onSetHidden && inScenario && ['system','flow'].includes(type) &&
            <button className="btn"
                    title={data.is_hidden
                      ? 'Show this again on the scenario diagram'
                      : 'Take this off the scenario diagram. Nothing is deleted.'}
                    onClick={() => onSetHidden(
                      type === 'system' ? [data.system_id] : [],
                      type === 'flow' ? [data.flow_id] : [],
                      !data.is_hidden)}>
              {data.is_hidden ? 'Show on diagram' : 'Hide from diagram'}
            </button>}
          {/* Retire sits beside Delete because the two are easily confused and
              the distinction matters: retiring says "this plan takes it out of
              service" and keeps it visible, struck through; deleting says "this
              never existed" and removes it from the picture entirely. Only
              inside a scenario, and never for something the scenario proposed —
              there is nothing to retire from. */}
          {!editing && canEdit && onRetire && inScenario && ['system','flow'].includes(type) &&
            data.change_state !== 'proposed' &&
            <Tooltip text={data.change_state === 'removed'
                      ? 'Stop marking this as retired by this plan. It goes back to being shown normally.'
                      : 'Mark this as taken out of service by this plan. It stays on the diagram, faded and struck through, so the plan shows what goes as well as what arrives. Nothing is deleted.'}>
              <button className="btn"
                      onClick={() => setConfirmRetire(data.change_state !== 'removed')}>
                {data.change_state === 'removed' ? 'Not retired after all' : 'Retire in this scenario'}
              </button>
            </Tooltip>}
          {/* Copy is how a repeating job is recorded: one task per occurrence,
              so March's outcome stays visible in June. Everything but the
              dates and the progress comes across. */}
          {!editing && canEdit && onCopyTask && type === 'task' &&
            <Tooltip text="Make another task just like this one — same type, parent, people and subtasks. Every date comes up blank and the progress starts again, so a quarterly job becomes four tasks each with its own outcome.">
              <button className="btn" onClick={() => onCopyTask(data)}>Copy task</button>
            </Tooltip>}
          {!editing && canEdit && onRetire && inScenario && type === 'task' &&
            data.change_state !== 'proposed' &&
            <Tooltip text={data.change_state === 'removed'
                      ? 'Stop marking this task as dropped by this plan.'
                      : 'Mark this task as dropped by this plan. It stays visible, struck through, so the plan shows what goes as well as what arrives.'}>
              <button className="btn"
                      onClick={() => setConfirmRetire(data.change_state !== 'removed')}>
                {data.change_state === 'removed' ? 'Not retired after all' : 'Retire in this scenario'}
              </button>
            </Tooltip>}
          {!editing && canEdit && onDelete && type === 'task' &&
            <Tooltip text={inScenario
                      ? 'Delete this task from the scenario entirely. To show it being dropped instead, use Retire.'
                      : 'Delete this task permanently, with its steps.'}>
              <button className="btn btn-danger"
                      onClick={() => setConfirmTaskDelete(true)}>Delete</button>
            </Tooltip>}
          {!editing && canEdit && onDelete && ['system','flow'].includes(type) &&
            <Tooltip text={inScenario
                      ? 'Delete this from the scenario entirely, as though it had never been there. To show it being taken out of service instead, use Retire.'
                      : 'Delete this permanently.'}>
              <button className="btn btn-danger" onClick={loadImpact}>Delete</button>
            </Tooltip>}
          {!editing && !canEdit && <span style={{fontSize:'12px',color:'#6b6b6b'}}>
            Read-only — your role does not permit editing.</span>}
          {editing && <button className="btn btn-save" onClick={saveEdit}>Save Changes</button>}
          {editing && <button className="btn" onClick={cancelEdit}>Cancel</button>}
        </div>
        <FieldDefs.Provider value={defsContext}>
        <div className="panel-body" ref={bodyRef}>
          {editing && missing.length > 0 && <div className="form-error-summary" role="alert">
            Please complete: {(PANEL_REQUIRED[type] || [])
              .filter(r => missing.includes(r.key)).map(r => r.label).join(', ')}.
          </div>}
          {type === 'system' && !editing && <SystemReadView data={data} onDrill={onDrill}
              contributors={contributors} canEdit={canEdit} notify={notify} isAdmin={isAdmin}
              systems={systems} onSchemaChanged={onSchemaChanged} />}
          {type === 'system' && editing && <SystemEditView form={form} set={set} inScenario={inScenario}
              contributors={contributors} systems={systems} systemTypes={systemTypes} missing={missing} />}
          {type === 'flow' && !editing && <FlowReadView data={data} contributors={contributors}
              canEdit={canEdit} notify={notify} />}
          {type === 'flow' && editing && <FlowEditView form={form} set={set} systems={systems} inScenario={inScenario}
              contributors={contributors} missing={missing} />}
          {type === 'element' && !editing &&
            <ElementReadView data={data} systems={systems} contributors={contributors} />}
          {type === 'element' && editing &&
            <ElementEditView form={form} set={set} missing={missing}
                             systems={systems} contributors={contributors} />}
          {type === 'schema_table' && !editing && <SchemaTableReadView data={data} contributors={contributors} />}
          {type === 'schema_table' && editing && <SchemaGovEditView form={form} set={set} inherited={data.inherited} level="table" contributors={contributors} />}
          {type === 'schema_column' && !editing && <SchemaColumnReadView data={data} contributors={contributors} />}
          {type === 'schema_column' && editing && <SchemaGovEditView form={form} set={set} inherited={data.inherited} level="field" contributors={contributors} />}
          {type === 'contributor' && !editing && <ContributorReadView data={data} />}
          {type === 'contributor' && editing && <ContributorEditView form={form} set={set} missing={missing} />}
          {type === 'task' && !editing &&
            <TaskReadView data={data} contributors={contributors}
                          canEdit={canEdit} notify={notify} />}
          {type === 'task' && editing &&
            <TaskEditView form={form} set={set} original={data} missing={missing}
                          allTasks={tasks}
                          onParent={v => setForm(f => ({ ...f, ...splitParent(v),
                                                         pos_main: null, pos_cross: null }))}
                          contributors={contributors} systems={systems} flows={flows}
                          taskTypes={taskTypes} inScenario={inScenario} />}
        </div>
        </FieldDefs.Provider>
      </>}
      {refs && <ConfirmDialog
        title={`Deactivate ${refs.contributor.name}?`}
        confirmLabel="Deactivate"
        message={refs.total === 0 && !refs.linked_user && refs.scenarios.length === 0
          ? 'Nothing currently names this contributor. They will stop being offered when assigning an Owner or Data Steward, and only a SuperAdmin will see them.'
          : 'They will stop being offered when assigning an Owner or Data Steward, and only a SuperAdmin will see them. Nothing is deleted and the assignments below are kept — so these records will go on naming someone who is no longer in circulation, until you reassign them.'}
        detail={<div className="ref-warning">
          {refs.linked_user && (
            <div className="ref-group">
              <strong>Linked user account</strong>
              <div className="gov-hint">
                {refs.linked_user.email} keeps working and stays linked.
                Deactivating a contributor does not affect anyone&rsquo;s sign-in.
              </div>
            </div>
          )}
          {refs.records.map(g => (
            <div className="ref-group" key={g.kind}>
              <strong>{g.label} &mdash; {g.count}</strong>
              <ul>
                {g.named.map(r => <li key={r.id}>{r.label || r.id}</li>)}
                {g.count > g.named.length &&
                  <li className="gov-hint">and {g.count - g.named.length} more</li>}
              </ul>
            </div>
          ))}
          {refs.scenarios.length > 0 && (
            <div className="ref-group">
              <strong>Also exists as a copy in {refs.scenarios.length} scenario(s)</strong>
              <ul>{refs.scenarios.map(sc =>
                <li key={sc.scenario_id}>{sc.name}</li>)}</ul>
              <div className="gov-hint">
                Those copies are separate records and are not affected.
              </div>
            </div>
          )}
        </div>}
        onCancel={() => setRefs(null)}
        onConfirm={deactivate} />}

      {impact && (impact.blockers || []).length > 0 && <ConfirmDialog
        title={type === 'system' ? 'This system cannot be deleted yet'
                                 : 'This data flow cannot be deleted yet'}
        confirmLabel="Close"
        message="Something still depends on it."
        detail={<div className="ref-warning">
          {impact.blockers.map((b, n) => (
            <div className="ref-group" key={n}>
              <strong>{b.reason}</strong>
              <ul>
                {b.named.map(r => <li key={r.id}>{r.label || r.id}</li>)}
                {b.count > b.named.length &&
                  <li className="gov-hint">and {b.count - b.named.length} more</li>}
              </ul>
            </div>
          ))}
        </div>}
        onCancel={() => setImpact(null)}
        onConfirm={() => setImpact(null)} />}

      {impact && (impact.blockers || []).length === 0 && <ConfirmDialog
        title={type === 'system' ? 'Delete this system?' : 'Delete this data flow?'}
        danger confirmLabel="Delete"
        message={`"${titleOf()}" will be permanently removed.`}
        detail={<div className="ref-warning">
          {impact.unavailable
            ? <div className="confirm-warn">{type === 'system'
                ? 'Any schema, attached documents and links belonging to this system go with it.'
                : 'The links between this flow and its data elements, plus any attached documents, go with it.'}</div>
            : impact.counts.length === 0
            ? <div className="confirm-warn">Nothing else is attached to it.</div>
            : <div className="ref-group">
                <strong>These go with it</strong>
                <ul>{impact.counts.map(c => (
                  <li key={c.label}>
                    {c.count.toLocaleString()} {c.label}{c.count === 1 ? '' : 's'}
                  </li>))}</ul>
              </div>}
          <div className="confirm-warn" style={{marginTop:8}}>
            This cannot be undone from the audit log — restoring it would need a
            database backup.
          </div>
          {/* Typing the name is asked only where the cascade is large enough
              that the count itself is a surprise. For an empty flow it would
              be friction with nothing behind it. */}
          {impact.heavy && (
            <div className="form-group" style={{marginTop:10}}>
              <label htmlFor="del-confirm">
                Type <strong>{impact.record.name}</strong> to confirm
              </label>
              <input id="del-confirm" value={typed} autoFocus
                     onChange={e => setTyped(e.target.value)} />
            </div>
          )}
        </div>}
        confirmDisabled={impact.heavy && typed.trim() !== impact.record.name}
        onCancel={() => setImpact(null)}
        onConfirm={() => { setImpact(null); onDelete(type, data); }} />}
      {confirmTaskDelete && <ConfirmDialog
        title="Delete this task?"
        danger confirmLabel="Delete"
        message={`"${titleOf()}" will be permanently removed.`}
        detail={<div className="ref-warning">
          <div className="confirm-warn">
            Its steps and the people named on it go with it. The flow or system
            it is attached to is not affected.
          </div>
          <div className="confirm-warn" style={{marginTop:8}}>
            This cannot be undone from the audit log — restoring it would need a
            database backup.
          </div>
        </div>}
        onCancel={() => setConfirmTaskDelete(false)}
        onConfirm={() => { setConfirmTaskDelete(false); onDelete(type, data); }} />}
      {confirmRetire !== null && <ConfirmDialog
        title={confirmRetire
          ? (type === 'system' ? 'Retire this system in the scenario?'
             : type === 'task' ? 'Retire this task in the scenario?'
                               : 'Retire this data flow in the scenario?')
          : 'No longer retired?'}
        confirmLabel={confirmRetire ? 'Retire it' : 'Bring it back'}
        message={confirmRetire
          ? `"${titleOf()}" will be shown as being taken out of service by this plan.`
          : `"${titleOf()}" will go back to being shown normally in this scenario.`}
        detail={<div className="gov-hint" style={{ marginTop: 8 }}>
          {confirmRetire
            ? 'It stays on the diagram, faded and struck through, so the plan shows what goes as well as what arrives. Nothing is deleted, Current Architecture is untouched, and you can undo this at any time.'
            : 'Nothing was ever deleted, so there is nothing to restore — this only changes how the scenario describes it.'}
        </div>}
        onCancel={() => setConfirmRetire(null)}
        onConfirm={() => { const r = confirmRetire; setConfirmRetire(null); onRetire(type, data, r); }} />}
    </div>
  );
}

        ))}</tbody>
      </table>
    </CollapsibleSection>}
  </>);

function FlowEditView({ form, set, systems, contributors, missing, inScenario }) {
  const bad = (k) => (missing || []).includes(k);
  const setEndpoint = endpointSetter(form, set, systems);
  // Only true while the name is still the one generated from the two systems.
  const nameIsGenerated = !form.name ||
    form.name === autoFlowName(systems, form.source_system_id, form.destination_system_id);
  return (<>
    <CollapsibleSection title="Overview">
      {/* Source and Destination sit above the name because the name follows
          from them: while it is still the generated "A to B", changing either
          system rewrites it. Once someone types their own name it is left
          alone, however the systems change afterwards. */}
      <div className="edit-field-row"><span className="field-label">Source</span>
        <Combo value={form.source_system_id || ''} ariaLabel="Source"
               onChange={v=>setEndpoint('source_system_id', v)}
               options={byName(systems).map(s =>
                 ({ value: s.system_id, label: systemOption(s) }))} /></div>
      <div className="edit-field-row"><span className="field-label">Destination</span>
        <Combo value={form.destination_system_id || ''} ariaLabel="Destination"
               onChange={v=>setEndpoint('destination_system_id', v)}
               options={byName(systems).map(s =>
                 ({ value: s.system_id, label: systemOption(s) }))} /></div>
      <div className="edit-field-row"><span className="field-label">Name</span>
        <div style={{flex:1}}>
          <input className={'edit-input' + (bad('name') ? ' field-error' : '')}
                 value={form.name || ''} aria-invalid={bad('name')}
                 onChange={e=>set('name', e.target.value)} />
          {bad('name') && <div className="field-error-msg">This field is required</div>}
          {nameIsGenerated && form.name && !bad('name') &&
            <div className="gov-hint">Follows the two systems above until you change it.</div>}
        </div></div>
      {/* Short label for the diagram. The full name is usually a sentence and
          would cover the picture, so this is separate rather than derived. */}
      <div className="edit-field-row"><span className="field-label">Display Name</span>
        <div style={{flex:1}}>
          <input className="edit-input" value={form.display_name || ''} maxLength={20}
                 placeholder="Optional — shown on the diagram instead of the ID"
                 onChange={e=>set('display_name', e.target.value)} />
          <div className="gov-hint">
            {(form.display_name || '').length}/20 · leave blank to show {form.flow_id}

// ===== Schema Table / Column Governance Panels =====
function GovEditField({ field, label, form, set, inherited, type, options, contributors }) {
  const inh = (inherited && inherited[field]) || { value: null, source: 'none' };
  const hasInh = inh.value !== null && inh.value !== undefined && inh.value !== '';
  const raw = form[field];
  let control;
  if (type === 'tri') {
    const val = (raw === null || raw === undefined || raw === '') ? '' : String(raw);
    control = <select className="edit-select" value={val} onChange={e => { const v = e.target.value; set(field, v === '' ? null : Number(v)); }}>
      <option value="">(inherit)</option><option value="1">Yes</option><option value="0">No</option></select>;
  } else if (type === 'select') {
    control = <select className="edit-select" value={raw || ''} onChange={e => set(field, e.target.value)}>
      <option value="">(inherit)</option>{options.map(o => <option key={o} value={o}>{o}</option>)}</select>;
  } else if (type === 'person') {
    // A contributor key, not free text. Typed by hand it was unvalidated and
    // displayed as "CON-003"; the blank option is how an override is cleared
    // so the value falls back to the parent.
    control = (
      <Combo value={raw || ''} ariaLabel={label}
             onChange={v => set(field, v || null)}
             options={[{ value: '', label: '(inherit)', hint: true },
                       ...assignable(contributors, raw).map(c =>
                         ({ value: c.contributor_id,
                            label: contributorLabel(c.contributor_id, contributors) }))]} />);
  } else if (type === 'textarea') {
    control = <textarea className="edit-textarea" value={raw || ''} placeholder="(inherit / none)" onChange={e => set(field, e.target.value)} />;
  } else {
    control = <input className="edit-input" value={raw || ''} placeholder="(inherit)" onChange={e => set(field, e.target.value)} />;
  }
  return (
    <div style={{ marginBottom: 10 }}>
      <div className="edit-field-row" style={{ marginBottom: 2 }}><span className="field-label">{label}</span>{control}</div>
      <div className="gov-hint">{hasInh ? `Inherits: ${fmtGov(field, inh.value, contributors)} (${SRC_LABEL[inh.source]})` : 'No inherited value'}</div>
    </div>
  );
}

// Multi-select hiding. Only offered inside a scenario, where hiding means
// "not part of what I am planning" — on Current Architecture there is nothing
// to tidy away, and a hidden live record would just be a record people cannot
// find. Selection lives here rather than in App because it is scratch state:
// switching view or reloading should forget it.
function useHideSelection(rows, idKey) {
  const [picked, setPicked] = useState([]);
  const present = new Set((rows || []).map(r => r[idKey]));
  const valid = picked.filter(id => present.has(id));
  const toggle = (id) => setPicked(p =>
    p.includes(id) ? p.filter(x => x !== id) : p.concat([id]));
  const clear = () => setPicked([]);
  const all = () => setPicked((rows || []).map(r => r[idKey]));
  return { picked: valid, toggle, clear, all,
           allPicked: valid.length > 0 && valid.length === (rows || []).length };
}

      <button className="btn" onClick={allPicked ? onClear : onSelectAll}>

      <span className="gov-hint">
        Hiding only affects what you see here. Nothing is deleted, and nothing is

  );
}

// ===== Required-field validation =====
// The Save button stays enabled; pressing it surfaces what's missing rather
// than leaving the user guessing why a grayed-out button won't respond.
function useRequired(fields, scrollRef) {
  const [touched, setTouched] = useState(false);
  // Required fields are often below the fold, so a failed save must bring the
  // message into view — otherwise pressing Save looks like it did nothing.
  const revealErrors = () => {
    // The element holding the fields is not always the one that scrolls: in the
    // Add modals the scroll container is the modal itself, so scrolling the
    // body did nothing and pressing Save looked like it was ignored. Walk up
    // until something can actually move.
    let el = scrollRef && scrollRef.current;
    while (el && el.scrollHeight <= el.clientHeight + 1) el = el.parentElement;
    if (!el) el = scrollRef && scrollRef.current;
    if (!el) return;
    if (typeof el.scrollTo === 'function') el.scrollTo({ top: 0, behavior: 'smooth' });
    else el.scrollTop = 0;
  };
  const missing = (form) => fields.filter(f => {
    const v = form[f.key];
    return v === undefined || v === null || String(v).trim() === '';
  });
  return {
    touched, setTouched,
    missing,
    attempt: (form, onValid) => {
      const gaps = missing(form);
      if (gaps.length) { setTouched(true); revealErrors(); return gaps; }
      setTouched(false);
      onValid();
      return [];
    },
    errorFor: (form, key) => touched &&
      missing(form).some(f => f.key === key) ? 'This field is required' : null,
    summary: (form) => {
      if (!touched) return null;
      const gaps = missing(form);
      if (!gaps.length) return null;
      return `Please complete: ${gaps.map(g => g.label).join(', ')}.`;
    },
  };
}

// A labeled input that shows its own required-field error.
// ===== Fields in an Add window =====
// `col` is the database column, and declaring it is the entire point of these
// two components. Every optional field in the Add windows used to be a
// hand-written `form-group` whose column appeared only inside an onChange
// closure — so a modal field had no identity anything else could use. Three
// consequences, all of which this removes: the catalog generator had to
// recover the column with a regex and managed 40 of 80; field hiding had
// nothing to ask; and a definition written in Preferences could not be shown
// here, which the 0.5.0 notes promised for this release.
//
// `entity` is passed explicitly rather than read from context. An Add window
// is not rendered inside the details panel's provider, and it is the only
// thing that knows which record type it is about to create.
//
// `ReqField` is the required variant and keeps its own component because it
// carries the validation wiring — error text, aria-invalid, the id the error
// message is tied to. It is never hidden: the form will not submit without a
// value, so hiding it would make that record type impossible to create.
function ReqField({ label, value, onChange, error, type, options, placeholder, id,
                   entity, col }) {
  const cls = error ? 'field-error' : '';
  return (
    <div className="form-group">
      <label htmlFor={id}>{label}<FieldInfo label={cleanLabel(label)} entity={entity} /></label>
      {type === 'select'
        ? <Combo id={id} value={value} onChange={onChange} invalid={!!error}
                 placeholder="Select…"
                 describedBy={error ? id + '-err' : undefined}
                 options={[{ value: '', label: 'Select…', hint: true },
                           ...(options || [])]} />
        : type === 'textarea'
        ? <textarea id={id} className={cls} value={value || ''} placeholder={placeholder}
                    onChange={e => onChange(e.target.value)} aria-invalid={!!error}
                    aria-describedby={error ? id + '-err' : undefined} />
        : <input id={id} className={cls} value={value || ''} placeholder={placeholder}
                 onChange={e => onChange(e.target.value)} aria-invalid={!!error}
                 aria-describedby={error ? id + '-err' : undefined} />}
      {error && <div className="field-error-msg" id={id + '-err'}>{error}</div>}
    </div>
  );
}

// The optional variant. Returns nothing at all when the field has been hidden
// for this record type, which is what makes one check in Preferences empty the
// field out of the Add window as well as the details panel.
//
// `wide` opts out of the two-column `form-row` so a textarea can have the full
// width, matching what the hand-written blocks did. `hint` is the small gray
// line some fields carry beneath the input.
function ModalField({ entity, col, label, value, onChange, type, options,
                      placeholder, id, maxLength, hint, children, blank,
                      min, max }) {
  const ctx = useContext(FieldDefs);
  if (isHidden(ctx, entity, { col })) return null;
  const marker = <FieldInfo label={cleanLabel(label)} entity={entity} />;
  const common = {
    id, value: value === null || value === undefined ? '' : value,
    onChange: e => onChange(e.target.value),
  };
  return (
    <div className="form-group">
      <label htmlFor={id}>{label}{marker}</label>
      {children ? children
        : type === 'select'
        ? <Combo id={id} value={common.value} onChange={onChange}
                 /* Three of these selects always hold a value and never offered
                    an empty choice — Status, Entry type and Frequency all
                    default to something. Offering one unconditionally would
                    have let a blank be chosen where it previously could not
                    be. */
                 options={[...(blank !== false
                   ? [{ value: '', label: placeholder || 'Select...', hint: true }]
                   : []), ...(options || [])]} />
        : type === 'textarea'
        ? <textarea {...common} placeholder={placeholder} />
        : <input {...common} type={type === 'date' ? 'date' : undefined}
                 placeholder={type === 'date' ? undefined : placeholder}
                 min={type === 'date' && min ? min : undefined}
                 max={type === 'date' && max ? max : undefined}
                 maxLength={maxLength} />}
      {hint && <div className="gov-hint">{hint}</div>}
    </div>
  );
}

// A checkbox in an Add window. Its own component because the markup differs —
// the box precedes its caption inside the label rather than sitting under one
// — and because the value is a boolean the modals convert to 0/1 on save.
function ModalCheck({ entity, col, label, checked, onChange }) {
  const ctx = useContext(FieldDefs);
  if (isHidden(ctx, entity, { col })) return null;
  return (
    <label className="check-inline">
      <input type="checkbox" checked={!!checked}
             onChange={e => onChange(e.target.checked)} />
      {label}<FieldInfo label={cleanLabel(label)} entity={entity} />
    </label>
  );
}

// ===== Email status and test send =====
// Every other path in the email feature hides its failures on purpose: a
// forgot-password request must answer the same way whether or not the address
// exists, so an administrator who has typed the wrong port has no way to find
// out. This is the one place that reports the real reason, and it is safe
// because the test message goes to the person who pressed the button.
//
// It reads from the server rather than from the Preferences draft beside it,
// because the thing that most often stops mail working — the credential — is
// an environment variable, so the answer is not on this screen at all. Which
// is also why it says to save first: pressing Send straight after typing a
// host would test the host the server still has.
function EmailStatus({ notify }) {
  const [info, setInfo] = useState(null);
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);

  const load = useCallback(() => {
    api.get('/api/email/test').then(setInfo).catch(() => setInfo(null));
  }, []);
  useEffect(() => { load(); }, [load]);

  const send = async () => {
    setBusy(true); setResult(null);
    try {
      const r = await api.post('/api/email/test', {});
      setResult(r);
      if (r.ok) notify(`Test message sent to ${r.sent_to}.`);
      else notify('The test message could not be sent.', true);
    } catch (err) {
      notify(err.message, true);
    } finally { setBusy(false); load(); }
  };

  if (!info) return null;
  return (
    <div className="pref-group">
      <h3>Email status</h3>
      <div className="pref-row">
        <div className="pref-label">
          <b>Credential</b>
          <span>
            {info.transport === 'none'
              ? 'No transport is selected, so no credential is needed.'
              : info.secret_present
                ? `Found in ${info.secret_env_var}.`
                : `Not found. Set ${info.secret_env_var} in the environment ` +
                  `where this app runs, then restart it. It is deliberately ` +
                  `not set from this screen, so it is never stored in the ` +
                  `database or carried in a backup.`}
          </span>
        </div>
        <div className="pref-control">
          {info.transport === 'none' ? '—'
            : info.secret_present ? 'Present' : 'Missing'}
        </div>
      </div>
      {info.problems && info.problems.length > 0 && (
        <div className="pref-row">
          <div className="pref-label">
            <b>Not ready to send</b>
            <span>
              <ul style={{margin:'4px 0 0 16px'}}>
                {info.problems.map((x, i) => <li key={i}>{x}</li>)}
              </ul>
            </span>
          </div>
          <div className="pref-control">&nbsp;</div>
        </div>
      )}
      {!!info.sink_active && (
        <div className="pref-row">
          <div className="pref-label">
            <b>Test sink is active</b>
            <span>
              EMAIL_SINK_PATH is set in this environment, so messages are
              written to a file and nothing is actually delivered. This should
              only ever be set in a test environment.
            </span>
          </div>
          <div className="pref-control">On</div>
        </div>
      )}
      <div className="pref-row">
        <div className="pref-label">
          <b>Send a test message</b>
          <span>
            Sends one message to your own address and reports exactly what
            happened. Save any changes above first &mdash; this tests the
            settings the server currently has, not what is typed on screen.
          </span>
        </div>
        <div className="pref-control">
          <button className="btn" onClick={send}
                  disabled={busy || !info.configured}>
            {busy ? 'Sending…' : 'Send test'}
          </button>
        </div>
      </div>
      {result && (
        <div className="pref-row">
          <div className="pref-label">
            <b>{result.ok ? 'Sent' : 'Failed'}</b>
            <span>{result.detail}</span>
          </div>
          <div className="pref-control">&nbsp;</div>
        </div>
      )}
    </div>
  );
}

// ===== Minimal markdown =====
// Release notes support a deliberately small subset: headings, bullets, bold,
// italic and links. Input is escaped first, so notes can never inject markup.
function renderMarkdown(text) {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = (s) => esc(s)
    // Images, before links, since ![alt](src) also matches the link pattern.
    // Only local files under /help/ are allowed — that is where the static
    // handler serves static/help/ from. Release notes are editable inside the
    // app, and permitting a remote image would let another server see who read
    // them and when.
    .replace(/!\[([^\]]*)\]\((\/help\/[A-Za-z0-9._-]+)\)/g,
             '<img src="$2" alt="$1" class="md-img" loading="lazy" />')
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, '')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
             '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');

  // Blocks are separated by blank lines, not by line endings. Source text is
  // hard-wrapped for readability, so treating every line as its own paragraph
  // broke sentences apart and stranded the last word on its own line.
  const out = [];
  let list = null;      // accumulated <li> html
  let item = null;      // the current list item's text, still being collected
  let para = null;      // the current paragraph's text, still being collected

  const closeItem = () => {
    if (item !== null) { list.push(`<li>${inline(item)}</li>`); item = null; }
  };
  const closeList = () => {
    closeItem();
    if (list && list.length) out.push(`<ul>${list.join('')}</ul>`);
    list = null;
  };
  const closePara = () => {
    if (para !== null) { out.push(`<p>${inline(para)}</p>`); para = null; }
  };

  (text || '').split('\n').forEach(raw => {
    const line = raw.replace(/\s+$/, '');
    const bullet = line.match(/^\s*[-*]\s+(.*)$/);
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    const indented = /^\s+\S/.test(line);

    if (!line.trim()) { closeList(); closePara(); return; }

    if (heading) { closeList(); closePara(); out.push(`<h2>${inline(heading[2])}</h2>`); return; }

    if (bullet) {
      closePara();
      if (!list) list = [];
      closeItem();
      item = bullet[1];
      return;
    }

    // An indented line under a bullet continues that bullet.
    if (item !== null && indented) { item += ' ' + line.trim(); return; }

    closeList();
    para = para === null ? line.trim() : para + ' ' + line.trim();
  });

  closeList();
  closePara();
  return out.join('');
}

// ===== Help / knowledge base =====
// A panel that slides up from the bottom, so it can sit over whatever you were
// looking at without navigating away — the question is nearly always about the
// screen you are on.
function HelpPanel({ screen, onClose, notify }) {
  const [data, setData] = useState({ for_this_screen: [], articles: [] });
  const [query, setQuery] = useState('');
  const [openId, setOpenId] = useState(null);
  const [loading, setLoading] = useState(true);
  const searchRef = useRef(null);
  const bodyRef = useRef(null);

  useEffect(() => {
    setLoading(true);
    api.get(`/api/help?screen=${encodeURIComponent(screen || '')}`)
      .then(setData)
      .catch(e => notify(e.message, true))
      .finally(() => setLoading(false));
  }, [screen, notify]);

  // Escape closes the panel, and closes an open article first, so it never
  // takes two guesses to get back to where you were.
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== 'Escape') return;
      if (openId) setOpenId(null); else onClose();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [openId, onClose]);

  useEffect(() => { if (searchRef.current) searchRef.current.focus(); }, []);
  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = 0; }, [openId]);

  const q = query.trim().toLowerCase();
  const matches = !q ? [] : data.articles.filter(a =>
    a.title.toLowerCase().includes(q) ||
    a.summary.toLowerCase().includes(q) ||
    (a.body || '').toLowerCase().includes(q));

  const open = data.articles.find(a => a.id === openId);
  const relevantIds = new Set((data.for_this_screen || []).map(a => a.id));
  const pinnedIds = new Set((data.pinned || []).map(a => a.id));

  // A short piece of the article around the first match, so a search result
  // shows why it matched rather than just repeating the summary.
  const snippet = (a) => {
    const body = (a.body || '').replace(/[#*`>]/g, ' ').replace(/\s+/g, ' ');
    const at = body.toLowerCase().indexOf(q);
    if (at < 0) return a.summary;
    const from = Math.max(0, at - 60);
    return (from > 0 ? '…' : '') + body.slice(from, at + 140).trim() + '…';
  };

  const Item = ({ a }) => (
    <button className="help-item" onClick={() => setOpenId(a.id)}>
      <div className="help-item-title">{a.title}</div>
      <div className="help-item-summary">{q ? snippet(a) : a.summary}</div>
    </button>
  );

  return (
    <div className="help-sheet" role="dialog" aria-modal="false"
         aria-labelledby="help-title">
      <div className="help-header">
        <span id="help-title">{open ? open.title : 'Help'}</span>
        {open && (
          <button className="btn" onClick={() => setOpenId(null)}>
            &larr; All articles
          </button>
        )}
        <span style={{ flex: 1 }} />
        <button className="panel-close" onClick={onClose} aria-label="Close help">
          &times;
        </button>
      </div>

      {!open && (
        <div className="help-search">
          <label htmlFor="help-q" className="sr-only">Search help articles</label>
          <input id="help-q" ref={searchRef} type="text" value={query}
                 placeholder="Search help…" autoComplete="off"
                 onChange={e => setQuery(e.target.value)} />
        </div>
      )}

      <div className="help-body" ref={bodyRef}>
        {loading && <div className="help-empty">Loading…</div>}

        {!loading && open && (
          <div className="md" dangerouslySetInnerHTML={{ __html: renderMarkdown(open.body) }} />
        )}

        {!loading && !open && q && (
          <React.Fragment>
            <div className="help-section">
              {matches.length} {matches.length === 1 ? 'result' : 'results'}
            </div>
            {matches.map(a => <Item key={a.id} a={a} />)}
            {matches.length === 0 && (
              <div className="help-empty">
                Nothing matched “{query}”. Try a word that would appear in the
                app itself — “scenario”, “governance”, “schema”.
              </div>
            )}
          </React.Fragment>
        )}

        {!loading && !open && !q && (
          <React.Fragment>
            {/* Pinned articles sit above everything with no heading of their
                own — an introduction does not belong under "For this screen",
                but it should still be the first thing anyone sees. */}
            {data.articles.filter(a => pinnedIds.has(a.id))
              .map(a => <Item key={a.id} a={a} />)}
            {relevantIds.size > 0 && (
              <React.Fragment>
                <div className="help-section">For this screen</div>
                {data.articles.filter(a => relevantIds.has(a.id))
                  .map(a => <Item key={a.id} a={a} />)}
                <div className="help-section">Everything else</div>
              </React.Fragment>
            )}
            {data.articles.filter(a => !relevantIds.has(a.id) && !pinnedIds.has(a.id))
              .map(a => <Item key={a.id} a={a} />)}
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

  const save = async () => {

      <div style={{ flex: 1, fontSize: 12, color: '#6b6b6b' }}>
