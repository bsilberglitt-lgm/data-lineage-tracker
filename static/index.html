                      <strong>{f.field}</strong>:{' '}
                      {String(f.reverted_from === null ? '(empty)' : f.reverted_from).slice(0, 60)}
                      {' → '}
                      {String(f.restored_to === null ? '(empty)' : f.restored_to).slice(0, 60)}
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onLater}>Remind me later</button>
          <button className="btn btn-primary" onClick={onAcknowledge}>Got it</button>
        </div>
      </div>
    </div>
  );
}

// ===== What's-new modal (shown once per release) =====
function WhatsNewModal({ releases, onLater, onAcknowledge }) {
  if (!releases || releases.length === 0) return null;
  const many = releases.length > 1;
  return (
    <div className="modal-overlay">
      <div className="modal release-modal" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
        <div className="modal-header">
          {many ? `What's new — ${releases.length} releases since your last visit` : "What's new"}
        </div>
        <div className="release-scroll">
          {/* Oldest first, so reading top to bottom follows what happened. */}
          {releases.map(r => <ReleaseEntry key={r.version} release={r} />)}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onLater}>Remind me later</button>
          <button className="btn btn-primary" onClick={onAcknowledge}>Got it</button>
        </div>
      </div>
    </div>
  );
}

// ===== Releases screen: history for everyone, editing for SuperAdmin =====
function ReleasesScreen({ canEdit, notify, currentVersion }) {
  const [releases, setReleases] = useState([]);
  const [editing, setEditing] = useState(null);
  const [adding, setAdding] = useState(false);
  const blank = { version: '', title: '', notes: '', released_date: '', is_published: 0 };
  const [form, setForm] = useState(blank);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const load = useCallback(() => {
    api.get('/api/releases').then(d => setReleases(d.releases || []))
      .catch(e => notify(e.message, true));
  }, [notify]);
  useEffect(() => { load(); }, [load]);

  const save = async () => {
    try {
      if (editing) await api.put(`/api/releases/${editing.version}`, form);
      else await api.post('/api/releases', form);
      setEditing(null); setAdding(false); load(); notify('Saved.');
    } catch (err) { notify(err.message, true); }
  };
  const publish = async (r, value) => {
    try {
      await api.put(`/api/releases/${r.version}`, { is_published: value });
      load(); notify(value ? `v${r.version} published.` : `v${r.version} unpublished.`);
    } catch (err) { notify(err.message, true); }
  };

  return (<div className="screen"><div className="table-view">
    <div style={{ display: 'flex', alignItems: 'center', marginBottom: 12 }}>
      <div style={{ flex: 1, fontSize: 12, color: '#6b6b6b' }}>
        Release history. Everyone sees published notes; drafts are visible to SuperAdmins only.
        This deployment is running <strong>v{currentVersion}</strong>.
      </div>
      {canEdit && <button className="btn btn-primary"
        onClick={() => { setForm(blank); setAdding(true); }}>+ Add Release</button>}
    </div>
    {releases.length === 0 && <div className="empty-state">No releases recorded yet.</div>}
    {releases.map(r => (
      <div className="pref-group release-card" key={r.version}>
        <div className="release-card-body">
          <ReleaseEntry release={r} />
          {canEdit && <div className="res-actions">
            <button className="btn btn-edit" onClick={() => {
              setForm({ ...blank, ...r }); setEditing(r);
            }}>Edit</button>
            <button className="btn" onClick={() => publish(r, r.is_published ? 0 : 1)}>
              {r.is_published ? 'Unpublish' : 'Publish'}
            </button>
          </div>}
        </div>
      </div>
    ))}

    {(adding || editing) && <div className="modal-overlay">
      <div className="modal release-modal" role="dialog" aria-modal="true">
        <div className="modal-header">{editing ? `Edit v${editing.version}` : 'Add Release'}
          <button className="panel-close"
                  onClick={() => { setAdding(false); setEditing(null); }}>&times;</button></div>
        <div className="modal-body" style={{ overflowY: 'auto' }}>
          <div className="form-row">
            <div className="form-group"><label>Version *</label>
              <input value={form.version} disabled={!!editing}
                     onChange={e => set('version', e.target.value)} placeholder="0.3.0" /></div>
            <div className="form-group"><label>Release date</label>
              <input type="date" value={form.released_date || ''}
                     onChange={e => set('released_date', e.target.value)} /></div>
          </div>
          <div className="form-group"><label>Title</label>
            <input value={form.title || ''} onChange={e => set('title', e.target.value)} /></div>
          <div className="form-group"><label>Notes (markdown: ## heading, * bullet, **bold**, [link](url))</label>
            <textarea style={{ minHeight: 200, fontFamily: 'ui-monospace, Menlo, monospace', fontSize: 12 }}
                      value={form.notes || ''} onChange={e => set('notes', e.target.value)} /></div>
          <div className="checkbox-row"><label>
            <input type="checkbox" checked={!!form.is_published}
                   onChange={e => set('is_published', e.target.checked ? 1 : 0)} />
            Published — everyone sees this, and it triggers the what's-new modal
          </label></div>
          {form.notes && <>
            <div className="modal-section-title">Preview</div>
            <ReleaseBody notes={form.notes} />
          </>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={() => { setAdding(false); setEditing(null); }}>Cancel</button>
          <button className="btn btn-primary" onClick={save}>Save</button>
        </div>
      </div></div>}
  </div></div>);
}

// ===== Confirm dialog =====
// ===== Tooltip =====
// Replaces the browser's own `title` attribute, which could not be used for
// this app's explanatory text for three reasons:
//
//   * **The delay is the browser's and cannot be changed** — roughly a second,
//     and the timer restarts on every cursor movement, so it feels as though
//     you have to find one exact spot and hold still.
//   * **It is invisible to keyboard users.** A `title` appears on hover only,
//     so anyone tabbing through never sees it. ACCESSIBILITY.md lists that as
//     a gap; this closes it rather than adding another.
//   * **It cannot be styled or measured**, so a long field definition is
//     rendered by the browser however it likes.
//
// Rendered through a portal rather than as a CSS pseudo-element on the
// trigger. The details flyout scrolls (`overflow-y: auto`), and anything drawn
// inside it is clipped at the panel edge — which is exactly where the field
// definitions live. A portal escapes that.
const TOOLTIP_DELAY_MS = 120;

function Tooltip({ text, children, placement = 'top' }) {
  const [shown, setShown] = useState(false);
  const [pos, setPos] = useState(null);
  const anchorRef = useRef(null);
  const timer = useRef(null);
  // Stable id so aria-describedby can point at the bubble.
  const idRef = useRef('tip-' + Math.random().toString(36).slice(2, 9));

  const measure = () => {
    const el = anchorRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    setPos({ left: r.left + r.width / 2, top: r.top, bottom: r.bottom });
  };

  const open = () => {
    clearTimeout(timer.current);
    timer.current = setTimeout(() => { measure(); setShown(true); }, TOOLTIP_DELAY_MS);
  };
  // Keyboard focus shows it at once: someone tabbing has already committed to
  // this control and should not be made to wait.
  const openNow = () => { clearTimeout(timer.current); measure(); setShown(true); };
  const close = () => { clearTimeout(timer.current); setShown(false); };

  useEffect(() => () => clearTimeout(timer.current), []);
  // A tooltip left behind by a scroll or a resize would point at nothing.
  useEffect(() => {
    if (!shown) return;
    const bail = () => close();
    window.addEventListener('scroll', bail, true);
    window.addEventListener('resize', bail);
    const esc = (e) => { if (e.key === 'Escape') close(); };
    window.addEventListener('keydown', esc);
    return () => {
      window.removeEventListener('scroll', bail, true);
      window.removeEventListener('resize', bail);
      window.removeEventListener('keydown', esc);
    };
  }, [shown]);

  if (!text) return children;

  // Clamped to the viewport so a tooltip near an edge stays readable rather
  // than hanging off the side.
  const W = 260;
  const style = pos ? {
    left: Math.min(Math.max(pos.left, W / 2 + 8), window.innerWidth - W / 2 - 8),
    top: placement === 'bottom' ? pos.bottom + 8 : pos.top - 8,
    maxWidth: W,
  } : null;

  return (
    <React.Fragment>
      <span ref={anchorRef} className="tip-anchor"
            onMouseEnter={open} onMouseLeave={close}
            onFocus={openNow} onBlur={close}
            aria-describedby={shown ? idRef.current : undefined}>
        {children}
      </span>
      {shown && pos && ReactDOM.createPortal(
        <div id={idRef.current} role="tooltip"
             className={'tip-bubble tip-' + placement} style={style}>
          {text}
        </div>,
        document.body)}
    </React.Fragment>
  );
}

function ConfirmDialog({ title, message, detail, confirmLabel, danger, onConfirm, onCancel }) {
  return (
    <div className="modal-overlay" onClick={onCancel}>
      <div className="modal confirm-box" role="alertdialog" aria-modal="true"
           aria-labelledby="confirm-title" onClick={e => e.stopPropagation()}>
        <div className="modal-header" id="confirm-title">{title}</div>
        <div className="modal-body">
          <div>{message}</div>
          {detail}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onCancel}>Cancel</button>
          <button className={`btn ${danger ? '' : 'btn-primary'}`}
                  style={danger ? { background: '#c0392b', color: '#fff', borderColor: '#c0392b' } : {}}
                  onClick={onConfirm}>{confirmLabel || 'Confirm'}</button>
        </div>
      </div>
    </div>
  );
}

// ===== Resources (documents and links) =====
const RES_ICON = { link: '🔗', file: '📄' };

function ResourcesSection({ entityType, entityId, canEdit, notify }) {
  const [items, setItems] = useState([]);
  const [previewing, setPreviewing] = useState(null);
  const [adding, setAdding] = useState(null);   // 'link' | 'file'
  const [form, setForm] = useState({ label: '', url: '', description: '' });
  const [file, setFile] = useState(null);
  const [busy, setBusy] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  // Editing an existing resource. The API has always supported this — label,
  // description and URL are all updatable — but nothing ever called it, so
  // fixing a typo in a title meant deleting the resource and adding it again,
  // losing its version history in the process.
  const [editing, setEditing] = useState(null);     // {resource_id,...}
  const [editForm, setEditForm] = useState({ label: '', url: '', description: '' });
  const replaceRefs = useRef({});

  // The field list is a fixed slot rather than an ordinary attachment. Manual
  // Entry systems get one automatically because they cannot be described
  // without it; a data flow can be given one when it carries a defined set of
  // fields. Anywhere else the idea does not apply.
  const FIELD_LIST_LABEL = 'Data entry field list';
  const hasFieldList = items.some(r => r.label === FIELD_LIST_LABEL);
  const canAddFieldList = canEdit && entityType === 'data_flow' && !hasFieldList;

  const addFieldList = async () => {
    setBusy(true);
    try {
      const rows = await api.post(`/api/resources/${entityType}/${entityId}/field-list`, {});
      setItems(rows);
      notify('Field list added.');
    } catch (err) { notify(err.message, true); }
    finally { setBusy(false); }
  };

  const startEdit = (r) => {
    setEditing(r);
    setEditForm({ label: r.label || '', url: r.url || '', description: r.description || '' });
  };

  const saveEdit = async () => {
    // Send only what this resource can actually change: a locked label is
    // refused by the server, and a file has no URL to set.
    const payload = { description: editForm.description };
    if (!editing.label_locked) payload.label = editForm.label;
    if (editing.kind === 'link') payload.url = editForm.url;
    setBusy(true);
    try {
      await api.put(`/api/resources/${editing.resource_id}`, payload);
      setEditing(null);
      load();
      notify('Resource updated.');
    } catch (err) { notify(err.message, true); }
    finally { setBusy(false); }
  };

  const clearResource = async (r) => {
    setBusy(true);
    try {
      await api.post(`/api/resources/${r.resource_id}/clear`, {});
      load();
      notify(r.label_locked
        ? 'Cleared. The slot stays because it is required here.'
        : 'Cleared. Earlier versions are kept.');
    } catch (err) { notify(err.message, true); }
    finally { setBusy(false); }
  };

  const load = useCallback(() => {
    if (!entityId) return;
    api.get(`/api/resources/${entityType}/${entityId}`).then(setItems).catch(() => {});
  }, [entityType, entityId]);
  useEffect(() => { load(); }, [load]);

  const addLink = async () => {
    if (!form.label.trim() || !form.url.trim()) { notify('Label and URL are both required.', true); return; }
    setBusy(true);
    try {
      const rows = await api.post(`/api/resources/${entityType}/${entityId}`,
        { label: form.label, kind: 'link', url: form.url, description: form.description });
      setItems(rows); setAdding(null); setForm({ label: '', url: '', description: '' }); notify('Link added.');
    } catch (e) { notify(e.message, true); } finally { setBusy(false); }
  };

  const uploadNew = async () => {
    if (!form.label.trim() || !file) { notify('Label and file are both required.', true); return; }
    setBusy(true);
    try {
      const fd = new FormData();
      fd.append('label', form.label);
      fd.append('description', form.description || '');
      fd.append('file', file);
      const payload = await uploadFile(`/api/resources/${entityType}/${entityId}`, fd);
      setItems(payload); setAdding(null); setForm({ label: '', url: '', description: '' }); setFile(null);
      notify('Document uploaded.');
    } catch (e) { notify(e.message, true); } finally { setBusy(false); }
  };

  const replaceFile = async (res, chosen) => {
    if (!chosen) return;
    setBusy(true);
    try {
      const fd = new FormData();
      fd.append('file', chosen);
      const payload = await uploadFile(`/api/resources/${res.resource_id}`, fd);
      setItems(payload);
      notify(`New version of "${res.label}" uploaded.`);
    } catch (e) { notify(e.message, true); } finally { setBusy(false); }
  };

  const remove = async (res) => {
    try { setItems(await api.del(`/api/resources/${res.resource_id}`)); notify('Removed.'); }
    catch (e) { notify(e.message, true); }
    finally { setConfirmDelete(null); }
  };

  const sizeText = (n) => !n ? '' :
    n > 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;

  // Downloading is the one action that puts a file on someone's machine, so it
  // asks first. The preference is per browser, not per account.
  const SKIP_KEY = 'dlt_skip_download_confirm';
  const [confirmDownload, setConfirmDownload] = useState(null);
  const [skipNext, setSkipNext] = useState(false);
  const startDownload = (r) => {
    window.location = `/api/resources/${r.resource_id}/file?download=1`;
  };
  const askDownload = (r) => {
    let skip = false;
    try { skip = localStorage.getItem(SKIP_KEY) === '1'; } catch (e) { /* private mode */ }
    if (skip) { startDownload(r); return; }
    setSkipNext(false);
    setConfirmDownload(r);
  };

  return (<>
    <div className="res-list">
      {items.length === 0 && <div style={{ fontSize: 12, color: '#6b6b6b' }}>
        No documents or links yet.</div>}
      {items.map(r => (
        <div className="res-item" key={r.resource_id}>
          <div className="res-top">
            <span className="res-icon" aria-hidden="true">{RES_ICON[r.kind] || '📄'}</span>
            {/* The title itself is the action, so long URLs and filenames never
                have to be shown. Both are still available on hover. */}
            {r.kind === 'link'
              ? (r.url
                  ? <a className="res-title-link" href={r.url} target="_blank"
                       rel="noopener noreferrer" title={r.url}>{r.label}</a>
                  : <span className="res-label">{r.label}</span>)
              : (r.filename
                  ? <button className="res-title-link" title={r.filename}
                            onClick={() => askDownload(r)}>{r.label}</button>
                  : <span className="res-label">{r.label}</span>)}
            {r.label_locked ? <span className="locked-tag">fixed</span> : null}
          </div>
          {r.description && <div className="res-desc">{r.description}</div>}
          <div className="res-meta">
            {r.kind === 'link'
              ? (r.url ? '' : 'No URL set')
              : (r.filename
                  ? `${sizeText(r.size_bytes)} · v${r.version_no}` +
                    (r.uploaded_by_email ? ` · ${r.uploaded_by_email}` : '') +
                    (r.version_count > 1 ? ` · ${r.version_count} versions` : '')
                  : 'Nothing uploaded yet')}
          </div>
          <div className="res-actions">
            {r.kind === 'file' && r.filename && r.can_preview &&
              <button className="btn" onClick={() =>
                setPreviewing(previewing === r.resource_id ? null : r.resource_id)}>
                {previewing === r.resource_id ? 'Hide' : 'View'}
              </button>}
            {canEdit && r.kind === 'file' && <>
              <input type="file" style={{ display: 'none' }}
                     ref={el => { replaceRefs.current[r.resource_id] = el; }}
                     onChange={e => { replaceFile(r, e.target.files[0]); e.target.value = ''; }} />
              <button className="btn" disabled={busy}
                      onClick={() => replaceRefs.current[r.resource_id].click()}>
                {r.filename ? 'Upload new version' : 'Upload'}
              </button>
            </>}
            {/* Edit changes the title, description and (for a link) the URL.
                The file itself is replaced with "Upload new version", which
                keeps the history; this only touches the wording around it. */}
            {canEdit &&
              <Tooltip text={r.label_locked
                        ? 'Change the description. This title is fixed by the system.'
                        : 'Change the title, description' +
                          (r.kind === 'link' ? ' or web address' : '') +
                          ' without losing the version history'}>
                <button className="btn" disabled={busy}
                        onClick={() => startEdit(r)}>Edit</button>
              </Tooltip>}
            {canEdit && (r.filename || r.url) &&
              <Tooltip text={r.label_locked
                        ? 'Empties this slot but keeps it, because a field list is required here. Earlier versions are kept.'
                        : 'Empties the contents but keeps this entry in the list. Earlier versions are kept.'}>
                <button className="btn" disabled={busy} onClick={() => clearResource(r)}>
                  Clear</button>
              </Tooltip>}
            {/* Remove had a tooltip only when the label was locked, so for an
                ordinary document or link there was nothing to discover — the
                attribute was simply undefined. Both states explain themselves
                now, and the contrast with Clear is the point. */}
            {canEdit && (!r.label_locked || entityType === 'data_flow') &&
              <Tooltip text={r.label_locked
                        ? 'Deletes this slot entirely. Allowed here because a field list is optional on a data flow.'
                        : 'Deletes this entry and everything attached to it, including earlier versions.'}>
                <button className="btn" onClick={() => setConfirmDelete(r)}>Remove</button>
              </Tooltip>}
          </div>
          {previewing === r.resource_id && r.can_preview && (
            <div className="res-preview">
              {(r.content_type || '').startsWith('image/')
                ? <img src={`/api/resources/${r.resource_id}/file`} alt={r.label} />
                : <iframe src={`/api/resources/${r.resource_id}/file`} title={r.label} />}
            </div>
          )}
          {r.kind === 'file' && !r.can_preview && r.filename && previewing === r.resource_id && (
            <div className="res-preview" style={{ padding: 14, fontSize: 12, color: '#666' }}>
              This file type can't be shown in the browser. Download it to open,
              then upload the edited copy back here as a new version.
            </div>
          )}
        </div>
      ))}
    </div>

    {canEdit && (adding === null
      ? <div className="res-add">
          <button className="btn" onClick={() => { setForm({ label: '', url: '', description: '' }); setAdding('file'); }}>
            + Document</button>
          <button className="btn" onClick={() => { setForm({ label: '', url: '', description: '' }); setAdding('link'); }}>
            + Link</button>
          {canAddFieldList && (
            <button className="btn" disabled={busy} onClick={addFieldList}
                    title="A fixed slot for the list of fields this carries">
              + Field List</button>
          )}
        </div>
      : <div style={{ marginTop: 10, borderTop: '1px solid #eee', paddingTop: 10 }}>
          <div className="form-group"><label>Label shown in the app *</label>
            <input value={form.label} onChange={e => setForm(f => ({ ...f, label: e.target.value }))}
                   placeholder={adding === 'link' ? 'e.g. Vendor documentation' : 'e.g. Data sharing agreement'} /></div>
          {adding === 'link'
            ? <div className="form-group"><label htmlFor="res-url">URL *</label>
                <input id="res-url" value={form.url}
                       onChange={e => setForm(f => ({ ...f, url: e.target.value }))}
                       placeholder="https://…" /></div>
            : <div className="form-group"><label htmlFor="res-file">File * (max 10 MB)</label>
                <input id="res-file" type="file" onChange={e => setFile(e.target.files[0])} /></div>}
          <div className="form-group">
            <label htmlFor="res-desc">Description (optional)</label>
            <textarea id="res-desc" value={form.description} maxLength={500}
                      onChange={e => setForm(f => ({ ...f, description: e.target.value }))}
                      placeholder="A short note about what this is and why it matters" />
            <div className={`char-count ${(form.description || '').length > 500 ? 'over' : ''}`}>
              {(form.description || '').length} / 500
            </div>
          </div>
          <div className="res-actions">
            <button className="btn btn-primary" disabled={busy}
                    onClick={adding === 'link' ? addLink : uploadNew}>
              {busy ? 'Saving…' : 'Save'}</button>
            <button className="btn" onClick={() => { setAdding(null); setFile(null); }}>Cancel</button>
          </div>
        </div>)}

    {/* Editing happens in a modal rather than inline, so a long description
        has room and so it cannot be confused with the add form below. */}
    {editing && <div className="modal-overlay"><div className="modal" role="dialog"
         aria-modal="true" aria-labelledby="res-edit-title">
      <div className="modal-header" id="res-edit-title">
        Edit this {editing.kind === 'link' ? 'link' : 'document'}
        <button className="panel-close" onClick={() => setEditing(null)}
                aria-label="Close">&times;</button></div>
      <div className="modal-body">
        <div className="form-group">
          <label htmlFor="res-edit-label">Label shown in the app{editing.label_locked ? '' : ' *'}</label>
          <input id="res-edit-label" value={editForm.label}
                 disabled={!!editing.label_locked}
                 onChange={e => setEditForm(f => ({ ...f, label: e.target.value }))} />
          {/* !! matters: label_locked is an INTEGER 0/1 per the project's
              convention, and `{0 && <div/>}` renders the number 0 rather than
              nothing — which is exactly what appeared under this field. */}
          {!!editing.label_locked &&
            <div className="gov-hint">This title is fixed by the system and cannot be changed.</div>}
        </div>
        {editing.kind === 'link' &&
          <div className="form-group"><label htmlFor="res-edit-url">URL *</label>
            <input id="res-edit-url" value={editForm.url} placeholder="https://…"
                   onChange={e => setEditForm(f => ({ ...f, url: e.target.value }))} />
            <div className="gov-hint">
              Changing this keeps the previous address in the version history.
            </div>
          </div>}
        {editing.kind !== 'link' && editing.filename &&
          <div className="form-group"><label>File</label>
            <div className="gov-hint">
              <strong>{editing.filename}</strong> — to replace the file itself,
              close this and use <strong>Upload new version</strong>.
            </div>
          </div>}
        <div className="form-group">
          <label htmlFor="res-edit-desc">Description (optional)</label>
          <textarea id="res-edit-desc" value={editForm.description} maxLength={500}
                    onChange={e => setEditForm(f => ({ ...f, description: e.target.value }))}
                    placeholder="A short note about what this is and why it matters" />
          <div className={`char-count ${(editForm.description || '').length > 500 ? 'over' : ''}`}>
            {(editForm.description || '').length} / 500
          </div>
        </div>
      </div>
      <div className="modal-footer">
        <button className="btn" onClick={() => setEditing(null)}>Cancel</button>
        <button className="btn btn-primary" disabled={busy} onClick={saveEdit}>
          {busy ? 'Saving…' : 'Save changes'}</button>
      </div>
    </div></div>}

    {confirmDelete && <ConfirmDialog
      title="Remove this resource?" danger confirmLabel="Remove"
      message={`"${confirmDelete.label}" and all of its versions will be deleted. This cannot be undone.`}
      onCancel={() => setConfirmDelete(null)} onConfirm={() => remove(confirmDelete)} />}

    {confirmDownload && <ConfirmDialog
      title="Download this document?" confirmLabel="Download"
      message={`"${confirmDownload.label}" will be saved to your computer.`}
      detail={<>
        <div className="mono-diff">
          {confirmDownload.filename} · {sizeText(confirmDownload.size_bytes)}
        </div>
        <label style={{ display: 'flex', alignItems: 'center', gap: 7,
                        fontSize: 12, marginTop: 12 }}>
          <input type="checkbox" checked={skipNext}
                 onChange={e => setSkipNext(e.target.checked)} />
          Don't ask again on this browser
        </label>
      </>}
      onCancel={() => setConfirmDownload(null)}
      onConfirm={() => {
        if (skipNext) { try { localStorage.setItem(SKIP_KEY, '1'); } catch (e) {} }
        startDownload(confirmDownload);
        setConfirmDownload(null);
      }} />}
  </>);
}

// ===== Schema upload (Administrator+, Data Store systems) =====
function SchemaUploadPanel({ system, notify, onSchemaChanged }) {
  const [snapshots, setSnapshots] = useState([]);
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);
  const [confirmRevert, setConfirmRevert] = useState(null);
  const fileRef = useRef(null);

  const load = useCallback(() => {
    api.get(`/api/systems/${system.system_id}/schema/snapshots`)
      .then(setSnapshots).catch(() => {});
  }, [system.system_id]);
  useEffect(() => { load(); }, [load]);

  const upload = async (chosen) => {
    if (!chosen) return;
    setBusy(true); setResult(null);
    try {
      const fd = new FormData();
      fd.append('file', chosen);
      const payload = await uploadFile(`/api/systems/${system.system_id}/schema/upload`, fd);
      setResult(payload); load();
      notify(payload.message);
      // Refresh the catalog so the SCHEMA badge appears on the node straight away.
      if (onSchemaChanged) onSchemaChanged();
    } catch (e) { notify(e.message, true); } finally { setBusy(false); }
  };

  const revert = async (snap) => {
    try {
      const r = await api.post(`/api/schema/snapshots/${snap.snapshot_id}/revert`);
      notify(r.message); load(); setResult(null);
      if (onSchemaChanged) onSchemaChanged();
    } catch (e) { notify(e.message, true); }
    finally { setConfirmRevert(null); }
  };

  return (<>
    <div style={{ fontSize: 12, color: '#666', lineHeight: 1.6, marginBottom: 10 }}>
      Upload a SQL Server schema script to refresh this system's tables and columns.
      Governance you've already entered is kept wherever the schema and table and
      column names still match; the previous schema is saved so you can go back.
    </div>
    <input type="file" accept=".sql,text/plain" ref={fileRef} style={{ display: 'none' }}
           onChange={e => { upload(e.target.files[0]); e.target.value = ''; }} />
    <button className="btn btn-primary" disabled={busy} onClick={() => fileRef.current.click()}>
      {busy ? 'Reading…' : 'Upload .sql schema'}
    </button>

    {result && <div className="mono-diff">
      {result.stats.tables} tables · {result.stats.columns} columns · {result.stats.schemas.join(', ')}<br />
      {result.summary.matched_tables} matched, {result.summary.new_tables} added,
      {' '}{result.summary.removed_tables} removed ·
      {' '}{result.summary.carried_values} governance values kept
      {result.warnings && result.warnings.length > 0 &&
        <div style={{ color: '#b9770e', marginTop: 4 }}>{result.warnings.join(' ')}</div>}
    </div>}

    {snapshots.length > 0 && <>
      <div className="panel-section-title" style={{ marginTop: 14 }}>Previous versions</div>
      {snapshots.map(sn => (
        <div className="res-item" key={sn.snapshot_id}>
          <div className="res-meta" style={{ marginTop: 0 }}>
            {String(sn.created_at).slice(0, 16).replace('T', ' ')} ·
            {' '}{sn.table_count} tables, {sn.column_count} columns
            {sn.created_by_email ? ` · ${sn.created_by_email}` : ''}
          </div>
          <div style={{ fontSize: 12, marginTop: 2 }}>{sn.summary}</div>
          <div className="res-actions">
            <button className="btn" onClick={() => setConfirmRevert(sn)}>Revert to this</button>
          </div>
        </div>
      ))}
    </>}

    {confirmRevert && <ConfirmDialog
      title="Revert this schema?" confirmLabel="Revert schema" danger
      message={`This replaces the current schema for ${system.name} with the version saved on ` +
               `${String(confirmRevert.created_at).slice(0, 16).replace('T', ' ')} ` +
               `(${confirmRevert.table_count} tables, ${confirmRevert.column_count} columns).`}
      detail={<div className="confirm-warn">
        The current schema is saved first, so this is itself reversible.
      </div>}
      onCancel={() => setConfirmRevert(null)} onConfirm={() => revert(confirmRevert)} />}
  </>);
}

// ===== Preferences (SuperAdmin) =====
function PreferencesScreen({ notify, onSaved, roles, onTypesChanged }) {
  const [prefs, setPrefs] = useState([]);
  const [draft, setDraft] = useState({});
  const [busy, setBusy] = useState(false);
  // The logo is staged here rather than inside LogoEditor because "Save
  // preferences" has to commit it along with everything else on this screen.
  // Choosing a file used to upload it straight away, which put a new logo in
  // the sidebar before the user had agreed to anything.
  const [logo, setLogo] = useState(null);          // what the server currently has
  const [logoLimits, setLogoLimits] = useState({});
  const [pendingLogo, setPendingLogo] = useState(null);   // {file,url,width,height,size}
  const [pendingRemove, setPendingRemove] = useState(false);

  const load = useCallback(() => {
    api.get('/api/preferences').then(rows => {
      setPrefs(rows);
      const d = {}; rows.forEach(p => { d[p.key] = p.value; });
      setDraft(d);
    }).catch(e => notify(e.message, true));
  }, [notify]);
  useEffect(() => { load(); }, [load]);

  const loadBranding = useCallback(() => {
    api.get('/api/branding').then(d => { setLogo(d.logo); setLogoLimits(d); })
      .catch(e => notify(e.message, true));
  }, [notify]);
  useEffect(() => { loadBranding(); }, [loadBranding]);

  // Object URLs for the staged preview are released when they stop being used,
  // or they leak for as long as the page is open.
  useEffect(() => () => { if (pendingLogo && pendingLogo.url) URL.revokeObjectURL(pendingLogo.url); },
            [pendingLogo]);

  const save = async () => {
    setBusy(true);
    try {
      // The image goes first: if the server rejects it, nothing else is saved
      // and the message names the actual problem.
      if (pendingRemove && logo) {
        await api.del('/api/branding');
      } else if (pendingLogo) {
        const fd = new FormData();
        fd.append('file', pendingLogo.file);
        await uploadFile('/api/branding', fd);
      }
      const editableKeys = prefs.filter(p => p.editable).map(p => p.key);
      const values = {}; editableKeys.forEach(k => { values[k] = draft[k]; });
      const rows = await api.put('/api/preferences', { values });
      setPrefs(rows);
      setPendingLogo(null); setPendingRemove(false);
      loadBranding();
      notify('Preferences saved.'); onSaved && onSaved();
    } catch (err) { notify(err.message, true); }
    finally { setBusy(false); }
  };

  const categories = [];
  prefs.forEach(p => { if (!categories.includes(p.category)) categories.push(p.category); });
  const setVal = (k, v) => setDraft(d => ({ ...d, [k]: v }));

  const control = (p) => {
    const v = draft[p.key];
    if (!p.editable) {
      return <select disabled value="false"><option value="false">Off</option></select>;
    }
    if (p.value_type === 'boolean') {
      return <select value={String(v) === 'true' ? 'true' : 'false'}
                     onChange={e => setVal(p.key, e.target.value)}>
        <option value="true">On</option><option value="false">Off</option></select>;
    }
    if (p.value_type === 'number') {
      return <input type="number" value={v || ''} onChange={e => setVal(p.key, e.target.value)} />;
    }
    if (p.value_type === 'role') {
      return <select value={v || 'Viewer'} onChange={e => setVal(p.key, e.target.value)}>
        {(roles || []).map(r => <option key={r} value={r}>{r}</option>)}</select>;
    }
    if (p.value_type === 'logo_position') {
      return <select value={LOGO_POSITIONS.indexOf(v) >= 0 ? v : 'left'}
                     onChange={e => setVal(p.key, e.target.value)}>
        <option value="left">Left of the title</option>
        <option value="right">Right of the title</option>
        <option value="above">Above the title</option>
        <option value="below">Below the title</option></select>;
    }
    return <input type="text" value={v || ''} onChange={e => setVal(p.key, e.target.value)} />;
  };

  return (<div className="screen"><div className="table-view">
    <div style={{display:'flex',alignItems:'center',marginBottom:14}}>
      <div style={{flex:1,fontSize:12,color:'#6b6b6b'}}>
        Global settings for this deployment. Changes are recorded in the audit log.
      </div>
      <button className="btn btn-primary" onClick={save} disabled={busy}>
        {busy ? 'Saving…' : 'Save preferences'}</button>
    </div>
    {categories.map(cat => (
      <React.Fragment key={cat}>
        <div className="pref-group">
          <h3>{cat}</h3>
          {prefs.filter(p => p.category === cat).map(p => (
            <div className={`pref-row ${p.editable ? '' : 'locked'}`} key={p.key}>
              <div className="pref-label"><b>{p.label || p.key}</b><span>{p.description}</span></div>
              <div className="pref-control">{control(p)}</div>
            </div>
          ))}
        </div>
        {/* The logo belongs with the title and subtitle it sits beside. */}
        {cat === 'General' &&
          <LogoEditor notify={notify} logo={logo} limits={logoLimits}
                      pending={pendingLogo} setPending={setPendingLogo}
                      pendingRemove={pendingRemove} setPendingRemove={setPendingRemove}
                      position={draft.logo_position}
                      hideTitle={String(draft.hide_app_title) === 'true'}
                      title={draft.app_title} subtitle={draft.app_subtitle} />}
        {/* System types sit after the password rules, before the not-yet-available toggles. */}
        {cat === 'Password policy' &&
          <SystemTypesEditor notify={notify} onChanged={onTypesChanged} />}
      </React.Fragment>
    ))}
    {/* Fallback: if the password category is ever renamed, still show the editor. */}
    {!categories.includes('Password policy') &&
      <SystemTypesEditor notify={notify} onChanged={onTypesChanged} />}
  </div></div>);
}

// ===== Logo (SuperAdmin, shown on the Preferences screen) =====
// The preview deliberately reuses the real .sidebar-header and .brand classes
// against the real navy, so what is shown here is what the sidebar will do —
// including how a wide or tall image gets contained. A preview built from
// separate styling would be free to disagree with the thing it previews.
// Nothing here talks to the server. Choosing a file stages it and Save
// preferences commits it, so the sidebar never changes before the user says so.
function LogoEditor({ notify, logo, limits, pending, setPending,
                      pendingRemove, setPendingRemove,
                      position, hideTitle, title, subtitle }) {
  const [confirmRemove, setConfirmRemove] = useState(false);
  const fileRef = useRef(null);
  const maxBytes = limits.max_bytes || 512 * 1024;
  const maxDim = limits.max_dimension || 2000;
  const kb = (n) => Math.max(1, Math.round((n || 0) / 1024));

  // Checked here as well as on the server, because deferring the upload would
  // otherwise defer the error message with it — a wrong file would be accepted
  // in silence and only rejected minutes later on Save. The server's check is
  // still the authority; this one just fails fast.
  const stage = async (file) => {
    if (!file) return;
    if (fileRef.current) fileRef.current.value = '';   // so the same file re-fires
    try {
      const head = new Uint8Array(await file.slice(0, 8).arrayBuffer());
      const isPng = head[0] === 0x89 && head[1] === 0x50 &&
                    head[2] === 0x4E && head[3] === 0x47;
      const isJpg = head[0] === 0xFF && head[1] === 0xD8 && head[2] === 0xFF;
      if (!isPng && !isJpg) {
        notify('That file is not a PNG or JPEG image. Only .png and .jpg files ' +
               'can be used as a logo.', true);
        return;
      }
      if (file.size > maxBytes) {
        notify(`That image is ${kb(file.size)} KB. The limit is ${kb(maxBytes)} KB.`, true);
        return;
      }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        if (img.naturalWidth > maxDim || img.naturalHeight > maxDim) {
          URL.revokeObjectURL(url);
          notify(`That image is ${img.naturalWidth}x${img.naturalHeight} pixels. ` +
                 `The limit is ${maxDim} pixels on either side.`, true);
          return;
        }
        setPendingRemove(false);
        setPending({ file, url, name: file.name, size: file.size,
                     width: img.naturalWidth, height: img.naturalHeight,
                     type: isPng ? 'image/png' : 'image/jpeg' });
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        notify('That image could not be read.', true);
      };
      img.src = url;
    } catch (e) {
      notify('That file could not be read.', true);
    }
  };

  // What the sidebar will look like once Save is pressed.
  const shown = pendingRemove ? null : (pending || logo);
  const src = pending ? pending.url
            : (logo ? '/api/branding/logo?v=' + encodeURIComponent(logo.etag) : null);
  const pos = LOGO_POSITIONS.indexOf(position) >= 0 ? position : 'left';
  const showText = !shown || !hideTitle;
  const unsaved = !!pending || (pendingRemove && !!logo);

  return (
    <div className="pref-group">
      <h3>Logo</h3>
      <div className="logo-editor">
        <div>
          <div className="logo-preview-label">
            Sidebar preview{unsaved && <span className="logo-unsaved">not saved yet</span>}
          </div>
          <div className="logo-preview">
            <div className="sidebar-header">
              {shown ? (
                <div className={'brand brand-' + pos + (showText ? '' : ' brand-only')}>
                  <img className="brand-logo" src={src} alt="" />
                  {showText && (
                    <div className="brand-text">
                      <h1 style={{cursor:'default'}}>{title || 'DATA LINEAGE TRACKER'}</h1>
                      {subtitle && <p style={{cursor:'default'}}>{subtitle}</p>}
                    </div>
                  )}
                </div>
              ) : (
                <React.Fragment>
                  <h1 style={{cursor:'default'}}>{title || 'DATA LINEAGE TRACKER'}</h1>
                  {subtitle && <p style={{cursor:'default'}}>{subtitle}</p>}
                </React.Fragment>
              )}
            </div>
          </div>
        </div>
        <div className="logo-controls">
          {shown ? (
            <div className="logo-meta">
              <b>{pending ? pending.name : logo.filename}</b>
              <span>
                {pending ? pending.width : logo.width}&times;
                {pending ? pending.height : logo.height} pixels ·
                {' '}{kb(pending ? pending.size : logo.size_bytes)} KB ·
                {' '}{(pending ? pending.type : logo.content_type) === 'image/png'
                      ? 'PNG' : 'JPEG'}
              </span>
            </div>
          ) : (
            <div className="logo-meta">
              <span>{pendingRemove && logo ? 'Will be removed when you save.'
                                           : 'No logo uploaded.'}</span>
            </div>
          )}
          <input ref={fileRef} type="file" style={{display:'none'}}
                 accept="image/png,image/jpeg,.png,.jpg,.jpeg"
                 onChange={e => stage(e.target.files && e.target.files[0])} />
          <div className="logo-buttons">
            <button className="btn"
                    onClick={() => fileRef.current && fileRef.current.click()}>
              {shown ? 'Choose a different image' : 'Choose an image'}</button>
            {/* Discarding just drops the staged file; the object URL is released
                by the effect that watches it. */}
            {shown && (logo || pending) &&
              <button className="btn btn-danger"
                      onClick={() => (pending ? setPending(null) : setConfirmRemove(true))}>
                {pending ? 'Discard' : 'Remove'}</button>}
            {pendingRemove && logo &&
              <button className="btn" onClick={() => setPendingRemove(false)}>
                Keep it after all</button>}
          </div>
          <div className="logo-hint">
            PNG or JPEG, up to {kb(maxBytes)} KB and {maxDim} pixels on a side.
            The sidebar is dark navy, so a PNG with a transparent background and
            light-coloured marks will sit best on it.
            {' '}<b>Nothing here changes until you click Save preferences</b>,
            including the position and the option to hide the title.
          </div>
        </div>
      </div>
      {confirmRemove && (
        <ConfirmDialog
          title="Remove the logo?"
          message="When you save, the sidebar and the sign-in screen will go back to showing the title on its own."
          detail={<div className="gov-hint" style={{ marginTop: 8 }}>
                    Nothing is removed until you click Save preferences.
                  </div>}
          confirmLabel="Remove on save" danger
          onConfirm={() => { setPending(null); setPendingRemove(true); setConfirmRemove(false); }}
          onCancel={() => setConfirmRemove(false)} />
      )}
    </div>
  );
}

// ===== System types editor (SuperAdmin, shown on the Preferences screen) =====
function SystemTypesEditor({ notify, onChanged }) {
  const [types, setTypes] = useState([]);
  const [palette, setPalette] = useState({});
  const [editing, setEditing] = useState(null);
  const [adding, setAdding] = useState(false);
  const [form, setForm] = useState({ type_name: '', description: '', palette: 'slate' });
  const [confirmRename, setConfirmRename] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const load = useCallback(() => {
    api.get('/api/system-types').then(d => { setTypes(d.types || []); setPalette(d.palette || {}); })
      .catch(e => notify(e.message, true));
  }, [notify]);
  useEffect(() => { load(); }, [load]);

  const paletteKeyFor = (t) => Object.keys(palette).find(k => palette[k].fill === t.fill_color) || 'slate';

  const save = async () => {
    try {
      if (adding) {
        const d = await api.post('/api/system-types', form);
        setTypes(d.types); setAdding(false); notify('System type added.');
      } else {
        const d = await api.put(`/api/system-types/${encodeURIComponent(editing.type_name)}`, form);
        setTypes(d.types); setEditing(null);
        notify(d.renamed_systems
          ? `Saved. ${d.renamed_systems} system(s) moved to the new name.`
          : 'Saved.');
      }
      onChanged && onChanged();
    } catch (e) { notify(e.message, true); }
    finally { setConfirmRename(null); }
  };

  const attemptSave = () => {
    // Renaming rewrites the type on every system using it, so it is confirmed.
    if (editing && form.type_name !== editing.type_name && editing.in_use > 0) {
      setConfirmRename({ from: editing.type_name, to: form.type_name, count: editing.in_use });
      return;
    }
    save();
  };

  const remove = async (t) => {
    try {
      const d = await api.del(`/api/system-types/${encodeURIComponent(t.type_name)}`);
      setTypes(d.types); notify('System type removed.'); onChanged && onChanged();
    } catch (e) { notify(e.message, true); }
    finally { setConfirmDelete(null); }
  };

  return (
    <div className="pref-group">
      <h3>System Types</h3>
      <div style={{ padding: '10px 16px', fontSize: 12, color: '#6b6b6b' }}>
        These appear on the diagram key and in the Type dropdown. Colours are drawn
        from a palette checked for contrast.
        <button className="btn" style={{ marginLeft: 10 }}
                onClick={() => { setForm({ type_name: '', description: '', palette: 'slate' });
                                 setAdding(true); setEditing(null); }}>+ Add Type</button>
      </div>
      {types.map(t => (
        <div className="pref-row" key={t.type_name}>
          <div className="pref-label" style={{ display: 'flex', gap: 9 }}>
            <div className="type-swatch" aria-hidden="true"
                 style={{ background: t.fill_color, border: `2px solid ${t.stroke_color}` }} />
            <div><b>{t.type_name}</b>
              <span>{t.in_use} system{t.in_use === 1 ? '' : 's'}</span></div>
          </div>
          <div className="pref-control">
            <div style={{ fontSize: 12, color: '#6b7684' }}>{t.description || 'No description yet.'}</div>
            <div className="res-actions">
              <button className="btn btn-edit" onClick={() => {
                setForm({ type_name: t.type_name, description: t.description || '',
                          palette: paletteKeyFor(t) });
                setEditing(t); setAdding(false);
              }}>Edit</button>
              <button className="btn" onClick={() => setConfirmDelete(t)}>Remove</button>
            </div>
          </div>
        </div>
      ))}

      {(adding || editing) && <div className="modal-overlay">
        <div className="modal" role="dialog" aria-modal="true">
          <div className="modal-header">{adding ? 'Add System Type' : `Edit ${editing.type_name}`}
            <button className="panel-close" aria-label="Close"
                    onClick={() => { setAdding(false); setEditing(null); }}>&times;</button></div>
          <div className="modal-body">
            <div className="form-group"><label htmlFor="st-name">Name *</label>
              <input id="st-name" value={form.type_name}
                     onChange={e => setForm(f => ({ ...f, type_name: e.target.value }))} />
              {editing && editing.in_use > 0 &&
                <div style={{ fontSize: 11, color: '#b08900', marginTop: 4 }}>
                  Renaming this will update {editing.in_use} system(s) that use it.
                </div>}
            </div>
            <div className="form-group"><label htmlFor="st-desc">Description</label>
              <textarea id="st-desc" value={form.description}
                        onChange={e => setForm(f => ({ ...f, description: e.target.value }))}
                        placeholder="Explain when someone should choose this type" /></div>
            <div className="form-group"><label htmlFor="st-colour">Colour</label>
              <select id="st-colour" value={form.palette}
                      onChange={e => setForm(f => ({ ...f, palette: e.target.value }))}>
                {Object.entries(palette).map(([k, v]) =>
                  <option key={k} value={k}>{v.label}</option>)}
              </select>
              {palette[form.palette] && <div style={{ marginTop: 8 }}>
                <span style={{ display: 'inline-block', padding: '5px 14px', borderRadius: 6,
                  background: palette[form.palette].fill,
                  border: `2px solid ${palette[form.palette].stroke}`,
                  color: palette[form.palette].text, fontWeight: 700, fontSize: 12 }}>
                  {form.type_name || 'Preview'}
                </span></div>}
            </div>
          </div>
          <div className="modal-footer">
            <button className="btn" onClick={() => { setAdding(false); setEditing(null); }}>Cancel</button>
            <button className="btn btn-primary" onClick={attemptSave}>Save</button>
          </div>
        </div></div>}

      {confirmRename && <ConfirmDialog
        title="Rename this system type?" confirmLabel="Rename and update systems"
        message={`Renaming "${confirmRename.from}" to "${confirmRename.to}" will change the type on ${confirmRename.count} system(s).`}
        detail={<div className="confirm-warn">
          Every system currently using this type is updated, so nothing is left
          pointing at a type that no longer exists. This is recorded in the audit log.
        </div>}
        onCancel={() => setConfirmRename(null)} onConfirm={save} />}

      {confirmDelete && <ConfirmDialog
        title="Remove this system type?" danger confirmLabel="Remove"
        message={confirmDelete.in_use > 0
          ? `"${confirmDelete.type_name}" is used by ${confirmDelete.in_use} system(s) and cannot be removed yet.`
          : `"${confirmDelete.type_name}" will be removed from the list of choices.`}
        onCancel={() => setConfirmDelete(null)}
        onConfirm={() => remove(confirmDelete)} />}
    </div>
  );
}

// ===== Audit log (SuperAdmin) =====
function AuditScreen({ notify }) {
  const [data, setData] = useState({ events: [], total: 0, actions: [], entity_types: [] });
  const [filters, setFilters] = useState({ start: '', end: '', user: '', action: '', entity_type: '' });
  const [offset, setOffset] = useState(0);
  // Without this the empty-state message showed while the first request was
  // still in flight, which read as "there is no audit history".
  const [loading, setLoading] = useState(true);
  const [confirmRevert, setConfirmRevert] = useState(null);
  const [conflicts, setConflicts] = useState(null);
  const LIMIT = 100;

  // Dates are sent as-is and interpreted as UTC days by the server, matching the
  // timestamps shown in the table. Reading them as *local* days was tried and
  // removed: it made the filter disagree with the column beside it, so a date
  // visible in the table could return nothing.
  const queryString = useCallback((extra, useFilters) => {
    const p = new URLSearchParams();
    Object.entries(useFilters || filters).forEach(([k, v]) => { if (v) p.set(k, v); });
    Object.entries(extra || {}).forEach(([k, v]) => p.set(k, v));
    return p.toString();
  }, [filters]);

  // `load` can be given the filters to use. Clearing used to call setFilters and
  // then load(0), but load still closed over the OLD filters, so the table came
  // back filtered exactly as before — the button looked broken.
  const load = useCallback((newOffset, useFilters) => {
    const off = newOffset === undefined ? offset : newOffset;
    setLoading(true);
    api.get(`/api/audit?${queryString({ limit: LIMIT, offset: off }, useFilters)}`)
      .then(d => { setData(d); setOffset(off); })
      .catch(e => notify(e.message, true))
      .finally(() => setLoading(false));
  }, [queryString, offset, notify]);

  const doRevert = async (event, force) => {
    try {
      await api.post(`/api/audit/${event.event_id}/revert`, force ? { force: true } : {});
      notify('Change reverted.');
      setConfirmRevert(null); setConflicts(null); load();
    } catch (err) {
      if (err.status === 409 && err.payload && err.payload.conflicts) {
        setConflicts(err.payload.conflicts);
      } else {
        notify(err.message, true); setConfirmRevert(null);
      }
    }
  };

  useEffect(() => { load(0); /* eslint-disable-next-line */ }, []);

  const setF = (k, v) => setFilters(f => ({ ...f, [k]: v }));
  const fmt = (t) => t ? String(t).replace('T', ' ').slice(0, 19) : '';
  // Sorting applies to the page currently loaded; the server always returns
  // newest-first, and the filters narrow the set before paging.
  const { sorted: sortedEvents, sort, toggle } = useSort(data.events, 'occurred_at', 'desc');

  return (<div className="screen">
    <div className="filter-bar">
      <div className="fg"><label>From (UTC)</label>
        <input type="date" value={filters.start} onChange={e => setF('start', e.target.value)} /></div>
      <div className="fg"><label>To (UTC)</label>
        <input type="date" value={filters.end} onChange={e => setF('end', e.target.value)} /></div>
      <div className="fg"><label>User</label>
        <input type="text" placeholder="email contains…" value={filters.user}
               onChange={e => setF('user', e.target.value)} /></div>
      <div className="fg"><label>Action</label>
        <select value={filters.action} onChange={e => setF('action', e.target.value)}>
          <option value="">All</option>
          {data.actions.map(a => <option key={a} value={a}>{a}</option>)}</select></div>
      <div className="fg"><label>Entity</label>
        <select value={filters.entity_type} onChange={e => setF('entity_type', e.target.value)}>
          <option value="">All</option>
          {data.entity_types.map(a => <option key={a} value={a}>{a}</option>)}</select></div>
      <button className="btn btn-primary" onClick={() => load(0)}>Apply</button>
      <button className="btn" onClick={() => {
        const empty = { start:'', end:'', user:'', action:'', entity_type:'' };
        setFilters(empty); setOffset(0); load(0, empty);
      }}>Clear</button>
      <button className="btn" onClick={() => { window.location = `/api/audit/export?${queryString()}`; }}>
        Export CSV</button>
    </div>
    <div className="table-view">
      <div style={{fontSize:12,color:'#6b6b6b',marginBottom:8}}>
        {data.total} event{data.total === 1 ? '' : 's'}
        {data.total > LIMIT ? ` — showing ${offset + 1}–${Math.min(offset + LIMIT, data.total)}` : ''}
        . The audit log is append-only; nothing can edit or remove entries.
      </div>
      {loading && <div className="empty-state">Loading audit history…</div>}
      {!loading && data.events.length === 0 &&
        <div className="empty-state">No matching events.</div>}
      {!loading && data.events.length > 0 && <table className="data-table">
        <thead><tr>
          <SortHeader label="When (UTC)" sortKey="occurred_at" sort={sort} toggle={toggle} style={{width:150}} />
          <SortHeader label="User" sortKey="actor_email" sort={sort} toggle={toggle} />
          <SortHeader label="Action" sortKey="action" sort={sort} toggle={toggle} />
          <SortHeader label="Entity" sortKey="entity_type" sort={sort} toggle={toggle} />
          <th>Details</th>
          <SortHeader label="IP" sortKey="ip_address" sort={sort} toggle={toggle} style={{width:110}} />
          <th style={{width:80}}></th>
        </tr></thead>
        <tbody>{sortedEvents.map(e => (
          <tr key={e.event_id}>
            <td style={{fontSize:'12px'}}>{fmt(e.occurred_at)}</td>
            <td style={{fontSize:'12px'}}>{e.actor_email || '—'}</td>
            <td><span className="badge badge-internal">{e.action}</span></td>
            <td style={{fontSize:'12px'}}>{e.entity_type || '—'}{e.entity_id ? ` ${e.entity_id}` : ''}</td>
            <td>
              {e.summary && <div style={{fontSize:'12px'}}>{e.summary}</div>}
              {e.changes && e.changes.length > 0 && <div className="audit-changes">
                {e.changes.slice(0, 6).map(c => (
                  <span className="chg" key={c.change_id}>
                    <strong>{c.field_name}</strong>{' '}
                    {c.old_value ? <span className="old">{String(c.old_value).slice(0,60)}</span> : null}
                    <span className="new">{c.new_value === null || c.new_value === undefined
                      ? '(cleared)' : String(c.new_value).slice(0,60)}</span>
                  </span>))}
                {e.changes.length > 6 && <span className="chg">…and {e.changes.length - 6} more</span>}
              </div>}
            </td>
            <td style={{fontSize:'11px',color:'#6b6b6b'}}>{e.ip_address || '—'}</td>
            <td>{e.revertible &&
              <button className="btn" style={{padding:'3px 8px',fontSize:'11px'}}
                      onClick={() => { setConflicts(null); setConfirmRevert(e); }}>Revert</button>}</td>
          </tr>))}
        </tbody>
      </table>}
      {confirmRevert && <ConfirmDialog
        title="Revert this change?" danger
        confirmLabel={conflicts ? 'Revert anyway' : 'Revert change'}
        message={`This restores the values as they were before ${confirmRevert.actor_email || 'this change'} ` +
                 `edited ${confirmRevert.entity_type} ${confirmRevert.entity_id} on ` +
                 `${String(confirmRevert.occurred_at).slice(0,16).replace('T',' ')}.`}
        detail={<>
          <div className="mono-diff">
            {(confirmRevert.changes || []).map(c =>
              <div key={c.change_id}>{c.field_name}: {String(c.new_value).slice(0,50)} → {String(c.old_value === null ? '(empty)' : c.old_value).slice(0,50)}</div>)}
          </div>
          {conflicts && <div className="confirm-warn">
            <strong>These fields have changed since then.</strong> Reverting will discard
            those newer changes:
            <div className="mono-diff">
              {conflicts.map(c => <div key={c.field}>{c.field}: now "{String(c.current).slice(0,40)}"</div>)}
            </div>
          </div>}
          <div style={{fontSize:12,color:'#6b6b6b',marginTop:10}}>
            The revert is recorded as a new audit entry; nothing is erased from the log.
          </div>
        </>}
        onCancel={() => { setConfirmRevert(null); setConflicts(null); }}
        onConfirm={() => doRevert(confirmRevert, !!conflicts)} />}

      {data.total > LIMIT && <div style={{display:'flex',gap:8,marginTop:12}}>
        <button className="btn" disabled={offset === 0} onClick={() => load(Math.max(0, offset - LIMIT))}>Previous</button>
        <button className="btn" disabled={offset + LIMIT >= data.total} onClick={() => load(offset + LIMIT)}>Next</button>
      </div>}
    </div>
  </div>);
}

// ===== Login Screen =====
function LoginScreen({ onSignedIn, settings }) {
  const [version, setVersion] = useState(null);
  useEffect(() => { api.get('/api/version').then(v => setVersion(v.version)).catch(() => {}); }, []);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (ev) => {
    ev.preventDefault();
    setBusy(true); setError('');
    try {
      const result = await api.post('/api/auth/login', { email, password });
      session.csrf = result.csrf_token;
      onSignedIn(result);
    } catch (err) {
      setError(err.message || 'Sign-in failed.');
      setPassword('');
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="login-screen">
      <form className="login-box" onSubmit={submit}>
        <LoginLogo settings={settings} />
        <h1>{(settings && settings.app_title) || 'Data Lineage Tracker'}</h1>
        <p>Sign in to continue</p>
        {error && <div className="login-error">{error}</div>}
        <div className="field">
          <label htmlFor="login-email">Email</label>
          <input id="login-email" type="email" autoComplete="username" value={email}
                 onChange={e => { setEmail(e.target.value); setError(''); }} autoFocus />
        </div>
        <div className="field">
          <label htmlFor="login-password">Password</label>
          <input id="login-password" type="password" autoComplete="current-password"
                 value={password} onChange={e => { setPassword(e.target.value); setError(''); }} />
        </div>
        <button type="submit" className="login-btn" disabled={busy}>
          {busy ? 'Signing in…' : 'Sign In'}
        </button>
        <div className="login-sub">
          Accounts are created by an administrator. If you've forgotten your
          password, ask an administrator to issue a new temporary one.
        </div>
      </form>
      <VersionBadge version={version} />
    </div>
  );
}

// ===== Forced password change =====
function ChangePasswordScreen({ user, settings, onDone, onSignOut, forced }) {
  const [current, setCurrent] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [error, setError] = useState('');
  const [problems, setProblems] = useState(null);
  const [busy, setBusy] = useState(false);

  const submit = async (ev) => {
    ev.preventDefault();
    setError(''); setProblems(null);
    if (next !== confirm) { setError('The new passwords do not match.'); return; }
    setBusy(true);
    try {
      await api.post('/api/auth/change-password', { current_password: current, new_password: next });
      onDone();
    } catch (err) {
      setError(err.message);
      setProblems(err.problems);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="login-screen">
      <form className="login-box" onSubmit={submit}>
        <h1>Choose a new password</h1>
        <p>{user ? user.email : ''}</p>
        {forced && <div className="login-note">
          Your account is using a temporary password. Choose a new one to continue.
        </div>}
        {error && <div className="login-error">{error}</div>}
        {problems && <ul className="policy-list">{problems.map((p, i) => <li key={i}>{p}</li>)}</ul>}
        <div className="field">
          <label htmlFor="cp-current">Current password</label>
          <input id="cp-current" type="password" autoComplete="current-password"
                 value={current} onChange={e => setCurrent(e.target.value)} autoFocus />
        </div>
        <div className="field">
          <label htmlFor="cp-new">New password</label>
          <input id="cp-new" type="password" autoComplete="new-password"
                 value={next} onChange={e => setNext(e.target.value)} />
        </div>
        <div className="field">
          <label htmlFor="cp-confirm">Confirm new password</label>
          <input id="cp-confirm" type="password" autoComplete="new-password"
                 value={confirm} onChange={e => setConfirm(e.target.value)} />
        </div>
        <button type="submit" className="login-btn" disabled={busy}>
          {busy ? 'Saving…' : 'Update password'}
        </button>
        <div className="login-sub">{(settings && settings.password_policy) || ''}</div>
        {onSignOut && <div className="login-sub">
          <a href="#" onClick={e => { e.preventDefault(); onSignOut(); }}>Sign out instead</a>
        </div>}
      </form>
    </div>
  );
}

// ===== Main App Wrapper =====
function AppWrapper() {
  const [state, setState] = useState({ status: 'loading', user: null, settings: {} });

  const loadSession = useCallback(async () => {
    try {
      const me = await api.get('/api/auth/me');
      session.csrf = me.csrf_token;
      setState({ status: me.user.must_change_password ? 'must-change' : 'ready',
                 user: me.user, settings: me.settings || {} });
    } catch (err) {
      // No session. The sign-in screen still needs the title and logo, so ask
      // for the public subset rather than leaving settings empty — which is
      // why the configured title never used to appear on that screen.
      let pub = {};
      try { pub = await api.get('/api/branding/public'); } catch (e) { /* defaults */ }
      setState({ status: 'signed-out', user: null, settings: pub || {} });
    }
  }, []);

  useEffect(() => {
    onAuthLost = () => { session.csrf = null; setState(s => ({ ...s, status: 'signed-out', user: null })); };
    loadSession();
    return () => { onAuthLost = () => {}; };
  }, [loadSession]);

  const signOut = useCallback(async () => {
    try { await api.post('/api/auth/logout'); } catch (e) { /* already gone */ }
    session.csrf = null;
    // Keep the branding after signing out, for the same reason as above.
    let pub = {};
    try { pub = await api.get('/api/branding/public'); } catch (e) { /* defaults */ }
    setState({ status: 'signed-out', user: null, settings: pub || {} });
  }, []);

  if (state.status === 'loading') {
    return <div className="login-screen"><div className="login-box"><p>Loading…</p></div></div>;
  }
  if (state.status === 'signed-out') {
    return <LoginScreen settings={state.settings} onSignedIn={(result) => {
      setState({ status: result.user.must_change_password ? 'must-change' : 'ready',
                 user: result.user, settings: result.settings || {} });
    }} />;
  }
  if (state.status === 'must-change') {
    return <ChangePasswordScreen forced user={state.user} settings={state.settings}
                                 onDone={loadSession} onSignOut={signOut} />;
  }
  return <App user={state.user} settings={state.settings}
              onSignOut={signOut} onSettingsChanged={loadSession} />;
}

// ===== Main App =====
// ===== Scenarios =====
// A scenario is a private, non-live copy of the diagram used for planning.
// The label always carries "(Scenario)" so the distinction never depends on
// the background tint alone — see ACCESSIBILITY.md.
const LIVE_LABEL = 'Current Architecture';
const scenarioLabel = (s) => s ? `${s.name} (Scenario)` : LIVE_LABEL;
const SCENARIO_STATUSES = ['Draft', 'Under review', 'Approved', 'Archived'];

// How a record differs from the live diagram. Every one of these is shown as
// text as well as styling, so none of it depends on sight of a colour.
const CHANGE_LABEL = {
  proposed: 'Proposed', modified: 'Modified', removed: 'Being retired',
  unchanged: '',
};

function ChangeBadge({ state, hidden }) {
  if (!state || state === 'unchanged') {
    return hidden ? <span className="badge" title="Hidden from this scenario's diagram">Hidden</span> : null;
  }
  const cls = { proposed: 'badge-planned', modified: 'badge-pii',
                removed: 'badge-deprecated' }[state] || '';
  return (
    <React.Fragment>
      <span className={`badge ${cls}`}>{CHANGE_LABEL[state]}</span>
      {hidden && <span className="badge" title="Hidden from this scenario's diagram">Hidden</span>}
    </React.Fragment>
  );
}

// The picker shown beside every catalog heading and on the audit log.
function ScenarioPicker({ scenarios, current, onChange }) {
  if (!scenarios.length) return null;
  return (
    <label className="scenario-picker">
      <span className="sr-only">Choose which view to show</span>
      <select value={current === null ? 'live' : String(current)}
              aria-label="Choose which view to show"
              onChange={e => onChange(e.target.value === 'live' ? null : Number(e.target.value))}>
        <option value="live">{LIVE_LABEL}</option>
        {scenarios.map(s => (
          <option key={s.scenario_id} value={s.scenario_id}>{scenarioLabel(s)}</option>
        ))}
      </select>
    </label>
  );
}

// Type-ahead for choosing people. A checkbox list is fine for a handful of
// accounts and unusable once a department is on the system, so this searches
// instead of listing — but it still shows who has already been chosen, since
// a search box alone gives no way to see what you have picked.
function PersonPicker({ users, exclude, chosen, onChange }) {
  const [query, setQuery] = useState('');
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState(0);
  const boxRef = useRef(null);

  const pool = (users || []).filter(u => u.user_id !== exclude && u.is_active);
  const already = new Set(chosen.map(c => c.user_id));
  const q = query.trim().toLowerCase();
  const matches = !q ? [] : pool.filter(u =>
    !already.has(u.user_id) &&
    (`${u.first_name} ${u.last_name}`.toLowerCase().includes(q) ||
     (u.email || '').toLowerCase().includes(q))
  ).slice(0, 8);

  const add = (u) => {
    onChange(chosen.concat([{ user_id: u.user_id, role: 'viewer' }]));
    setQuery(''); setOpen(false); setActive(0);
  };

  const onKeyDown = (e) => {
    if (!matches.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(a => Math.min(a + 1, matches.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(a => Math.max(a - 1, 0)); }
    else if (e.key === 'Enter') { e.preventDefault(); add(matches[active]); }
    else if (e.key === 'Escape') { setOpen(false); }
  };

  const nameOf = (id) => {
    const u = pool.find(x => x.user_id === id);
    return u ? `${u.first_name} ${u.last_name}` : `User ${id}`;
  };

  return (
    <div className="person-picker" ref={boxRef}>
      <label htmlFor="scn-invite" className="sr-only">Search for a person to invite</label>
      <input id="scn-invite" type="text" value={query} autoComplete="off"
             placeholder="Type a name or email to search…"
             role="combobox" aria-expanded={open && matches.length > 0}
             aria-controls="scn-invite-results" aria-autocomplete="list"
             onChange={e => { setQuery(e.target.value); setOpen(true); setActive(0); }}
             onKeyDown={onKeyDown}
             onFocus={() => setOpen(true)} />
      {open && q && (
        <ul className="picker-results" id="scn-invite-results" role="listbox">
          {matches.map((u, i) => (
            <li key={u.user_id} role="option" aria-selected={i === active}
                className={i === active ? 'active' : ''}
                onMouseDown={e => { e.preventDefault(); add(u); }}
                onMouseEnter={() => setActive(i)}>
              {u.first_name} {u.last_name}
              <span className="gov-hint"> {u.email} &middot; {u.role}</span>
            </li>
          ))}
          {matches.length === 0 && (
            <li className="no-match">No matching active account.</li>
          )}
        </ul>
      )}
      {chosen.length > 0 && (
        <div className="chosen-list">
          {chosen.map(c => (
            <div key={c.user_id} className="invite-row">
              <span>{nameOf(c.user_id)}</span>
              <span>
                <select value={c.role}
                        aria-label={`Scenario role for ${nameOf(c.user_id)}`}
                        onChange={e => onChange(chosen.map(x =>
                          x.user_id === c.user_id ? { ...x, role: e.target.value } : x))}>
                  <option value="viewer">can view</option>
                  <option value="editor">can edit</option>
                </select>
                <button type="button" className="btn"
                        aria-label={`Remove ${nameOf(c.user_id)}`}
                        onClick={() => onChange(chosen.filter(x => x.user_id !== c.user_id))}>
                  Remove
                </button>
              </span>
            </div>
          ))}
        </div>
      )}
      {chosen.length === 0 && (
        <div className="gov-hint">Nobody else yet — only you will see this scenario.</div>
      )}
    </div>
  );
}

// Managing a scenario after it exists: rename, status, membership, ownership,
// deletion. Only the owner and SuperAdmins get here.
function ScenarioSettingsModal({ scenario, users, currentUserId, isSuper,
                                 onClose, onSaved, notify }) {
  const [tab, setTab] = useState('details');
  const [form, setForm] = useState({
    name: scenario.name || '', description: scenario.description || '',
  });
  const [status, setStatus] = useState(scenario.status);
  const [busy, setBusy] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [invite, setInvite] = useState([]);
  const [newOwner, setNewOwner] = useState('');
  const members = scenario.members || [];

  const call = (p) => { setBusy(true); return p.finally(() => setBusy(false)); };

  const saveDetails = () => {
    if (!form.name.trim()) { notify('A scenario needs a name.', true); return; }
    call(api.put(`/api/scenarios/${scenario.scenario_id}`, form)
      .then(() => onSaved()).then(() => notify('Scenario updated.'))
      .catch(e => notify(e.message, true)));
  };

  const saveStatus = (next) => {
    setStatus(next);
    call(api.put(`/api/scenarios/${scenario.scenario_id}`, { status: next })
      .then(() => onSaved())
      .then(() => notify(next === 'Draft'
        ? 'Returned to Draft — it can be edited again.'
        : `Status set to ${next}. The scenario is now read-only.`))
      .catch(e => { setStatus(scenario.status); notify(e.message, true); }));
  };

  const addPeople = () => {
    if (!invite.length) return;
    call(Promise.all(invite.map(i =>
      api.post(`/api/scenarios/${scenario.scenario_id}/members`, i)))
      .then(() => onSaved()).then(() => { setInvite([]); notify('Invitations sent.'); })
      .catch(e => notify(e.message, true)));
  };

  const setRole = (uid, role) =>
    call(api.post(`/api/scenarios/${scenario.scenario_id}/members`, { user_id: uid, role })
      .then(() => onSaved()).catch(e => notify(e.message, true)));

  const removeMember = (uid) =>
    call(api.del(`/api/scenarios/${scenario.scenario_id}/members/${uid}`)
      .then(() => onSaved()).then(() => notify('Removed from this scenario.'))
      .catch(e => notify(e.message, true)));

  const transfer = () => {
    if (!newOwner) return;
    call(api.post(`/api/scenarios/${scenario.scenario_id}/owner`, { user_id: Number(newOwner) })
      .then(() => onSaved()).then(() => { setNewOwner(''); notify('Ownership transferred.'); })
      .catch(e => notify(e.message, true)));
  };

  const doDelete = () =>
    call(api.del(`/api/scenarios/${scenario.scenario_id}`)
      .then(() => { setConfirmDelete(false); onClose(); return onSaved(true); })
      .then(() => notify('Scenario deleted. A SuperAdmin can restore it.'))
      .catch(e => notify(e.message, true)));

  const nameOf = (m) => `${m.first_name} ${m.last_name}`;

  return (
    <div className="modal-overlay"><div className="modal" role="dialog"
         aria-modal="true" aria-labelledby="scn-set-title">
      <div className="modal-header" id="scn-set-title">
        {scenario.name} (Scenario)
        <button className="panel-close" onClick={onClose} aria-label="Close">&times;</button>
      </div>
      <div className="tab-row" role="tablist">
        {['details', 'people', 'danger'].map(t => (
          <button key={t} role="tab" aria-selected={tab === t}
                  className={`tab-btn ${tab === t ? 'active' : ''}`}
                  onClick={() => setTab(t)}>
            {t === 'details' ? 'Details' : t === 'people' ? 'People' : 'Delete'}
          </button>
        ))}
      </div>
      <div className="modal-body">
        {tab === 'details' && (
          <React.Fragment>
            <ReqField id="set-name" label="Name" value={form.name}
                      onChange={v => setForm({ ...form, name: v })} />
            <ReqField id="set-desc" label="Description" type="textarea"
                      value={form.description}
                      onChange={v => setForm({ ...form, description: v })} />
            <button className="btn btn-primary" onClick={saveDetails} disabled={busy}>
              Save details
            </button>

            <div className="modal-section-title" style={{ marginTop: 18 }}>Status</div>
            <div className="gov-hint">
              Only a Draft can be edited. Under review, Approved and Archived are
              read-only for everyone — return it to Draft to make changes.
            </div>
            <select value={status} aria-label="Scenario status"
                    onChange={e => saveStatus(e.target.value)} disabled={busy}>
              {SCENARIO_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </React.Fragment>
        )}

        {tab === 'people' && (
          <React.Fragment>
            <div className="gov-hint">
              A scenario role applies here only. Someone can edit this scenario
              while being a Viewer everywhere else, and the reverse.
            </div>
            <table className="data-table" style={{ marginBottom: 14 }}>
              <thead><tr><th>Person</th><th>Elsewhere</th><th>Here</th><th></th></tr></thead>
              <tbody>
                {members.map(m => (
                  <tr key={m.user_id}>
                    <td><strong>{nameOf(m)}</strong><br />
                        <span className="gov-hint">{m.email}</span></td>
                    {/* Read the role from the freshly-loaded account list, not
