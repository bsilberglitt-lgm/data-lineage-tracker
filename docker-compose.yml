# Local development stack: the app plus its own PostgreSQL database.
#
#   docker compose up          start everything (first run builds the image)
#   docker compose down        stop everything (your data is kept)
#   docker compose down -v     stop and DELETE the database volume
#
# Then open http://localhost:8765
#
# The database lives in the named volume "pgdata", so it survives restarts.
#
# **The Postgres major version must match production**, which is 18 on Render.
# Two reasons, and the second is easy to miss:
#
#   * `pg_restore` cannot read a dump from a newer server, so the quarterly
#     restore drill in backup/README.md fails against an older local Postgres —
#     and fails in a way that looks like a corrupt backup rather than a version
#     mismatch.
#   * Behavior differences between majors are exactly what local testing is
#     supposed to catch before production does.
#
# **Two things change together for 18+, and missing the second one fails.**
#
#   1. The image tag.
#   2. **The volume mount path.** In 18 and above the official image puts data
#      in a version-specific directory (`/var/lib/postgresql/18/docker`) and
#      declares its volume at `/var/lib/postgresql`, one level up. Mounting at
#      the old `/var/lib/postgresql/data` makes the container refuse to start,
#      complaining about data in an "unused mount/volume" — the data would go
#      to an anonymous volume and vanish on re-creation.
#      See https://github.com/docker-library/postgres/pull/1259
#
# Postgres also will not start on a data directory written by a different major
# version, so recreate the volume when changing either:
#
#     docker compose down -v      # deletes the local database
#     docker compose up           # re-seeds from scratch
#
# Local data is seed data, so this costs nothing but the time to re-run it.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lineage
      POSTGRES_PASSWORD: lineage
      POSTGRES_DB: lineage
    ports:
      # Exposed so you can also connect with a GUI tool (TablePlus, DBeaver, psql)
      - "5432:5432"
    volumes:
      # One level above the data directory — required for 18+. See the note at
      # the top of this file before changing it.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineage -d lineage"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://lineage:lineage@db:5432/lineage
      PORT: 8765
      # First run only: creates the initial SuperAdmin account. Change the email
      # to your own. If you omit the password, a strong one is generated and
      # printed to the logs once. Either way you must change it at first sign-in.
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-admin@example.gov}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
      BOOTSTRAP_SUPERADMIN_FIRST_NAME: ${BOOTSTRAP_SUPERADMIN_FIRST_NAME:-System}
      BOOTSTRAP_SUPERADMIN_LAST_NAME: ${BOOTSTRAP_SUPERADMIN_LAST_NAME:-Administrator}
      # Local convenience: keep the password above instead of being asked to
      # change it every time the database is recreated. Never set this on a
      # deployed environment.
      BOOTSTRAP_SUPERADMIN_SKIP_PASSWORD_CHANGE: ${BOOTSTRAP_SUPERADMIN_SKIP_PASSWORD_CHANGE:-}
      # Emergency password reset. Normally unset; see RELEASE_CHECKLIST.md.
      BOOTSTRAP_SUPERADMIN_RESET: ${BOOTSTRAP_SUPERADMIN_RESET:-}
      # Mail credentials, for testing email locally. Only the secret lives in
      # the environment; everything else is in Preferences. See mailer.py.
      #
      # The *_FILE forms take the path of a file holding the secret instead,
      # which is how AWS ECS, Azure Key Vault and Docker secrets deliver one —
      # and the file is read per send, so rotating it needs no restart. If a
      # *_FILE is set and cannot be read, that is reported as its own error
      # rather than falling back to the plain variable.
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_KEY_FILE: ${RESEND_API_KEY_FILE:-}
      # Test only: writes mail to a file instead of sending it, so t_email.py
      # can read what "was sent". Point it INSIDE /app — the project directory
      # is mounted there, so the file lands beside your checkout and the suite,
      # running on the host, can read the same bytes the container wrote. A
      # path outside /app would be written inside the container and invisible.
      #
      # **Both variables are required and the app refuses to start on the path
      # alone**, because one variable that makes password reset report success
      # and deliver nothing is something an environment file carries along by
      # accident:
      #
      #     EMAIL_SINK_PATH=/app/.mail-test.jsonl \
      #     EMAIL_SINK_CONFIRM=discard-all-mail docker compose up -d
      #
      # NEVER set these on a deployed environment. The app warns loudly at
      # startup when the sink is active, and Preferences -> Email status says
      # so too.
      EMAIL_SINK_PATH: ${EMAIL_SINK_PATH:-}
      EMAIL_SINK_CONFIRM: ${EMAIL_SINK_CONFIRM:-}
    ports:
      - "8765:8765"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount the project directory so code edits take effect on restart
      # (docker compose restart app) without rebuilding the image.
      - .:/app

volumes:
  pgdata:
